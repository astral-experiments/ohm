# Build a complete stage-2 distribution, including the pinned Cargo, from the
# source revisions in a versioned toolchain manifest.
profile = "dist"

[build]
description = "Ohm"
locked-deps = true
tools = ["cargo"]

# Ohm does not modify LLVM. Reuse Rust's matching CI LLVM when the source
# history proves that it is compatible; the compiler, sysroot, and extended
# Cargo archive are still built from the pinned Ohm sources.
[llvm]
download-ci-llvm = true

[dist]
compression-profile = "balanced"
