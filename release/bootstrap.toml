# Build a complete stage-2 distribution, including the pinned Cargo, from the
# source revisions in a versioned toolchain manifest.
profile = "dist"

[build]
description = "Ohm"
locked-deps = true
# Upstream's opt-dist pipeline requires bootstrap timing and metrics output.
metrics = true
# Build the compiler-rt profiling runtime needed to train rustc, rustdoc,
# Cargo, Clippy, and rustfmt for component-specific release PGO.
profiler = true
# Match upstream Rust releases: vendor Cargo's native dependencies instead of
# relying on libraries that are installed only on the build machine.
cargo-native-static = true
# Rust's combined macOS and Windows installers still require the deprecated
# rust-analysis compatibility component even though it only contains a removal
# notice. Keep it alongside the user-facing tools so `x.py dist extended` can
# assemble every supported installer format.
tools = ["analysis", "cargo", "clippy", "rustdoc", "rustfmt"]

# Package Cargo so selecting an Ohm toolchain activates the complete workflow.
[build.tool.cargo]
features = ["ohm-defaults"]

# Ohm exposes its experimental build acceleration through unstable interfaces.
# Build both rustc and Cargo for the dev channel so those interfaces are
# available without requiring RUSTC_BOOTSTRAP.
[rust]
channel = "dev"
omit-git-hash = false

# Match the compiler settings used by Rust's official release distributions.
codegen-units = 1
codegen-units-std = 1
jemalloc = true
lto = "thin"

# Ohm does not modify LLVM. Reuse Rust's matching CI LLVM when the source
# history proves that it is compatible; the compiler, sysroot, and extended
# Cargo archive are still built from the pinned Ohm sources.
[llvm]
download-ci-llvm = true

[dist]
compression-formats = ["gz"]
compression-profile = "balanced"
