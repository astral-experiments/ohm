# Build a complete stage-2 distribution, including the pinned Cargo, from the
# source revisions in a versioned toolchain manifest.
profile = "dist"

[build]
description = "Ohm"
locked-deps = true
# Rust's combined macOS and Windows installers still require the deprecated
# rust-analysis compatibility component even though it only contains a removal
# notice. Keep it alongside the user-facing tools so `x.py dist extended` can
# assemble every supported installer format.
tools = ["analysis", "cargo", "clippy", "rustfmt"]

# Ohm exposes its experimental build acceleration through explicit `-Z` flags.
# Build both rustc and Cargo for the dev channel so those opt-in interfaces are
# available without requiring RUSTC_BOOTSTRAP.
[rust]
channel = "dev"
omit-git-hash = false

# Ohm does not modify LLVM. Reuse Rust's matching CI LLVM when the source
# history proves that it is compatible; the compiler, sysroot, and extended
# Cargo archive are still built from the pinned Ohm sources.
[llvm]
download-ci-llvm = true

[dist]
compression-profile = "balanced"
