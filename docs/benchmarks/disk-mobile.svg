<svg xmlns="http://www.w3.org/2000/svg" width="430" height="187" viewBox="0 0 430 187" class="compact" role="img" aria-labelledby="title desc">
<title id="title">Disk space retained by ten worktrees on APFS</title>
<desc id="desc">Rust 1.99.0 and Ohm 1.99.0-11. All bars share a linear scale starting at zero.</desc>
<style>
.paper { fill: #25172c }
