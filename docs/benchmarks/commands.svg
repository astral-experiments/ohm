<svg xmlns="http://www.w3.org/2000/svg" width="640" height="247" viewBox="0 0 640 247" role="img" aria-labelledby="title desc">
<title id="title">Total command time across the four replays</title>
<desc id="desc">Rust 1.99.0 and Ohm 1.99.0-26. All bars share a linear scale starting at zero.</desc>
<style>
text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26232b }
.heading { font-size: 16px; font-weight: 550 }
.label { fill: #625f67 }
.value, .change { font-size: 13px; font-variant-numeric: tabular-nums }
.change { fill: #625f67 }
.rust { fill: #b8b8bd }
.ohm { fill: #7546a8 }
@media (prefers-color-scheme: dark) {
  text { fill: #ece9ef }
  .label, .change { fill: #c2bec6 }
  .rust { fill: #88888e }
  .ohm { fill: #c49aeb }
}
</style>
