<svg xmlns="http://www.w3.org/2000/svg" width="640" height="73" viewBox="0 0 640 73" role="img" aria-labelledby="title desc">
<title id="title">Disk space retained by ten worktrees on APFS</title>
<desc id="desc">Rust 1.99.0 and Ohm 1.99.0-11. All bars share a linear scale starting at zero.</desc>
<style>
text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26232b }
.heading { font-size: 16px; font-weight: 550 }
.label { fill: #625f67 }
.value, .change { font-size: 13px; font-variant-numeric: tabular-nums }
.change { fill: #625f67 }
.rust { fill: #b8b8bd }
.ohm { fill: #7546a8 }
@media (prefers-color-scheme: dark) {
  text { fill: #ece9ef }
  .label, .change { fill: #c2bec6 }
  .rust { fill: #88888e }
  .ohm { fill: #c49aeb }
}
</style>
<text x="2.0" y="18" class="heading" text-anchor="start">Ruff/ty</text>
<text x="300.0" y="18" class="change" text-anchor="end">50.1% less space</text>
<text x="2.0" y="41" class="label" text-anchor="start">Rust</text>
<rect x="46" y="33" width="122.09" height="8" class="rust"/>
<text x="174.1" y="41" class="value" text-anchor="start">52.98 GiB</text>
<text x="2.0" y="61" class="label" text-anchor="start">Ohm</text>
<rect x="46" y="53" width="60.98" height="8" class="ohm"/>
<text x="113.0" y="61" class="value ohm" text-anchor="start">26.46 GiB</text>
<text x="330.0" y="18" class="heading" text-anchor="start">uv</text>
<text x="628.0" y="18" class="change" text-anchor="end">59.3% less space</text>
<text x="330.0" y="41" class="label" text-anchor="start">Rust</text>
<rect x="374" y="33" width="183.00" height="8" class="rust"/>
<text x="563.0" y="41" class="value" text-anchor="start">79.41 GiB</text>
<text x="330.0" y="61" class="label" text-anchor="start">Ohm</text>
<rect x="374" y="53" width="74.46" height="8" class="ohm"/>
<text x="454.5" y="61" class="value ohm" text-anchor="start">32.31 GiB</text>
</svg>
