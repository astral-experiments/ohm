<svg xmlns="http://www.w3.org/2000/svg" width="640" height="223" viewBox="0 0 640 223" role="img" aria-labelledby="title desc">
<title id="title">Ohm speedup over stock Rust after one edit</title>
<desc id="desc">Direct and dependency edits use the same linear scale. A speedup of 1× is parity.</desc>
<style>
text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26232b }
.heading { font-size: 16px; font-weight: 550 }
.label { fill: #625f67 }
.value, .change { font-size: 13px; font-variant-numeric: tabular-nums }
.change { fill: #625f67 }
.rust { fill: #b8b8bd }
.ohm { fill: #7546a8 }
@media (prefers-color-scheme: dark) {
  text { fill: #ece9ef }
  .label, .change { fill: #c2bec6 }
  .rust { fill: #88888e }
  .ohm { fill: #c49aeb }
}
</style>
<text x="185.0" y="18" class="heading" text-anchor="start">Direct edit</text>
<text x="419.0" y="18" class="heading" text-anchor="start">Dependency edit</text>
<text x="2.0" y="48" class="heading" text-anchor="start">uv</text>
<text x="2.0" y="72" class="label" text-anchor="start">cargo check</text>
<rect x="185" y="64" width="3.67" height="8" class="ohm"/>
<text x="194.7" y="72" class="value ohm" text-anchor="start">1.13×</text>
<rect x="419" y="64" width="64.19" height="8" class="ohm"/>
<text x="489.2" y="72" class="value ohm" text-anchor="start">19.68×</text>
<text x="2.0" y="96" class="label" text-anchor="start">cargo clippy</text>
<rect x="185" y="88" width="4.22" height="8" class="ohm"/>
<text x="195.2" y="96" class="value ohm" text-anchor="start">1.29×</text>
<rect x="419" y="88" width="75.92" height="8" class="ohm"/>
<text x="500.9" y="96" class="value ohm" text-anchor="start">23.27×</text>
<text x="2.0" y="120" class="label" text-anchor="start">cargo test --test it</text>
<rect x="185" y="112" width="6.97" height="8" class="ohm"/>
<text x="198.0" y="120" class="value ohm" text-anchor="start">2.14×</text>
<rect x="419" y="112" width="29.60" height="8" class="ohm"/>
<text x="454.6" y="120" class="value ohm" text-anchor="start">9.07×</text>
<text x="2.0" y="142" class="heading" text-anchor="start">Codex</text>
<text x="2.0" y="166" class="label" text-anchor="start">cargo check</text>
<rect x="185" y="158" width="3.53" height="8" class="ohm"/>
<text x="194.5" y="166" class="value ohm" text-anchor="start">1.08×</text>
<rect x="419" y="158" width="84.25" height="8" class="ohm"/>
<text x="509.2" y="166" class="value ohm" text-anchor="start">25.82×</text>
<text x="2.0" y="190" class="label" text-anchor="start">just clippy</text>
<rect x="185" y="182" width="5.05" height="8" class="ohm"/>
<text x="196.0" y="190" class="value ohm" text-anchor="start">1.55×</text>
<rect x="419" y="182" width="150.00" height="8" class="ohm"/>
<text x="575.0" y="190" class="value ohm" text-anchor="start">45.98×</text>
<text x="2.0" y="214" class="label" text-anchor="start">just test</text>
<rect x="185" y="206" width="3.33" height="8" class="ohm"/>
<text x="194.3" y="214" class="value ohm" text-anchor="start">1.02×</text>
<rect x="419" y="206" width="65.93" height="8" class="ohm"/>
<text x="490.9" y="214" class="value ohm" text-anchor="start">20.21×</text>
</svg>
