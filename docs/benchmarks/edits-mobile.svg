<svg xmlns="http://www.w3.org/2000/svg" width="430" height="299" viewBox="0 0 430 299" class="compact" role="img" aria-labelledby="title desc">
<title id="title">Ohm speedup over stock Rust after one edit</title>
<desc id="desc">Both columns show Ohm speedups over stock Rust on the same linear scale.</desc>
<style>
.paper { fill: #25172c }
.grid { stroke: #49364e; stroke-width: 1 }
.zero { stroke: #66546d; stroke-width: 1 }
.rust { fill: #beb8c8 }
.ohm { fill: #d7fa79 }
text { fill: #faf5fb; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased }
.head, .tick, .value, .key { font-family: Menlo, Consolas, "Liberation Mono", monospace }
.head, .tick, .key { fill: #c6b8cb }
.head, .tick { font-size: 16px }
.key { font-size: 14px }
.name { font-weight: 500; font-size: 30px }
.command { font-size: 24px }
.value { font-size: 21px; font-variant-numeric: tabular-nums }
.stat { fill: #d7fa79; font-weight: 500; font-size: 29px }
.slower { fill: #faf5fb }
.compact .head, .compact .tick { font-size: 10px }
.compact .key { font-size: 11px }
.compact .name { font-size: 17px }
.compact .command, .compact .value { font-size: 13px }
.compact .stat { font-size: 16px }
</style>
<rect width="100%" height="100%" class="paper"/>
<text x="13.00" y="26" class="head" text-anchor="start">COMMAND</text>
<text x="142.00" y="26" class="head" text-anchor="start">DIRECT EDIT</text>
<path d="M142.00 42V270" class="zero"/>
<text x="142.00" y="287" class="tick" text-anchor="middle">0×</text>
<path d="M176.95 42V270" class="grid"/>
<text x="176.95" y="287" class="tick" text-anchor="middle">20×</text>
<path d="M211.89 42V270" class="grid"/>
<text x="211.89" y="287" class="tick" text-anchor="middle">40×</text>
<text x="280.00" y="26" class="head" text-anchor="start">DEPENDENCY EDIT</text>
<path d="M280.00 42V270" class="zero"/>
<text x="280.00" y="287" class="tick" text-anchor="middle">0×</text>
<path d="M314.95 42V270" class="grid"/>
<text x="314.95" y="287" class="tick" text-anchor="middle">20×</text>
<path d="M349.89 42V270" class="grid"/>
<text x="349.89" y="287" class="tick" text-anchor="middle">40×</text>
