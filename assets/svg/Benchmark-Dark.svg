<svg xmlns="http://www.w3.org/2000/svg" width="570" height="229" viewBox="0 0 570 229" role="img" aria-labelledby="benchmark-title benchmark-description">
  <title id="benchmark-title">Incremental codex-core build benchmarks</title>
  <desc id="benchmark-description">After editing a dependency, checking takes 0.52 seconds with Ohm and 7.74 seconds with Rust 1.97.1, a 15.01 times speedup. Clippy takes 0.64 seconds with Ohm and 22.61 seconds with Rust, a 35.24 times speedup. Testing takes 4.22 seconds with Ohm and 22.28 seconds with Rust, a 5.28 times speedup.</desc>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji'" font-size="12" fill="#C9D1D9">
    <g aria-hidden="true" fill="none" stroke="rgba(127,127,127,0.25)" stroke-width="1">
      <path d="M125.5 20v40m0 30v40m0 30v40M285.5 20v40m0 30v40m0 30v40M445.5 20v40m0 30v40m0 30v40M525.5 20v40m0 30v40m0 30v40"/>
    </g>

    <text x="10" y="14" font-weight="500">check</text>
    <text x="525" y="14" text-anchor="end" fill="#8B949E">15× faster</text>
    <g aria-label="check with Ohm: 0.52 seconds">
      <text x="114" y="32.5" text-anchor="end" font-weight="bold">Ohm</text>
      <path d="M125 22h8.32v13h-8.32Z" fill="#5F6DE9"/>
      <text x="139.32" y="32.5" font-weight="bold">0.52s</text>
    </g>
    <g aria-label="check with Rust 1.97.1: 7.74 seconds">
      <text x="114" y="55" text-anchor="end">Rust</text>
      <path d="M125 44.5h123.84v13h-123.84Z" fill="#8B949E"/>
      <text x="254.84" y="55">7.74s</text>
    </g>

    <text x="10" y="84" font-weight="500">clippy</text>
    <text x="525" y="84" text-anchor="end" fill="#8B949E">35× faster</text>
    <g aria-label="Clippy with Ohm: 0.64 seconds">
      <text x="114" y="102.5" text-anchor="end" font-weight="bold">Ohm</text>
      <path d="M125 92h10.24v13h-10.24Z" fill="#5F6DE9"/>
      <text x="141.24" y="102.5" font-weight="bold">0.64s</text>
    </g>
    <g aria-label="Clippy with Rust 1.97.1: 22.61 seconds">
      <text x="114" y="125" text-anchor="end">Rust</text>
      <path d="M125 114.5h361.76v13h-361.76Z" fill="#8B949E"/>
      <text x="492.76" y="125">22.61s</text>
    </g>

    <text x="10" y="154" font-weight="500">test</text>
    <text x="525" y="154" text-anchor="end" fill="#8B949E">5× faster</text>
    <g aria-label="test with Ohm: 4.22 seconds">
      <text x="114" y="172.5" text-anchor="end" font-weight="bold">Ohm</text>
      <path d="M125 162h67.52v13h-67.52Z" fill="#5F6DE9"/>
      <text x="198.52" y="172.5" font-weight="bold">4.22s</text>
    </g>
    <g aria-label="test with Rust 1.97.1: 22.28 seconds">
      <text x="114" y="195" text-anchor="end">Rust</text>
      <path d="M125 184.5h356.48v13h-356.48Z" fill="#8B949E"/>
      <text x="487.48" y="195">22.28s</text>
    </g>

    <g aria-hidden="true" text-anchor="middle">
      <text x="125" y="218">0s</text>
      <text x="285" y="218">10s</text>
      <text x="445" y="218">20s</text>
      <text x="525" y="218">25s</text>
    </g>
  </g>
</svg>
