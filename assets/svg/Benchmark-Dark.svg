<svg xmlns="http://www.w3.org/2000/svg" width="640" height="254" viewBox="0 0 640 254" role="img" aria-labelledby="benchmark-title benchmark-description">
  <title id="benchmark-title">Incremental codex-core builds with Rust and Ohm</title>
  <desc id="benchmark-description">After editing a dependency, cargo check takes 7.74 seconds with Rust and 0.52 seconds with Ohm, a 15.01 times speedup. Clippy takes 22.61 seconds with Rust and 0.64 seconds with Ohm, a 35.24 times speedup. Tests take 22.28 seconds with Rust and 4.22 seconds with Ohm, a 5.28 times speedup.</desc>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C9D1D9">
    <text x="10" y="20" font-size="13" font-weight="600">Incremental builds after a dependency edit</text>
    <text x="631" y="20" text-anchor="end" fill="#8B949E">codex-core</text>

    <g aria-hidden="true" fill="none" stroke="rgba(127,127,127,0.20)" stroke-width="1">
      <path d="M192.5 40v172M270.5 40v172M348.5 40v172M426.5 40v172M504.5 40v172M582.5 40v172"/>
    </g>

    <g aria-label="cargo check: Rust 7.74 seconds, Ohm 0.52 seconds, 15.01 times faster">
      <text x="10" y="56" font-weight="600">cargo check</text>
      <rect x="10" y="64" width="61" height="18" rx="9" fill="#123A3A"/>
      <text x="40.5" y="76.5" text-anchor="middle" font-size="11" font-weight="600" fill="#46EBE1">15.01×</text>
      <text x="179" y="57.5" text-anchor="end" fill="#8B949E">Rust 1.97.1</text>
      <rect x="192" y="47" width="120.74" height="13" rx="2" fill="#E58583"/>
      <text x="320.74" y="57.5">7.74s</text>
      <text x="179" y="79.5" text-anchor="end" font-weight="600">Ohm</text>
      <rect x="192" y="69" width="8.11" height="13" rx="2" fill="#46EBE1"/>
      <text x="208.11" y="79.5" font-weight="600">0.52s</text>
    </g>

    <g aria-label="just clippy: Rust 22.61 seconds, Ohm 0.64 seconds, 35.24 times faster">
      <text x="10" y="119" font-weight="600">just clippy</text>
      <rect x="10" y="127" width="61" height="18" rx="9" fill="#123A3A"/>
      <text x="40.5" y="139.5" text-anchor="middle" font-size="11" font-weight="600" fill="#46EBE1">35.24×</text>
      <text x="179" y="120.5" text-anchor="end" fill="#8B949E">Rust 1.97.1</text>
      <rect x="192" y="110" width="352.72" height="13" rx="2" fill="#E58583"/>
      <text x="552.72" y="120.5">22.61s</text>
      <text x="179" y="142.5" text-anchor="end" font-weight="600">Ohm</text>
      <rect x="192" y="132" width="9.98" height="13" rx="2" fill="#46EBE1"/>
      <text x="209.98" y="142.5" font-weight="600">0.64s</text>
    </g>

    <g aria-label="just test: Rust 22.28 seconds, Ohm 4.22 seconds, 5.28 times faster">
      <text x="10" y="182" font-weight="600">just test</text>
      <rect x="10" y="190" width="55" height="18" rx="9" fill="#123A3A"/>
      <text x="37.5" y="202.5" text-anchor="middle" font-size="11" font-weight="600" fill="#46EBE1">5.28×</text>
      <text x="179" y="183.5" text-anchor="end" fill="#8B949E">Rust 1.97.1</text>
      <rect x="192" y="173" width="347.57" height="13" rx="2" fill="#E58583"/>
      <text x="547.57" y="183.5">22.28s</text>
      <text x="179" y="205.5" text-anchor="end" font-weight="600">Ohm</text>
      <rect x="192" y="195" width="65.83" height="13" rx="2" fill="#46EBE1"/>
      <text x="265.83" y="205.5" font-weight="600">4.22s</text>
    </g>

    <g aria-hidden="true" fill="#8B949E" font-size="11" text-anchor="middle">
      <text x="192" y="231">0s</text>
      <text x="270" y="231">5s</text>
      <text x="348" y="231">10s</text>
      <text x="426" y="231">15s</text>
      <text x="504" y="231">20s</text>
      <text x="582" y="231">25s</text>
    </g>
  </g>
</svg>
