<svg xmlns="http://www.w3.org/2000/svg" width="550" height="70" viewBox="0 0 550 70" role="img" aria-labelledby="benchmark-title benchmark-description">
  <title id="benchmark-title">Incremental codex-core Clippy benchmark</title>
  <desc id="benchmark-description">After editing a dependency, Clippy takes 0.64 seconds with Ohm and 22.61 seconds with Rust 1.97.1.</desc>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji'" font-size="12" fill="#333333">
    <g aria-hidden="true" fill="none" stroke="rgba(127,127,127,0.25)" stroke-width="1">
      <path d="M105.5 2v46M265.5 2v46M425.5 2v46M505.5 2v46"/>
    </g>

    <g aria-label="Ohm: 0.64 seconds">
      <text x="95" y="18.5" text-anchor="end" font-weight="bold">Ohm</text>
      <path d="M105 8h10.24v13h-10.24Z" fill="#E15759"/>
      <text x="121.24" y="18.5" font-weight="bold">0.64s</text>
    </g>

    <g aria-label="Rust 1.97.1: 22.61 seconds">
      <text x="95" y="41" text-anchor="end">Rust 1.97.1</text>
      <path d="M105 30.5h361.76v13h-361.76Z" fill="#E15759"/>
      <text x="472.76" y="41">22.61s</text>
    </g>

    <g aria-hidden="true" text-anchor="middle">
      <text x="105" y="63">0s</text>
      <text x="265" y="63">10s</text>
      <text x="425" y="63">20s</text>
      <text x="505" y="63">25s</text>
    </g>
  </g>
</svg>
