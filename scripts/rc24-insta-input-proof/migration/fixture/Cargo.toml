[workspace]
[package]
name = "ohm_insta_chain"
version = "0.1.0"
edition = "2021"
[dependencies]
insta = { version = "=1.48.0", features = ["colors", "filters", "json", "redactions", "ron"] }
insta-cmd = { version = "=0.7.0", default-features = false }
[profile.dev]
opt-level = 1
debug = "line-tables-only"
lto = "off"
[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
