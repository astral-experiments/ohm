name: Publish public release assets

on:
  workflow_call:
    inputs:
      version:
        description: Exact published Ohm toolchain version
        required: true
        type: string

permissions: {}

jobs:
  publish-mirror:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      OHM_TOOLCHAIN: ${{ inputs.version }}
    steps:
      - name: Download published release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.version }}-*
          path: release
          merge-multiple: true

      - name: Verify and isolate public release assets
        id: assets
        working-directory: release
        run: |
          if [[ ! "$OHM_TOOLCHAIN" =~ ^ohm-[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*$ ]]; then
            echo "invalid Ohm toolchain version: $OHM_TOOLCHAIN" >&2
            exit 1
          fi

          macos_archive="$OHM_TOOLCHAIN-aarch64-apple-darwin.tar.gz"
          linux_archive="$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu.tar.gz"
          for asset in \
            "$macos_archive" \
            "$macos_archive.sha256" \
            "$linux_archive" \
            "$linux_archive.sha256" \
            ohm-installer.sh \
            SHA256SUMS; do
            if [[ ! -f "$asset" || -L "$asset" ]]; then
              echo "missing or unsafe release asset: $asset" >&2
              exit 1
            fi
          done

          sha256sum --check --strict SHA256SUMS

          public_directory="$(mktemp -d "${RUNNER_TEMP:?}/ohm-public-release.XXXXXX")"
          cp \
            "$macos_archive" \
            "$macos_archive.sha256" \
            "$linux_archive" \
            "$linux_archive.sha256" \
            "$public_directory/"
          cp ohm-installer.sh "$public_directory/install.sh"
          (
            cd "$public_directory"
            sha256sum \
              "$macos_archive" \
              "$macos_archive.sha256" \
              "$linux_archive" \
              "$linux_archive.sha256" \
              install.sh > SHA256SUMS
          )
          echo "directory=$public_directory" >> "$GITHUB_OUTPUT"

      - name: Publish immutable release assets
        uses: astral-sh/github-actions/upload-r2@46d9685eed35b39a3d83a8dde3a3b4e1bff97a8a # 2026.11.19.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
        with:
          account-id: ${{ vars.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}
          bucket: ${{ vars.MIRROR_R2_BUCKET_NAME }}
          source-directory: ${{ steps.assets.outputs.directory }}
          prefix: ohm/releases/${{ inputs.version }}
          if-exists: skip
          cache-control: public, max-age=31536000, immutable

      - name: Publish latest release installer
        uses: astral-sh/github-actions/upload-r2@46d9685eed35b39a3d83a8dde3a3b4e1bff97a8a # 2026.11.19.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
        with:
          account-id: ${{ vars.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}
          bucket: ${{ vars.MIRROR_R2_BUCKET_NAME }}
          source-directory: ${{ steps.assets.outputs.directory }}
          include: install.sh
          prefix: ohm
          if-exists: overwrite
          cache-control: public, max-age=300
