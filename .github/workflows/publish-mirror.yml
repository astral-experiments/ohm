name: Publish public release assets

on:
  workflow_call:
    inputs:
      version:
        description: Exact published Ohm toolchain version
        required: true
        type: string

permissions: {}

jobs:
  publish-mirror:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      OHM_TOOLCHAIN: ${{ inputs.version }}
    steps:
      - name: Download published release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.version }}-*
          path: release
          merge-multiple: true

      - name: Verify and isolate public release assets
        id: assets
        working-directory: release
        run: |
          if [[ ! "$OHM_TOOLCHAIN" =~ ^ohm-[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*$ ]]; then
            echo "invalid Ohm toolchain version: $OHM_TOOLCHAIN" >&2
            exit 1
          fi

          macos_archive="$OHM_TOOLCHAIN-aarch64-apple-darwin.tar.gz"
          linux_archive="$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu.tar.gz"
          for asset in \
            "$macos_archive" \
            "$macos_archive.sha256" \
            "$linux_archive" \
            "$linux_archive.sha256" \
            ohm-installer.sh \
            SHA256SUMS; do
            if [[ ! -f "$asset" || -L "$asset" ]]; then
              echo "missing or unsafe release asset: $asset" >&2
              exit 1
            fi
          done

          sha256sum --check --strict SHA256SUMS

          public_directory="$(mktemp -d "${RUNNER_TEMP:?}/ohm-public-release.XXXXXX")"
          cp \
            "$macos_archive" \
            "$macos_archive.sha256" \
            "$linux_archive" \
            "$linux_archive.sha256" \
            "$public_directory/"
          cp ohm-installer.sh "$public_directory/install.sh"
          (
            cd "$public_directory"
            sha256sum \
              "$macos_archive" \
              "$macos_archive.sha256" \
              "$linux_archive" \
              "$linux_archive.sha256" \
              install.sh > SHA256SUMS
          )
          echo "directory=$public_directory" >> "$GITHUB_OUTPUT"

      - name: Publish immutable release assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ vars.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          PUBLIC_DIRECTORY: ${{ steps.assets.outputs.directory }}
          R2_BUCKET: ${{ vars.MIRROR_R2_BUCKET_NAME }}
        run: |
          aws s3 cp --recursive --output table --color on \
            --cache-control "public, max-age=31536000, immutable" \
            "$PUBLIC_DIRECTORY/" \
            "s3://$R2_BUCKET/ohm/releases/$OHM_TOOLCHAIN/"

      - name: Publish latest release installer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ vars.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          PUBLIC_DIRECTORY: ${{ steps.assets.outputs.directory }}
          R2_BUCKET: ${{ vars.MIRROR_R2_BUCKET_NAME }}
        run: |
          aws s3 cp --output table --color on \
            --cache-control "public, max-age=300" \
            "$PUBLIC_DIRECTORY/install.sh" \
            "s3://$R2_BUCKET/ohm/install.sh"
