name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Versioned manifest to build
        required: true
        default: toolchains/1.98.1/2.json
        type: string
      build:
        description: Run the full x.py dist extended build
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ohm-release-${{ inputs.manifest }}
  cancel-in-progress: false

jobs:
  plan:
    environment: release
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    outputs:
      rust-revision: ${{ steps.manifest.outputs.rust-revision }}
      cargo-revision: ${{ steps.manifest.outputs.cargo-revision }}
      clippy-revision: ${{ steps.manifest.outputs.clippy-revision }}
      rustfmt-revision: ${{ steps.manifest.outputs.rustfmt-revision }}
      manifest: ${{ steps.manifest.outputs.manifest }}
      toolchain: ${{ steps.manifest.outputs.toolchain }}
    steps:
      - name: Check out release coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require protected main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "release candidates must be built from the protected main branch" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Read and validate manifest
        id: manifest
        env:
          MANIFEST_PATH: ${{ inputs.manifest }}
        run: |
          if [[ ! "$MANIFEST_PATH" =~ ^toolchains/[0-9]+\.[0-9]+\.[0-9]+/[1-9][0-9]*\.json$ ]]; then
            echo "invalid versioned manifest path: $MANIFEST_PATH" >&2
            exit 1
          fi
          ./scripts/validate-release-manifest.sh --require-pinned "$MANIFEST_PATH"
          {
            echo "rust-revision=$(jq -er '.sources.rust.revision' "$MANIFEST_PATH")"
            echo "cargo-revision=$(jq -er '.sources.cargo.revision' "$MANIFEST_PATH")"
            echo "clippy-revision=$(jq -er '.sources.clippy.revision' "$MANIFEST_PATH")"
            echo "rustfmt-revision=$(jq -er '.sources.rustfmt.revision' "$MANIFEST_PATH")"
            echo "manifest=$MANIFEST_PATH"
            echo "toolchain=$(jq -er '.release.toolchain_name' "$MANIFEST_PATH")"
          } >> "$GITHUB_OUTPUT"

      - name: Create read-only source repository token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OHM_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OHM_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ohm-rust
            ohm-cargo
            ohm-rust-clippy
            ohm-rustfmt
          permission-contents: read

      - name: Check out pinned ohm-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-rust
          ref: ${{ steps.manifest.outputs.rust-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust

      - name: Check out pinned ohm-cargo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-cargo
          ref: ${{ steps.manifest.outputs.cargo-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/cargo

      - name: Check out pinned ohm-rust-clippy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-rust-clippy
          ref: ${{ steps.manifest.outputs.clippy-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/clippy

      - name: Check out pinned ohm-rustfmt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-rustfmt
          ref: ${{ steps.manifest.outputs.rustfmt-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rustfmt

      - name: Verify source revisions
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest }}
        run: |
          ./scripts/verify-release-sources.sh \
            "$MANIFEST_PATH" \
            source/rust \
            source/cargo \
            source/clippy \
            source/rustfmt

  build:
    if: inputs.build
    needs: plan
    environment: release
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            # Namespace Apple Silicon runners crash PGO-instrumented binaries.
            runner: depot-macos-15
          - target: x86_64-unknown-linux-gnu
            runner: github-ubuntu-24.04-x86_64-8
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      OHM_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out release coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Create read-only source repository token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OHM_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OHM_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ohm-rust
            ohm-cargo
            ohm-rust-clippy
            ohm-rustfmt
          permission-contents: read

      - name: Check out pinned ohm-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-rust
          ref: ${{ needs.plan.outputs.rust-revision }}
          token: ${{ steps.source-token.outputs.token }}
          # Bootstrap needs the upstream history to locate a compatible LLVM artifact.
          fetch-depth: 0
          persist-credentials: false
          path: source/rust

      - name: Check out pinned ohm-cargo into the Rust source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-cargo
          ref: ${{ needs.plan.outputs.cargo-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust/src/tools/cargo

      - name: Check out pinned ohm-rust-clippy into the Rust source tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: astral-sh/ohm-rust-clippy
          ref: ${{ needs.plan.outputs.clippy-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust/src/tools/clippy

      - name: Check out pinned ohm-rustfmt into the Rust source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-rustfmt
          ref: ${{ needs.plan.outputs.rustfmt-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust/src/tools/rustfmt

      - name: Verify source revisions
        env:
          MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
        run: |
          ./scripts/verify-release-sources.sh \
            "$MANIFEST_PATH" \
            source/rust \
            source/rust/src/tools/cargo \
            source/rust/src/tools/clippy \
            source/rust/src/tools/rustfmt

      - name: Install pinned LLVM BOLT tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          BOLT_BASE_URL: https://apt.llvm.org/noble/pool/main/l/llvm-toolchain-22
          BOLT_VERSION: 22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80
        run: |
          if [[ "$(dpkg --print-architecture)" != amd64 ]]; then
            echo 'LLVM BOLT packages require an amd64 Linux runner' >&2
            exit 1
          fi

          bolt_root="$(mktemp -d "${RUNNER_TEMP:?}/ohm-bolt.XXXXXX")"
          for package in bolt-22 libbolt-22-dev; do
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --fail --location --retry 3 --show-error --silent \
              --output "$bolt_root/$package.deb" \
              "$BOLT_BASE_URL/${package}_${BOLT_VERSION}_amd64.deb"
          done

          printf '%s  %s\n' \
            '97a9e4e8d2b2219757c38abef93e913793ebc64580aa51207bd23941c44ec070' \
            "$bolt_root/bolt-22.deb" \
            '48639dafeb45892eec58f5d8a2d0d612ce791a2f713f06c794b71d6a72fa582d' \
            "$bolt_root/libbolt-22-dev.deb" \
            | sha256sum --check --strict

          dpkg-deb --extract "$bolt_root/bolt-22.deb" "$bolt_root"
          dpkg-deb --extract "$bolt_root/libbolt-22-dev.deb" "$bolt_root"

          bolt_llvm_dir="$bolt_root/usr/lib/llvm-22"
          "$bolt_llvm_dir/bin/llvm-bolt" --version
          "$bolt_llvm_dir/bin/merge-fdata" --version
          if [[ ! -f "$bolt_llvm_dir/lib/libbolt_rt_instr.a" ]]; then
            echo 'LLVM BOLT instrumentation runtime is missing' >&2
            exit 1
          fi

          printf 'OHM_BOLT_LLVM_DIR=%s\n' "$bolt_llvm_dir" >> "$GITHUB_ENV"

      - name: Prepare pinned Wild linker
        env:
          MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
        run: |
          wild_directory="$(python3 scripts/prepare-wild.py \
            "$MANIFEST_PATH" "$OHM_TARGET" "$RUNNER_TEMP/ohm-wild")"
          printf 'OHM_WILD_LINKER_DIR=%s\n' "$wild_directory" >> "$GITHUB_ENV"

      - name: Build optimized extended Rust distribution
        env:
          OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
        run: |
          ./scripts/build-optimized-dist.sh \
            "$OHM_TARGET" \
            "$OHM_TOOLCHAIN" \
            "$GITHUB_WORKSPACE/source/rust" \
            "$GITHUB_WORKSPACE/release/bootstrap.toml"

      - name: Write build provenance
        env:
          CARGO_REVISION: ${{ needs.plan.outputs.cargo-revision }}
          CLIPPY_REVISION: ${{ needs.plan.outputs.clippy-revision }}
          COORDINATOR_REPOSITORY: ${{ github.repository }}
          COORDINATOR_REVISION: ${{ github.sha }}
          MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
          OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
          RUST_REVISION: ${{ needs.plan.outputs.rust-revision }}
          RUSTFMT_REVISION: ${{ needs.plan.outputs.rustfmt-revision }}
        run: |
          manifest_sha256="$(shasum -a 256 "$MANIFEST_PATH" | awk '{print $1}')"
          jq -n \
            --arg toolchain "$OHM_TOOLCHAIN" \
            --arg target "$OHM_TARGET" \
            --arg coordinator_repository "$COORDINATOR_REPOSITORY" \
            --arg coordinator_revision "$COORDINATOR_REVISION" \
            --arg manifest_path "$MANIFEST_PATH" \
            --arg manifest_sha256 "$manifest_sha256" \
            --arg rust_revision "$RUST_REVISION" \
            --arg cargo_revision "$CARGO_REVISION" \
            --arg clippy_revision "$CLIPPY_REVISION" \
            --arg rustfmt_revision "$RUSTFMT_REVISION" \
            --argjson bundled_tools "$(jq --arg target "$OHM_TARGET" \
              'if $target == "x86_64-unknown-linux-gnu" then .bundled_tools // {} else {} end' "$MANIFEST_PATH")" \
            '{
              schema_version: 1,
              toolchain: $toolchain,
              target: $target,
              bundled_tools: $bundled_tools,
              coordinator: {
                repository: $coordinator_repository,
                revision: $coordinator_revision
              },
              manifest: {
                path: $manifest_path,
                sha256: $manifest_sha256
              },
              sources: {
                rust: { revision: $rust_revision },
                cargo: { revision: $cargo_revision },
                clippy: { revision: $clippy_revision },
                rustfmt: { revision: $rustfmt_revision }
              }
            }' > source/rust/build/dist/ohm-provenance.json

      - name: Stage versioned distribution assets
        id: assets
        env:
          OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
        run: |
          rust_version="$(tr -d '\r\n' < source/rust/src/version)"
          combined_archive="source/rust/build/dist/rust-$rust_version-dev-$OHM_TARGET.tar.gz"
          if [[ ! -f "$combined_archive" ]]; then
            echo "combined Ohm archive not found: $combined_archive" >&2
            exit 1
          fi

          release_directory="$(mktemp -d "${RUNNER_TEMP:?}/ohm-release.XXXXXX")"
          archive_name="$OHM_TOOLCHAIN-$OHM_TARGET.tar.gz"
          provenance_name="$OHM_TOOLCHAIN-$OHM_TARGET-provenance.json"
          cp "$combined_archive" "$release_directory/$archive_name"
          cp source/rust/build/dist/ohm-provenance.json \
            "$release_directory/$provenance_name"

          (
            cd "$release_directory"
            shasum -a 256 "$archive_name" > "$archive_name.sha256"
            shasum -a 256 "$provenance_name" > "$provenance_name.sha256"
          )

          echo "directory=$release_directory" >> "$GITHUB_OUTPUT"

      - name: Retain distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}
          path: |
            ${{ steps.assets.outputs.directory }}/${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}.tar.gz
            ${{ steps.assets.outputs.directory }}/${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}.tar.gz.sha256
            ${{ steps.assets.outputs.directory }}/${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}-provenance.json
            ${{ steps.assets.outputs.directory }}/${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}-provenance.json.sha256
          if-no-files-found: error
          retention-days: 7

  assemble:
    if: inputs.build
    needs:
      - plan
      - build
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    env:
      MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
      OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
    steps:
      - name: Check out release coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified distribution assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.plan.outputs.toolchain }}-*
          path: release
          merge-multiple: true

      - name: Verify and assemble release assets
        run: bash scripts/assemble-release.sh "$MANIFEST_PATH" release "$OHM_TOOLCHAIN"

      - name: Retain global release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.toolchain }}-global
          path: |
            release/ohm-installer.sh
            release/${{ needs.plan.outputs.toolchain }}.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  smoke-test:
    if: inputs.build
    needs:
      - plan
      - assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: namespace-profile-macos-15
          - target: x86_64-unknown-linux-gnu
            runner: depot-ubuntu-24.04-4
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CLIPPY_REVISION: ${{ needs.plan.outputs.clippy-revision }}
      OHM_TARGET: ${{ matrix.target }}
      OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
    steps:
      - name: Check out release coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download platform distribution assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}
          path: release

      - name: Download universal release installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.toolchain }}-global
          path: release

      - name: Install rust-analyzer for the editor smoke test
        run: |
          upstream_version="$(jq -r '.release.upstream_rust_version' "release/$OHM_TOOLCHAIN.json")"
          rustup toolchain install "$upstream_version" --profile minimal --component rust-analyzer
          printf 'RUST_ANALYZER=%s\n' "$(rustup which --toolchain "$upstream_version" rust-analyzer)" >> "$GITHUB_ENV"

      - name: Smoke test Ohm toolchain
        run: |
          bash scripts/smoke-test-release.sh release \
            "$OHM_TOOLCHAIN" "$OHM_TARGET" "$CLIPPY_REVISION"

  publish:
    if: inputs.build
    needs:
      - plan
      - smoke-test
    environment: release
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
    steps:
      - name: Download verified distribution assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.plan.outputs.toolchain }}-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS

      - name: Create source repository tagging token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OHM_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OHM_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ohm-rust
            ohm-cargo
            ohm-rust-clippy
            ohm-rustfmt
          permission-contents: write

      - name: Tag release source revisions
        env:
          CARGO_REVISION: ${{ needs.plan.outputs.cargo-revision }}
          CLIPPY_REVISION: ${{ needs.plan.outputs.clippy-revision }}
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          RUST_REVISION: ${{ needs.plan.outputs.rust-revision }}
          RUSTFMT_REVISION: ${{ needs.plan.outputs.rustfmt-revision }}
          SOURCE_OWNER: ${{ github.repository_owner }}
        run: |
          sources=(
            "ohm-rust:$RUST_REVISION"
            "ohm-cargo:$CARGO_REVISION"
            "ohm-rust-clippy:$CLIPPY_REVISION"
            "ohm-rustfmt:$RUSTFMT_REVISION"
          )
          missing_sources=()

          for source in "${sources[@]}"; do
            repository="${source%%:*}"
            revision="${source#*:}"
            existing_revision="$(
              gh api "repos/$SOURCE_OWNER/$repository/git/matching-refs/tags/$OHM_TOOLCHAIN" \
                --jq ".[] | select(.ref == \"refs/tags/$OHM_TOOLCHAIN\") | .object.sha"
            )"

            if [[ "$existing_revision" == "$revision" ]]; then
              echo "$repository: reusing $OHM_TOOLCHAIN at $revision"
            elif [[ -n "$existing_revision" ]]; then
              echo "$repository: $OHM_TOOLCHAIN points at $existing_revision, expected $revision" >&2
              exit 1
            else
              missing_sources+=("$source")
            fi
          done

          for source in "${missing_sources[@]}"; do
            repository="${source%%:*}"
            revision="${source#*:}"
            gh api --method POST "repos/$SOURCE_OWNER/$repository/git/refs" \
              -f "ref=refs/tags/$OHM_TOOLCHAIN" \
              -f "sha=$revision" \
              --silent
            echo "$repository: tagged $OHM_TOOLCHAIN at $revision"
          done

      - name: Publish GitHub Release
        working-directory: release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Ohm releases must be published from the protected main branch" >&2
            exit 1
          fi

          if existing_release="$(
            gh release view "$OHM_TOOLCHAIN" \
              --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish,assets 2>/dev/null
          )"; then
            if ! jq -e --arg commit "$RELEASE_COMMIT" \
              '.targetCommitish == $commit' <<< "$existing_release" >/dev/null; then
              echo "existing Ohm release targets a different commit: $OHM_TOOLCHAIN" >&2
              exit 1
            fi

            for asset in \
              "$OHM_TOOLCHAIN-aarch64-apple-darwin.tar.gz" \
              "$OHM_TOOLCHAIN-aarch64-apple-darwin.tar.gz.sha256" \
              "$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu.tar.gz" \
              "$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu.tar.gz.sha256" \
              ohm-installer.sh \
              "$OHM_TOOLCHAIN.json" \
              "$OHM_TOOLCHAIN-aarch64-apple-darwin-provenance.json" \
              "$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu-provenance.json" \
              SHA256SUMS; do
              expected_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
              if ! jq -e --arg name "$asset" --arg digest "$expected_digest" '
                [.assets[] | select(.name == $name)]
                | length == 1 and .[0].digest == $digest
              ' <<< "$existing_release" >/dev/null; then
                echo "existing Ohm release contains a different asset: $asset" >&2
                exit 1
              fi
            done

            echo "Ohm release already exists with matching assets: $OHM_TOOLCHAIN"
            exit 0
          fi

          release_url="https://labs.astral.sh/ohm/releases/$OHM_TOOLCHAIN"
          notes_file="$RUNNER_TEMP/ohm-release-notes.md"
          upstream_rust_version="$(jq -er '.release.upstream_rust_version' "$OHM_TOOLCHAIN.json")"
          ohm_revision="$(jq -er '.release.ohm_revision' "$OHM_TOOLCHAIN.json")"
          if [[ "$ohm_revision" == 1 ]]; then
            release_summary="This is the first Ohm release based on Rust $upstream_rust_version."
          else
            release_summary="Based on Rust $upstream_rust_version."
          fi
          printf '%s\n' \
            '> [!WARNING]' \
            '> Ohm is an experimental Rust toolchain intended only for local development.' \
            '> Its optimizations may be unsound; never use it for production builds,' \
            '> releases, CI correctness validation, or final test results.' \
            '' \
            "$release_summary" \
            '' \
            "## Install Ohm $OHM_TOOLCHAIN" \
            '' \
            '### Install prebuilt binaries via shell script' \
            '' \
            'Requires rustup and Apple Silicon macOS or x86_64 Linux.' \
            '' \
            '```sh' \
            "curl --proto '=https' --tlsv1.2 -LsSf $release_url/install.sh | sh" \
            '```' \
            '' \
            '### Use Ohm for local development' \
            '' \
            '```sh' \
            'cargo +ohm test' \
            'cargo +ohm check' \
            'cargo +ohm clippy' \
            'cargo +ohm fmt' \
            '```' \
            '' \
            'Disable the experimental defaults for a local comparison:' \
            '' \
            '```sh' \
            'cargo +ohm -Zohm-defaults=no test' \
            '```' \
            '' \
            "## Download Ohm $OHM_TOOLCHAIN" \
            '' \
            '| File | Platform | Checksum |' \
            '|------|----------|----------|' \
            "| [$OHM_TOOLCHAIN-aarch64-apple-darwin.tar.gz]($release_url/$OHM_TOOLCHAIN-aarch64-apple-darwin.tar.gz) | Apple Silicon macOS | [checksum]($release_url/$OHM_TOOLCHAIN-aarch64-apple-darwin.tar.gz.sha256) |" \
            "| [$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu.tar.gz]($release_url/$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu.tar.gz) | x86_64 Linux | [checksum]($release_url/$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu.tar.gz.sha256) |" \
            > "$notes_file"

          gh release create "$OHM_TOOLCHAIN" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "$OHM_TOOLCHAIN" \
            --notes-file "$notes_file" \
            --generate-notes \
            "$OHM_TOOLCHAIN-aarch64-apple-darwin.tar.gz" \
            "$OHM_TOOLCHAIN-aarch64-apple-darwin.tar.gz.sha256" \
            "$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu.tar.gz" \
            "$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            ohm-installer.sh \
            "$OHM_TOOLCHAIN.json" \
            "$OHM_TOOLCHAIN-aarch64-apple-darwin-provenance.json" \
            "$OHM_TOOLCHAIN-x86_64-unknown-linux-gnu-provenance.json" \
            SHA256SUMS

  publish-mirror:
    if: inputs.build
    needs:
      - plan
      - publish
    uses: ./.github/workflows/publish-mirror.yml
    with:
      version: ${{ needs.plan.outputs.toolchain }}
    secrets: inherit # zizmor: ignore[secrets-inherit] required for the protected release environment
    permissions:
      contents: read
