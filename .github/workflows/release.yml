name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Versioned manifest to build
        required: true
        default: toolchains/1.97.1/1.json
        type: string
      build:
        description: Run the full x.py dist extended build
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ohm-release-${{ inputs.manifest }}
  cancel-in-progress: false

jobs:
  plan:
    environment: release
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    outputs:
      rust-revision: ${{ steps.manifest.outputs.rust-revision }}
      cargo-revision: ${{ steps.manifest.outputs.cargo-revision }}
      clippy-revision: ${{ steps.manifest.outputs.clippy-revision }}
      rustfmt-revision: ${{ steps.manifest.outputs.rustfmt-revision }}
      manifest: ${{ steps.manifest.outputs.manifest }}
      toolchain: ${{ steps.manifest.outputs.toolchain }}
    steps:
      - name: Check out release coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require protected main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "release candidates must be built from the protected main branch" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Read and validate manifest
        id: manifest
        env:
          MANIFEST_PATH: ${{ inputs.manifest }}
        run: |
          if [[ ! "$MANIFEST_PATH" =~ ^toolchains/[0-9]+\.[0-9]+\.[0-9]+/[1-9][0-9]*\.json$ ]]; then
            echo "invalid versioned manifest path: $MANIFEST_PATH" >&2
            exit 1
          fi
          ./scripts/validate-release-manifest.sh --require-pinned "$MANIFEST_PATH"
          {
            echo "rust-revision=$(jq -er '.sources.rust.revision' "$MANIFEST_PATH")"
            echo "cargo-revision=$(jq -er '.sources.cargo.revision' "$MANIFEST_PATH")"
            echo "clippy-revision=$(jq -er '.sources.clippy.revision' "$MANIFEST_PATH")"
            echo "rustfmt-revision=$(jq -er '.sources.rustfmt.revision' "$MANIFEST_PATH")"
            echo "manifest=$MANIFEST_PATH"
            echo "toolchain=$(jq -er '.release.toolchain_name' "$MANIFEST_PATH")"
          } >> "$GITHUB_OUTPUT"

      - name: Create read-only source repository token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OHM_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OHM_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ohm-rust
            ohm-cargo
            ohm-rust-clippy
            ohm-rustfmt
          permission-contents: read

      - name: Check out pinned ohm-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-rust
          ref: ${{ steps.manifest.outputs.rust-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust

      - name: Check out pinned ohm-cargo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-cargo
          ref: ${{ steps.manifest.outputs.cargo-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/cargo

      - name: Check out pinned ohm-rust-clippy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-rust-clippy
          ref: ${{ steps.manifest.outputs.clippy-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/clippy

      - name: Check out pinned ohm-rustfmt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-rustfmt
          ref: ${{ steps.manifest.outputs.rustfmt-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rustfmt

      - name: Verify source revisions
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest }}
        run: |
          ./scripts/verify-release-sources.sh \
            "$MANIFEST_PATH" \
            source/rust \
            source/cargo \
            source/clippy \
            source/rustfmt

  build:
    if: inputs.build
    needs: plan
    environment: release
    timeout-minutes: 360
    runs-on: depot-macos-15
    permissions:
      contents: read
    env:
      OHM_TARGET: aarch64-apple-darwin
    steps:
      - name: Check out release coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Create read-only source repository token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OHM_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OHM_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ohm-rust
            ohm-cargo
            ohm-rust-clippy
            ohm-rustfmt
          permission-contents: read

      - name: Check out pinned ohm-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-rust
          ref: ${{ needs.plan.outputs.rust-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust

      - name: Check out pinned ohm-cargo into the Rust source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-cargo
          ref: ${{ needs.plan.outputs.cargo-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust/src/tools/cargo

      - name: Check out pinned ohm-rust-clippy into the Rust source tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: astral-sh/ohm-rust-clippy
          ref: ${{ needs.plan.outputs.clippy-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust/src/tools/clippy

      - name: Check out pinned ohm-rustfmt into the Rust source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ohm-rustfmt
          ref: ${{ needs.plan.outputs.rustfmt-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust/src/tools/rustfmt

      - name: Verify source revisions
        env:
          MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
        run: |
          ./scripts/verify-release-sources.sh \
            "$MANIFEST_PATH" \
            source/rust \
            source/rust/src/tools/cargo \
            source/rust/src/tools/clippy \
            source/rust/src/tools/rustfmt

      - name: Build extended Rust distribution
        env:
          OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
        run: |
          python3 source/rust/x.py dist \
            --config "$GITHUB_WORKSPACE/release/bootstrap.toml" \
            --host "$OHM_TARGET" \
            --target "$OHM_TARGET" \
            --set "build.description=$OHM_TOOLCHAIN" \
            extended

      - name: Write build provenance
        env:
          CARGO_REVISION: ${{ needs.plan.outputs.cargo-revision }}
          CLIPPY_REVISION: ${{ needs.plan.outputs.clippy-revision }}
          COORDINATOR_REPOSITORY: ${{ github.repository }}
          COORDINATOR_REVISION: ${{ github.sha }}
          MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
          OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
          RUST_REVISION: ${{ needs.plan.outputs.rust-revision }}
          RUSTFMT_REVISION: ${{ needs.plan.outputs.rustfmt-revision }}
        run: |
          manifest_sha256="$(shasum -a 256 "$MANIFEST_PATH" | awk '{print $1}')"
          jq -n \
            --arg toolchain "$OHM_TOOLCHAIN" \
            --arg target "$OHM_TARGET" \
            --arg coordinator_repository "$COORDINATOR_REPOSITORY" \
            --arg coordinator_revision "$COORDINATOR_REVISION" \
            --arg manifest_path "$MANIFEST_PATH" \
            --arg manifest_sha256 "$manifest_sha256" \
            --arg rust_revision "$RUST_REVISION" \
            --arg cargo_revision "$CARGO_REVISION" \
            --arg clippy_revision "$CLIPPY_REVISION" \
            --arg rustfmt_revision "$RUSTFMT_REVISION" \
            '{
              schema_version: 1,
              toolchain: $toolchain,
              target: $target,
              coordinator: {
                repository: $coordinator_repository,
                revision: $coordinator_revision
              },
              manifest: {
                path: $manifest_path,
                sha256: $manifest_sha256
              },
              sources: {
                rust: { revision: $rust_revision },
                cargo: { revision: $cargo_revision },
                clippy: { revision: $clippy_revision },
                rustfmt: { revision: $rustfmt_revision }
              }
            }' > source/rust/build/dist/ohm-provenance.json

      - name: Stage versioned distribution assets
        id: assets
        env:
          MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
          OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
        run: |
          rust_version="$(tr -d '\r\n' < source/rust/src/version)"
          combined_archive="source/rust/build/dist/rust-$rust_version-dev-$OHM_TARGET.tar.gz"
          if [[ ! -f "$combined_archive" ]]; then
            echo "combined Ohm archive not found: $combined_archive" >&2
            exit 1
          fi

          release_directory="$(mktemp -d "${RUNNER_TEMP:?}/ohm-release.XXXXXX")"
          archive_name="$OHM_TOOLCHAIN-$OHM_TARGET.tar.gz"
          manifest_name="$OHM_TOOLCHAIN.json"
          provenance_name="$OHM_TOOLCHAIN-$OHM_TARGET-provenance.json"
          cp "$combined_archive" "$release_directory/$archive_name"
          cp "$MANIFEST_PATH" "$release_directory/$manifest_name"
          cp source/rust/build/dist/ohm-provenance.json \
            "$release_directory/$provenance_name"

          archive_sha256="$(shasum -a 256 "$release_directory/$archive_name" | awk '{print $1}')"
          awk -v version="$OHM_TOOLCHAIN" -v archive_sha256="$archive_sha256" '
            $0 == "embedded_version=" {
              print "embedded_version=" version
              ++version_count
              next
            }
            $0 == "embedded_archive_sha256=" {
              print "embedded_archive_sha256=" archive_sha256
              ++archive_sha256_count
              next
            }
            { print }
            END {
              if (version_count != 1 || archive_sha256_count != 1) {
                exit 1
              }
            }
          ' scripts/install.sh > "$release_directory/ohm-installer.sh"
          sh -n "$release_directory/ohm-installer.sh"
          grep -Fx "embedded_version=$OHM_TOOLCHAIN" "$release_directory/ohm-installer.sh" >/dev/null
          grep -Fx "embedded_archive_sha256=$archive_sha256" "$release_directory/ohm-installer.sh" >/dev/null

          (
            cd "$release_directory"
            shasum -a 256 \
              "$archive_name" \
              ohm-installer.sh \
              "$manifest_name" \
              "$provenance_name" > SHA256SUMS
          )

          echo "directory=$release_directory" >> "$GITHUB_OUTPUT"

      - name: Smoke test Ohm toolchain
        env:
          OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
          RELEASE_DIRECTORY: ${{ steps.assets.outputs.directory }}
        run: |
          smoke_root="$(mktemp -d "${RUNNER_TEMP:?}/ohm-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_root"' EXIT

          toolchain_root="$smoke_root/toolchain"
          export CARGO_HOME="$smoke_root/cargo-home"
          export RUSTUP_HOME="$smoke_root/rustup-home"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          OHM_DOWNLOAD_URL="file://$RELEASE_DIRECTORY" \
            OHM_INSTALL_DIR="$toolchain_root" \
            sh "$RELEASE_DIRECTORY/ohm-installer.sh"

          unset RUSTC_BOOTSTRAP
          rustc +"$OHM_TOOLCHAIN" -Z help \
            | grep -F 'public-api-hash' >/dev/null
          cargo +"$OHM_TOOLCHAIN" -Z help \
            | grep -F 'relink-only' >/dev/null
          rust_revision="$(git -C source/rust rev-parse --short=10 HEAD)"
          "$toolchain_root/bin/cargo-clippy" --version \
            | grep -F "$rust_revision" >/dev/null
          "$toolchain_root/bin/clippy-driver" --version \
            | grep -F "$rust_revision" >/dev/null
          rustfmt_version="$("$toolchain_root/bin/rustfmt" --version)"
          cargo_fmt_version="$("$toolchain_root/bin/cargo-fmt" --version)"
          grep -F 'rustfmt ' <<< "$rustfmt_version" >/dev/null
          [[ "$cargo_fmt_version" == "$rustfmt_version" ]]

          smoke_crate="$smoke_root/crate"
          mkdir -p "$smoke_crate/src"
          cat > "$smoke_crate/Cargo.toml" <<'EOF'
          [package]
          name = "ohm-smoke"
          version = "0.0.0"
          edition = "2024"
          EOF
          cat > "$smoke_crate/src/main.rs" <<'EOF'
          fn main() {}
          EOF

          rustc_wrapper="$smoke_root/rustc-wrapper"
          cat > "$rustc_wrapper" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          crate_name=
          has_public_api_hash=false
          has_proc_macro_cache=false
          previous_argument=
          for argument in "$@"; do
            if [[ "$previous_argument" == "--crate-name" ]]; then
              crate_name="$argument"
            fi
            case "$argument" in
              -Zpublic-api-hash) has_public_api_hash=true ;;
              -Zcache-proc-macros) has_proc_macro_cache=true ;;
            esac
            previous_argument="$argument"
          done

          if [[ "$crate_name" == "ohm_smoke" ]]; then
            case "${OHM_EXPECT_DEFAULTS:?}" in
              enabled)
                if [[ "$has_public_api_hash" != true || "$has_proc_macro_cache" != true ]]; then
                  echo "Ohm defaults missing from ohm_smoke rustc invocation" >&2
                  exit 1
                fi
                ;;
              disabled)
                if [[ "$has_public_api_hash" == true || "$has_proc_macro_cache" == true ]]; then
                  echo "Ohm defaults present on disabled ohm_smoke rustc invocation" >&2
                  exit 1
                fi
                ;;
              *)
                echo "invalid OHM_EXPECT_DEFAULTS value" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$OHM_EXPECT_DEFAULTS" >> "${OHM_RUSTC_LOG:?}"
          fi

          exec "$@"
          EOF
          chmod +x "$rustc_wrapper"

          unset CARGO_BUILD_RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTFLAGS RUSTC_WORKSPACE_WRAPPER
          defaults_log="$smoke_root/defaults-rustc-args"
          OHM_EXPECT_DEFAULTS=enabled \
            OHM_RUSTC_LOG="$defaults_log" \
            RUSTC_WRAPPER="$rustc_wrapper" \
            CARGO_TARGET_DIR="$smoke_root/defaults-target" \
            cargo +"$OHM_TOOLCHAIN" build --manifest-path "$smoke_crate/Cargo.toml"
          grep -Fx enabled "$defaults_log" >/dev/null

          disabled_log="$smoke_root/disabled-rustc-args"
          OHM_EXPECT_DEFAULTS=disabled \
            OHM_RUSTC_LOG="$disabled_log" \
            RUSTC_WRAPPER="$rustc_wrapper" \
            CARGO_TARGET_DIR="$smoke_root/disabled-target" \
            cargo +"$OHM_TOOLCHAIN" -Zohm-defaults=no build \
              --manifest-path "$smoke_crate/Cargo.toml"
          grep -Fx disabled "$disabled_log" >/dev/null

          cargo +"$OHM_TOOLCHAIN" clippy --manifest-path "$smoke_crate/Cargo.toml" -- -D warnings
          cargo +"$OHM_TOOLCHAIN" fmt --manifest-path "$smoke_crate/Cargo.toml" -- --check

      - name: Retain distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.toolchain }}-aarch64-apple-darwin
          path: ${{ steps.assets.outputs.directory }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.build
    needs:
      - plan
      - build
    environment: release
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OHM_TARGET: aarch64-apple-darwin
      OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
    steps:
      - name: Download verified distribution assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.toolchain }}-aarch64-apple-darwin
          path: release

      - name: Verify release assets
        working-directory: release
        run: |
          archive_name="$OHM_TOOLCHAIN-$OHM_TARGET.tar.gz"
          manifest_name="$OHM_TOOLCHAIN.json"
          provenance_name="$OHM_TOOLCHAIN-$OHM_TARGET-provenance.json"

          for asset in "$archive_name" ohm-installer.sh "$manifest_name" "$provenance_name" SHA256SUMS; do
            if [[ ! -f "$asset" || -L "$asset" ]]; then
              echo "missing or unsafe release asset: $asset" >&2
              exit 1
            fi
          done

          sha256sum --check --strict SHA256SUMS

      - name: Publish GitHub Release
        working-directory: release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Ohm releases must be published from the protected main branch" >&2
            exit 1
          fi

          if existing_release="$(
            gh release view "$OHM_TOOLCHAIN" \
              --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish,assets 2>/dev/null
          )"; then
            if ! jq -e --arg commit "$RELEASE_COMMIT" \
              '.targetCommitish == $commit' <<< "$existing_release" >/dev/null; then
              echo "existing Ohm release targets a different commit: $OHM_TOOLCHAIN" >&2
              exit 1
            fi

            for asset in \
              "$OHM_TOOLCHAIN-$OHM_TARGET.tar.gz" \
              ohm-installer.sh \
              "$OHM_TOOLCHAIN.json" \
              "$OHM_TOOLCHAIN-$OHM_TARGET-provenance.json" \
              SHA256SUMS; do
              expected_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
              if ! jq -e --arg name "$asset" --arg digest "$expected_digest" '
                [.assets[] | select(.name == $name)]
                | length == 1 and .[0].digest == $digest
              ' <<< "$existing_release" >/dev/null; then
                echo "existing Ohm release contains a different asset: $asset" >&2
                exit 1
              fi
            done

            echo "Ohm release already exists with matching assets: $OHM_TOOLCHAIN"
            exit 0
          fi

          release_url="https://labs.astral.sh/ohm/releases/$OHM_TOOLCHAIN"
          notes_file="$RUNNER_TEMP/ohm-release-notes.md"
          printf '%s\n' \
            '> [!WARNING]' \
            '> Ohm is an experimental Rust toolchain intended only for local development.' \
            '> Its optimizations may be unsound; never use it for production builds,' \
            '> releases, CI correctness validation, or final test results.' \
            '' \
            "## Install Ohm $OHM_TOOLCHAIN" \
            '' \
            '### Install prebuilt binaries via shell script' \
            '' \
            'Requires rustup and Apple Silicon macOS.' \
            '' \
            '```sh' \
            "curl --proto '=https' --tlsv1.2 -LsSf $release_url/install.sh | sh" \
            '```' \
            '' \
            '### Use Ohm for local development' \
            '' \
            '```sh' \
            'cargo +ohm test' \
            'cargo +ohm check' \
            'cargo +ohm clippy' \
            'cargo +ohm fmt' \
            '```' \
            '' \
            'Disable the experimental defaults for a local comparison:' \
            '' \
            '```sh' \
            'cargo +ohm -Zohm-defaults=no test' \
            '```' \
            '' \
            "## Download Ohm $OHM_TOOLCHAIN" \
            '' \
            '| File | Platform | Checksum |' \
            '|------|----------|----------|' \
            "| [$OHM_TOOLCHAIN-$OHM_TARGET.tar.gz]($release_url/$OHM_TOOLCHAIN-$OHM_TARGET.tar.gz) | Apple Silicon macOS | [checksum]($release_url/SHA256SUMS) |" \
            > "$notes_file"

          gh release create "$OHM_TOOLCHAIN" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "$OHM_TOOLCHAIN" \
            --notes-file "$notes_file" \
            --generate-notes \
            "$OHM_TOOLCHAIN-$OHM_TARGET.tar.gz" \
            ohm-installer.sh \
            "$OHM_TOOLCHAIN.json" \
            "$OHM_TOOLCHAIN-$OHM_TARGET-provenance.json" \
            SHA256SUMS

  publish-mirror:
    if: inputs.build
    needs:
      - plan
      - publish
    uses: ./.github/workflows/publish-mirror.yml
    with:
      version: ${{ needs.plan.outputs.toolchain }}
    permissions:
      contents: read
