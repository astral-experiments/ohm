name: Qualify Linux release compiler
run-name: Qualify Linux release compiler from ${{ inputs.candidate_revision }}
"on":
  workflow_dispatch:
    inputs:
      candidate_revision:
        description: Exact coordinator commit containing the candidate manifest
        required: true
        type: string
      manifest:
        description: Versioned manifest path in the candidate commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: linux-release-qualification-${{ inputs.candidate_revision }}
  cancel-in-progress: false
jobs:
  compiler:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: release
    timeout-minutes: 360
    runs-on: namespace-profile-ubuntu-24-04-16
    permissions:
      contents: read
    env:
      OHM_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Check out release coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - name: Validate the candidate commit
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          MANIFEST_PATH: ${{ inputs.manifest }}
        run: |
          if [[ ! "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ || ! "$MANIFEST_PATH" =~ ^toolchains/[0-9]+\.[0-9]+\.[0-9]+/[1-9][0-9]*\.json$ ]]; then
            echo "select an exact candidate commit and versioned manifest path" >&2
            exit 1
          fi

      - name: Read the candidate manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_revision }}
          path: qualification-input
          sparse-checkout: ${{ inputs.manifest }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate the qualification manifest
        id: manifest
        env:
          MANIFEST_PATH: ${{ inputs.manifest }}
        run: |
          manifest="$MANIFEST_PATH"
          candidate="qualification-input/$manifest"
          if [[ -e "$manifest" ]]; then
            cmp -- "$candidate" "$manifest"
          else
            mkdir -p -- "$(dirname -- "$manifest")"
            cp -- "$candidate" "$manifest"
          fi
          ./scripts/validate-release-manifest.sh --require-pinned "$manifest"
          {
            echo "rust-revision=$(jq -er '.sources.rust.revision' "$manifest")"
            echo "cargo-revision=$(jq -er '.sources.cargo.revision' "$manifest")"
            echo "clippy-revision=$(jq -er '.sources.clippy.revision' "$manifest")"
            echo "rustfmt-revision=$(jq -er '.sources.rustfmt.revision' "$manifest")"
            echo "manifest=$manifest"
            echo "toolchain=$(jq -er '.release.toolchain_name' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Create read-only source repository token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OHM_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OHM_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ohm-rust
            ohm-cargo
            ohm-rust-clippy
            ohm-rustfmt
          permission-contents: read
      - name: Check out pinned ohm-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository_owner }}/ohm-rust
          ref: ${{ steps.manifest.outputs.rust-revision }}
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
          path: source/rust
      - name: Check out pinned ohm-cargo into the Rust source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository_owner }}/ohm-cargo
          ref: ${{ steps.manifest.outputs.cargo-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust/src/tools/cargo
      - name: Check out pinned ohm-rust-clippy into the Rust source tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ github.repository_owner }}/ohm-rust-clippy
          ref: ${{ steps.manifest.outputs.clippy-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust/src/tools/clippy
      - name: Check out pinned ohm-rustfmt into the Rust source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository_owner }}/ohm-rustfmt
          ref: ${{ steps.manifest.outputs.rustfmt-revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source/rust/src/tools/rustfmt
      - name: Verify source revisions
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest }}
        run: |
          ./scripts/verify-release-sources.sh \
            "$MANIFEST_PATH" \
            source/rust \
            source/rust/src/tools/cargo \
            source/rust/src/tools/clippy \
            source/rust/src/tools/rustfmt

      - name: Install pinned LLVM BOLT tools
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest }}
        run: ./scripts/install-release-bolt.sh

      - name: Prepare pinned Wild linker
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest }}
        run: |
          wild_directory="$(python3 scripts/prepare-wild.py \
            "$MANIFEST_PATH" "$OHM_TARGET" "$RUNNER_TEMP/ohm-wild")"
          printf 'OHM_WILD_LINKER_DIR=%s\n' "$wild_directory" >> "$GITHUB_ENV"

      - name: Build optimized extended Rust distribution
        id: distribution
        env:
          OHM_TOOLCHAIN: ${{ steps.manifest.outputs.toolchain }}
        run: |
          ./scripts/build-optimized-dist.sh \
            "$OHM_TARGET" \
            "$OHM_TOOLCHAIN" \
            "$GITHUB_WORKSPACE/source/rust" \
            "$GITHUB_WORKSPACE/release/bootstrap.toml"

      - name: Stage versioned distribution assets
        id: assets
        env:
          CARGO_REVISION: ${{ steps.manifest.outputs.cargo-revision }}
          CLIPPY_REVISION: ${{ steps.manifest.outputs.clippy-revision }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest }}
          OHM_TOOLCHAIN: ${{ steps.manifest.outputs.toolchain }}
          RUST_REVISION: ${{ steps.manifest.outputs.rust-revision }}
          RUSTFMT_REVISION: ${{ steps.manifest.outputs.rustfmt-revision }}
        run: ./scripts/stage-release-dist.sh

      - name: Retain distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-release-qualification-${{ github.run_id }}
          path: |
            ${{ steps.assets.outputs.directory }}/${{ steps.manifest.outputs.toolchain }}-x86_64-unknown-linux-gnu.tar.gz
            ${{ steps.assets.outputs.directory }}/${{ steps.manifest.outputs.toolchain }}-x86_64-unknown-linux-gnu.tar.gz.sha256
            ${{ steps.assets.outputs.directory }}/${{ steps.manifest.outputs.toolchain }}-x86_64-unknown-linux-gnu-provenance.json
            ${{ steps.assets.outputs.directory }}/${{ steps.manifest.outputs.toolchain }}-x86_64-unknown-linux-gnu-provenance.json.sha256
          if-no-files-found: error
          retention-days: 14
    name: Build the Linux qualification compiler
