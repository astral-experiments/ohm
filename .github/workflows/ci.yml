name: Check a phase-owned foreign trait inventory on uv 22874
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
        description: Reviewed full SHA of this benchmark
      build_run_id:
        required: true
        type: string
        description: Completed arena compiler build
      build_head:
        required: true
        type: string
        description: Reviewed arena producer commit
      sdk_lock_sha256:
        required: true
        type: string
        description: SHA-256 of both authenticated production inputs and native qualification
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  root:
    if: github.event.repository.private == true && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-22874-inventory-uv-client'
      && github.sha == inputs.reviewed_head && github.run_attempt == 1 && inputs.build_run_id == '41389169358' && inputs.build_head == '70cf505327e6f7f433b8f45797bf4ee6220722f1'
      && inputs.sdk_lock_sha256 == 'c5cd93910f3b1d4300d58e916625adff2e1e49106acc77518388f765d13f1f8a'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 175
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_HEAD: ${{ inputs.build_head }}
      SDK_LOCK_SHA256: ${{ inputs.sdk_lock_sha256 }}
    steps:
    - name: Check out coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: coordinator
        ref: ${{ github.sha }}
        persist-credentials: 'false'
        sparse-checkout: |-
          scripts/handwritten-panel
          scripts/uv-inherent-22874
        fetch-depth: '2'
    - name: Check out builder
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: builder
        ref: 682930c7b58a62cd46c6f951b60d8cab8d3c7869
        persist-credentials: 'false'
        sparse-checkout: |-
          .github/workflows
          scripts/handwritten-stage1
    - name: Check out exact inventory builder
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: inventory-builder
        ref: ${{ inputs.build_head }}
        persist-credentials: 'false'
        sparse-checkout: |-
          .github/workflows
          scripts/trait-inventory-stage1
    - name: Check out opening
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: opening
        ref: 341cd92e5d381a50bd380467075f31e780ee6296
        persist-credentials: 'false'
        sparse-checkout: |
          scripts/uv-root-20991-opening
    - name: Check out previous
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: previous
        ref: 8bf1d2c61fa3bb23ccf44a329e74e0359d98848c
        persist-credentials: 'false'
        sparse-checkout: |
          scripts/uv-resolver-whole-pmu
    - name: Check out qualified
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: qualified
        ref: 1286210a06dcc353a4f03dcf8c7bb15f99a56cad
        persist-credentials: 'false'
        sparse-checkout: |
          scripts/rc23-trait-qualification
    - name: Check out pilot
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: pilot
        ref: 5c651f1d38c629da2a75d5cac3588db0be8104d7
        persist-credentials: 'false'
        sparse-checkout: |
          scripts/ctfe-crossover-pilot
          scripts/branch-return-pmu
    - name: Check out calibrator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: calibrator
        ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
        persist-credentials: 'false'
        sparse-checkout: |
          scripts/gnu-renderer-pfc-hardware
    - name: Check out observers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: observers
        ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
        persist-credentials: 'false'
        sparse-checkout: |
          scripts/gnu-example-ceiling
          scripts/gnu-renderer-library-workers
    - name: Check out uv at the actual landed edit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: astral-sh/uv
        ref: d952be66482a298658f39f314ba8c337154ed0e7
        fetch-depth: '2'
        fetch-tags: 'false'
        persist-credentials: 'false'
        path: uv-source
    - name: Check the private payload and host prerequisites
      run: |
        set -euo pipefail
        mkdir trait-results
        (cd coordinator/scripts/handwritten-panel && sha256sum --strict --check SHA256SUMS)
        (cd coordinator/scripts/uv-inherent-22874 && sha256sum --strict --check SHA256SUMS)
        /usr/bin/bash opening/scripts/uv-root-20991-opening/host-prerequisites.sh 2>&1 | tee trait-results/host-prerequisites.log
    - name: Calibrate inherited userspace instructions for real fork, exec and threads
      run: |
        set -euo pipefail
        /usr/bin/python3.12 -ISBu coordinator/scripts/uv-inherent-22874/core.py calibrate 2>&1 | tee trait-results/calibration.log
    - name: Admit the two qualified stage1 SDKs and the signed Cargo binary
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        /usr/bin/python3.12 -ISBu coordinator/scripts/uv-inherent-22874/core.py admit 2>&1 | tee trait-results/intake.log
    - name: Check both incremental and metadata migration directions
      run: /usr/bin/python3.12 -ISBu coordinator/scripts/uv-inherent-22874/core.py migration
    - name: Qualify native roots and collect four ordinary pairs plus two independent nine-compiler pairs
      run: |-
        set -euo pipefail
        /usr/bin/python3.12 -ISBu coordinator/scripts/uv-inherent-22874/screen.py 2>&1 | tee trait-results/experiment.log
    - name: Verify original restored outputs, PMU clocks and separate uninstrumented wall
      run: |-
        set -euo pipefail
        /usr/bin/python3.12 -ISBu coordinator/scripts/uv-inherent-22874/score.py 2>&1 | tee trait-results/reduction.log
    - name: Preserve raw clocks, source qualification and any incomplete attempt
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: uv-22874-arena-inventory-client-screen-1
        path: trait-results/
        if-no-files-found: error
        compression-level: '1'
        retention-days: 5
