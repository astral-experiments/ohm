name: Exact Cargo 444 first-parent comparison
run-name: Same-remap Cargo registry migration from ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact nonrelease QA head
        type: string
        required: true
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-25-restack-registry-20261104'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 75
    steps:
      - name: Check out the frozen merged Cargo and its verifiers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/rc25-registry-validation/
            /scripts/rc24-insta-input-proof/release-compiler.json
            /scripts/rc24-insta-input-proof/exec_count.c
            /scripts/rc24-insta-input-proof/migration/run.py
            /scripts/rc24-insta-input-proof/migration/fixture/
            /scripts/rc24-insta-input-proof/evidence/nonempty-registry-history/replay.py
      - name: Install the kernel exec tracer
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y strace
          fi
      - name: Prove normal v5 migration and the inherited history on the true first parent
        env:
          OHM_SDK_READ_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C qa rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -IB qa/scripts/rc25-registry-validation/pair.py
      - name: Keep original Cargo records, compiler invocations and native images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo25-first-parent-registry-${{ github.run_id }}
          path: ${{ runner.temp }}/cargo25-registry/proof
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
