name: Measure the Ruff Unicode width parser edit on two source-built compilers
run-name: Ruff Unicode width parser ${{ inputs.cohort }} at ${{ inputs.reviewed_head }}
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed QA commit
        type: string
        required: true
      cohort:
        description: Original pilot or separately admitted confirmation
        type: choice
        required: true
        options: [pilot, confirmation]
jobs:
  price:
    if: >-
      github.repository == 'astral-experiments/ohm' && github.run_attempt == '1'
      && github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-width-parser-pmu-20261104'
    name: Parser ${{ matrix.slot }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.cohort == 'pilot' && '["pilot-PC","pilot-CP"]' || '["B1","B2","B3","B4","B5","B6"]') }}
    steps:
      - name: Open the exact measurement and its original SDK receiver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: qa
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ruff-width-parser/*.py
            /scripts/ruff-width-parser/*.rs
            /scripts/ruff-width-parser/*.json
            /scripts/ruff-width-parser/PROTOCOL.md
            /scripts/ruff-width-parser/evidence/pilot/qualified.json
            /scripts/ruff-static-array-cost/*.c
            /scripts/ruff-static-array-cost/*.json
            /scripts/ruff-static-array-cost/transport.py
          persist-credentials: false
      - name: Open the original Ruff edit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/ruff
          ref: 64a255df497bede66fa4cdac80b9464d73a787ba
          fetch-depth: 3
          path: ruff
          persist-credentials: false
      - name: Count the ordinary Ruff check, its edited rustc and build controls
        env:
          WIDTH_COHORT: ${{ inputs.cohort }}
          WIDTH_SLOT: ${{ matrix.slot }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-width-parser/worker.py
      - name: Save the complete counters, programs and refusals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: width21231-${{ matrix.slot }}-${{ github.run_id }}
          path: ${{ runner.temp }}/width-parser/proof
          compression-level: 1
          retention-days: 14
          if-no-files-found: error
