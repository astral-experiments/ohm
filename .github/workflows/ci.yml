name: Reproduce genuine Ruff native grouping and jobserver assignments
run-name: Reopen both full signed e2e ELF forms with real jobserver groups ${{ inputs.reviewed_head }}
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1'
      && github.event_name == 'workflow_dispatch' && github.sha == inputs.reviewed_head
      && github.ref_name == 'charlie/qa-wild-native-boundary-29697-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ inputs.reviewed_head }}
        path: qa
        persist-credentials: false
        sparse-checkout: 'scripts/ruff-foreign-span-observer

          scripts/ruff-original-ty-instructions

          '
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: astral-sh/ruff
        ref: bfa2407e98ee1343caeefd02b4b69043509baa8c
        fetch-depth: 2
        path: ruff
        persist-credentials: false
    - name: Fetch the exact upstream Wild 0.11.0 source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: wild-linker/wild
        ref: e856d81f6683cad80b9fe0ebf1a0c3c403c6fe11
        path: wild-source
        persist-credentials: false
    - name: Provision the system SHA-256 library
      run: sudo apt-get update -qq && sudo apt-get install -qy strace libssl-dev elfutils
    - name: Run identical-live-argv signed E2E and controlled genuine section-group assignments
      env:
        REVIEWED_HEAD: ${{ inputs.reviewed_head }}
        OHM_SDK_READ_TOKEN: ${{ github.token }}
      run: python3 -IB qa/scripts/ruff-original-ty-instructions/e2e-existing-output/groups_study.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ty-server-native-jobserver-groups-${{ github.run_id }}
        path: ${{ runner.temp }}/ohm-foreign-join/published/
        retention-days: 10
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease QA source
        required: true
        type: string
