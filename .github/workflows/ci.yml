name: Unpublished original Darwin PGO Diesel capture
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact QA commit
        required: true
        type: string
permissions: {}
concurrency:
  group: private-darwin-pgo-diesel-original
  cancel-in-progress: false
jobs:
  forensics:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-rc22-pgo-diesel-forensics-20261101' && github.run_attempt == 1 && github.sha == inputs.reviewed_head
    timeout-minutes: 180
    runs-on: macos-15
    permissions:
      contents: read
    env:
      OHM_TARGET: aarch64-apple-darwin
      OHM_TOOLCHAIN: ohm-1.99.0-22
    steps:
    - name: Check out release coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 3
    - name: Make room for macOS profile training
      if: runner.environment == 'github-hosted'
      run: ./scripts/prepare-hosted-macos-release.sh
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: true
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b
        path: source-carrier
        persist-credentials: false
        sparse-checkout: scripts/rc22-private-export-ice
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27
        path: transport
        persist-credentials: false
        sparse-checkout: scripts/rc22-native
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
        path: public-seed
        persist-credentials: false
        sparse-checkout: scripts/ohm-apple-zmij/source-transport
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
        path: signed-rust
        persist-credentials: false
        sparse-checkout: scripts/strict-mixed-generics
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
        path: cargo-seed
        persist-credentials: false
        sparse-checkout: |-
          scripts/cargo-diagnostic-fix
          scripts/ohm-apple-zmij/cargo293
    - name: Verify exact coordinator, inputs and all four source trees
      shell: bash
      run: |-
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^)" = 8b2c911b32b7cad9442b7ddced987c5a1b0a62e5
        git diff --exit-code HEAD^ HEAD -- .github/workflows/release.yml scripts ':!scripts/darwin-pgo-diesel' release toolchains
        (cd scripts/integrated-dist-qa && shasum -a 256 --check SHA256SUMS)
        (cd scripts/darwin-pgo-diesel && shasum -a 256 --check SHA256SUMS && python3 -IB test_local.py)
        python3 -IB scripts/integrated-dist-qa/sources.py
        python3 -IB scripts/darwin-pgo-diesel/worker.py source
        df -h "$GITHUB_WORKSPACE"
        available=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
        test "$available" -ge 41943040
    - name: Install matching LLVM tools for native PGO
      env:
        MANIFEST_PATH: toolchains/1.99.0/22.json
      run: |
        case "$(jq -er '.release.upstream_rust_version' "$MANIFEST_PATH")" in
          1.97.* | 1.98.*) exit 0 ;;
          1.99.*)
            clang_version=23.1.2
            clang_sha256=d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1
            ;;
          *)
            echo 'Pin matching Clang for this Rust version' >&2
            exit 1
            ;;
        esac

        # Native PGO and ThinLTO require matching LLVM formats.
        clang_root="$(mktemp -d "${RUNNER_TEMP:?}/ohm-clang.XXXXXX")"
        clang_archive="$clang_root/clang.tar.xz"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
          --fail --location --retry 3 --show-error --silent \
          --output "$clang_archive" \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-$clang_version/LLVM-$clang_version-macOS-ARM64.tar.xz"
        printf '%s  %s\n' "$clang_sha256" "$clang_archive" | shasum -a 256 --check
        tar -xf "$clang_archive" -C "$clang_root" --strip-components=1
        rm "$clang_archive"
        "$clang_root/bin/clang" --version
        "$clang_root/bin/clang++" --version
        ln -s clang "$clang_root/bin/cc"
        ln -s llvm-ar "$clang_root/bin/ar"
        ln -s llvm-ranlib "$clang_root/bin/ranlib"
        ln -s llvm-nm "$clang_root/bin/nm"
        printf '%s\n' "$clang_root/bin" >> "$GITHUB_PATH"
        {
          printf 'CC=%s\n' "$clang_root/bin/clang"
          printf 'CXX=%s\n' "$clang_root/bin/clang++"
          printf 'AR=%s\n' "$clang_root/bin/llvm-ar"
          printf 'RANLIB=%s\n' "$clang_root/bin/llvm-ranlib"
          printf 'SDKROOT=%s\n' "$(xcrun --sdk macosx --show-sdk-path)"
        } >> "$GITHUB_ENV"
    - name: Prepare pinned Wild linker
      env:
        MANIFEST_PATH: toolchains/1.99.0/22.json
      run: |
        wild_directory="$(python3 scripts/prepare-wild.py \
          "$MANIFEST_PATH" "$OHM_TARGET" "$RUNNER_TEMP/ohm-wild")"
        printf 'OHM_WILD_LINKER_DIR=%s\n' "$wild_directory" >> "$GITHUB_ENV"
    - name: Run the original optimized release command through all rustc PGO benchmarks
      id: primary
      continue-on-error: true
      run: python3 -IB scripts/darwin-pgo-diesel/supervise.py
    - name: Escrow original collector workspace and graph bytes before any diagnostic compiler
      id: escrow
      if: '!cancelled() && steps.primary.outcome != ''skipped'''
      run: python3 -IB scripts/darwin-pgo-diesel/worker.py first
    - name: Save originals before any replay
      id: originals
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: diesel-pgo-first-original
        path: |-
          source/reports/diesel-pgo/original-opt-dist.log
          source/reports/diesel-pgo/entry.json
          source/reports/diesel-pgo/primary.json
          source/reports/diesel-pgo/unaccepted-checkpoint.txt
          source/reports/diesel-pgo/native-training.json
          source/reports/diesel-pgo/original-graphs
          source/reports/diesel-pgo/original-workspace.tar.gz
          source/reports/diesel-pgo/workspace-custody.json
          source/reports/diesel-pgo/original-workspace.tar.inventory.json
          source/reports/diesel-pgo/before-replay.json
        if-no-files-found: warn
        compression-level: 0
        retention-days: 7
    - name: Decode every distinct original finalized graph after custody
      id: decode
      if: >-
        !cancelled() && steps.escrow.outcome == 'success' && steps.originals.outcome == 'success'
      run: python3 -IB scripts/darwin-pgo-diesel/worker.py decode
    - name: Authenticate and escrow the instrumented native compiler and exact Cargo
      id: runtime
      if: '!cancelled() && steps.escrow.outcome == ''success'' && steps.originals.outcome == ''success'''
      run: python3 -IB scripts/darwin-pgo-diesel/worker.py runtime
    - name: Save native instrumented runtime
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: diesel-pgo-real-stage2
        path: |-
          source/reports/diesel-pgo/instrumented-sdk.tar.gz
          source/reports/diesel-pgo/instrumented-sdk.tar.inventory.json
          source/reports/diesel-pgo/tool-identity.json
          source/reports/diesel-pgo/driver-otool.txt
          source/reports/diesel-pgo/identity-llvm-profdata.txt
          source/reports/diesel-pgo/runtime.json
          source/reports/diesel-pgo/runtime-smoke
          source/reports/diesel-pgo/rustc-perf-identity.json
        if-no-files-found: warn
        compression-level: 0
        retention-days: 7
    - name: Replay authentic saved graphs and two independent empty readers
      id: direct
      if: '!cancelled() && steps.escrow.outcome == ''success'' && steps.originals.outcome == ''success'' && hashFiles(''source/reports/diesel-pgo/tool-identity.json'') != '''''
      run: python3 -IB scripts/darwin-pgo-diesel/worker.py direct
    - name: Run pinned original collector with only the real Diesel Opt benchmark
      id: focused
      if: '!cancelled() && steps.escrow.outcome == ''success'' && steps.originals.outcome == ''success'' && hashFiles(''source/reports/diesel-pgo/tool-identity.json'') != '''''
      run: python3 -IB scripts/darwin-pgo-diesel/worker.py focused
    - name: Save off-primary diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: diesel-pgo-focused-replays
        path: |-
          source/reports/diesel-pgo/direct-*
          source/reports/diesel-pgo/focused-*
          source/reports/diesel-pgo/original-graph-decode.*
        if-no-files-found: warn
        compression-level: 0
        retention-days: 7
    - name: Report original natural training result
      if: always()
      run: |-
        python3 -IB - <<'PY'
        import json
        from pathlib import Path
        r=Path('source/reports/diesel-pgo')
        assert (r/'before-replay.json').is_file(), 'original qualification failed before its raw worktree admission'
        first=json.loads((r/'before-replay.json').read_bytes())
        print(first['outcome'])
        assert (r/'runtime.json').is_file(), 'no independently reopened instrumented SDK'
        assert (r/'focused-collector/result.json').is_file(), 'focused same-binary result missing'
        assert not first['failed_timing_root'], 'the original full PGO training reproduced the release ICE; original and replay receipts retained'
        PY
    name: Original macOS PGO Diesel containment
