name: Physical owner of the historical RUF009 portable-atomic native build
run-name: RUF009 native owner ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  native-owner:
    name: native-owner-0
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruf009-portable-owner-20261103' && github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 60
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PHASE: native-owner
      BLOCK: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-ruf009-derived-enum
            scripts/ruff-module-16149
            scripts/ruff-linter-check-attribution
            scripts/ruff-heldout-mono-fold/residual
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bd7b58765ae44b21a1c9273b3ff0be8e923adc47
          path: donor
          persist-credentials: false
          sparse-checkout: scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 95b405a443e75f1e08daefb0dbd86d29581a5bde
          path: scope-ruf009
          persist-credentials: false
          sparse-checkout: scripts/ruff-matched-stage
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: b00f68a23cedbd3a38fc25bac63638f0f11fc3f0
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the independent process observer
        run: sudo apt-get -qq update && sudo apt-get install -y --no-install-recommends strace zstd
      - name: Verify the historical factory, registry, Cargo client and real Rust targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-ruf009-derived-enum/case.py "$PHASE" "$BLOCK"
      - name: Retain raw compiler metadata and physically observe normal and traced native builds
        run: python3 -IB qa/scripts/ruff-ruf009-derived-enum/native_owner.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ruf009-native-owner-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-ruf009/receipt
          retention-days: 7
