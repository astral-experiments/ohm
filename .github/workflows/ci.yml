name: Compare the CTFE literal change with ordinary cache retention
run-name: Single-session Ruff history ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact registered study commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-rc23-ctfe-default' && inputs.reviewed_head == github.sha
    name: Paired default-cache Ruff history ${{ matrix.cohort }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        cohort: ['01','02','03','04']
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      COHORT: ${{ matrix.cohort }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: current
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/rc23-ctfe-default
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 7b13f01ba1569887a25670820764b24c206da8e5
          path: ruff
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0b50022990577aadd904731e51c4d6c2a0f9b665
          path: historical
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ctfe-crossover-pilot
            scripts/ctfe-cli-semantic
            scripts/gnu-ctfe-literal-identity
            scripts/branch-return-pmu
            scripts/branch-first-session-e-screen
            scripts/branch-storage-e-confirmation
            scripts/ohm-packed-ruff
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5c651f1d38c629da2a75d5cac3588db0be8104d7
          path: prior-pilot
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ctfe-crossover-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 18b0cf251988b5967f8ffb0b11db850966eae9d1
          path: ctfe-source
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/gnu-ctfe-literal-identity
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 762fc25095e317ac5632ec835df3c7f9cfc64a64
          path: source
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-checked-packed-source
            scripts/branch-first-session-e-source
            scripts/branch-return-source
            scripts/ohm-packed-ruff
            scripts/ohm-apple-zmij/source-transport
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the historical source and prepare empty task-owned output roots
        run: |
          set -exuo pipefail
          test "$(git -C historical rev-parse HEAD)" = 0b50022990577aadd904731e51c4d6c2a0f9b665
          test "$(git -C current rev-parse HEAD)" = "$REVIEWED_HEAD"
          (cd current/scripts/rc23-ctfe-default && sha256sum --strict --check SHA256SUMS)
          test "$(git -C prior-pilot rev-parse HEAD)" = 5c651f1d38c629da2a75d5cac3588db0be8104d7
          test "$(git -C historical rev-parse HEAD:scripts/ctfe-crossover-pilot)" = "$(git -C prior-pilot rev-parse HEAD:scripts/ctfe-crossover-pilot)"
          test "$(git -C ctfe-source rev-parse HEAD)" = 18b0cf251988b5967f8ffb0b11db850966eae9d1
          test "$(git -C source rev-parse HEAD)" = 762fc25095e317ac5632ec835df3c7f9cfc64a64
          for component_path in scripts/gnu-ctfe-literal-identity scripts/ruff-repair-tables-pilot/guards.py; do
            source_object=$(git -C ctfe-source rev-parse "HEAD:$component_path")
            pilot_object=$(git -C historical rev-parse "HEAD:$component_path")
            test "$source_object" = "$pilot_object"
          done
          for d in ctfe-source/scripts/gnu-ctfe-literal-identity prior-pilot/scripts/ctfe-crossover-pilot historical/scripts/{ctfe-cli-semantic,branch-return-pmu,branch-first-session-e-screen,branch-storage-e-confirmation,ohm-packed-ruff,ohm-packed-ruff/full-cli}; do
            (cd "$d" && sha256sum --strict --check --status SHA256SUMS)
          done
          python3 -IB historical/scripts/ctfe-crossover-pilot/test_subjects.py
          python3 -IB historical/scripts/ctfe-cli-semantic/test.py
          python3 -IB historical/scripts/ctfe-cli-semantic/read.py --help > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates git libssl-dev strace zstd
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          dpkg-query -W b3sum binutils build-essential git libssl-dev strace zstd > "$base/logs/packages.tsv"
      - name: Reconstruct both 81-file compiler installations using original source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -IB historical/scripts/ctfe-cli-semantic/run.py acquire "$GITHUB_WORKSPACE/source"
      - name: Compare ordinary builds on the same four CPUs and verify each repaired executable against an empty build
        run: python3 -IB current/scripts/rc23-ctfe-default/compare.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc23-ctfe-default-${{ matrix.cohort }}-attempt-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 6
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ctfe-default
            ${{ runner.temp }}/ohm-branch-object-qa/logs/sdk
