name: Inspect a Ruff workspace option edit
run-name: Signed GNU Ruff workspace option edit ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease QA commit
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-workspace-option-edit-20261101' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    name: Signed GNU Ruff workspace option edit
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 90
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-workspace-option-edit
            scripts/ruff-cgu-inputs
            scripts/ruff-default-owner-pmu
            scripts/ohm-packed-ruff
            scripts/branch-return-pmu
            scripts/branch-storage-e-confirmation/review
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: collector
          persist-credentials: false
          sparse-checkout: scripts/gnu-example-ceiling
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 42ab30fd5e6bcdcf908df81de9baac65ca64fbf9
          path: contract
          persist-credentials: false
          sparse-checkout: scripts/notebook-fanout-ceiling
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 088b7b5f77fcb05994fd2a17cbc940cd9edb341a
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify sources, physical capture and counter contract
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          test "$(git -C enrolled rev-parse HEAD)" = "$REVIEWED_HEAD"
          test -z "$(git -C enrolled status --porcelain=v1 --untracked-files=all)"
          python3 -IB enrolled/scripts/ruff-workspace-option-edit/setup.py sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils build-essential git libssl-dev
          python3 -IB enrolled/scripts/ruff-workspace-option-edit/setup.py compile "$base"
          python3 -IB enrolled/scripts/ruff-workspace-option-edit/tests.py "$GITHUB_WORKSPACE/ruff" "$base/workspace-cgu" | tee "$base/logs/controls.txt"
      - name: Enroll the one fresh worker and install the original signed GNU SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB enrolled/scripts/ruff-workspace-option-edit/setup.py acquire
      - name: Verify the root archive and typed client on the installed SDK
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-workspace-option-edit/test_native.py "$GITHUB_WORKSPACE/ruff" "$base/fixture" "$base/home/.rustup" "$base/home/.cargo/bin" "$base/workspace-cgu" > "$base/logs/signed-fixture.stdout"
          cp "$base/fixture/qualified.json" "$base/logs/signed-fixture.json"
      - name: Meter ordinary Cargo first and collect independent physical evidence
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-repair-tables-pilot/guards.py watch "$base/work" "$base/logs" "$base/logs/resource" python3 -IB enrolled/scripts/ruff-workspace-option-edit/worker.py "$GITHUB_WORKSPACE/ruff" "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract"
      - name: Reopen raw clocks, signed executable behavior, fresh bitcode and archive members
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-workspace-option-edit/reopen.py "$base/logs" "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract" "$REVIEWED_HEAD" --execute > "$base/accepted.json"
          mv "$base/accepted.json" "$base/logs/accepted.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-gnu-ruff-workspace-option-edit
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
