name: Measure project check instructions
run-name: ${{ inputs.project }} history ${{ inputs.mode }} (rustc ${{ inputs.prototype || inputs.kits || 'shipped' }}, Cargo ${{ inputs.cargo || 'shipped' }})
on:
  workflow_dispatch:
    inputs:
      project:
        description: Workload
        default: both
        type: choice
        options: [both, ripgrep, serc]
      mode:
        description: Experiment
        required: true
        type: choice
        options: [build-kit, pilot, marginal, confirm, profile, audit, audit-control]
      patch:
        description: Optional gzipped, base64-encoded compiler diff for an ephemeral benchmark
        type: string
        required: false
      kits:
        description: Workflow run with compiler kits, or empty for shipped -3 on both sides
        type: string
      compiler_ref:
        description: Exact public compiler commit to apply before the experimental patch
        required: false
        type: string
      reference_pair:
        description: Optional kit pair with the release and the previous PR stack
        required: false
        type: string
      intermediate:
        description: Optional kit for the first PR of a stack
        required: false
        type: string
      second:
        description: Optional kit for the second PR of a three-patch stack
        required: false
        type: string
      candidate_as_control:
        description: Use the candidate from kits as the control when comparing two candidate builds
        default: false
        type: boolean
        required: false
      cargo:
        description: Workflow run with the patched Cargo to use on the candidate side
        type: string
        required: false
      prototype:
        description: Workflow run with a replacement candidate compiler SDK, requires kits
        type: string
        required: false
      optimized:
        description: Build matched stage-1 kits with thin LTO and one codegen unit
        type: boolean
        default: false
      public_stack:
        description: Use the restacked public compiler source through 138b9b74a947
        type: boolean
        default: false
      parser_ref:
        description: 'Optional exact public #450 commit on top of #448'
        type: string
        required: false
      ctfe:
        description: 'Apply #318 at 2b0876f27b14 to the public stack'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.mode == 'build-kit'
    name: Build matched compiler
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: coordinator
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-experiments/ohm-rust
          ref: af392995e5ca93b70fc487b45dfdf6604dbbbc84
          fetch-depth: 0
          persist-credentials: false
          path: rust
      - name: Build and smoke-test the compiler SDK
        working-directory: rust
        env:
          EXPERIMENT_PATCH: ${{ inputs.patch }}
          OPTIMIZED: 1
          COMPILER_REF: ${{ inputs.compiler_ref }}
        run: bash ../coordinator/scripts/project-check-instructions/build-kit.sh candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-candidate
          path: ${{ runner.temp }}/packages/*.tar.zst
          if-no-files-found: error
          retention-days: 10
          compression-level: 0

  measure:
    if: inputs.mode == 'pilot' || inputs.mode == 'marginal' || inputs.mode == 'confirm' || inputs.mode == 'profile' || inputs.mode == 'audit' || inputs.mode == 'audit-control' || inputs.mode == 'annotate'
    name: Measure ${{ matrix.project }} pair ${{ matrix.pair }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.project == 'both' && '["ripgrep","serc"]' || format('["{0}"]', inputs.project)) }}
        pair: ${{ fromJSON(inputs.mode == 'confirm' && '[1,2,3,4,5,6]' || inputs.mode == 'marginal' && '[1,2]' || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.project == 'ripgrep' && 'BurntSushi/ripgrep' || 'astral-experiments/serc' }}
          ref: ${{ matrix.project == 'ripgrep' && '43fc97d43a4c61d65e7d74d4110c8480fe42ea5b' || '1b15ce1cba1d5a0045ac7303b8797102f807e57c' }}
          fetch-depth: 21
          persist-credentials: false
          path: workload
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.kits != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.kits }}
          pattern: ${{ inputs.candidate_as_control && 'sdk-candidate' || inputs.prototype != '' && 'sdk-control' || 'sdk-*' }}
          merge-multiple: true
          path: ${{ runner.temp }}/kits
      - name: Stage the first candidate kit as the control
        if: inputs.candidate_as_control
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/repack"
          tar -C "$RUNNER_TEMP/repack" --zstd -xf "$RUNNER_TEMP/kits/candidate.tar.zst"
          mv "$RUNNER_TEMP/repack/candidate" "$RUNNER_TEMP/repack/control"
          tar -C "$RUNNER_TEMP/repack" -cf - control | zstd -T4 -1 > "$RUNNER_TEMP/kits/control.tar.zst"
          mv "$RUNNER_TEMP/kits/candidate.tar.zst" "$RUNNER_TEMP/repack/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.prototype != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prototype }}
          name: sdk-candidate
          path: ${{ runner.temp }}/kits
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.cargo != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cargo }}
          name: cargo-kits
          path: ${{ runner.temp }}/kits
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.reference_pair != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reference_pair }}
          pattern: sdk-*
          merge-multiple: true
          path: ${{ runner.temp }}/kits/references
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.intermediate != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.intermediate }}
          name: sdk-candidate
          path: ${{ runner.temp }}/kits/pr
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.second != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.second }}
          name: sdk-candidate
          path: ${{ runner.temp }}/kits/pr2
      - name: Measure the first root check after each of the twenty edits
        env:
          PROJECT: ${{ matrix.project }}
          PROFILE_UV: ${{ (inputs.mode == 'profile' || inputs.mode == 'annotate') && '1' || '' }}
          ANNOTATE_UV: ${{ inputs.mode == 'annotate' && '1' || '' }}
          AUDIT_UV: ${{ inputs.mode == 'audit-control' && 'control' || inputs.mode == 'audit' && '1' || '' }}
          RUSTC_KITS: ${{ inputs.kits }}
          REFERENCE_PAIR: ${{ inputs.reference_pair }}
          INTERMEDIATE_KIT: ${{ inputs.intermediate }}
          SECOND_KIT: ${{ inputs.second }}
          CARGO_KITS: ${{ inputs.cargo }}
        run: bash scripts/project-check-instructions/measure.sh ${{ matrix.pair }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.project }}-pair-${{ matrix.pair }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30
