name: Verify the installed final 1.99.0-23 distributions
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
        description: Exact reviewed nonrelease qualification commit
permissions: {}
concurrency:
  group: rc23-final-installed-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-rc23-formatter-installed-20261101' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    name: Installed regressions (${{ matrix.target }})
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04}
          - {target: aarch64-apple-darwin, runner: macos-15}
    env:
      OHM_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the actual release coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: e408863e7ba61fac3e054a580e149dbf4c89f582
          sparse-checkout: |
            scripts
            toolchains/1.99.0
      - name: Check out the reviewed receiver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: qa-code
          sparse-checkout: |
            scripts/rc23-final-installed
            .github/workflows
      - name: Check out the published native suites
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 4fe6d1c04b8226928fb0c57800a864269d7001e8
          path: qa-suites
          sparse-checkout: |
            scripts/rc23-expanded-inputs
            scripts/rc23-expanded-dist
      - name: Check out the published native fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 46258d8b9b6ae5f7b443fab3115799466a3b5ff4
          path: legacy
          sparse-checkout: |
            scripts/dep-graph-slots
            scripts/integrated-dist-qa
            toolchains/1.99.0
      - name: Select the reviewed Python reader
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate the installed test inputs
        id: prepare
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/rc23-final-reports"
          (cd qa-code && shasum -a 256 -c scripts/rc23-final-installed/SHA256SUMS) > "$RUNNER_TEMP/rc23-final-reports/registered-files.log"
          python3 -IB qa-code/scripts/rc23-final-installed/prepare.py \
            --root "$PWD" --suites "$PWD/qa-suites" --legacy "$PWD/legacy" \
            --out "$RUNNER_TEMP/rc23-native-suite" --receipt "$RUNNER_TEMP/rc23-final-reports/fixture-sources.json"
      - name: Receive the successful original native and assembly media
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -IB qa-code/scripts/rc23-final-installed/receive.py stage --gh gh \
            --root "$GITHUB_WORKSPACE" --target "$OHM_TARGET" --work "$RUNNER_TEMP/rc23-original" --reports "$RUNNER_TEMP/rc23-final-reports"
      - name: Fresh-install the unchanged assembled candidate
        id: candidate
        run: |
          umask 077
          release="$RUNNER_TEMP/rc23-original/release"
          mkdir -p "$RUNNER_TEMP/rc23-candidate/rustup" "$RUNNER_TEMP/rc23-candidate/cargo"
          RUSTUP_HOME="$RUNNER_TEMP/rc23-candidate/rustup" CARGO_HOME="$RUNNER_TEMP/rc23-candidate/cargo" \
            OHM_DOWNLOAD_URL="file://$release" OHM_INSTALL_DIR="$RUNNER_TEMP/rc23-candidate/sdk" \
            sh "$release/ohm-installer.sh" 2>&1 | tee "$RUNNER_TEMP/rc23-final-reports/candidate-install.log"
      - name: Exercise the changed GNU AArch64 and musl assembly classification on the installed x86 compiler
        if: "!cancelled() && runner.os == 'Linux' && steps.candidate.outcome == 'success'"
        run: bash qa-code/scripts/rc23-final-installed/cross.sh
      - name: Exercise native installer path resolution and concurrent registrations
        if: '!cancelled() && steps.candidate.outcome == ''success'''
        run: |
          python3 -IB qa-code/scripts/rc23-final-installed/native_installer_paths.py \
            --installed "$RUNNER_TEMP/rc23-candidate/sdk" --release "$RUNNER_TEMP/rc23-original/release" \
            --target "$OHM_TARGET" --work-parent "$RUNNER_TEMP" --reports "$RUNNER_TEMP/rc23-final-reports/installer-paths"
      - name: Install the independently released predecessor
        id: previous
        if: '!cancelled() && steps.candidate.outcome == ''success'''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -IB "$RUNNER_TEMP/rc23-native-suite/native.py" --install-published --host "$OHM_TARGET" \
            --work "$RUNNER_TEMP/rc23-previous" --out "$RUNNER_TEMP/rc23-final-reports/previous"
      - name: Check Cargo install feature, collision, reinstall and removal behavior
        if: '!cancelled() && steps.candidate.outcome == ''success'' && steps.previous.outcome == ''success'''
        run: |
          python3 -IB "$RUNNER_TEMP/rc23-native-suite/install_checks.py" \
            --candidate "$RUNNER_TEMP/rc23-candidate/sdk" --published "$RUNNER_TEMP/rc23-previous/sdk" \
            --work "$RUNNER_TEMP/rc23-install-checks" --out "$RUNNER_TEMP/rc23-final-reports/install-checks"
      - name: Exercise both actual compilers, Cargo worktrees, native inputs, trait and epoch recovery
        if: '!cancelled() && steps.candidate.outcome == ''success'' && steps.previous.outcome == ''success'''
        run: |
          python3 -IB "$RUNNER_TEMP/rc23-native-suite/native.py" \
            --installed "$RUNNER_TEMP/rc23-candidate/sdk" --published "$RUNNER_TEMP/rc23-previous/sdk" --host "$OHM_TARGET" \
            --work "$RUNNER_TEMP/rc23-native" --out "$RUNNER_TEMP/rc23-final-reports/native" \
            --archive "$RUNNER_TEMP/rc23-original/release/ohm-1.99.0-23-$OHM_TARGET.tar.gz"
      - name: Retain complete and partial installed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qa-rc23-final-installed-${{ matrix.target }}
          path: ${{ runner.temp }}/rc23-final-reports
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
