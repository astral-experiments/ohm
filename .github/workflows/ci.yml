name: Native Apple higher-priority provider and poisoned-target upgrade
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [providers]
        required: true
permissions:
  contents: read
  actions: read
jobs:
  providers:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-apple-strict-761-provider-20261031' && inputs.stage == 'providers'
    timeout-minutes: 50
    runs-on: namespace-profile-macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: scripts/apple-strict-761
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 14c9d13d68f3dd21c53f1ef6c3721de8363c0123
          path: historical
          persist-credentials: false
          sparse-checkout: scripts/ohm-apple-zmij
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          path: signed-reader
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate the actual signed Apple SDK and exact compiled candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
          mkdir -m 700 "$RUNNER_TEMP/apple-provider-761"
          python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/apple-provider-761"
          python3 -IB protocol/scripts/apple-strict-761/supply.py "$RUNNER_TEMP/apple-provider-761"
      - name: Reopen the prior fixture, build real Apple providers and change only Cargo on a poisoned target
        run: |
          set -eu
          test "$(git -C historical rev-parse HEAD)" = 14c9d13d68f3dd21c53f1ef6c3721de8363c0123
          python3 -IB protocol/scripts/apple-strict-761/visits.py "$RUNNER_TEMP/apple-provider-761" "$GITHUB_WORKSPACE/historical"
      - name: Independently reopen native process, executable and migration evidence
        run: |
          set -eu
          python3 -IB protocol/scripts/apple-strict-761/verify.py "$RUNNER_TEMP/apple-provider-761/receipts" > "$RUNNER_TEMP/apple-provider-761/receipts/verified.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: first-apple-761-native-provider-receipts
          path: ${{ runner.temp }}/apple-provider-761/receipts
          retention-days: 7
          if-no-files-found: warn
