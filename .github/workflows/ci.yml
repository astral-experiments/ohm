name: Sample two expensive rustcs on Ruff's notebook edit
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact independently reviewed 40-character packaging commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: signed21-notebook-heavy-compiler-samples
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-signed21-notebook-heavy-compiler-samples-v3-20261031'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 130
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - name: Require the reviewed commit before any checkout or acquisition
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_HEAD" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: registered
          persist-credentials: false
          sparse-checkout: scripts/notebook-fanout-ceiling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: feature
          ref: 69c21b3ecf8510871c346f751c60866e302708d5
          persist-credentials: false
          sparse-checkout: |
            scripts/mixed-generics-ruff
            scripts/featureless-e2e
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collector
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          persist-credentials: false
          sparse-checkout: scripts/gnu-example-ceiling
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: signed
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: physical
          ref: 9d1dd09be4d2346142957cc298093d8a75c755c3
          persist-credentials: false
          sparse-checkout: scripts/ron-check-share
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tree
          ref: 77e33ee7781b8d823dc7f046d3bd9bea43818bc8
          persist-credentials: false
          sparse-checkout: scripts/strict-unicode-cost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: classic
          ref: b3a1bbd38e07293168f06cb21648821b8cacd206
          persist-credentials: false
          sparse-checkout: scripts/ohm-aarch64-fallback
      - name: Authenticate an exact complete signed SDK and its strict Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C registered rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config perl libssl-dev zstd binutils git
          if sudo apt-get install -y --no-install-recommends linux-tools-generic; then
            mapfile -t perf_bins < <(find -L /usr/lib/linux-tools -mindepth 2 -maxdepth 2 -type f -name perf | sort -V)
            if (("${#perf_bins[@]}" > 0)); then
              perf_bin="$(realpath "${perf_bins[-1]}")"
              dpkg-query -S "$perf_bin"
              "$perf_bin" version --build-options
              printf 'OHM_DIAGNOSTIC_PERF=%s\n' "$perf_bin" >> "$GITHUB_ENV"
            fi
          fi
          for t in git rustup rustc cargo cc zstd du cp; do command -v "$t"; done
          (cd registered/scripts/notebook-fanout-ceiling && sha256sum --strict --check SHA256SUMS)
          python3 -IB feature/scripts/featureless-e2e/acquire.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/selected-e2e-cargo" strict
      - name: Sample the actual compiler processes and preserve five native objects
        run: |
          set -euo pipefail
          python3 -IB registered/scripts/notebook-fanout-ceiling/worker.py \
            --workspace "$GITHUB_WORKSPACE" --incoming "$RUNNER_TEMP/selected-e2e-cargo" --root "$RUNNER_TEMP/ohm-featureless-e2e"
      - name: Reopen native receipts independently from disk
        run: |
          set -euo pipefail
          python3 -IB registered/scripts/notebook-fanout-ceiling/reopen.py \
            "$RUNNER_TEMP/ohm-featureless-e2e/receipts" --feature "$GITHUB_WORKSPACE/feature" --collector "$GITHUB_WORKSPACE/collector"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed21-notebook-heavy-compiler-profile
          path: ${{ runner.temp }}/ohm-featureless-e2e/receipts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
