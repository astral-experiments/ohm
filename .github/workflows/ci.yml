name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gnu-aarch64-nine-inodes-prerequisite-20261030
  cancel-in-progress: false
jobs:
  block:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-register-comments-20261030'
    name: Qualify all six inter-compiler and three same-compiler native selections
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the prospective registration and the exact physical tools
        run: |
          set -euo pipefail
          export QA_ROOT="$RUNNER_TEMP/gnu-aarch64-ruff-screen"
          mkdir -p "$QA_ROOT/inputs" "$QA_ROOT/receipts"
          printf 'QA_ROOT=%s\n' "$QA_ROOT" >> "$GITHUB_ENV"
          for family in ohm-aarch64-registers ohm-aarch64-compact ohm-aarch64-confirm; do
            (cd "scripts/$family" && sha256sum -c SHA256SUMS)
          done
          cp scripts/ohm-aarch64-confirm/{PARKED.md,PLAN.md,schedule.json,SHA256SUMS} "$QA_ROOT/receipts/"
          python3 -IB scripts/ohm-aarch64-confirm/study.py schedule | cmp - "$QA_ROOT/receipts/schedule.json"
          python3 -IB scripts/ohm-aarch64-confirm/local_selector_test.py
          git rev-parse HEAD > "$QA_ROOT/receipts/qa-head"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user strace valgrind zstd
          dpkg-query -W gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user strace valgrind > "$QA_ROOT/receipts/packages"
          echo 'def5fdcf6ae64a4d3e6af3786b622978d8313e0734ecf3f6cbe71d8be9e274c8  /usr/bin/valgrind.bin' | sha256sum -c -
          python3 -IB scripts/ohm-aarch64-linux/qualify.py selftest
      - name: Reopen the independent native gates and all three signed and source-built compiler roles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -IB scripts/ohm-aarch64-confirm/gates.py
          python3 -IB scripts/ohm-aarch64-compact/acquire.py
          bash scripts/ohm-aarch64-confirm/ancestor.sh "$RUNNER_TEMP/gnu-compact-public-ancestor"
      - name: Reopen every native transition on the signed Cargo without measuring performance
        run: |
          set -euo pipefail
          python3 -IB scripts/ohm-aarch64-confirm/study.py qualify "$RUNNER_TEMP/gnu-compact-public-ancestor" "$QA_ROOT/inputs"
          python3 -IB scripts/ohm-aarch64-confirm/verify_transitions.py "$QA_ROOT/receipts" "$QA_ROOT/receipts/independent-nine.json"
      - name: Retain every native visit including a rejected physical identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-three-compiler-nine-transitions
          path: ${{ runner.temp }}/gnu-aarch64-ruff-screen/receipts
          retention-days: 7
          if-no-files-found: error
