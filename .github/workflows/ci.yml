name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qa-compact-input-lowering-only-20261030
  cancel-in-progress: false
jobs:
  ruff:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-register-comments-20261030'
    name: Inspect the already-failed source-built classifier without any Ruff measurements
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Open only the rejected native pair for a bounded lowering inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export QA_ROOT="$RUNNER_TEMP/compact-input-diagnostic"
          mkdir -p "$QA_ROOT/inputs" "$QA_ROOT/receipts"
          echo "QA_ROOT=$QA_ROOT" >> "$GITHUB_ENV"
          (cd scripts/ohm-aarch64-compact && sha256sum -c SHA256SUMS)
          python3 -IB scripts/ohm-aarch64-compact/acquire_failed.py
      - name: Capture ordinary dep-info, MIR, LLVM, HIR and THIR
        run: python3 -IB scripts/ohm-aarch64-compact/diagnose.py
      - name: Keep the complete unscored observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compact-input-precise-lowering
          path: ${{ runner.temp }}/compact-input-diagnostic/receipts
          retention-days: 7
          if-no-files-found: error
