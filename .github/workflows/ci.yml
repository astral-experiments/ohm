name: Qualify Cargo and rustc checksum fixes together on macOS
run-name: Combined nonpublishing checksum QA ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
        description: Exact QA source commit
permissions:
  contents: read
jobs:
  apple:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-combined-input-checksums-darwin-20261103'
    runs-on: namespace-profile-macos-15
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.reviewed_head }}
          path: qa
          persist-credentials: false
          sparse-checkout: scripts/ruff-combined-apple
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-experiments/ohm-rust
          ref: d46c44b58d91b9d7b4b0d2fc4850c31ad5cbc8f2
          fetch-depth: 0
          path: rust
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-experiments/ohm-cargo
          ref: 4a6de7858c60e579fc30e01f5b60ddcaa84c2e30
          path: cargo-src
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5b47d5755bd515e61a98b9f85eca3af0aaf7c137
          path: fixtures
          persist-credentials: false
          sparse-checkout: scripts/ruff-matched-stage
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the signed parent distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/combined"
          gh release download ohm-1.99.0-23 -R astral-experiments/ohm -p ohm-1.99.0-23-aarch64-apple-darwin.tar.gz --dir "$RUNNER_TEMP/combined"
          python3 -IB qa/scripts/ruff-combined-apple/qualify.py install
      - name: Build the two precise product heads
        run: |
          git -C rust submodule update --init library/backtrace
          command -v ninja || brew install ninja
          python3 -IB qa/scripts/ruff-combined-apple/qualify.py build
      - name: Exercise signed, upgraded and clean Cargo verdicts
        run: python3 -IB qa/scripts/ruff-combined-apple/qualify.py exercise
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: combined-checksums-apple-${{ github.run_id }}
          path: ${{ runner.temp }}/combined/logs/
          if-no-files-found: warn
          retention-days: 15
