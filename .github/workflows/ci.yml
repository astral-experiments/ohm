name: Qualify strict native-link Cargo with Ruff recovery and both collectors
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  builder:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-strict-links-and-three-cargo-fixes-20261031'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: protocol
        persist-credentials: false
        sparse-checkout: |
          scripts/gc-mount-evidence
          scripts/cargo-diagnostic-fix
          scripts/ohm-apple-zmij/cargo293
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: signed-reader
        ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
        persist-credentials: false
        sparse-checkout: scripts/packaged-release-workspace
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Install the enrolled release SDK for the source build
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
        mkdir -m700 "$RUNNER_TEMP/gc-compiler-build"
        python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/gc-compiler-build"
    - name: Build native Cargo from the locally sealed complete source
      run: |
        set -eu
        sudo apt-get -qq update
        sudo apt-get install -y --no-install-recommends ninja-build build-essential cmake pkg-config perl libssl-dev
        python3 -IB protocol/scripts/gc-mount-evidence/build_candidate.py "$RUNNER_TEMP/gc-compiler-build" "$GITHUB_WORKSPACE/protocol/scripts/ohm-apple-zmij/cargo293/source.pack"
    - name: Record the executable and build receipt for the independent private collector job
      id: seal
      shell: bash
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP/gc-compiler-build/deliver\"\nprintf 'cargo=%s\\n' \"$(sha256sum cargo | cut -d ' ' -f1)\" >> \"$GITHUB_OUTPUT\"\
        \nprintf 'build=%s\\n' \"$(sha256sum build.json | cut -d ' ' -f1)\" >> \"$GITHUB_OUTPUT\"\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: disposable-gc-qualified-cargo
        path: ${{ runner.temp }}/gc-compiler-build/deliver
        if-no-files-found: error
        retention-days: 1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: gc-qualified-cargo-build-record
        path: ${{ runner.temp }}/gc-compiler-build/build-cert
        if-no-files-found: warn
        retention-days: 7
    outputs:
      cargo: ${{ steps.seal.outputs.cargo }}
      build: ${{ steps.seal.outputs.build }}
  gc:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-strict-links-and-three-cargo-fixes-20261031'
    needs: builder
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: protocol
        persist-credentials: false
        sparse-checkout: |
          scripts/gc-mount-evidence
          scripts/cargo-diagnostic-fix
          scripts/ohm-apple-zmij/cargo293
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: signed-reader
        ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
        persist-credentials: false
        sparse-checkout: scripts/packaged-release-workspace
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Install the original signed distribution and verify provenance
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
        mkdir -m700 "$RUNNER_TEMP/gc-mount-qualification"
        python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/gc-mount-qualification"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: disposable-gc-qualified-cargo
        path: ${{ runner.temp }}/candidate-download
    - name: Exercise unprivileged public GC on signed and source-fixed Cargo
      run: |
        set -eu
        if ! command -v strace; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends strace; fi
        python3 -IB protocol/scripts/gc-mount-evidence/compare.py "$RUNNER_TEMP/gc-mount-qualification" "$RUNNER_TEMP/candidate-download"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: gc-signed-vs-fixed-native-mounts
        path: |
          ${{ runner.temp }}/gc-mount-qualification/packet
          ${{ runner.temp }}/gc-mount-qualification/receipts/21
        retention-days: 7
        if-no-files-found: error
  ruff:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-strict-links-and-three-cargo-fixes-20261031'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 110
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: protocol
        persist-credentials: false
        sparse-checkout: |-
          scripts/cargo-diagnostic-fix
          scripts/cargo-recovery-upgrade
          scripts/ron-check-share
          scripts/ohm-apple-zmij/cargo293

          scripts/gc-mount-evidence
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
        path: original-qa
        persist-credentials: false
        sparse-checkout: scripts/packaged-release-workspace
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 927e20bcad028e5ed4290a58bd330a258ee5da41
        path: existing-counter
        persist-credentials: false
        sparse-checkout: scripts/ohm-gnu-syscall
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: disposable-gc-qualified-cargo
        path: ${{ runner.temp }}/candidate-download
    - name: Run matched dev-channel Cargo migrations and physical output controls
      env:
        QUALIFICATION_TOKEN: ${{ github.token }}
      run: |
        set -eu
        test "$(git -C original-qa rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
        test "$(git -C existing-counter rev-parse HEAD)" = 927e20bcad028e5ed4290a58bd330a258ee5da41
        sudo apt-get -qq update
        sudo apt-get install -y --no-install-recommends ninja-build strace build-essential cmake pkg-config libssl-dev perl
        python3 -IB protocol/scripts/cargo-recovery-upgrade/layout_controls.py "$GITHUB_WORKSPACE/original-qa" "$GITHUB_WORKSPACE/existing-counter/scripts/ohm-gnu-syscall/calibrate.c" "$GITHUB_WORKSPACE/protocol/scripts/ohm-apple-zmij/cargo293/source.pack" "$RUNNER_TEMP/candidate-download"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: combined-Cargo-real-Ruff-upgrade
        path: ${{ runner.temp }}/ordinary-ron-check/packet
        retention-days: 7
        if-no-files-found: error
    needs: builder
  shared-late:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-strict-links-and-three-cargo-fixes-20261031'
    needs: builder
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: protocol
        persist-credentials: false
        sparse-checkout: |
          scripts/gc-mount-evidence
          scripts/cargo-diagnostic-fix
          scripts/ohm-apple-zmij/cargo293
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: signed-reader
        ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
        persist-credentials: false
        sparse-checkout: scripts/packaged-release-workspace
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Install the original signed distribution and verify provenance
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
        mkdir -m700 "$RUNNER_TEMP/gc-mount-qualification"
        python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/gc-mount-qualification"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: disposable-gc-qualified-cargo
        path: ${{ runner.temp }}/candidate-download
    - name: Exercise unprivileged public GC on signed and source-fixed Cargo
      run: |
        set -eu
        if ! command -v strace; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends strace; fi
        python3 -IB protocol/scripts/gc-mount-evidence/compare.py late "$RUNNER_TEMP/gc-mount-qualification" "$RUNNER_TEMP/candidate-download"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: combined-late-shared-mount
        path: |
          ${{ runner.temp }}/gc-mount-qualification/packet
          ${{ runner.temp }}/gc-mount-qualification/receipts/21
        retention-days: 7
        if-no-files-found: error
    name: Attach a new mount during shared GC
  private:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-strict-links-and-three-cargo-fixes-20261031'
    needs: builder
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: protocol
        persist-credentials: false
        sparse-checkout: |
          scripts/gc-mount-evidence
          scripts/cargo-diagnostic-fix
          scripts/ohm-apple-zmij/cargo293
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 786e5235c3faf04fcfde6beef6c2b91537d37696
        path: private-protocol
        persist-credentials: false
        sparse-checkout: "scripts/private-gc-overlay\nscripts/gc-mount-evidence"
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: signed-reader
        ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
        persist-credentials: false
        sparse-checkout: scripts/packaged-release-workspace
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Install the original signed distribution and verify provenance
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
        mkdir -m700 "$RUNNER_TEMP/gc-mount-qualification"
        python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/gc-mount-qualification"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: disposable-gc-qualified-cargo
        path: ${{ runner.temp }}/candidate-download
    - name: Reopen private targets under the real and fallback mount resolvers
      run: |
        set -eu
        if ! command -v strace; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends strace; fi
        python3 -IB protocol/scripts/gc-mount-evidence/combined_private.py "$RUNNER_TEMP/candidate-download" "$RUNNER_TEMP/gc-mount-qualification/sdk-21" "$GITHUB_WORKSPACE/private-protocol" "$RUNNER_TEMP/private-stack"
      env:
        BUILT_CARGO_SHA256: ${{ needs.builder.outputs.cargo }}
        ORIGINAL_BUILD_SHA256: ${{ needs.builder.outputs.build }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: combined-private-reattachment
        path: |-
          ${{ runner.temp }}/private-stack/evidence
        retention-days: 7
        if-no-files-found: error
    name: Reattach the same private target inode after discovery
