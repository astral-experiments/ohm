name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qa-gnu-compact-input-20261030
  cancel-in-progress: false

jobs:
  linux-cross:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-register-comments-20261030'
    name: Build the single GNU input-comment child, reopen its actual parent and validate native input tracking
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the plan and acquire the Ubuntu cross toolchain
        run: |
          set -euo pipefail
          export QA_ROOT="$RUNNER_TEMP/ohm-aarch64-linux-zmij"
          printf 'QA_ROOT=%s\n' "$QA_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$QA_ROOT/receipts" "$QA_ROOT/inbox"
          (cd scripts/ohm-aarch64-registers && sha256sum -c SHA256SUMS)
          (cd scripts/ohm-aarch64-compact && sha256sum -c SHA256SUMS)
          cp scripts/ohm-aarch64-compact/{PLAN.md,SHA256SUMS} "$QA_ROOT/receipts"
          git rev-parse HEAD > "$QA_ROOT/receipts/qa-head"
          python3 -IB scripts/ohm-aarch64-linux/qualify.py selftest
          python3 -IB scripts/ohm-aarch64-linux/capsule.py --help
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user strace valgrind ninja-build
          dpkg-query -W 'gcc*aarch64-linux-gnu' 'libc6*-arm64-cross' binutils-aarch64-linux-gnu qemu-user valgrind strace > "$QA_ROOT/receipts/packages"
          cc -O2 -Wall -Wextra -o "$QA_ROOT/trace" scripts/ohm-aarch64-linux/trace-compilers.c
          test -x /usr/bin/valgrind.bin
          test -e /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1
          strace -ff -qq -s 65535 -e trace=execve -o "$QA_ROOT/receipts/tracer-check" /bin/true
      - name: Reopen and bind the earlier full parent without rebuilding it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$QA_ROOT/old"
          cd "$QA_ROOT/old"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41057968152" --jq '[.head_sha,.status,.conclusion]|@tsv' > workflow
          test "$(cat workflow)" = "$(printf 'c54c565ebbf3116322c61689ba6d793c5f637de0\tcompleted\tsuccess')"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12977632631/zip" > sdk.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12977184593/zip" > native.zip
          echo 'da327a22d280aca99b74b60b07cb962fe88cacdba2a197960254d1a5c1cd2338  sdk.zip' | sha256sum -c -
          echo '44cb09e19e4297460c62fab748a7ba8c49d47bbeadf80d23a83d5134a1c917ee  native.zip' | sha256sum -c -
          unzip -qp sdk.zip linux-aarch64-sdk-pair.tar.zst > sdk.tar.zst
          unzip -q native.zip -d native
          python3 -IB "$GITHUB_WORKSPACE/scripts/ohm-aarch64-compact/kit.py" import "$PWD/sdk.tar.zst" "$PWD/native"
      - name: Download the original signed Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=ohm-1.99.0-20
          archive="$release-x86_64-unknown-linux-gnu"
          gh release download "$release" --repo "$GITHUB_REPOSITORY" --dir "$QA_ROOT/inbox" \
            --pattern "$archive.tar.gz" --pattern "$archive.tar.gz.sha256" --pattern "$archive-provenance.json"
      - name: Build the new Linux host compiler and authentic host and AArch64 standard libraries
        id: bootstrap
        run: bash scripts/ohm-aarch64-compact/prepare.sh
      - name: Build and independently reopen the allowlisted private SDK archive
        id: custody
        run: python3 -IB scripts/ohm-aarch64-compact/kit.py capsule
        continue-on-error: true
      - name: Exercise both live compilers on each true and conservative assembler and provider case
        run: |
          set -euo pipefail
          for role in P C; do
            python3 -IB scripts/ohm-aarch64-compact/kit.py select "$role"
            setting=base
            if [[ "$role" = C ]]; then setting=extended; fi
            python3 -IB scripts/ohm-aarch64-compact/classifier.py "$setting"
            python3 -IB scripts/ohm-aarch64-compact/providers.py
            mkdir "$QA_ROOT/parked-native-$role" "$QA_ROOT/receipts/native-$role"
            mv "$QA_ROOT/gnu-as" "$QA_ROOT/native-search-fixture" "$QA_ROOT/provider-work" "$QA_ROOT/parked-native-$role/"
            mv "$QA_ROOT/receipts/gnu-as" "$QA_ROOT/receipts/spaced-gnu-as" "$QA_ROOT/receipts/native-provider" "$QA_ROOT/receipts/native-$role/"
          done
      - name: Run both checked-in Linux host assembler controls on the real child
        if: always() && steps.bootstrap.outcome == 'success'
        run: bash scripts/ohm-aarch64-compact/prepare.sh test-host
      - name: Keep the binary-only SDK for three days
        if: always() && steps.custody.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-compact-input-compiler-pair
          path: ${{ runner.temp }}/ohm-aarch64-linux-zmij/private-return/linux-aarch64-sdk-pair.tar.zst
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
      - name: Retain every completed command and the earliest failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-compact-input-native
          path: ${{ runner.temp }}/ohm-aarch64-linux-zmij/receipts
          retention-days: 7
          if-no-files-found: error
      - name: Require the private SDK export
        if: always() && steps.bootstrap.outcome == 'success'
        run: test "${{ steps.custody.outcome }}" = success
