name: Darwin ordinary Cargo native export qualification
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed packaging QA commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: darwin-private-export-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: Apple ARM64 ordinary build and test after an export rename
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-darwin-private-native-export-20261031' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: namespace-profile-macos-15
    timeout-minutes: 240
    env:
      OHM_QA_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: '${{ github.sha }}', path: protocol, persist-credentials: false, sparse-checkout: scripts/darwin-native-export}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b, path: source-carrier, persist-credentials: false, sparse-checkout: scripts/rc22-private-export-ice}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27, path: transport, persist-credentials: false, sparse-checkout: scripts/rc22-native}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a, path: public-seed, persist-credentials: false, sparse-checkout: scripts/ohm-apple-zmij/source-transport}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1, path: signed-rust, persist-credentials: false, sparse-checkout: scripts/strict-mixed-generics}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
          path: cargo-seed
          persist-credentials: false
          sparse-checkout: |
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 69af8fd3bf8ef6ddb49aa801f25016c6af5171a9
          path: native-reader
          persist-credentials: false
          sparse-checkout: |
            scripts/rc22-complete-smoke
            release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - name: Admit pinned media reader, GNU source carrier and native host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C protocol rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C native-reader rev-parse HEAD)" = 69af8fd3bf8ef6ddb49aa801f25016c6af5171a9
          test "$(git -C source-carrier rev-parse HEAD)" = 0c9c558ce24212e5da6fb66150790b0af3cee90b
          command -v zstd
          xcrun -f ld
          test "$(uname -m)" = arm64
          echo "WORK=$RUNNER_TEMP/private-export-darwin" >> "$GITHUB_ENV"
          echo "QA=$GITHUB_WORKSPACE/protocol/scripts/darwin-native-export" >> "$GITHUB_ENV"
      - name: Authenticate and install the original release and common Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB "$QA/drive.py" original "$WORK"
      - name: Record the original ordinary Cargo and Mach-O behavior
        run: python3 -IB "$QA/drive.py" probe-parent "$WORK"
      - name: Reconstruct the exact accepted compiler source
        run: python3 -IB "$GITHUB_WORKSPACE/source-carrier/scripts/rc22-private-export-ice/subject.py" prepare "$WORK"
      - name: Build the revised Apple compiler, rustdoc and standard library
        run: python3 -IB "$QA/drive.py" candidate "$WORK"
      - name: Verify ordinary native builds, edits, retries, diagnostics and repair
        run: python3 -IB "$QA/drive.py" probe-candidate "$WORK"
      - name: Preserve native executables and Cargo streams even on a failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darwin-private-export-cargo-qualification
          path: |
            ${{ runner.temp }}/private-export-darwin/receipts/
            ${{ runner.temp }}/private-export-darwin/reports/
          if-no-files-found: error
          retention-days: 21
