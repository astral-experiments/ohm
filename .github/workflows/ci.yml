name: Qualify immutable rustc literal bytes on a real Ruff typeshed edit
run-name: Ruff literal confirmation ${{ inputs.rank }} ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      rank:
        description: Frozen independent pair
        required: true
        type: choice
        options: ['0', '1', '2', '3', '4', '5']
      reviewed_head:
        description: Full frozen nonrelease QA commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    name: Ruff literal edit and parser control
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-frozen-literal-ruff-29042-20261103' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 180
    env:
      CONFIRMATION_RANK: ${{ inputs.rank }}
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-frozen-literal
            scripts/ruff-ruf009-derived-enum
            scripts/ruff-module-16149
            scripts/ruff-linter-check-attribution
            scripts/ruff-heldout-mono-fold/residual
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bd7b58765ae44b21a1c9273b3ff0be8e923adc47
          path: donor
          persist-credentials: false
          sparse-checkout: scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f1af047a36a1a7ea0fce11ddae61a4028d5e7582
          path: scope-frozen
          persist-credentials: false
          sparse-checkout: scripts/ruff-matched-stage
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: d8dac4cb576bd091a8b6cdc60a65c770ea75a96e
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check the original tool prerequisites
        run: command -v zstd || (sudo apt-get -qq update && sudo apt-get install -y --no-install-recommends zstd)
      - name: Reopen the pinned compiler and price complete ordinary Ruff commands
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-frozen-literal/enrolled.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ruff-frozen-literal-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-frozen-29042/receipt
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
