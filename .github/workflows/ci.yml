name: Price deferred Cargo registry checks (pilot)
run-name: Ruff unchanged Cargo pilot ${{ inputs.reviewed_head }}
permissions:
  contents: read
  actions: read
jobs:
  price:
    name: 'Ruff #29604 ${{ matrix.block }}'
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.sha == inputs.reviewed_head && github.ref_name ==
      'charlie/qa-rc24-insta-input-proof-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        block:
        - CP
        - PC
      max-parallel: 2
    steps:
    - name: Read this immutable measurement
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: qa
        sparse-checkout: scripts/rc24-insta-input-proof
        persist-credentials: false
    - name: Read the genuine Ruff edit and its parent
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: astral-sh/ruff
        ref: dfe14506d23010aa5dbc4ff6fea702a22ba312bd
        fetch-depth: 2
        path: ruff
        persist-credentials: false
    - name: Measure both source-built Cargo programs
      env:
        PRICE_BLOCK: ${{ matrix.block }}
        OHM_READ_TOKEN: ${{ github.token }}
      run: python3 -IB qa/scripts/rc24-insta-input-proof/price.py
    - name: Preserve the original counters, inventories and refusals
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: insta-price-${{ matrix.block }}-${{ github.run_id }}
        path: ${{ runner.temp }}/insta-price/proof
        retention-days: 7
        compression-level: 6
        if-no-files-found: error
    - name: Verify both Cargo migrations on one physical target after pricing
      if: success() && matrix.block == 'PC'
      run: "set -eu\nr=\"$RUNNER_TEMP/insta-price\"\npython3 -IB qa/scripts/rc24-insta-input-proof/migration/run.py \\\n  --work \"$RUNNER_TEMP/insta-migration\"\
        \ --sdk \"$r/sdk\" \\\n  --parent \"$GITHUB_WORKSPACE/pair/parent/cargo\" --candidate \"$GITHUB_WORKSPACE/pair/candidate/cargo\" \\\n\
        \  --registry \"$r/enrolled-cargo-home/registry\" --fixture \"$GITHUB_WORKSPACE/qa/scripts/rc24-insta-input-proof/migration/fixture\"\
        \ \\\n  --exec-counter \"$r/exec_count\""
    - name: Preserve separate native migration and kernel originals
      if: always() && matrix.block == 'PC'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: insta-migration-PC-${{ github.run_id }}
        path: ${{ runner.temp }}/insta-migration/proof
        retention-days: 7
        compression-level: 6
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
        description: Exact QA source commit
