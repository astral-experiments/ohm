name: Replay Ohm edits
run-name: Count full-session instructions on −7 against −6 (${{ inputs.label }})
on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        required: true
      cases:
        type: string
        required: true
      pairs:
        type: string
        default: '[1,2]'
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: inputs.label != 'loader' && inputs.label != 'build-actual'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.cases) }}
        pair: ${{ fromJSON(inputs.pairs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch both published SDKs
        run: |
          for n in 6 7; do
            mkdir -p "kits/$n"
            name="ohm-1.100.0-$n"
            curl -fsSL --retry 5 "https://github.com/astral-experiments/ohm/releases/download/$name/$name-x86_64-unknown-linux-gnu.tar.gz" -o "kits/$n/kit.tar.gz"
          done
      - name: Set up the Codex dependencies
        if: contains(matrix.scenario, 'codex-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libcap-dev protobuf-compiler
          curl -fsSL --retry 4 https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz -o just.tar.gz
          echo '4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  just.tar.gz' | sha256sum -c
          tar xzf just.tar.gz just
      - name: Install the automatic fix tool
        if: matrix.scenario == 'regression'
        run: rustup toolchain install 1.100.0 --profile minimal && cargo +1.100.0 install --locked cargo-fixit --version 0.1.12
      - name: Install nextest
        if: contains(matrix.scenario, 'codex-') || startsWith(matrix.scenario, 'session-')
        run: |
          curl -fsSL --retry 4 https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.140/cargo-nextest-0.9.140-x86_64-unknown-linux-musl.tar.gz -o next.tar.gz
          echo 'bc2a998567816eef7b087b920036f49fb89aa2a8a603f6a3d84098be160b62c5  next.tar.gz' | sha256sum -c
          tar xzf next.tar.gz
      - name: Replay both SDKs
        env:
          REPLAY_MODE: ${{ inputs.label }}
          PAIR: ${{ matrix.pair }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if [[ $(cat /proc/sys/kernel/perf_event_paranoid) -gt 2 ]]; then sudo sysctl kernel.perf_event_paranoid=2; fi
          args="$SCENARIO/$PAIR"
          main=replay/replay.py
          sudo unshare --mount --propagation private bash replay/session.sh "$USER" "$args" "$PWD:$PATH" "$GITHUB_STEP_SUMMARY" "$main" "$REPLAY_MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.scenario }}-${{ matrix.pair }}
          path: counts/
          if-no-files-found: error
          retention-days: 30
