          if [[ -z "$testsuite" ]]; then
            echo 'compiled Cargo integration test binary was not found' >&2
            exit 1
          fi
          for case in profile_settings::ohm_default_debuginfo profile_settings::ohm_default_debuginfo_respects_overrides; do
            log="$RUNNER_TEMP/$case.log"
            "$testsuite" "$case" --exact --include-ignored --nocapture | tee "$log"
            grep -Fx "test $case ... ok" "$log"
            grep -F 'test result: ok. 1 passed; 0 failed;' "$log"
          done

  apple-selector-linux-build:
    name: Build the exact Apple fingerprint selector on x86-64 Linux
    if: ${{ inputs.task == 'apple-selector' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-native-reader-linux-ci-20261030' }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: qa-protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/ohm-apple-zmij/cargo293
            scripts/ohm-aarch64-versioned/cargo-transport
            scripts/ohm-cargo-301-linux-ci
      - name: Verify both physical source trees and their sole delta
        run: |
          mkdir receipt
          python3 -IB qa-protocol/scripts/ohm-cargo-301-linux-ci/source_302.py subject >receipt/source.json
      - name: Build the native Linux Cargo and bind the actual binary
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-302-compile
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustc +"$RUST_VERSION" -vV >receipt/constructor.txt
          cargo +"$RUST_VERSION" -Vv >receipt/constructor-cargo.txt
          for role in 301 302; do
            if test "$role" = 301; then subject_head=c18e91b514b2c4e4966c9ab03232c804af3e1b57; else subject_head=9a102b4519b40f9034aa40533d92c83583dcb289; fi
            git -C subject -c advice.detachedHead=false checkout --quiet --detach "$subject_head"
            test "$(git -C subject rev-parse HEAD)" = "$subject_head"
            test -z "$(git -C subject status --porcelain)"
            if test "$role" = 302; then
              # Cargo's own build script reads HEAD but only tracks files in a source tarball.
              # Give both source versions an independently empty target at the same visible path.
              mv "$CARGO_TARGET_DIR" "$CARGO_TARGET_DIR.retained-301"
            fi
            test ! -e "$CARGO_TARGET_DIR"
            cargo +"$RUST_VERSION" build --manifest-path subject/Cargo.toml --locked --features ohm-defaults,all-static --bin cargo -j12 --message-format=json >"receipt/construction-$role.jsonl"
          python3 - "$role" "$subject_head" <<'PYTHON'
          import hashlib,json,os,pathlib,subprocess,sys
          role,head=sys.argv[1:];out=pathlib.Path('receipt');rows=[json.loads(l) for l in (out/f'construction-{role}.jsonl').read_text().splitlines()]
          assert rows[-1]=={'reason':'build-finished','success':True}
          leaf,=[r for r in rows if r['reason']=='compiler-artifact' and r['target']['name']=='cargo' and r['target']['kind']==['bin']]
          assert not leaf['fresh'] and {'ohm-defaults','all-static'}<=set(leaf['features'])
          p=pathlib.Path(leaf['executable']);assert p.is_file() and os.access(p,os.X_OK)
          vv=subprocess.check_output([p,'-Vv']);(out/f'cargo-{role}-Vv.txt').write_bytes(vv)
          assert head.encode() in vv and b'x86_64-unknown-linux-gnu' in vv,(head,vv)
          with p.open('rb') as f:dig=hashlib.file_digest(f,'sha256').hexdigest()
          subprocess.run(['zstd','-q','-T0','-3',str(p),'-o',str(out/f'cargo-{role}.zst')],check=True)
          (out/f'product-{role}.json').write_text(json.dumps({'source':head,'tree':subprocess.check_output(['git','-C','subject','rev-parse','HEAD^{tree}'],text=True).strip(),'features':leaf['features'],'elf_bytes':p.stat().st_size,'elf':dig,'compressed_sha256':hashlib.sha256((out/f'cargo-{role}.zst').read_bytes()).hexdigest()},sort_keys=True)+'\n')
          PYTHON
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: exact-cargo-302-linux-selector
          retention-days: 7
          path: receipt

  e2e-reason:
    name: Diagnose the signed Linux ty_server e2e fingerprint
    if: ${{ inputs.task == 'e2e-reason' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-native-reader-linux-ci-20261030' }}
    permissions:
      contents: read
      actions: read
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: focus
          persist-credentials: false
          sparse-checkout: scripts/ohm-cargo-301-linux-ci
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          path: original-qa
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify tools and acquire the single native target history
        env:
          QUALIFICATION_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git -C original-qa rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends strace ninja-build
          python3 -IB focus/scripts/ohm-cargo-301-linux-ci/e2e_reason.py "$GITHUB_WORKSPACE/original-qa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: focused-published-21-ty-server-e2e-fingerprints
          path: ${{ runner.temp }}/packaged-linux-50/diagnostic
          if-no-files-found: warn
          retention-days: 7
