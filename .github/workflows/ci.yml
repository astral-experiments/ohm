name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-gnu-register-independent-counter-20261030
  cancel-in-progress: false
jobs:
  counter:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-register-comments-20261030'
    name: Calibrate whole-process guest Ir with actual threads and posix_spawn
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Record all native parent and child instructions separately
        run: |
          set -euo pipefail
          export QA_ROOT="$RUNNER_TEMP/gnu-counter-calibration"
          mkdir -p "$QA_ROOT/receipts"
          (cd scripts/ohm-aarch64-registers && sha256sum -c SHA256SUMS)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
          dpkg-query -W valgrind > "$QA_ROOT/receipts/valgrind"
          git rev-parse HEAD > "$QA_ROOT/receipts/qa-head"
          python3 -IB scripts/ohm-aarch64-registers/tree_ir.py
      - name: Retain successful or failed calibration
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-register-counter-calibration
          path: ${{ runner.temp }}/gnu-counter-calibration/receipts
          retention-days: 7
          if-no-files-found: error
