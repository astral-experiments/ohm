      fail-fast: false
      matrix:
        include:
          - os: depot-ubuntu-24.04-16
            other: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: qa-protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/ohm-apple-zmij/cargo293
            scripts/ohm-aarch64-versioned/cargo-transport
            scripts/ohm-cargo-301-linux-ci
      - name: Authenticate Cargo 301 source, tree and all 3114 entries
