name: Qualify an upstream monomorphization consumer in Ruff
run-name: Old Ruff ruff_db library-test custody ${{ inputs.reviewed_head }}
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact nonrelease QA commit
        required: true
        type: string
permissions: {}
concurrency:
  group: heldout-old-ruff-27470-${{ github.sha }}
  cancel-in-progress: false
jobs:
  heldout:
    name: Signed Old ruff_db library test
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-heldout-mono-fold-27470-20261102' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    permissions:
      actions: read
      contents: read
    timeout-minutes: 55
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-heldout-mono-fold
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bd7b58765ae44b21a1c9273b3ff0be8e923adc47
          path: donor
          persist-credentials: false
          sparse-checkout: scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: bb868838d75876c3b016d8cf1687d33eae80daa6
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check native tools
        run: |
          set -euo pipefail
          command -v rustup gh git gcc make pkg-config
          test -x /usr/bin/nm && test -x /usr/bin/c++filt
          command -v python3
      - name: Authenticate the worker and all 79 signed Ohm SDK files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-heldout-mono-fold/worker.py acquire
      - name: Prefetch only the locked test source graph
        run: python3 -IB qa/scripts/ruff-heldout-mono-fold/worker.py prefetch
      - name: Build the frozen Old library test and inspect its native graph
        run: python3 -IB qa/scripts/ruff-heldout-mono-fold/worker.py run
      - name: Retain the raw graph, native outputs and receipts
        if: always()
        run: python3 -IB qa/scripts/ruff-heldout-mono-fold/worker.py seal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ruff-27470-old-library-test
          path: ${{ runner.temp }}/ohm-ruff27470-old/heldout-proof.tar
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
