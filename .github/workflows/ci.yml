name: Inventory a historical ty_server check
run-name: Ruff 27470 scoped visibility admission ${{ inputs.reviewed_head }}

on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact independently reviewed nonrelease QA commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  profile:
    name: Check the held-out ty_server edit
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-ruff-visibility-heldout-20261103' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-linter-check-attribution
            scripts/ruff-heldout-mono-fold/residual
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bd7b58765ae44b21a1c9273b3ff0be8e923adc47
          path: donor
          persist-credentials: false
          sparse-checkout: scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 97065696c0e4dbe6ff43a89c73f923bf60ee231a
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate the signed SDK and enrolled worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-linter-check-attribution/worker.py acquire
      - name: Fetch the exact registry closure without compiling
        run: python3 -IB qa/scripts/ruff-linter-check-attribution/worker.py prefetch
      - name: Count actual compiler invocations and compare the direct and indirect metadata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends strace zstd
          python3 -IB qa/scripts/ruff-linter-check-attribution/inventory.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: heldout-visibility-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-ruff-visibility/receipt
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
