name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qa-gnu-1-99-restamped-native-provider-20261030
  cancel-in-progress: false
jobs:
  ruff:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-cargo293-link-fallback-20261030'
    name: Read the identical restamped archive and higher-priority search on upstream Rust and Cargo 1.99
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Reopen the fixed protocol, counter and native cross toolchain
        run: |
          set -euo pipefail
          export QA_ROOT="$RUNNER_TEMP/gnu-aarch64-ruff-screen"
          mkdir -p "$QA_ROOT/receipts" "$QA_ROOT/inputs"
          printf 'QA_ROOT=%s\n' "$QA_ROOT" >> "$GITHUB_ENV"
          (cd scripts/ohm-aarch64-registers && sha256sum -c SHA256SUMS)
          (cd scripts/ohm-aarch64-compact && sha256sum -c SHA256SUMS)
          (cd scripts/ohm-aarch64-fallback && sha256sum -c SHA256SUMS)
          cp scripts/ohm-aarch64-compact/{STOCK.md,SHA256SUMS} "$QA_ROOT/receipts/"
          git rev-parse HEAD > "$QA_ROOT/receipts/qa-head"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user strace valgrind zstd
          dpkg-query -W gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user strace valgrind > "$QA_ROOT/receipts/packages"
          echo 'def5fdcf6ae64a4d3e6af3786b622978d8313e0734ecf3f6cbe71d8be9e274c8  /usr/bin/valgrind.bin' | sha256sum -c -
          python3 -IB scripts/ohm-aarch64-linux/qualify.py selftest
      - name: Run both provider graphs with the authenticated official stable Linux host and target
        run: |
          set -euo pipefail
          python3 -IB scripts/ohm-aarch64-fallback/stock_native.py
          python3 -IB scripts/ohm-aarch64-fallback/verify_native.py "$QA_ROOT/receipts" "$QA_ROOT/receipts/independent-native.json"
      - name: Retain sources, original data, all complete programs and any qualification failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-physical-stock-1.99-restamped
          path: ${{ runner.temp }}/gnu-aarch64-ruff-screen/receipts
          retention-days: 7
          if-no-files-found: error
