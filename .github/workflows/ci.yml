name: Adjacent Cargo commits on Ruff's implicit Linux provider
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  products:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-linux-implicit-294-parent-20261031'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/linux-294-parent
            scripts/gc-mount-evidence/build_candidate.py
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          path: signed-reader
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate and install the real released SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
          mkdir -m700 "$RUNNER_TEMP/unicode-builder"
          python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/unicode-builder"
      - name: Build exactly the one-commit product difference with matching driver and Cargo settings
        run: |
          set -eu
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends ninja-build build-essential cmake pkg-config perl libssl-dev
          python3 -IB protocol/scripts/linux-294-parent/build.py "$RUNNER_TEMP/unicode-builder" "$GITHUB_WORKSPACE/protocol/scripts/ohm-apple-zmij/cargo293/source.pack"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: same-compiler-adjacent-cargo
          path: ${{ runner.temp }}/unicode-builder/deliver
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adjacent-source-build-record
          path: |
            ${{ runner.temp }}/unicode-builder/reports
            ${{ runner.temp }}/unicode-builder/receipts
          retention-days: 7
          if-no-files-found: warn
