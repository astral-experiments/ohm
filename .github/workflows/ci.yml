name: Build a matched nonrelease stage1 compiler pair
run-name: Matched stage1 Rust compilers ${{ inputs.reviewed_head }}
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease QA commit
        required: true
        type: string
permissions: {}
concurrency:
  group: ohm-remat-matched-stage1-${{ github.sha }}
  cancel-in-progress: false
jobs:
  matched:
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-remat-live-pin-20261102'
      && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 355
    permissions:
      actions: read
      contents: read
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      OHM_TARGET: x86_64-unknown-linux-gnu
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Check out release coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 634d090f0f565936996a817bcb884c64cbe7e6cc
    - name: Authenticate the proposed release Rust pin
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: e6fe4399e188e6d86a32a750585936800ce0d99a
        path: proposed-pin
        sparse-checkout: toolchains/1.99.0
        persist-credentials: false
    - name: Check out qa-code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        path: qa-code
        sparse-checkout: |-
          .github/workflows
          scripts/rc23-expanded-inputs
          scripts/ruff-matched-stage
        persist-credentials: false
        fetch-depth: 16
    - name: Install Python for QA readers
      id: qa_python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
        update-environment: true
    - name: Install the release manifest validator's uvx runner
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: false
    - name: Check out legacy
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46258d8b9b6ae5f7b443fab3115799466a3b5ff4
        path: legacy
        sparse-checkout: |-
          scripts/integrated-dist-qa
          scripts/dep-graph-slots
          toolchains/1.99.0
          scripts/darwin-pgo-diesel
        persist-credentials: false
    - name: Check out legacy/source-carrier
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b
        path: legacy/source-carrier
        sparse-checkout: scripts/rc22-private-export-ice
        persist-credentials: false
    - name: Check out legacy/transport
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27
        path: legacy/transport
        sparse-checkout: scripts/rc22-native
        persist-credentials: false
    - name: Check out legacy/public-seed
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
        path: legacy/public-seed
        sparse-checkout: scripts/ohm-apple-zmij/source-transport
        persist-credentials: false
    - name: Check out legacy/signed-rust
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
        path: legacy/signed-rust
        sparse-checkout: scripts/strict-mixed-generics
        persist-credentials: false
    - name: Check out legacy/cargo-seed
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
        path: legacy/cargo-seed
        sparse-checkout: |-
          scripts/cargo-diagnostic-fix
          scripts/ohm-apple-zmij/cargo293
        persist-credentials: false
    - name: Check out qa-cross
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: e6ff148b647d3033244eb979eb6384963e351db2
        path: qa-cross
        sparse-checkout: scripts/rc23-cross-qualification
        persist-credentials: false
    - name: Check out the immutable stage1 recipe and capsule writer
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: bc0e3e18ccf825c4eeaece4727b9ac3b4ecd8a89
        path: packed
        sparse-checkout: scripts/ohm-packed-ruff
        persist-credentials: false
    - name: Install the native build tools before recording their versions
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libssl-dev jq zstd
    - name: Admit this reviewed nonrelease worker
      run: |-
        set -euo pipefail
        (cd qa-code/scripts/rc23-expanded-inputs && sha256sum --check --strict --quiet SHA256SUMS)
        ./scripts/validate-release-manifest.sh --require-pinned toolchains/1.99.0/23.json
        python3 -IB qa-code/scripts/ruff-matched-stage/build.py preflight
        python3 -IB qa-code/scripts/ruff-matched-stage/tests.py
    - name: Assemble the complete pinned Rust, Cargo, Clippy and rustfmt checkouts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        python3 -IB qa-code/scripts/rc23-expanded-inputs/materialize.py --workspace "$GITHUB_WORKSPACE" --rust "$GITHUB_WORKSPACE/source/rust" --out "$RUNNER_TEMP/ohm-branch-object-qa/logs/source.json"
    - name: Acquire the frozen signed Cargo and GNU linker transport
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        gh api -H "Accept: application/octet-stream" repos/astral-experiments/ohm/releases/assets/698533704 > "$RUNNER_TEMP/ohm-branch-object-qa/signed-cargo.tar.gz"
    - name: Build the isolated stage1 pair and verify ordinary Cargo
      run: |-
        set -euo pipefail
        command -v git curl cmake ninja cc rustup gh zstd nm patch
        python3 -IB qa-code/scripts/ruff-matched-stage/build.py build
    - name: Package authenticated content-addressed compiler objects
      run: |-
        set -euo pipefail
        study="$RUNNER_TEMP/ohm-branch-object-qa"
        test -s "$study/logs/accepted.json"
        tar --sort=name --numeric-owner --owner=0 --group=0 --mtime=@0 -C "$study" -cf - capsule | zstd -q -T4 -5 -o "$study/matched-stage.tar.zst"
        (cd "$study" && sha256sum matched-stage.tar.zst > logs/archive.sha256)
    - name: Retain the matched compiler capsule
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ohm-remat-matched-stage1
        path: ${{ runner.temp }}/ohm-branch-object-qa/matched-stage.tar.zst
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
    - name: Retain source, tool and smoke evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ohm-remat-matched-stage1-receipts
        path: ${{ runner.temp }}/ohm-branch-object-qa/logs
        retention-days: 7
        if-no-files-found: warn
