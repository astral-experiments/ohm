name: Four-role full repair hardware diagnostic
run-name: Whole Cargo repair intervention ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed commit of the repair diagnostic
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  measure:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ctfe-repair-notify-pmu-20261101' && github.run_attempt == '1' && inputs.reviewed_head == github.sha
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        position: ['01', '02']
    name: Full repair counter ${{ matrix.position }}
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      POSITION: ${{ matrix.position }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ctfe-crossover-pilot
            scripts/ctfe-repair-encode
            scripts/ctfe-repair-notify-pmu
            scripts/gnu-ctfe-literal-identity
            scripts/branch-return-pmu
            scripts/branch-first-session-e-screen
            scripts/branch-storage-e-confirmation
            scripts/ohm-packed-ruff
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5c651f1d38c629da2a75d5cac3588db0be8104d7
          path: prior-pilot
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ctfe-crossover-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 18b0cf251988b5967f8ffb0b11db850966eae9d1
          path: ctfe-source
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/gnu-ctfe-literal-identity
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 762fc25095e317ac5632ec835df3c7f9cfc64a64
          path: source
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-checked-packed-source
            scripts/branch-first-session-e-source
            scripts/branch-return-source
            scripts/ohm-packed-ruff
            scripts/ohm-apple-zmij/source-transport
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 19f9a67b032cce44cea1e3bb7e324558cd9abd0a
          path: observer-source
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-return-execstop
            scripts/branch-return-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 084db0cf9d1156c9644880fda30f320072734865
          path: contact-source
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ctfe-repair-encode
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
          path: calibration-source
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-renderer-pfc-hardware
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: meter-source
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-example-ceiling
            scripts/gnu-renderer-library-workers
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the enrolled source and prepare empty task-owned output roots
        run: |
          set -exuo pipefail
          test "$(git -C enrolled rev-parse HEAD)" = "$REVIEWED_HEAD"
          test "$(git -C contact-source rev-parse HEAD)" = 084db0cf9d1156c9644880fda30f320072734865
          test "$(git -C enrolled rev-parse HEAD:scripts/ctfe-repair-encode)" = "$(git -C contact-source rev-parse HEAD:scripts/ctfe-repair-encode)"
          test "$(git -C observer-source rev-parse HEAD)" = 19f9a67b032cce44cea1e3bb7e324558cd9abd0a
          test "$(git -C prior-pilot rev-parse HEAD)" = 5c651f1d38c629da2a75d5cac3588db0be8104d7
          test "$(git -C enrolled rev-parse HEAD:scripts/ctfe-crossover-pilot)" = "$(git -C prior-pilot rev-parse HEAD:scripts/ctfe-crossover-pilot)"
          test "$(git -C ctfe-source rev-parse HEAD)" = 18b0cf251988b5967f8ffb0b11db850966eae9d1
          for component_path in scripts/gnu-ctfe-literal-identity scripts/ruff-repair-tables-pilot/guards.py; do
            source_object=$(git -C ctfe-source rev-parse "HEAD:$component_path")
            pilot_object=$(git -C enrolled rev-parse "HEAD:$component_path")
            test "$source_object" = "$pilot_object"
          done
          for d in ctfe-source/scripts/gnu-ctfe-literal-identity prior-pilot/scripts/ctfe-crossover-pilot contact-source/scripts/ctfe-repair-encode enrolled/scripts/{ctfe-repair-notify-pmu,branch-return-pmu,branch-first-session-e-screen,branch-storage-e-confirmation,ohm-packed-ruff,ohm-packed-ruff/full-cli}; do
            (cd "$d" && sha256sum --strict --check --status SHA256SUMS)
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates git libssl-dev strace zstd
          python3 -IB enrolled/scripts/ctfe-crossover-pilot/test_subjects.py
          python3 -IB enrolled/scripts/ctfe-repair-encode/test_gate.py
          python3 -IB enrolled/scripts/ctfe-repair-encode/test_contact.py
          python3 -IB enrolled/scripts/ctfe-repair-encode/read_contact.py --help > /dev/null
          python3 -IB enrolled/scripts/ctfe-repair-notify-pmu/test_protocol.py
          python3 -IB enrolled/scripts/ctfe-repair-notify-pmu/review.py --help >/dev/null
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          dpkg-query -W b3sum binutils build-essential git libssl-dev strace zstd > "$base/logs/packages.tsv"
      - name: Reopen the prerequisite and both source SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          contact="$RUNNER_TEMP/prerequisite-full-repair"
          python3 -IB enrolled/scripts/ctfe-repair-notify-pmu/intake.py "$contact"
          python3 -IB enrolled/scripts/ctfe-repair-notify-pmu/repair_study.py acquire "$GITHUB_WORKSPACE/source" "$contact" "$contact/contact.zip" "$GITHUB_WORKSPACE/observer-source"
      - name: Separate native observation and four ordinary repair measurements
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-repair-tables-pilot/guards.py watch "$base/work" "$base/logs" "$base/logs/resource" python3 -IB enrolled/scripts/ctfe-repair-notify-pmu/repair_study.py "$POSITION" "$GITHUB_WORKSPACE/calibration-source" "$GITHUB_WORKSPACE/meter-source"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ctfe-repair-notify-pmu-${{ matrix.position }}
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
