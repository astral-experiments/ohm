name: Compare the -23 compiler on two Ruff cross builds
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        type: string
        required: true
        description: Exact comparison commit
permissions: {}
jobs:
  replay:
    name: Ruff ${{ matrix.workload }} edits, cohort ${{ matrix.cohort }}
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-rc23-cross-qualification' && github.sha == inputs.reviewed_head
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workload:
          - gnu
        cohort:
          - 1
          - 2
    runs-on: ${{ vars.OHM_RELEASE_LINUX_RUNNER || 'namespace-profile-ubuntu-24-04-16' }}
    timeout-minutes: 355
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      WORKLOAD: ${{ matrix.workload }}
      COHORT: ${{ matrix.cohort }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/ruff
          ref: ${{ matrix.workload == 'gnu' && '193984681ef7185c90b548c27b0ac6326908f2ec' || '672bb4edf04c84f8b0753346359daee4057158f2' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          path: ruff-source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install the target C toolchain and execution tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -y -qq install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu musl-tools qemu-user
      - name: Read the sealed artifacts from both matched release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/astral-experiments/ohm/actions/runs/41337830413/artifacts?per_page=100' > base-artifacts.json
          gh api 'repos/astral-experiments/ohm/actions/runs/41338756360/artifacts?per_page=100' > cross-artifacts.json
          jq -n --slurpfile base base-artifacts.json --slurpfile cross cross-artifacts.json   '{artifacts: ([ $base[0].artifacts[] | select(.name == "rc23-cross-sdk-base") ] + [ $cross[0].artifacts[] | select(.name == "rc23-cross-sdk-cross") ])}' > cross-media.json
          jq -e '.artifacts | length == 2' cross-media.json >/dev/null
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: 41337830413
          github-token: ${{ github.token }}
          path: cross-media/rc23-cross-sdk-base
          name: rc23-cross-sdk-base
        name: Download the base compiler
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: 41338756360
          github-token: ${{ github.token }}
          path: cross-media/rc23-cross-sdk-cross
          name: rc23-cross-sdk-cross
        name: Download the cross compiler
      - name: Check asm invalidation, runtime outputs and paired edit timings
        run: |
          (cd scripts/rc23-cross-study && sha256sum --strict --check SHA256SUMS)
          python3 -Bu scripts/rc23-cross-study/measure.py "$WORKLOAD" "$COHORT"
      - name: Retain raw logs, timings and excluded attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc23-cross-results-${{ matrix.workload }}-${{ matrix.cohort }}-attempt-${{ github.run_attempt }}
          path: |
            cross-results/
            cross-media.json
          if-no-files-found: warn
          retention-days: 30
