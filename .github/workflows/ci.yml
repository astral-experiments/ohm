name: Count genuine native work in two ordinary Ruff builds
run-name: "Count #337 native work after complete typed archive admission"
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
      distributions:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prices:
    if: ${{ github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-real-cgu-weights-20261102' && github.sha == inputs.reviewed_head && github.run_attempt == '1' && inputs.distributions == 'typed-native-prices' }}
    runs-on: namespace-profile-ubuntu-24-04-16
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2]
    timeout-minutes: 155
    env:
      NATIVE_WINDOW_REPLICATE: ${{ matrix.replicate }}
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PLACEMENT_FACTORY: '41475100027'
      PLACEMENT_SOURCE: 4e546b27c311f29d99f9528e64420887f57c7538
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-real-cgu-weights
            scripts/ruff-source-placement
            scripts/ruff-ldv-physical-stage
            scripts/ruff-ldv-physical-workflow
            scripts/ruff-ldv-needed
            scripts/ruff-ldv-pilot
            scripts/ruff-default-owner-pmu
            scripts/ruff-workspace-link-census
            scripts/ruff-workspace-remat
            scripts/ruff-workspace-option-edit
            scripts/ruff-cgu-inputs
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 088b7b5f77fcb05994fd2a17cbc940cd9edb341a
          path: ruff-option
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install native tracing and source-certificate verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential libssl-dev pkg-config strace zstd
      - name: Verify the original matched compiler source capsule
        working-directory: enrolled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          (cd scripts/ruff-source-placement && sha256sum --strict --quiet -c factory.sha256 && sha256sum --strict --quiet -c worker.sha256)
          python3 -IB scripts/ruff-real-cgu-weights/prices.py receive "$RUNNER_TEMP/placement-qualified-sdks"
      - name: Compare all three real rlibs and qualify the native object windows
        run: python3 -IB -u enrolled/scripts/ruff-real-cgu-weights/prices.py "$GITHUB_WORKSPACE/ruff-option"
      - name: Preserve the profile and native verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typed-native-unit-instructions-${{ matrix.replicate }}
          path: |
            ${{ runner.temp }}/cgu-profile-report/*.json
            ${{ runner.temp }}/cgu-profile-report/*.gz
          if-no-files-found: warn
          retention-days: 7
