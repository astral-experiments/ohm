name: Private native Apple provider qualification
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: apple-276-external-providers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apple-provider-edges:
    runs-on: namespace-profile-macos-15
    timeout-minutes: 105
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the protocol, Apple exec observer and native linker
        run: |
          root="$RUNNER_TEMP/ohm-276-apple-provider"
          python3 -IB scripts/ohm-apple-zmij/test_provider_edges.py -v
          python3 -IB scripts/ohm-apple-zmij/run.py pilot calibrate "$root"
          test -s "$root/receipts/observer.json"
      - name: Authenticate signed Cargo and its native reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/ohm-276-apple-provider"
          mkdir "$root/assets"
          gh release download ohm-1.99.0-20 --repo "$GITHUB_REPOSITORY" --dir "$root/assets" --pattern 'ohm-1.99.0-20-aarch64-apple-darwin*'
          python3 -IB scripts/ohm-apple-zmij/run.py prepare release "$root" "$root/assets"
      - name: Build exact Rust parent and child and reopen both complete SDKs
        run: |
          root="$RUNNER_TEMP/ohm-276-apple-provider"
          python3 -IB scripts/ohm-apple-zmij/run.py host "$root" 32
          if ! command -v ninja >/dev/null; then brew install ninja; fi
          (cd scripts/ohm-apple-zmij/source-transport && shasum -a 256 -c SHA256SUMS)
          python3 -IB scripts/ohm-apple-zmij/source-transport/prepare.py "$root/enrolled-rust" > "$root/receipts/public-source-transport.json"
          python3 -IB scripts/ohm-apple-zmij/run.py prepare pair "$root" "$root/enrolled-rust"
      - name: Reopen first direct no-watch parent and candidate
        run: python3 -IB scripts/ohm-apple-zmij/provider_edges.py "$RUNNER_TEMP/ohm-276-apple-provider" first
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: apple-276-direct-unwatched-first
          path: |
            ${{ runner.temp }}/ohm-276-apple-provider/receipts/provider-matrix
            ${{ runner.temp }}/ohm-276-apple-provider/receipts/edge-markers
            ${{ runner.temp }}/ohm-276-apple-provider/receipts/edge-images
          retention-days: 14
          if-no-files-found: warn
      - name: Complete both native placements and Cargo modes with watched and unwatched providers
        run: python3 -IB scripts/ohm-apple-zmij/provider_edges.py "$RUNNER_TEMP/ohm-276-apple-provider" rest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: apple-276-external-provider-receipts
          path: ${{ runner.temp }}/ohm-276-apple-provider/receipts
          retention-days: 14
          if-no-files-found: warn
