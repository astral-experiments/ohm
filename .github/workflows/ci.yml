name: Reopen the original signed workspace foreign-span intervention
run-name: Independently reopen the signed Ron source intervention on Ruff
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  read:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.event_name == 'workflow_dispatch' && github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-read-workspace-ron-cause-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.reviewed_head }}
          path: qa
          fetch-depth: 2
          sparse-checkout: scripts/ruff-original-ty-instructions
          persist-credentials: false
      - name: Install the format's registered checksum verifier
        run: sudo apt-get update -qq && sudo apt-get install -qy b3sum
      - name: Read both original source states and the signed compiler diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -IB qa/scripts/ruff-original-ty-instructions/ron_cause_reopen.py --qa "$PWD/qa" --root "$RUNNER_TEMP/reopened" --gh gh
          test -s "$RUNNER_TEMP/reopened/41621281440/decoded.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-ron-cause-read-${{ github.run_id }}
          path: ${{ runner.temp }}/reopened/41621281440/*.json
          retention-days: 10
          if-no-files-found: error
