name: Compare native link smoke requirements on GNU
on:
  workflow_dispatch:
    inputs:
      expected_head: {description: Qualification commit, required: true, type: string}
permissions: {contents: read, actions: read}
concurrency: {group: rc22-declared-input-comparison, cancel-in-progress: false}
jobs:
  compare:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-22-declared-input-comparison'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify the qualification commit
        env: {EXPECTED: '${{ inputs.expected_head }}'}
        run: test "$GITHUB_SHA" = "$EXPECTED"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {persist-credentials: false, sparse-checkout: scripts/rc22-declared-inputs}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - name: Exercise the original test, proposed test and hidden second archive
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 -IB scripts/rc22-declared-inputs/compare.py
      - name: Keep the commands, failures and exact binary identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc22-declared-input-comparison
          path: ${{ runner.temp }}/rc22-candidate-replay/reports/
          if-no-files-found: error
          retention-days: 30
