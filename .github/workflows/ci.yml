name: CI
on:
  workflow_dispatch:
    inputs:
      gnu_only: {description: Only the Linux tracer, type: boolean, default: false}
      expected_head: {description: Exact reviewed commit, type: string, required: true}
permissions: {contents: read, actions: read}
jobs:
  observe:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-22-observe-gnu-native-links' && github.sha == inputs.expected_head && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '13064288126'
          run-id: '41256793646'
          github-token: ${{ github.token }}
          path: release
          merge-multiple: true
      - name: Observe both default output links on the new GNU distribution
        run: |
          command -v strace || sudo apt-get install -y strace
          python3 -IB scripts/rc22-physical-gnu.py
      - name: Retain the native exec traces and runtime outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnu-native-default-link-observations
          path: ${{ runner.temp }}/rc22-physical-gnu/reports/
          retention-days: 21
          if-no-files-found: error
  apple-graph:
    name: Replay the optimized Diesel edit on matched Apple compilers
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-22-observe-gnu-native-links' && github.sha == inputs.expected_head && github.run_attempt == 1 && !inputs.gnu_only
    runs-on: namespace-profile-macos-15
    timeout-minutes: 240
    env:
      OHM_QA_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: c0748d6bc1bac8e85828ea0c5c9f297eb10f88aa, path: protocol, persist-credentials: false, sparse-checkout: scripts/darwin-native-export}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b, path: source-carrier, persist-credentials: false, sparse-checkout: scripts/rc22-private-export-ice}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27, path: transport, persist-credentials: false, sparse-checkout: scripts/rc22-native}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a, path: public-seed, persist-credentials: false, sparse-checkout: scripts/ohm-apple-zmij/source-transport}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1, path: signed-rust, persist-credentials: false, sparse-checkout: scripts/strict-mixed-generics}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
          path: cargo-seed
          persist-credentials: false
          sparse-checkout: |
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 69af8fd3bf8ef6ddb49aa801f25016c6af5171a9
          path: native-reader
          persist-credentials: false
          sparse-checkout: |
            scripts/rc22-complete-smoke
            release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - name: Admit pinned media reader, GNU source carrier and native host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C protocol rev-parse HEAD)" = c0748d6bc1bac8e85828ea0c5c9f297eb10f88aa
          test "$(git -C native-reader rev-parse HEAD)" = 69af8fd3bf8ef6ddb49aa801f25016c6af5171a9
          test "$(git -C source-carrier rev-parse HEAD)" = 0c9c558ce24212e5da6fb66150790b0af3cee90b
          command -v zstd
          xcrun -f ld
          test "$(uname -m)" = arm64
          echo "WORK=$RUNNER_TEMP/private-export-darwin" >> "$GITHUB_ENV"
          echo "QA=$GITHUB_WORKSPACE/protocol/scripts/darwin-native-export" >> "$GITHUB_ENV"
      - name: Authenticate and install the original release and common Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB "$QA/drive.py" original "$WORK"
      - name: Reconstruct the exact accepted compiler source
        run: python3 -IB "$GITHUB_WORKSPACE/source-carrier/scripts/rc22-private-export-ice/subject.py" prepare "$WORK"
      - name: Build the revised Apple compiler, rustdoc and standard library
        run: python3 -IB "$QA/drive.py" candidate "$WORK"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', path: diagnostic, persist-credentials: false, sparse-checkout: scripts/rc22-diesel-graph.py, sparse-checkout-cone-mode: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rust-lang/rustc-perf
          ref: 0a054b0ead56e41a4584bfab6fdc1a5fad2aedc3
          path: perf
          persist-credentials: false
          sparse-checkout: collector/compile-benchmarks/diesel-2.2.10
      - name: Compare the retained Diesel graph and rustc exit on the edit and its repeats
        run: python3 -IB "$GITHUB_WORKSPACE/diagnostic/scripts/rc22-diesel-graph.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: apple-diesel-graph-control
          path: |
            ${{ runner.temp }}/private-export-darwin/receipts/
            ${{ runner.temp }}/private-export-darwin/reports/
          if-no-files-found: error
          retention-days: 21
