name: Read-only complete original -22 smoke
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact 40-character SHA reviewed for this manual run
        required: true
        type: string
      source:
        description: Frozen original release run
        required: true
        type: choice
        options:
          - '41237680370'
permissions: {}
jobs:
  smoke:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-rc22-complete-input-smoke-20261031' && inputs.source == '41237680370' && inputs.reviewed_head == github.sha && github.run_attempt == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: namespace-profile-macos-15
    name: Complete smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    env:
      OHM_QA_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/rc22-complete-smoke
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check first-parent source and reviewer tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = e8468d0d0221379e7152a748a8735d78a88eda2f
          test "$(git hash-object scripts/smoke-test-release.sh)" = dc978769b3d0fa3b8e797b7041fdbdaf5c04dc1e
          test "$(git hash-object scripts/smoke-test-relink.sh)" = 3743c253445a2b796445a90fe31c08db53304ba8
          python3 -IB scripts/rc22-complete-smoke/test_controls.py
      - name: Authenticate original platform and global release ZIPs
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/rc22-complete-smoke/media.py original
      - name: Verify physical upstream 1.99.0 rust-analyzer and archive members
        id: stock
        run: |
          python3 -IB scripts/rc22-complete-smoke/stock.py
          python3 -IB scripts/rc22-complete-smoke/installed.py catalog
      - name: Entire corrected smoke on the unmodified original distribution
        id: packaged
        run: python3 -IB scripts/rc22-complete-smoke/run.py packaged
      - name: Authenticate the separate source-built corrected Cargo binary
        id: corrected
        if: ${{ !cancelled() && steps.original.outcome == 'success' && steps.stock.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/rc22-complete-smoke/media.py fixed
      - name: Entire corrected smoke on the private Cargo replacement
        id: replacement
        if: ${{ !cancelled() && steps.corrected.outcome == 'success' }}
        run: python3 -IB scripts/rc22-complete-smoke/run.py fourfix
      - name: Independently check both completed arms
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && steps.replacement.outcome == 'success' }}
        run: python3 -IB scripts/rc22-complete-smoke/reopen.py "$RUNNER_TEMP/rc22-complete-smoke/receipts"
      - name: Retain original, partial, or complete QA receipts only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc22-complete-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/rc22-complete-smoke/receipts
          if-no-files-found: warn
          retention-days: 14
