name: Independently reopen the two Ruff 25492 packets
run-name: Reopen Ruff 25492 at ${{ inputs.reviewed_head }}
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reader commit
        type: string
        required: true
permissions: {}
jobs:
  readback:
    name: Read the two complete recorded packets without running a compiler
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-line-end-25492-20261102' && github.sha == inputs.reviewed_head && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: scripts/ruff-line-end-25492
      - name: Reopen both full ZIPs and compare the four original histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/ruff-line-end-25492/reopen.py "$RUNNER_TEMP/report"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-line-end-25492-readback
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 14
