name: Read signed Rust foreign-span observations on a Ruff check
run-name: RUF009 native macro observation ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Diagnostic fixtures or release-profile Ruff acceptance
        type: choice
        default: fixture
        options: [fixture, reader, release-ruff, reader-ruff, fixed-extern-hardware]
      reviewed_head:
        description: Exact reviewed nonrelease QA source
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-ruf009-join-proof-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.reviewed_head }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-foreign-span-observer
            scripts/ruff-join-proof
      - name: Check out the prior authenticated QA source pack
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0ba92bc43183bd548243fedea51e2762f27c05dc
          persist-credentials: false
          path: accepted-source
          sparse-checkout: scripts/ohm-apple-zmij/cargo293
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: inputs.lane == 'release-ruff' || inputs.lane == 'reader-ruff' || inputs.lane == 'fixed-extern-hardware'
        with:
          repository: astral-sh/ruff
          ref: b00f68a23cedbd3a38fc25bac63638f0f11fc3f0
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - name: Build matched release-profile Cargo and check real Ruff
        if: inputs.lane == 'release-ruff' || inputs.lane == 'reader-ruff'
        env:
          OHM_READER_RELEASE_QA: ${{ inputs.lane == 'reader-ruff' && '1' || '0' }}
          OHM_SDK_READ_TOKEN: ${{ github.token }}
        run: |
          command -v strace || (sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends strace zstd)
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          python3 -IB qa/scripts/ruff-join-proof/release/ruff.py
      - name: Check historical Ruff against paired release Cargo and identical true native dependencies
        if: inputs.lane == 'fixed-extern-hardware'
        env:
          OHM_SDK_READ_TOKEN: ${{ github.token }}
        run: |
          command -v strace || (sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends strace zstd)
          sudo sysctl -w kernel.perf_event_paranoid=-1
          python3 -IB qa/scripts/ruff-join-proof/release/qualified_hardware.py
      - name: Build and validate actual Cargo after dependencies complete
        if: inputs.lane == 'fixture' || inputs.lane == 'reader'
        env:
          OHM_INPUT_RECHECK_QA: '1'
          OHM_DEP_INFO_READER_QA: ${{ inputs.lane == 'reader' && '1' || '0' }}
          OHM_SDK_READ_TOKEN: ${{ github.token }}
        run: |
          command -v strace || (sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends strace)
          python3 -IB qa/scripts/ruff-join-proof/causality/probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ruf009-join-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-foreign-join/published/
          retention-days: 15
          if-no-files-found: error
