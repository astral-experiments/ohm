name: Calibrate instruction counters on the threads of a single compiler image
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Reviewed commit of the private calibration tool
        required: true
        type: string
permissions:
  contents: read
jobs:
  calibrate:
    if: github.event.repository.private && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-rustc-thread-instructions' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/rustc-thread-instructions
      - name: Compile and verify native probes
        working-directory: scripts/rustc-thread-instructions
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence/pmu"
          sha256sum -c SHA256SUMS
          { uname -a; cat /proc/sys/kernel/perf_event_paranoid; cc --version; } > "$GITHUB_WORKSPACE/evidence/host.txt"
          cc -O2 -Wall -Wextra -Werror -fPIC -shared pmu.c -o libohm_pmu.so
          cc -O2 -Wall -Wextra -Werror -pthread workload.c -o workload
          python3 -ISB preflight.py "$GITHUB_WORKSPACE/evidence/uninstrumented"
          python3 -ISB per_rustc.py calibrate "$GITHUB_WORKSPACE/evidence/pmu" ./libohm_pmu.so ./workload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rustc-thread-instructions-${{ github.run_id }}-1
          path: evidence
          if-no-files-found: error
          retention-days: 14
