name: Qualify the source-built compiler with the shipped -24 recipe
run-name: Measure fully trained Linux compilers ${{ inputs.reviewed_head }}
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
      && github.ref_name == 'charlie/qa-rc24-trained-aggregate-20261104'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
    - name: Check out release coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 634d090f0f565936996a817bcb884c64cbe7e6cc
    - name: Check out the current release source verifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: b4dab2cbe352ee63daffbeda179f77f061137049
        path: current-verifier
        sparse-checkout: 'scripts

          toolchains

          '
    - name: Check out the signed -23 source manifest
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 9c2397d36f033900a0864484714d526788d1dc77
        path: signed-coordinator
        sparse-checkout: 'scripts

          toolchains/1.99.0'
        persist-credentials: false
    - name: Check out qa-code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        path: qa-code
        sparse-checkout: '.github/workflows

          scripts/rc23-expanded-inputs

          scripts/ruff-matched-stage

          scripts/ruff-combined-apple'
        persist-credentials: false
        fetch-depth: 16
    - name: Check out legacy
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46258d8b9b6ae5f7b443fab3115799466a3b5ff4
        path: legacy
        sparse-checkout: 'scripts/integrated-dist-qa

          scripts/dep-graph-slots

          toolchains/1.99.0

          scripts/darwin-pgo-diesel'
        persist-credentials: false
    - name: Check out legacy/source-carrier
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b
        path: legacy/source-carrier
        sparse-checkout: scripts/rc22-private-export-ice
        persist-credentials: false
    - name: Check out legacy/transport
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27
        path: legacy/transport
        sparse-checkout: scripts/rc22-native
        persist-credentials: false
    - name: Check out legacy/public-seed
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
        path: legacy/public-seed
        sparse-checkout: scripts/ohm-apple-zmij/source-transport
        persist-credentials: false
    - name: Check out legacy/signed-rust
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
        path: legacy/signed-rust
        sparse-checkout: scripts/strict-mixed-generics
        persist-credentials: false
    - name: Check out legacy/cargo-seed
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
        path: legacy/cargo-seed
        sparse-checkout: 'scripts/cargo-diagnostic-fix

          scripts/ohm-apple-zmij/cargo293'
        persist-credentials: false
    - name: Check out qa-cross
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: e6ff148b647d3033244eb979eb6384963e351db2
        path: qa-cross
        sparse-checkout: scripts/rc23-cross-qualification
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 5b47d5755bd515e61a98b9f85eca3af0aaf7c137
        path: fixtures
        persist-credentials: false
        sparse-checkout: scripts/ruff-matched-stage
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: d47e72f8dc7cbc296d25992287998bea7e0f5520
        path: reader-source
        persist-credentials: false
        sparse-checkout: scripts/ruff-join-proof/fix
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0ba92bc43183bd548243fedea51e2762f27c05dc
        path: accepted-source
        persist-credentials: false
        sparse-checkout: scripts/ohm-apple-zmij/cargo293
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: false
    - name: Install the release manifest validator runner
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: false
    - name: Verify the original source scripts and retained historical evidence
      run: 'set -euo pipefail

        test "$(git -C qa-code rev-parse HEAD)" = "$GITHUB_SHA"

        test "$(git -C qa-code rev-parse HEAD:scripts/rc23-expanded-inputs)" = f80929b71c28137e4a6657b2ac7a7951c2c9a283

        test "$(git -C qa-code rev-parse HEAD:scripts/ruff-combined-apple)" = 666a7f145926728631a7e3e716d2b3ea7c8a7b24

        test "$(git -C qa-code rev-parse HEAD:scripts/ruff-matched-stage)" = f1a2c7b4ef41df09dca27e4b038c8c66773cdafb

        '
    - name: Recover both exact source trees from the private packaging repository
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/ohm-branch-object-qa/logs" "$RUNNER_TEMP/combined/logs"

        python3 -IB qa-code/scripts/rc23-expanded-inputs/materialize.py --workspace "$GITHUB_WORKSPACE" --rust "$GITHUB_WORKSPACE/source/rust"
        --out "$RUNNER_TEMP/ohm-branch-object-qa/logs/source-precursor.json"

        python3 -IB qa-code/scripts/ruff-matched-stage/signed_source.py

        python3 -IB reader-source/scripts/ruff-join-proof/fix/materialize.py --prior-pack accepted-source/scripts/ohm-apple-zmij/cargo293/source.pack
        --dest "$GITHUB_WORKSPACE/cargo-src"

        python3 -IB qa-code/scripts/ruff-combined-apple/qualify.py source'
    - name: Read exactly the published -24 coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 8f25c47ff9e7c4ab2f22a1cad0638a26c7e26e1c
        path: shipping
        persist-credentials: false
    - name: Read the immutable experiment
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: enrollment
        sparse-checkout: scripts/rc24-release-compiler-price
        persist-credentials: false
    - name: Verify all four published source trees, then apply the registered compiler difference
      run: python3 -IB enrollment/scripts/rc24-release-compiler-price/factory.py source
    - name: Install pinned LLVM BOLT tools
      env:
        MANIFEST_PATH: toolchains/1.99.0/24.json
      run: "if [[ \"$(dpkg --print-architecture)\" != amd64 ]]; then\n  echo 'LLVM BOLT tools require an amd64 Linux\
        \ runner' >&2\n  exit 1\nfi\n\ncase \"$(jq -er '.release.upstream_rust_version' \"$MANIFEST_PATH\")\" in\n\
        \  1.97.* | 1.98.*)\n    bolt_major=22\n    bolt_version='22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80'\n\
        \    bolt_sha256='97a9e4e8d2b2219757c38abef93e913793ebc64580aa51207bd23941c44ec070'\n    runtime_sha256='48639dafeb45892eec58f5d8a2d0d612ce791a2f713f06c794b71d6a72fa582d'\n\
        \    ;;\n  1.99.*)\n    bolt_major=23\n    bolt_version='23.1.2'\n    bolt_sha256='b5ed9675149cc837c282e9b6962c276c9fa62863d5b2f91537b60848552995b7'\n\
        \    ;;\n  *)\n    echo 'Pin matching LLVM BOLT tools for this Rust version' >&2\n    exit 1\n    ;;\nesac\n\
        bolt_root=\"$(mktemp -d \"${RUNNER_TEMP:?}/ohm-bolt.XXXXXX\")\"\nif [[ \"$bolt_major\" == 23 ]]; then\n  bolt_archive=\"\
        $bolt_root/llvm.tar.xz\"\n  bolt_directory=\"LLVM-$bolt_version-Linux-X64\"\n  curl --proto '=https' --proto-redir\
        \ '=https' --tlsv1.2 \\\n    --fail --location --retry 3 --show-error --silent \\\n    --output \"$bolt_archive\"\
        \ \\\n    \"https://github.com/llvm/llvm-project/releases/download/llvmorg-$bolt_version/$bolt_directory.tar.xz\"\
        \n  printf '%s  %s\\n' \"$bolt_sha256\" \"$bolt_archive\" | sha256sum --check --strict\n  # Leave llvm-profdata\
        \ for the build to link from Rust's matching LLVM.\n  tar -xJf \"$bolt_archive\" -C \"$bolt_root\" --strip-components=1\
        \ --occurrence=1 \\\n    \"$bolt_directory/bin/llvm-bolt\" \\\n    \"$bolt_directory/bin/merge-fdata\" \\\n\
        \    \"$bolt_directory/lib/libbolt_rt_hugify.a\" \\\n    \"$bolt_directory/lib/libbolt_rt_instr.a\"\n  rm\
        \ \"$bolt_archive\"\n  bolt_llvm_dir=\"$bolt_root\"\nelse\n  bolt_base_url=\"https://apt.llvm.org/noble/pool/main/l/llvm-toolchain-$bolt_major\"\
        \n  for package in \"bolt-$bolt_major\" \"libbolt-$bolt_major-dev\"; do\n    curl --proto '=https' --proto-redir\
        \ '=https' --tlsv1.2 \\\n      --fail --location --retry 3 --show-error --silent \\\n      --output \"$bolt_root/$package.deb\"\
        \ \\\n      \"$bolt_base_url/${package}_${bolt_version}_amd64.deb\"\n  done\n\n  printf '%s  %s\\n' \\\n \
        \   \"$bolt_sha256\" \\\n    \"$bolt_root/bolt-$bolt_major.deb\" \\\n    \"$runtime_sha256\" \\\n    \"$bolt_root/libbolt-$bolt_major-dev.deb\"\
        \ \\\n    | sha256sum --check --strict\n\n  dpkg-deb --extract \"$bolt_root/bolt-$bolt_major.deb\" \"$bolt_root\"\
        \n  dpkg-deb --extract \"$bolt_root/libbolt-$bolt_major-dev.deb\" \"$bolt_root\"\n  bolt_llvm_dir=\"$bolt_root/usr/lib/llvm-$bolt_major\"\
        \nfi\n\"$bolt_llvm_dir/bin/llvm-bolt\" --version\n\"$bolt_llvm_dir/bin/merge-fdata\" --version\nif [[ ! -f\
        \ \"$bolt_llvm_dir/lib/libbolt_rt_instr.a\" ]]; then\n  echo 'LLVM BOLT instrumentation runtime is missing'\
        \ >&2\n  exit 1\nfi\n\nprintf 'OHM_BOLT_LLVM_DIR=%s\\n' \"$bolt_llvm_dir\" >> \"$GITHUB_ENV\"\n"
      working-directory: shipping
    - name: Prepare pinned Wild linker
      env:
        MANIFEST_PATH: toolchains/1.99.0/24.json
      run: "wild_directory=\"$(python3 scripts/prepare-wild.py \\\n  \"$MANIFEST_PATH\" \"$OHM_TARGET\" \"$RUNNER_TEMP/ohm-wild\"\
        )\"\nprintf 'OHM_WILD_LINKER_DIR=%s\\n' \"$wild_directory\" >> \"$GITHUB_ENV\"\n"
      working-directory: shipping
    - name: Train and link the Linux compiler with the published PGO, ThinLTO and BOLT recipe
      id: distribution
      env:
        OHM_TOOLCHAIN: ohm-1.99.0-24
      run: "./scripts/build-optimized-dist.sh \\\n  \"$OHM_TARGET\" \\\n  \"$OHM_TOOLCHAIN\" \\\n  \"$GITHUB_WORKSPACE/source/rust\"\
        \ \\\n  \"$GITHUB_WORKSPACE/shipping/release/bootstrap.toml\"\n"
      working-directory: shipping
    - name: Read the unchanged signed Cargo and Wild
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release download ohm-1.99.0-24 -R astral-experiments/ohm -p ohm-1.99.0-24-x86_64-unknown-linux-gnu.tar.gz
        --dir "$RUNNER_TEMP/release-compiler-price"
    - name: Verify the optimized driver, executed profiles and native compiler
      run: python3 -IB enrollment/scripts/rc24-release-compiler-price/factory.py collect
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: trained-sdk-${{ matrix.role }}-${{ github.run_id }}
        path: ${{ runner.temp }}/release-compiler-price/sdk.tar.zst
        retention-days: 3
        compression-level: 0
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: trained-proof-${{ matrix.role }}-${{ github.run_id }}
        path: ${{ runner.temp }}/release-compiler-price/proof
        retention-days: 7
        if-no-files-found: warn
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      OHM_TARGET: ${{ matrix.target }}
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_COMPILER_ARM: ${{ matrix.role }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: namespace-profile-ubuntu-24-04-16
          target: x86_64-unknown-linux-gnu
          role: candidate
    name: Train the ${{ matrix.role }} compiler with the shipped Linux recipe
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
        description: Exact QA source commit
