name: Qualify three native GNU renderer compiler sources
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed SHA of this QA workflow
        required: true
        type: string
      cargo_input:
        description: Enrolled complete Cargo 301 from its original build or literal source reconstruction
        type: choice
        options: [archive, source]
        default: archive

permissions:
  contents: read
  actions: read

concurrency:
  group: renderer-gnu-source-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-renderer-cgu-source-20261031' && github.event.inputs.reviewed_head == github.sha
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 300
    env:
      QA_ROOT: /tmp/ohm-gnu-renderer-source-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/gnu-renderer-cgu-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
          path: public-seed
          persist-credentials: false
          sparse-checkout: scripts/ohm-apple-zmij/source-transport
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
          path: signed-source
          persist-credentials: false
          sparse-checkout: scripts/strict-mixed-generics
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          path: package-reader
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - if: inputs.cargo_input == 'archive'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 17981f5b807be81496282dd5a58e579e71586962
          path: cargo-reader
          persist-credentials: false
          sparse-checkout: scripts/gnu-example-ceiling
      - if: inputs.cargo_input == 'source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1e3b37ac28ed11a638d3ba2093b54d83ca10ce14
          path: cargo-reader
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate frozen QA, resources, source transports and bootstrap tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C public-seed rev-parse HEAD)" = 85c467e1190d80fa8607fb0f9ef0824b4271266a
          test "$(git -C signed-source rev-parse HEAD)" = d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
          test "$(git -C package-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
          mkdir "$QA_ROOT" "$QA_ROOT/receipts"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build cmake clang lld build-essential perl libssl-dev pkg-config curl zstd time strace
          dpkg-query -W ninja-build cmake clang gcc binutils perl libssl-dev pkg-config curl zstd time strace > "$QA_ROOT/receipts/native-packages.tsv"
          packet=public-seed/scripts/ohm-apple-zmij/source-transport
          (cd "$packet" && sha256sum --check SHA256SUMS)
          python3 -IB "$packet/prepare.py" "$QA_ROOT/rust"
          python3 -IB signed-source/scripts/strict-mixed-generics/source.py materialize "$QA_ROOT/rust" parent
          python3 -IB scripts/gnu-renderer-cgu-source/source.py verify "$QA_ROOT/rust" > "$QA_ROOT/receipts/source.json"
      - name: Acquire verified signed tools and exact source-produced Cargo
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.cargo_input }}
        run: |
          set -euo pipefail
          python3 -IB package-reader/scripts/packaged-release-workspace/packages.py 21 "$QA_ROOT/packages"
          python3 -IB scripts/gnu-renderer-cgu-source/cargo.py "$QA_ROOT" "$INPUT" cargo-reader
      - name: Clean bootstraps, exact checked-in red/green suites and normal native clients
        run: python3 -IB scripts/gnu-renderer-cgu-source/build.py "$QA_ROOT"
      - if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-renderer-qualified-native
          path: /tmp/ohm-gnu-renderer-source-native/transfer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-renderer-source-native-observations
          path: |
            /tmp/ohm-gnu-renderer-source-native/receipts
            /tmp/ohm-gnu-renderer-source-native/packages/receipts
            /tmp/ohm-gnu-renderer-source-native/cargo/cargo-product.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 21
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-renderer-unqualified-partial-transfer
          path: /tmp/ohm-gnu-renderer-source-native/transfer/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
