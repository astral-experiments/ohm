name: Measure project check instructions
run-name: ${{ inputs.project }} history ${{ inputs.mode }} (rustc ${{ inputs.prototype || inputs.kits || 'shipped' }}, window ${{ inputs.window }})
on:
  workflow_dispatch:
    inputs:
      project:
        description: Workload
        default: both
        type: choice
        options: [both, ripgrep, serc]
      mode:
        description: Experiment
        required: true
        type: choice
        options: [train, build-kit, build-cargo, pilot, marginal, confirm, profile, audit, audit-control]
      patch:
        description: Optional gzipped, base64-encoded compiler diff for an ephemeral benchmark
        type: string
        required: false
      kits:
        description: Workflow run with compiler kits, or empty for shipped -3 on both sides
        type: string
      compiler_ref:
        description: Exact public compiler commit to apply before the experimental patch
        required: false
        type: string
      shipped:
        description: Add the actual release as a separate arm
        type: boolean
        default: false
      release4:
        description: Use Ohm 1.100.0-4 for the common Cargo and the release arm
        type: boolean
        default: false
      release_llvm:
        description: Load the verified Ohm -4 LLVM 23.1.5 shared library in every compiler
        type: boolean
        default: false
      window:
        description: Select a history and any commits to check before the replay
        type: choice
        default: recent
        options: [recent, preceding, shared, revisit, from-tip, moves, preceding-tip, detour]
      intermediate:
        description: Optional kit for the first PR of a stack
        required: false
        type: string
      second:
        description: Optional kit for the second PR of a three-patch stack
        required: false
        type: string
      candidate_as_control:
        description: Use the candidate from kits as the control when comparing two candidate builds
        default: false
        type: boolean
        required: false
      prototype:
        description: Workflow run with a replacement candidate compiler SDK, requires kits
        type: string
        required: false
      profdata:
        description: Optional baseline rustc profile training run ID
        type: string
      cargo_parent:
        description: Run supplying Cargo for the intermediate arm
        type: string
      cargo_head:
        description: Run supplying Cargo for second and candidate arms
        type: string
      stage2:
        description: Build stage two with the release driver's relocation policy
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    if: inputs.mode == 'build-kit' || inputs.mode == 'train'
    permissions:
      contents: read
      actions: read
    name: Build matched compiler
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: coordinator
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-experiments/ohm-rust
          ref: ef7389dc8c738056d546e00f6b574df03e783472
          fetch-depth: 0
          persist-credentials: false
          path: rust
      - name: Download the baseline compiler profile
        if: inputs.profdata != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profdata }}
        run: bash coordinator/scripts/project-check-instructions/download.sh "$PROFILE" rustc-profile rustc.profdata "$RUNNER_TEMP/profile/rustc.profdata"
      - name: Build and smoke-test the compiler SDK
        working-directory: rust
        env:
          EXPERIMENT_PATCH: ${{ inputs.patch }}
          OPTIMIZED: 1
          STAGE_TWO: ${{ inputs.stage2 }}
          PROFILED: ${{ inputs.mode == 'train' && 'train' || inputs.profdata }}
          COMPILER_REF: ${{ inputs.compiler_ref }}
        run: bash ../coordinator/scripts/project-check-instructions/build-kit.sh candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.mode == 'train' && 'rustc-profile' || 'sdk-candidate' }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 10
          compression-level: 0

  build-cargo:
    if: inputs.mode == 'build-cargo'
    name: Build Cargo with the supplied changes
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: coordinator
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-experiments/ohm-cargo
          ref: 4193b7226ed980a4947848e979cd72444cc3bc22
          persist-credentials: false
          path: cargo
      - name: Compile the alternative Cargo
        working-directory: cargo
        env:
          EXPERIMENT_PATCH: ${{ inputs.patch }}
        run: bash ../coordinator/scripts/project-check-instructions/build-cargo.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alt-cargo
          path: ${{ runner.temp }}/cargo.tar.zst
          if-no-files-found: error
          retention-days: 10
          compression-level: 0

  measure:
    if: inputs.mode == 'pilot' || inputs.mode == 'marginal' || inputs.mode == 'confirm' || inputs.mode == 'profile' || inputs.mode == 'audit' || inputs.mode == 'audit-control' || inputs.mode == 'annotate'
    name: Measure ${{ matrix.project }} pair ${{ matrix.pair }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.project == 'both' && '["ripgrep","serc"]' || format('["{0}"]', inputs.project)) }}
        pair: ${{ fromJSON(inputs.mode == 'confirm' && '[1,2,3,4,5,6]' || inputs.mode == 'marginal' && '[1,2]' || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.project == 'ripgrep' && 'BurntSushi/ripgrep' || 'astral-experiments/serc' }}
          ref: ${{ matrix.project == 'ripgrep' && '43fc97d43a4c61d65e7d74d4110c8480fe42ea5b' || inputs.window == 'moves' && 'c09203c60af828b1a5981f205b0c574dd5a5973e' || '1b15ce1cba1d5a0045ac7303b8797102f807e57c' }}
          fetch-depth: ${{ inputs.window == 'preceding' && 41 || 21 }}
          persist-credentials: false
          path: workload
      - name: Download compiler kits and verify their digests
        if: inputs.kits != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROL: ${{ inputs.kits }}
          CANDIDATE: ${{ inputs.prototype }}
          INTERMEDIATE: ${{ inputs.intermediate }}
          SECOND: ${{ inputs.second }}
        run: |
          set -euo pipefail
          fetch() {
            bash scripts/project-check-instructions/download.sh "$1" sdk-candidate candidate.tar.zst "$RUNNER_TEMP/kits/$2.tar.zst"
          }
          fetch "$CONTROL" control
          fetch "$CANDIDATE" candidate
          if [[ -n "$INTERMEDIATE" ]]; then fetch "$INTERMEDIATE" pr/candidate; fi
          if [[ -n "$SECOND" ]]; then fetch "$SECOND" pr2/candidate; fi
      - name: Download alternative Cargo binaries
        if: inputs.cargo_head != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARENT: ${{ inputs.cargo_parent }}
          CANDIDATE: ${{ inputs.cargo_head }}
        run: |
          dest=$RUNNER_TEMP/kits
          for variant in PARENT CANDIDATE; do
            [[ -n "${!variant}" ]] || continue
            file="$dest/cargo-$variant.tar.zst"
            bash scripts/project-check-instructions/download.sh "${!variant}" alt-cargo cargo.tar.zst "$file"
          done
      - name: Retrieve the official Linux distribution for Ohm -4
        if: inputs.release4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          base=ohm-1.100.0-4-x86_64-unknown-linux-gnu
          packed="$RUNNER_TEMP/kits/$base.tar.gz"
          mkdir -p "$RUNNER_TEMP/kits"
          if ! curl -fsSL --retry 3 "https://github.com/astral-experiments/ohm/releases/download/ohm-1.100.0-4/$base.tar.gz" -o "$packed"; then
            bash scripts/project-check-instructions/download.sh 44863671852 "$base" "$base.tar.gz" "$packed"
          fi
      - name: Measure the first root check after each edit
        env:
          RELEASE4: ${{ inputs.release4 }}
          RELEASE_LLVM: ${{ inputs.release_llvm }}
          PROJECT: ${{ matrix.project }}
          PROFILE_UV: ${{ (inputs.mode == 'profile' || inputs.mode == 'annotate') && '1' || '' }}
          ANNOTATE_UV: ${{ inputs.mode == 'annotate' && '1' || '' }}
          AUDIT_UV: ${{ inputs.mode == 'audit-control' && 'control' || inputs.mode == 'audit' && '1' || '' }}
          RUSTC_KITS: ${{ inputs.kits }}
          HISTORY_WINDOW: ${{ inputs.window }}
          SHIPPED: ${{ inputs.shipped }}
          INTERMEDIATE_KIT: ${{ inputs.intermediate }}
          SECOND_KIT: ${{ inputs.second }}
        run: bash scripts/project-check-instructions/measure.sh ${{ matrix.pair }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.project }}-pair-${{ matrix.pair }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30
