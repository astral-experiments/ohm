name: Experimental Apple custom-build native receipt control
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Digest-pinned experimental source packet; visible to workflow and repository readers
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: apple-test-only-custom-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa-experimental:
    runs-on: namespace-profile-macos-15
    timeout-minutes: 250
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Freeze and verify subjects, clock design and native execution observer
        run: |
          root="$RUNNER_TEMP/apple-relay-qa"
          python3 -IB scripts/ohm-apple-zmij/test_provider_edges.py -v
          python3 -IB scripts/ohm-apple-zmij/run.py test_protocol -v
          python3 -IB scripts/ohm-apple-zmij/run.py pilot calibrate "$root"
          test -s "$root/receipts/observer.json"
          cp scripts/ohm-apple-zmij/relay-plan.md "$root/receipts/registration.md"
      - name: Authenticate exact signed Apple release and seed the real locked Ruff repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/apple-relay-qa"
          mkdir "$root/assets"
          gh release download ohm-1.99.0-20 --repo "$GITHUB_REPOSITORY" --dir "$root/assets" --pattern 'ohm-1.99.0-20-aarch64-apple-darwin*'
          python3 -IB scripts/ohm-apple-zmij/run.py prepare release "$root" "$root/assets"
          python3 -IB scripts/ohm-apple-zmij/run.py zlib_study seed "$root"
      - name: Bootstrap source-bound 444c and 82911b and run both native compiler tests
        run: |
          root="$RUNNER_TEMP/apple-relay-qa"
          python3 -IB scripts/ohm-apple-zmij/run.py host "$root" 32
          if ! command -v ninja >/dev/null; then brew install ninja; fi
          (cd scripts/ohm-apple-zmij/source-transport && shasum -a 256 -c SHA256SUMS)
          python3 -IB scripts/ohm-apple-zmij/source-transport/prepare.py "$root/enrolled-rust" > "$root/receipts/public-source-transport.json"
          python3 -IB scripts/ohm-apple-zmij/source-transport/crc/prepare.py "$root/enrolled-rust" > "$root/receipts/crc-source-transport.json"
          python3 -IB scripts/ohm-apple-zmij/run.py prepare pair "$root" "$root/enrolled-rust"
      - name: Build unmodified Cargo 735e and bind exactly one Mach-O to both compilers
        run: |
          root="$RUNNER_TEMP/apple-relay-qa"
          python3 -IB scripts/ohm-apple-zmij/receipt_cargo.py build "$root"
          python3 -IB scripts/ohm-apple-zmij/fixed_crc.py pin "$root"
      - name: Reconstruct original unpushed QA commit from the digest-pinned event input and build with signed release Cargo
        id: candidate
        run: python3 -IB scripts/ohm-apple-zmij/relay_source.py build "$RUNNER_TEMP/apple-relay-qa"
      - name: Replay providers, build-script inputs and ordinary Ruff with original Cargo 293
        id: baseline
        run: python3 -IB scripts/ohm-apple-zmij/relay_qa.py baseline "$RUNNER_TEMP/apple-relay-qa"
      - name: Repeat every input with the experimental Cargo and identical native Rust
        if: always() && steps.candidate.outcome == 'success'
        run: python3 -IB scripts/ohm-apple-zmij/relay_qa.py experimental "$RUNNER_TEMP/apple-relay-qa"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: experimental-custom-build-native
          path: ${{ runner.temp }}/apple-relay-qa/receipts
          retention-days: 14
          if-no-files-found: warn
