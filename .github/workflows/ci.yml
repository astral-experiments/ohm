name: Qualify native GNU crate-root field visibility
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed SHA of this QA workflow
        required: true
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: rdr-root-visibility-source-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-rdr-root-field-20261031' && github.event.inputs.reviewed_head == github.sha
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 160
    env:
      QA_ROOT: /tmp/ohm-gnu-renderer-source-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-renderer-cgu-source
            scripts/rdr-root-field
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
          path: public-seed
          persist-credentials: false
          sparse-checkout: scripts/ohm-apple-zmij/source-transport
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
          path: signed-source
          persist-credentials: false
          sparse-checkout: scripts/strict-mixed-generics
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate frozen QA, resources, source transports and bootstrap tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (cd scripts/gnu-renderer-cgu-source && sha256sum --check SHA256SUMS)
          test "$(git -C public-seed rev-parse HEAD)" = 85c467e1190d80fa8607fb0f9ef0824b4271266a
          test "$(git -C signed-source rev-parse HEAD)" = d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
          (cd scripts/rdr-root-field && sha256sum --check SHA256SUMS)
          mkdir "$QA_ROOT" "$QA_ROOT/receipts" "$QA_ROOT/incoming"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build cmake clang lld build-essential perl libssl-dev pkg-config curl zstd time strace
          dpkg-query -W ninja-build cmake clang gcc binutils perl libssl-dev pkg-config curl zstd time strace > "$QA_ROOT/receipts/native-packages.tsv"
          packet=public-seed/scripts/ohm-apple-zmij/source-transport
          (cd "$packet" && sha256sum --check SHA256SUMS)
          python3 -IB "$packet/prepare.py" "$QA_ROOT/rust"
          python3 -IB signed-source/scripts/strict-mixed-generics/source.py materialize "$QA_ROOT/rust" parent
          python3 -IB scripts/rdr-root-field/inputs.py source "$QA_ROOT/rust" > "$QA_ROOT/receipts/reconstructed.json"
      - name: Authenticate original complete parent and CI bootstrap custody
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/rdr-root-field/inputs.py acquire "$QA_ROOT/incoming"
      - name: Source-build candidate and run registered native controls
        run: python3 -IB scripts/rdr-root-field/qualify.py "$QA_ROOT"
      - if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rdr-root-qualified-native
          path: /tmp/ohm-gnu-renderer-source-native/transfer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rdr-root-observations
          path: |
            /tmp/ohm-gnu-renderer-source-native/receipts/
            /tmp/ohm-gnu-renderer-source-native/incoming/original-api.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 21
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rdr-root-unqualified-partial
          path: /tmp/ohm-gnu-renderer-source-native/transfer/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
