name: Trace native generator invalidation on Linux
on:
  workflow_dispatch:
    inputs:
      expected_head: {description: Qualification commit, required: true, type: string}
permissions: {contents: read, actions: read}
concurrency: {group: rc22-generator-cost-trace, cancel-in-progress: false}
jobs:
  trace:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-22-trace-generator'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 45
    steps:
      - name: Verify the submitted source
        env: {EXPECTED: '${{ inputs.expected_head }}'}
        run: test "$GITHUB_SHA" = "$EXPECTED"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {path: protocol, persist-credentials: false, sparse-checkout: scripts/rc22-native}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {repository: astral-sh/ruff, ref: 93526150df078af7dd8fc4226cdcc469539d2001, path: ruff, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - name: Reuse the qualified driver and Cargo executable
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -y install --no-install-recommends zstd b3sum clang
          python3 -IB protocol/scripts/rc22-native/acquire_plain.py protocol/scripts/rc22-native/source/sdk-gnu.json "$RUNNER_TEMP/rc22-inbox" "$RUNNER_TEMP/rc22-source"
          gh api repos/astral-experiments/ohm/actions/artifacts/13050858750/zip > "$RUNNER_TEMP/standalone.zip"
      - name: Trace the unchanged Unicode generator and its consumers
        run: python3 -IB protocol/scripts/rc22-native/trace_generator.py
      - name: Preserve raw commands, output identities and fingerprint diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc22-gnu-generator-control
          path: |
            ${{ runner.temp }}/generator-recheck/reports/
            ${{ runner.temp }}/rc22-source/
          if-no-files-found: warn
          retention-days: 30
