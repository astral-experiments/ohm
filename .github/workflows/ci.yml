name: Replay final native release-smoke artifacts
on:
  workflow_dispatch:
    inputs:
      source:
        description: Native job run containing the two reviewed original ZIPs
        required: true
        type: choice
        options:
          - '41250511954'
      reviewed_head:
        description: Exact 40-character reader commit reviewed for dispatch
        required: true
        type: string
permissions: {}
jobs:
  readback:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-rc22-static-smoke-readback-20261031' && inputs.source == '41250511954' && inputs.reviewed_head == github.sha && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/rc22-complete-smoke
            release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify reviewed reader, native parent, source checksums, and negative controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = cce370a71a4292c14e58bbfc2c62e8b641e712d9
          sha256sum --quiet --check scripts/rc22-complete-smoke/SHA256SUMS
          for tool in zstd ar nm readelf; do command -v "$tool"; done
          python3 -IB scripts/rc22-complete-smoke/test_controls.py
      - name: Authenticate and fetch the two original GitHub ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/rc22-complete-smoke/replay_static.py capture "$RUNNER_TEMP/originals"
      - name: Decode original GNU and Darwin payloads and reject all 15 transcript mutations
        run: python3 -IB scripts/rc22-complete-smoke/replay_static.py review "$RUNNER_TEMP/originals" "$RUNNER_TEMP/rc22-smoke-readback.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc22-smoke-original-readback
          path: ${{ runner.temp }}/rc22-smoke-readback.json
          if-no-files-found: error
          retention-days: 14
