name: "Observe the GNU native search of Ruff's database test"
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  single-target:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-ruff-db-link-search-20261030'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Reopen the original 119-file compiler and Cargo pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/ohm-gnu-syscall/ingress.sh
          export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          export QA_ROOT="$RUNNER_TEMP/qualified-syscall"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/restore_prior.py
          export CENSUS_SDK="$QA_ROOT/candidate-sdk"
          export CENSUS_CANDIDATE_RECORD="$QA_ROOT/receipts/candidate.json"
          python3 -IB scripts/ohm-gnu-atomic-db/sdk.py
          {
            echo "CENSUS_ROOT=$RUNNER_TEMP/observed-ruff-db"
            echo "CENSUS_SDK=$CENSUS_SDK"
            echo "CENSUS_CANDIDATE_RECORD=$CENSUS_CANDIDATE_RECORD"
          } >> "$GITHUB_ENV"
      - name: Trace the actual ordinary, forced and empty test target with external providers
        run: python3 -IB scripts/ohm-gnu-atomic-db-shadow/study.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-ruff-db-external-link-search
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/observed-ruff-db/receipts/
            !${{ runner.temp }}/observed-ruff-db/receipts/visits/**/live-trace/**
            ${{ runner.temp }}/atomic-subjects/*-sdk.json
            ${{ runner.temp }}/atomic-subjects/origin.json
            ${{ runner.temp }}/atomic-subjects/atomic-candidate.json
