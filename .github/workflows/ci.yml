name: Inspect signed Ruff first-A native codegen inputs
run-name: Signed GNU Ruff two-library CGU inputs ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact independently reviewed nonrelease diagnostic commit
        required: true
        type: string
      previous_boots:
        description: Six original job/artifact/digest/boot descriptors in their registered order
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-first-a-cgu-inputs-20261101' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    name: Signed GNU Ruff first-A two-library codegen inputs
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 75
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-cgu-inputs
            scripts/ruff-default-owner-pmu
            scripts/ohm-packed-ruff
            scripts/branch-return-pmu
            scripts/branch-storage-e-confirmation/review
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: collector
          persist-credentials: false
          sparse-checkout: scripts/gnu-example-ceiling
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 42ab30fd5e6bcdcf908df81de9baac65ca64fbf9
          path: contract
          persist-credentials: false
          sparse-checkout: scripts/notebook-fanout-ceiling
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify source, dependencies and orchestration
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          test "$(git -C enrolled rev-parse HEAD)" = "$REVIEWED_HEAD"
          git -C enrolled diff --exit-code "$REVIEWED_HEAD" -- scripts .github/workflows/ci.yml
          test -z "$(git -C enrolled status --porcelain=v1 --untracked-files=all)"
          python3 -IB enrolled/scripts/ruff-cgu-inputs/acquire_cgu.py --sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential git libssl-dev zstd
          dpkg-query -W b3sum binutils build-essential git libssl-dev zstd > "$base/logs/packages.tsv"
          python3 -IB enrolled/scripts/ruff-default-owner-pmu/test_attribution.py "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract"
          python3 -IB enrolled/scripts/ruff-cgu-inputs/worker_cgu.py compile-capture
          python3 -IB enrolled/scripts/ruff-cgu-inputs/test_files.py | tee "$base/logs/cgu-files-fixture.stdout"
          python3 -IB enrolled/scripts/ruff-cgu-inputs/test_capture.py "$base/cgu-capture" | tee "$base/logs/cgu-capture-fixture.stdout"
          python3 -IB enrolled/scripts/ruff-cgu-inputs/test_cgu_orchestration.py
      - name: Authenticate the single worker and install the published 79-file GNU release
        env:
          GH_TOKEN: ${{ github.token }}
          EXCLUDED_BOOT_CUSTODY: ${{ inputs.previous_boots }}
        run: python3 -IB enrolled/scripts/ruff-cgu-inputs/acquire_cgu.py
      - name: Run the ordinary and diagnostic histories on independent targets
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-repair-tables-pilot/guards.py watch "$base/work" "$base/logs" "$base/logs/resource" python3 -IB enrolled/scripts/ruff-cgu-inputs/worker_cgu.py run "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract"
      - name: Reopen the original compiler arguments, native outputs, bitcode and ordinary hardware clock
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-cgu-inputs/worker_cgu.py reopen "$base/logs" "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract" "$REVIEWED_HEAD" > "$base/accepted.json"
          mv "$base/accepted.json" "$base/logs/accepted.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-gnu-ruff-first-a-cgu-inputs
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
