name: Strict Unicode and Ron native attribution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screen:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-strict-unicode-cost-20261031-v1'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: enrolled
          persist-credentials: false
          sparse-checkout: scripts/strict-unicode-cost
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: original-protocol
          ref: 9d1dd09be4d2346142957cc298093d8a75c755c3
          persist-credentials: false
          sparse-checkout: scripts/ron-check-share
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: signed-reader
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: calibration
          ref: 927e20bcad028e5ed4290a58bd330a258ee5da41
          persist-credentials: false
          sparse-checkout: scripts/ohm-gnu-syscall
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Acquire previously source-qualified Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          (cd enrolled/scripts/strict-unicode-cost && sha256sum --check SHA256SUMS)
          python3 -IB enrolled/scripts/strict-unicode-cost/acquire-cargo.py "$RUNNER_TEMP/strict-qualified-cargo"
      - name: Attribute four disjoint native subtrees and compare no-ptrace controls
        env:
          QUALIFICATION_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends ninja-build strace
          python3 -IB enrolled/scripts/strict-unicode-cost/study.py --protocol "$GITHUB_WORKSPACE/original-protocol" --signed-source "$GITHUB_WORKSPACE/signed-reader" --counter "$GITHUB_WORKSPACE/calibration/scripts/ohm-gnu-syscall/calibrate.c" --cargo "$RUNNER_TEMP/strict-qualified-cargo/cargo"
          python3 -IB enrolled/scripts/strict-unicode-cost/verify.py "$RUNNER_TEMP/ordinary-ron-check/packet" > "$RUNNER_TEMP/strict-cost-verdict.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strict-unicode-stage-attribution
          path: |
            ${{ runner.temp }}/ordinary-ron-check/packet
            ${{ runner.temp }}/strict-cost-verdict.json
            ${{ runner.temp }}/strict-qualified-cargo/custody.json
          retention-days: 7
          if-no-files-found: warn
