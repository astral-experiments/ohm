name: Independently reopen the signed Ruff workspace census
run-name: Reopen workspace 41617756983 on ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  open:
    if: github.repository == 'astral-experiments/ohm' && github.sha == inputs.reviewed_head && github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.ref_name == 'charlie/qa-current-workspace-test-29697-reader-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.reviewed_head }}
          path: qa
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-original-ty-instructions
            scripts/ruff-foreign-span-observer
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: bfa2407e98ee1343caeefd02b4b69043509baa8c
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - name: Read original native evidence and signed toolchain receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
        run: |
          python3 -IB qa/scripts/ruff-original-ty-instructions/workspace29697_reopen.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-test-29697-reopened-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workspace-receiver/41617756983/*.json
          if-no-files-found: error
          retention-days: 12
