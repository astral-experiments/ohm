name: Native Ruff compiler metadata and opaque lifetimes
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-musl-ast-opaque-lifetime-check'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install stock native utilities
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools strace zstd
      - name: Reopen the original SDK, native histories and failed screen archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/ohm-musl-ast-opaque/run.py acquire
      - name: Restore independent 39-unit closures and verify the five ordinary visits on both compilers
        run: python3 -IB scripts/ohm-musl-ast-opaque/run.py verify
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: musl-opaque-native-qualification
          path: ${{ runner.temp }}/opaque-results
          if-no-files-found: error
          retention-days: 21
          compression-level: 1
