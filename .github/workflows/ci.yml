name: GNU private native export query qualification
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed packaging QA commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: private-export-rustc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: GNU rustc, std, rustdoc and native private exports
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-rc22-private-export-ice-20261031' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {path: protocol, persist-credentials: false, sparse-checkout: scripts/rc22-private-export-ice}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27, path: transport, persist-credentials: false, sparse-checkout: scripts/rc22-native}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a, path: public-seed, persist-credentials: false, sparse-checkout: scripts/ohm-apple-zmij/source-transport}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1, path: signed-rust, persist-credentials: false, sparse-checkout: scripts/strict-mixed-generics}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
          path: cargo-seed
          persist-credentials: false
          sparse-checkout: |
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 69af8fd3bf8ef6ddb49aa801f25016c6af5171a9
          path: native-reader
          persist-credentials: false
          sparse-checkout: |
            scripts/rc22-complete-smoke
            release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - name: Admit source, receiver and native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C protocol rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C native-reader rev-parse HEAD)" = 69af8fd3bf8ef6ddb49aa801f25016c6af5171a9
          tools="$GITHUB_WORKSPACE/protocol/scripts/rc22-private-export-ice"
          (cd "$tools" && sha256sum -c SHA256SUMS)
          python3 -IB "$tools/test_protocol.py"
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config perl libssl-dev zstd clang lld curl
          mkdir -m 700 "$RUNNER_TEMP/rc22-private-export"
          echo "WORK=$RUNNER_TEMP/rc22-private-export" >> "$GITHUB_ENV"
          echo "QA=$tools" >> "$GITHUB_ENV"
          echo "PARENT=556a8364f1485a03be31b1a50c250d63198a943d" >> "$GITHUB_ENV"
          echo "CANDIDATE=00526133a6352eb88eca70382000e6221253235c" >> "$GITHUB_ENV"
      - name: Verify original release and separately built static Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB "$QA/inputs.py" "$WORK"
      - name: Reproduce both original failed queries and the nested private field case
        run: |
          python3 -IB "$QA/native.py" "$WORK/receipts/parent" "$WORK/work-P" "$WORK/baseline" "$PARENT"
          python3 -IB "$QA/verify.py" "$WORK/receipts/parent" parent "$PARENT"
      - name: Reproduce original Rust dylib layout, section and span failures
        run: |
          python3 -IB "$QA/dylib.py" run "$WORK/receipts/parent-dylib" parent --work "$WORK/work-P-dylib" --sdk "$WORK/baseline" --revision "$PARENT"
          python3 -IB "$QA/dylib.py" read "$WORK/receipts/parent-dylib" parent --sdk "$WORK/baseline"
      - name: Reconstruct exact parent and candidate source
        run: python3 -IB "$QA/subject.py" prepare "$WORK"
      - name: Bootstrap GNU candidate compiler, std and rustdoc
        id: bootstrap
        run: python3 -IB "$QA/subject.py" build "$WORK"
      - name: Ordinary fixed build and test, fresh reference and Rust diagnostics
        run: |
          python3 -IB "$QA/native.py" "$WORK/receipts/candidate" "$WORK/work-C" "$WORK/candidate" "$CANDIDATE"
          python3 -IB "$QA/verify.py" "$WORK/receipts/candidate" candidate "$CANDIDATE"
      - name: Fixed Rust dylib foreign impl metadata and pure-Rust dynamic client
        if: always() && steps.bootstrap.outcome == 'success'
        run: |
          python3 -IB "$QA/dylib.py" run "$WORK/receipts/candidate-dylib" candidate --work "$WORK/work-C-dylib" --sdk "$WORK/candidate" --revision "$CANDIDATE"
          python3 -IB "$QA/dylib.py" read "$WORK/receipts/candidate-dylib" candidate --sdk "$WORK/candidate"
      - name: Replace the SDK for an existing Cargo target and shared build tree
        if: always() && steps.bootstrap.outcome == 'success'
        run: |
          python3 -IB "$QA/native.py" "$WORK/receipts/migration" "$WORK/work-migration" "$WORK/baseline" "$PARENT" --migration-sdk "$WORK/candidate" --migration-revision "$CANDIDATE" --case test --case abi --case nested
          python3 -IB "$QA/verify.py" "$WORK/receipts/migration" migration "$CANDIDATE" --case test --case abi --case nested
      - name: Independently exercise both metadata readers and identical-stamp graph migration
        if: always() && steps.bootstrap.outcome == 'success'
        run: python3 -IB "$QA/formats.py" "$WORK/format-work" "$WORK/receipts/formats" "$WORK/baseline" --candidate "$WORK/candidate" --previous "$WORK/receipts/previous/libsubject.rmeta"
      - name: Execute named new and existing rustc run-make regressions
        if: always() && steps.bootstrap.outcome == 'success'
        run: python3 -IB "$QA/subject.py" tests "$WORK"
      - name: Check both reachable and unreachable local trait incremental regressions
        if: always() && steps.bootstrap.outcome == 'success'
        run: python3 -IB "$QA/subject.py" incremental "$WORK"
      - name: Retain source-built SDK for independent native replay
        if: always() && steps.bootstrap.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-private-export-sdk-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/rc22-private-export/export/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain original streams and native outputs on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-private-export-qualification-gnu
          path: |
            ${{ runner.temp }}/rc22-private-export/receipts/
            ${{ runner.temp }}/rc22-private-export/reports/
          if-no-files-found: warn
          retention-days: 21
