name: Build exact strict Cargo on signed Apple silicon
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-apple-strict-761-provider-20261031'
    timeout-minutes: 65
    runs-on: namespace-profile-macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/apple-strict-761
            scripts/gc-mount-evidence
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          path: signed-reader
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate the actual signed arm64 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
          mkdir -m 700 "$RUNNER_TEMP/native-strict-apple"
          python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/native-strict-apple"
      - name: Build exact merge and verify its native binary
        run: |
          set -eu
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          if ! command -v ninja >/dev/null; then brew install ninja; fi
          python3 -IB protocol/scripts/apple-strict-761/build.py "$RUNNER_TEMP/native-strict-apple"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-sealed-apple-strict-cargo
          path: ${{ runner.temp }}/native-strict-apple/deliver
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-native-apple-strict-build-record
          path: |
            ${{ runner.temp }}/native-strict-apple/build
            ${{ runner.temp }}/native-strict-apple/receipts
          retention-days: 7
          if-no-files-found: warn
