name: Measure Ruff Unicode compiler instructions
run-name: Count the full Ruff Unicode compiler and command ${{ inputs.reviewed_head }}
permissions:
  contents: read
  actions: read
jobs:
  price:
    name: Ruff Unicode ${{ matrix.fixture }} edit ${{ matrix.block }}
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
      && github.ref_name == 'charlie/qa-rc24-static-rand-cost-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
        - block: PC
          fixture: rand
        - block: CP
          fixture: rand
    steps:
    - name: Read this immutable measurement
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: qa
        sparse-checkout: scripts/ruff-static-array-cost
        persist-credentials: false
    - name: Read the genuine Ruff edit and its parent
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: astral-sh/ruff
        ref: bfedc614b7670b8766576b64afd426c292f8c2ce
        fetch-depth: 3
        path: ruff
        persist-credentials: false
    - name: Measure both source-built rustc programs on the same Ruff edit
      env:
        PRICE_BLOCK: ${{ matrix.block }}
        ARRAY_CASE: ${{ matrix.fixture }}
        GH_TOKEN: ${{ github.token }}
      run: python3 -IB qa/scripts/ruff-static-array-cost/price.py
    - name: Preserve the original counters, inventories and refusals
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: unicode-price-${{ matrix.fixture }}-${{ matrix.block }}-${{ github.run_id }}
        path: ${{ runner.temp }}/unicode-price/proof
        retention-days: 7
        compression-level: 6
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
        description: Exact QA source commit
