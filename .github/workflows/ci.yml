name: Native Apple response-file custody calibration
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: xcode-response-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  calibration:
    if: github.ref == 'refs/heads/charlie/qa-apple-xcode-response-fds'
    runs-on: namespace-profile-macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate actual kernel filesystem fixture, inode and parent
        run: python3 -IB scripts/ohm-apple-zmij/response_fs_schema.py "$RUNNER_TEMP/response-custody/schema"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: darwin-response-custody
          path: ${{ runner.temp }}/response-custody
          if-no-files-found: warn
          retention-days: 14
