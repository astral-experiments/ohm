name: Replay Ohm edits
run-name: Time Ruff doctests on −10 against −9 (${{ inputs.label }})
on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        required: true
      cases:
        type: string
        required: true
      pairs:
        type: string
        default: '[1,2]'
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: inputs.label != 'loader' && inputs.label != 'build-actual'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.cases) }}
        pair: ${{ fromJSON(inputs.pairs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch both published SDKs
        run: |
          for n in 9 10; do
            mkdir -p "kits/$n"
            name="ohm-1.100.0-$n"
            curl -fsSL --retry 5 "https://github.com/astral-experiments/ohm/releases/download/$name/$name-x86_64-unknown-linux-gnu.tar.gz" -o "kits/$n/kit.tar.gz"
          done
      - name: Replay both SDKs
        env:
          REPLAY_MODE: ${{ inputs.label }}
          PAIR: ${{ matrix.pair }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          args="$SCENARIO/$PAIR"
          main=replay/replay.py
          python3 -I "$main" "$args"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.scenario }}-${{ matrix.pair }}
          path: counts/
          if-no-files-found: error
          retention-days: 30
