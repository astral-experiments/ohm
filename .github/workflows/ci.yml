name: Signed Rust generic-sharing bridge on Ruff
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  pair:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-strict-unicode-share-bridge-20261031'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        row: ['01', '02']
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: registered
          persist-credentials: false
          sparse-checkout: scripts/strict-share-bridge
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: one
          ref: 3c9c82bb960564dbe3b0df7c0a736662354e502d
          persist-credentials: false
          sparse-checkout: scripts/strict-one-package
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: broad
          ref: 5d26c524606e556b4934842568ed4acd2e91219d
          persist-credentials: false
          sparse-checkout: scripts/strict-host-opt
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: ron
          ref: 9d1dd09be4d2346142957cc298093d8a75c755c3
          persist-credentials: false
          sparse-checkout: scripts/ron-check-share
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: signed
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: counters
          ref: 927e20bcad028e5ed4290a58bd330a258ee5da41
          persist-credentials: false
          sparse-checkout: scripts/ohm-gnu-syscall
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: native
          ref: 8b6d208b982fb3cb4a803a2976934c80bfcc66b5
          persist-credentials: false
          sparse-checkout: scripts/linux-294-parent
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Pin exact source-qualified Linux Cargo and instrumentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends strace ninja-build binutils build-essential
          python3 -IB broad/scripts/strict-host-opt/acquire_cargo.py "$RUNNER_TEMP/strict-qualified-cargo"
      - name: Whole-command inherited counts, clean and provider references
        env:
          QUALIFICATION_TOKEN: ${{ github.token }}
          QA_ROW: ${{ matrix.row }}
        run: python3 -IB registered/scripts/strict-share-bridge/bridge.py
      - name: Compact original packet
        if: always()
        run: |
          set -eu
          if test -d "$RUNNER_TEMP/ordinary-ron-check/packet"; then
            cp "$RUNNER_TEMP/strict-qualified-cargo/custody.json" "$RUNNER_TEMP/ordinary-ron-check/packet/strict-cargo-artifact.json"
            tar -C "$RUNNER_TEMP/ordinary-ron-check/packet" -czf "$RUNNER_TEMP/share-bridge-${{ matrix.row }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: share-bridge-${{ matrix.row }}
          path: ${{ runner.temp }}/share-bridge-${{ matrix.row }}.tar.gz
          retention-days: 7
          if-no-files-found: error
