name: 'Independent signed −22 compiler-instruction replication for uv #22536'
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
        description: Reviewed full SHA of this benchmark
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  eight-real-session-pairs:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-22536-instruction-replica-22' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 210
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
    - name: Check out coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: coordinator
        ref: ${{ github.sha }}
        persist-credentials: 'false'
        sparse-checkout: 'scripts/handwritten-panel

          scripts/uv-callables-21041

          scripts/uv-client-22958

          scripts/uv-check-22536'
        fetch-depth: '6'
    - name: Check out opening
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: opening
        ref: 341cd92e5d381a50bd380467075f31e780ee6296
        persist-credentials: 'false'
        sparse-checkout: 'scripts/uv-root-20991-opening

          '
    - name: Check out previous
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: previous
        ref: 8bf1d2c61fa3bb23ccf44a329e74e0359d98848c
        persist-credentials: 'false'
        sparse-checkout: 'scripts/uv-resolver-whole-pmu

          '
    - name: Check out qualified
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: qualified
        ref: 1286210a06dcc353a4f03dcf8c7bb15f99a56cad
        persist-credentials: 'false'
        sparse-checkout: 'scripts/rc23-trait-qualification

          '
    - name: Check out pilot
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: pilot
        ref: 5c651f1d38c629da2a75d5cac3588db0be8104d7
        persist-credentials: 'false'
        sparse-checkout: 'scripts/ctfe-crossover-pilot

          scripts/branch-return-pmu

          '
    - name: Check out calibrator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: calibrator
        ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
        persist-credentials: 'false'
        sparse-checkout: 'scripts/gnu-renderer-pfc-hardware

          '
    - name: Check out observers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: observers
        ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
        persist-credentials: 'false'
        sparse-checkout: 'scripts/gnu-example-ceiling

          scripts/gnu-renderer-library-workers

          '
    - name: Check out the genuine final review revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: astral-sh/uv
        ref: d9ed4be043e33e1494d17fa555bc0f6d9af9ed06
        fetch-depth: '96'
        fetch-tags: 'false'
        persist-credentials: 'false'
        path: uv-source
    - name: Verify the reviewed historical uv release tag
      shell: bash
      run: 'set -euo pipefail

        git -C uv-source fetch --no-tags --depth=1 https://github.com/astral-sh/uv.git refs/tags/0.13.4:refs/tags/0.13.4

        test "$(git -C uv-source rev-parse ''refs/tags/0.13.4^{}'')" = 7456b60bc6bc348e13e06e3691bf08e78d3aef54

        '
    - name: Verify every local file and host instruction permissions
      shell: bash
      run: 'set -euo pipefail

        (cd coordinator/scripts/uv-check-22536 && sha256sum --strict -c SHA256SUMS)

        /usr/bin/bash opening/scripts/uv-root-20991-opening/host-prerequisites.sh

        '
    - name: Admit all three source-native distributions and the 654 genuine locked crates
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISB coordinator/scripts/uv-check-22536/authority.py acquire

        '
      env: &id001
        GH_TOKEN: ${{ github.token }}
    - name: Calibrate inherited, scoped, blocking and short-child controls
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISB coordinator/scripts/uv-check-22536/science.py calibrate session-config.json

        '
    - name: Publish only the early physical attestation
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: uv-22536-session-boot
        path: session-results/calibration/accepted.json
        if-no-files-found: error
        retention-days: 5
    - name: Use separate real native warm/cold histories, source probes and landed tests
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISB coordinator/scripts/uv-check-22536/science.py open session-config.json

        '
    - name: Check both real compiler epochs and native metadata in both directions
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISB coordinator/scripts/uv-check-22536/science.py epochs session-config.json

        '
    - name: Recheck the current published signed release before the first bare vote
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISB coordinator/scripts/uv-check-22536/authority.py latest

        '
      env: *id001
    - name: Acquire eight new independent pairs and all three genuine edits
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISB coordinator/scripts/uv-check-22536/science.py measure session-config.json

        '
    - name: Recheck the published signed release after the last measurement
      shell: bash
      run: /usr/bin/python3.12 -ISB coordinator/scripts/uv-check-22536/authority.py latest-after
      env: *id001
    - name: Reopen every native visit and physical counter on the fresh host
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISB coordinator/scripts/uv-check-22536/score.py session-results > session-results/independent-replay.json

        /usr/bin/python3.12 -ISB coordinator/scripts/uv-check-22536/native_reader.py session-results > session-results/native-replay.json

        '
    - name: Pack all raw measurements and custody on failure or success
      if: always()
      shell: bash
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISB coordinator/scripts/uv-check-22536/evidence.py

        '
    - name: Preserve the single durable result
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: uv-22536-two-code-edits
        path: session-evidence/
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
