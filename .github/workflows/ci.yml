name: Count genuine Apple workspace links in the published Ohm tools
on: workflow_dispatch
permissions:
  contents: read
  actions: read
concurrency:
  group: packaged-apple-full-workspace-${{ github.sha }}
  cancel-in-progress: false
jobs:
  apple-workspace:
    if: github.ref == 'refs/heads/charlie/qa-release21-full-workspace'
    runs-on: namespace-profile-macos-15
    timeout-minutes: 240
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Calibrate actual Apple linker, held response inode and physical compiler inputs
        run: |
          root="$RUNNER_TEMP/release-workspace"
          python3 -IB scripts/ohm-apple-zmij/run.py test_cgu scripts/ohm-apple-zmij/native-fixtures/developer-root-cgu-prior.zip
          python3 -IB scripts/ohm-apple-zmij/run.py pilot calibrate "$root"
          python3 -IB scripts/ohm-apple-zmij/response_fs_schema.py "$root/receipts/response-calibration/schema"
          python3 -IB scripts/ohm-apple-zmij/test_xcode_response.py -q
          python3 -IB scripts/ohm-apple-zmij/test_held_response.py -q
          python3 -IB scripts/ohm-apple-zmij/test_held_response.py native "$root/response-control"
          cp -R "$root/response-control/receipts" "$root/receipts/response-calibration/native"
      - name: Download, verify and install the two actual published release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -IB scripts/packaged-release-workspace/packages.py 20 "$RUNNER_TEMP/release-workspace"
          python3 -IB scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/release-workspace"
      - name: Execute the original 83-program ordinary Ruff workspace and real deleted-file e2e edit
        run: python3 -IB scripts/packaged-release-workspace/apple.py "$RUNNER_TEMP/release-workspace"
      - name: Reopen entire original Mach-O bodies, provider and CGU evidence and native PIDs
        run: python3 -IB scripts/packaged-release-workspace/apple_reopen.py "$RUNNER_TEMP/release-workspace/receipts" --record
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: packaged-20-21-ruff-83-original-macos
          path: ${{ runner.temp }}/release-workspace/receipts
          retention-days: 14
          if-no-files-found: warn
