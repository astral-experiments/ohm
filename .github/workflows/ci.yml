name: Confirm ordinary Ruff branch returns
run-name: Packed Ruff confirmation ${{ inputs.cohort }} ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Approved exact packaging commit with successful native sources sealed
        type: string
        required: true
      cohort:
        description: Preregistered twelve-boot cohort
        type: choice
        options: [c1, c2]
        required: true
permissions:
  actions: read
  contents: read
jobs:
  ordinary:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-packed-ordinary-confirmation-20261031' && inputs.reviewed_head == github.sha && github.run_attempt == '1' && (inputs.cohort == 'c1' || inputs.cohort == 'c2')
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 355
    name: Packed Ruff confirmation ${{ inputs.cohort }}-${{ matrix.position }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        position: ['01','02','03','04','05','06','07','08','09','10','11','12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-return-pmu
            scripts/packed-ordinary-efficacy
            scripts/ohm-packed-ruff/full-cli
            scripts/ohm-packed-ruff/harness
      - name: Read the binding to the independently completed native source run
        id: binding
        run: |
          set -euo pipefail
          cd enrolled/scripts/branch-return-pmu
          sha256sum --strict --check --status SHA256SUMS
          python3 -IB bind.py >> "$GITHUB_OUTPUT"
      - name: Verify the two original screen archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=repos/astral-experiments/ohm/actions/runs/41217046302
          gh api "$api" | jq -e '.id == 41217046302 and .run_attempt == 1 and .conclusion == "success" and .head_sha == "ae9ed53266a0106f19571e692a05fb65d28f06b2"' >/dev/null
          gh api "$api/artifacts?per_page=100" | jq -e '
            .total_count == 2 and ([.artifacts[] | select(.expired == false) | [.name, .id, .size_in_bytes, .digest]] | sort) == [
              ["packed-ordinary-efficacy-01", 13048239295, 165035713, "sha256:07f1a47fb017c03994dc3e09106761f9760083c239b755995a8c95529c2f3f7d"],
              ["packed-ordinary-efficacy-02", 13048079548, 165037075, "sha256:6acb3a0ac0f430edb5fcdc7144845ca0854aed561fc0e4a8fc0239f03ab40c7d"]
            ]' >/dev/null
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.binding.outputs.source_head }}
          path: source
          persist-credentials: false
          sparse-checkout: scripts/branch-return-source
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
          path: physical
          persist-credentials: false
          sparse-checkout: scripts/gnu-renderer-pfc-hardware
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: observers
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-example-ceiling
            scripts/gnu-renderer-library-workers
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ea7d4e23dba715023cb43c82a9e99bec8c8262a4
          path: provider
          persist-credentials: false
          sparse-checkout: scripts/linux-294-parent
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Prepare a bounded task-owned target and build filesystem
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates coreutils git ninja-build strace util-linux zstd
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          truncate -s 12G "$base/task-owned.ext4"
          /usr/sbin/mkfs.ext4 -q -m 0 -E lazy_itable_init=0,lazy_journal_init=0 "$base/task-owned.ext4"
          if sudo mount -o loop,nosuid,nodev,noatime "$base/task-owned.ext4" "$base/work"; then
            sudo chown "$(id -u):$(id -g)" "$base/work"
            test "$(findmnt -n -o FSTYPE --target "$base/work")" = ext4
            printf '%s\n' private-ext4 > "$base/logs/storage-mode.txt"
          else
            ! mountpoint -q "$base/work"
            printf '%s\n' runner-filesystem > "$base/logs/storage-mode.txt"
          fi
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          (cd enrolled/scripts/ohm-packed-ruff/full-cli && sha256sum --strict --check --status SHA256SUMS)
      - name: Open qualified source SDKs and measure both same-SDK switches
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          POSITION: ${{ matrix.position }}
          COHORT: ${{ inputs.cohort }}
        run: |
          set -euo pipefail
          python3 -IB enrolled/scripts/packed-ordinary-efficacy/ordinary.py "$POSITION" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/physical" "$GITHUB_WORKSPACE/observers" "$GITHUB_WORKSPACE/provider"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-ordinary-confirm-${{ inputs.cohort }}-${{ matrix.position }}
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
