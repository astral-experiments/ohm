name: QA expanded Ohm 1.99.0-23 distribution
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed QA commit
        required: true
        type: string
permissions: {}
concurrency:
  group: qa-expanded-rc23-${{ github.sha }}
  cancel-in-progress: false
env:
  REVIEWED_HEAD: ${{ inputs.reviewed_head }}
defaults:
  run:
    shell: bash
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      rust-revision: ${{ steps.manifest.outputs.rust-revision }}
      cargo-revision: ${{ steps.manifest.outputs.cargo-revision }}
      clippy-revision: ${{ steps.manifest.outputs.clippy-revision }}
      rustfmt-revision: ${{ steps.manifest.outputs.rustfmt-revision }}
      manifest: ${{ steps.manifest.outputs.manifest }}
      toolchain: ${{ steps.manifest.outputs.toolchain }}
    steps:
    - name: Check out release coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ca9989034f0ba97389dc82a4b17ff1684b3c069f
    - name: Check out qa-code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        path: qa-code
        sparse-checkout: |-
          scripts/rc23-expanded-dist
          scripts/rc23-expanded-inputs
        persist-credentials: false
    - name: Install Python for QA readers
      id: qa_python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
        update-environment: false
    - name: Confirm immutable coordinator, signed predecessor and reviewed QA inputs
      run: |
        mkdir -p "$RUNNER_TEMP/ohm-expanded-reports"
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-dist/verify.py checkout --root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/ohm-expanded-reports/context.json"
      env:
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: true
    - name: Read and validate manifest
      id: manifest
      env:
        MANIFEST_PATH: toolchains/1.99.0/23.json
      run: |
        if [[ ! "$MANIFEST_PATH" =~ ^toolchains/[0-9]+\.[0-9]+\.[0-9]+/[1-9][0-9]*\.json$ ]]; then
          echo "invalid versioned manifest path: $MANIFEST_PATH" >&2
          exit 1
        fi
        ./scripts/validate-release-manifest.sh --require-pinned "$MANIFEST_PATH"
        {
          echo "rust-revision=$(jq -er '.sources.rust.revision' "$MANIFEST_PATH")"
          echo "cargo-revision=$(jq -er '.sources.cargo.revision' "$MANIFEST_PATH")"
          echo "clippy-revision=$(jq -er '.sources.clippy.revision' "$MANIFEST_PATH")"
          echo "rustfmt-revision=$(jq -er '.sources.rustfmt.revision' "$MANIFEST_PATH")"
          echo "manifest=$MANIFEST_PATH"
          echo "toolchain=$(jq -er '.release.toolchain_name' "$MANIFEST_PATH")"
        } >> "$GITHUB_OUTPUT"
    - name: Reject mismatched pins, archive substitution and incomplete release assembly
      run: |
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-dist/test_staged.py "$GITHUB_WORKSPACE"
        (cd qa-code/scripts/rc23-expanded-inputs && sha256sum --strict --quiet -c SHA256SUMS)
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-inputs/test_inputs.py
        bash scripts/test-release-packaging.sh
      env:
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-rc23-expanded-distribution-20261101'
      && github.sha == inputs.reviewed_head && github.run_attempt == '1'
  build:
    needs: plan
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: aarch64-apple-darwin
          runner: ${{ vars.OHM_RELEASE_MACOS_RUNNER || 'macos-15' }}
        - target: x86_64-unknown-linux-gnu
          runner: ${{ vars.OHM_RELEASE_LINUX_RUNNER || 'namespace-profile-ubuntu-24-04-16' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    env:
      OHM_TARGET: ${{ matrix.target }}
    steps:
    - name: Check out release coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ca9989034f0ba97389dc82a4b17ff1684b3c069f
    - name: Check out qa-code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        path: qa-code
        sparse-checkout: |-
          scripts/rc23-expanded-dist
          scripts/rc23-expanded-inputs
        persist-credentials: false
    - name: Install Python for QA readers
      id: qa_python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
        update-environment: false
    - name: Confirm immutable coordinator, signed predecessor and reviewed QA inputs
      run: |
        mkdir -p "$RUNNER_TEMP/ohm-expanded-reports"
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-dist/verify.py checkout --root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/ohm-expanded-reports/context.json"
      env:
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
    - name: Make room for macOS profile training
      if: matrix.runner == 'macos-15' && runner.environment == 'github-hosted'
      run: ./scripts/prepare-hosted-macos-release.sh
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: true
    - name: Check out legacy
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46258d8b9b6ae5f7b443fab3115799466a3b5ff4
        path: legacy
        sparse-checkout: |-
          scripts/integrated-dist-qa
          scripts/dep-graph-slots
          toolchains/1.99.0
          scripts/darwin-pgo-diesel
        persist-credentials: false
    - name: Check out legacy/source-carrier
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b
        path: legacy/source-carrier
        sparse-checkout: scripts/rc22-private-export-ice
        persist-credentials: false
    - name: Check out legacy/transport
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27
        path: legacy/transport
        sparse-checkout: scripts/rc22-native
        persist-credentials: false
    - name: Check out legacy/public-seed
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
        path: legacy/public-seed
        sparse-checkout: scripts/ohm-apple-zmij/source-transport
        persist-credentials: false
    - name: Check out legacy/signed-rust
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
        path: legacy/signed-rust
        sparse-checkout: scripts/strict-mixed-generics
        persist-credentials: false
    - name: Check out legacy/cargo-seed
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
        path: legacy/cargo-seed
        sparse-checkout: |-
          scripts/cargo-diagnostic-fix
          scripts/ohm-apple-zmij/cargo293
        persist-credentials: false
    - name: Check out qa-cross
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: e6ff148b647d3033244eb979eb6384963e351db2
        path: qa-cross
        sparse-checkout: scripts/rc23-cross-qualification
        persist-credentials: false
    - name: Materialize and authenticate four exact release checkouts
      env:
        GH_TOKEN: ${{ github.token }}
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
      run: |
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-inputs/materialize.py --workspace "$GITHUB_WORKSPACE" --rust "$GITHUB_WORKSPACE/source/rust" --out "$RUNNER_TEMP/ohm-expanded-reports/source.json"
    - name: Verify source revisions
      env:
        MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
      run: |
        ./scripts/verify-release-sources.sh \
          "$MANIFEST_PATH" \
          source/rust \
          source/rust/src/tools/cargo \
          source/rust/src/tools/clippy \
          source/rust/src/tools/rustfmt
    - name: Install pinned LLVM BOLT tools
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      env:
        MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
      run: |
        if [[ "$(dpkg --print-architecture)" != amd64 ]]; then
          echo 'LLVM BOLT tools require an amd64 Linux runner' >&2
          exit 1
        fi

        case "$(jq -er '.release.upstream_rust_version' "$MANIFEST_PATH")" in
          1.97.* | 1.98.*)
            bolt_major=22
            bolt_version='22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80'
            bolt_sha256='97a9e4e8d2b2219757c38abef93e913793ebc64580aa51207bd23941c44ec070'
            runtime_sha256='48639dafeb45892eec58f5d8a2d0d612ce791a2f713f06c794b71d6a72fa582d'
            ;;
          1.99.*)
            bolt_major=23
            bolt_version='23.1.2'
            bolt_sha256='b5ed9675149cc837c282e9b6962c276c9fa62863d5b2f91537b60848552995b7'
            ;;
          *)
            echo 'Pin matching LLVM BOLT tools for this Rust version' >&2
            exit 1
            ;;
        esac
        bolt_root="$(mktemp -d "${RUNNER_TEMP:?}/ohm-bolt.XXXXXX")"
        if [[ "$bolt_major" == 23 ]]; then
          bolt_archive="$bolt_root/llvm.tar.xz"
          bolt_directory="LLVM-$bolt_version-Linux-X64"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --retry 3 --show-error --silent \
            --output "$bolt_archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$bolt_version/$bolt_directory.tar.xz"
          printf '%s  %s\n' "$bolt_sha256" "$bolt_archive" | sha256sum --check --strict
          # Leave llvm-profdata for the build to link from Rust's matching LLVM.
          tar -xJf "$bolt_archive" -C "$bolt_root" --strip-components=1 --occurrence=1 \
            "$bolt_directory/bin/llvm-bolt" \
            "$bolt_directory/bin/merge-fdata" \
            "$bolt_directory/lib/libbolt_rt_hugify.a" \
            "$bolt_directory/lib/libbolt_rt_instr.a"
          rm "$bolt_archive"
          bolt_llvm_dir="$bolt_root"
        else
          bolt_base_url="https://apt.llvm.org/noble/pool/main/l/llvm-toolchain-$bolt_major"
          for package in "bolt-$bolt_major" "libbolt-$bolt_major-dev"; do
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --fail --location --retry 3 --show-error --silent \
              --output "$bolt_root/$package.deb" \
              "$bolt_base_url/${package}_${bolt_version}_amd64.deb"
          done

          printf '%s  %s\n' \
            "$bolt_sha256" \
            "$bolt_root/bolt-$bolt_major.deb" \
            "$runtime_sha256" \
            "$bolt_root/libbolt-$bolt_major-dev.deb" \
            | sha256sum --check --strict

          dpkg-deb --extract "$bolt_root/bolt-$bolt_major.deb" "$bolt_root"
          dpkg-deb --extract "$bolt_root/libbolt-$bolt_major-dev.deb" "$bolt_root"
          bolt_llvm_dir="$bolt_root/usr/lib/llvm-$bolt_major"
        fi
        "$bolt_llvm_dir/bin/llvm-bolt" --version
        "$bolt_llvm_dir/bin/merge-fdata" --version
        if [[ ! -f "$bolt_llvm_dir/lib/libbolt_rt_instr.a" ]]; then
          echo 'LLVM BOLT instrumentation runtime is missing' >&2
          exit 1
        fi

        printf 'OHM_BOLT_LLVM_DIR=%s\n' "$bolt_llvm_dir" >> "$GITHUB_ENV"
    - name: Install matching LLVM tools for native PGO
      if: matrix.target == 'aarch64-apple-darwin'
      env:
        MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
      run: |
        case "$(jq -er '.release.upstream_rust_version' "$MANIFEST_PATH")" in
          1.97.* | 1.98.*) exit 0 ;;
          1.99.*)
            clang_version=23.1.2
            clang_sha256=d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1
            ;;
          *)
            echo 'Pin matching Clang for this Rust version' >&2
            exit 1
            ;;
        esac

        # Native PGO and ThinLTO require matching LLVM formats.
        clang_root="$(mktemp -d "${RUNNER_TEMP:?}/ohm-clang.XXXXXX")"
        clang_archive="$clang_root/clang.tar.xz"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
          --fail --location --retry 3 --show-error --silent \
          --output "$clang_archive" \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-$clang_version/LLVM-$clang_version-macOS-ARM64.tar.xz"
        printf '%s  %s\n' "$clang_sha256" "$clang_archive" | shasum -a 256 --check
        tar -xf "$clang_archive" -C "$clang_root" --strip-components=1
        rm "$clang_archive"
        "$clang_root/bin/clang" --version
        "$clang_root/bin/clang++" --version
        ln -s clang "$clang_root/bin/cc"
        ln -s llvm-ar "$clang_root/bin/ar"
        ln -s llvm-ranlib "$clang_root/bin/ranlib"
        ln -s llvm-nm "$clang_root/bin/nm"
        printf '%s\n' "$clang_root/bin" >> "$GITHUB_PATH"
        {
          printf 'CC=%s\n' "$clang_root/bin/clang"
          printf 'CXX=%s\n' "$clang_root/bin/clang++"
          printf 'AR=%s\n' "$clang_root/bin/llvm-ar"
          printf 'RANLIB=%s\n' "$clang_root/bin/llvm-ranlib"
          printf 'SDKROOT=%s\n' "$(xcrun --sdk macosx --show-sdk-path)"
        } >> "$GITHUB_ENV"
    - name: Prepare pinned Wild linker
      env:
        MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
      run: |
        wild_directory="$(python3 scripts/prepare-wild.py \
          "$MANIFEST_PATH" "$OHM_TARGET" "$RUNNER_TEMP/ohm-wild")"
        printf 'OHM_WILD_LINKER_DIR=%s\n' "$wild_directory" >> "$GITHUB_ENV"
    - name: Build optimized extended Rust distribution
      id: distribution
      env:
        OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
      run: |
        set -o pipefail
        ./scripts/build-optimized-dist.sh \
          "$OHM_TARGET" \
          "$OHM_TOOLCHAIN" \
          "$GITHUB_WORKSPACE/source/rust" \
          "$GITHUB_WORKSPACE/release/bootstrap.toml" 2>&1 | tee "$RUNNER_TEMP/ohm-expanded-reports/production-build.log"
    - name: Read original PGO evidence and preserve any failed collector workspace
      id: escrow
      if: '!cancelled() && (steps.distribution.outcome == ''success'' || steps.distribution.outcome == ''failure'')'
      env:
        BUILD_OUTCOME: ${{ steps.distribution.outcome }}
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
      run: |
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-inputs/pgo.py --log "$RUNNER_TEMP/ohm-expanded-reports/production-build.log" --rust "$GITHUB_WORKSPACE/source/rust" --host "$OHM_TARGET" --temp "${TMPDIR:-/tmp}" --out "$RUNNER_TEMP/ohm-expanded-reports/pgo" --outcome "$BUILD_OUTCOME"
    - name: Capture macOS compiler crash
      if: failure() && steps.distribution.outcome == 'failure' && runner.os == 'macOS' && steps.escrow.outcome == 'success'
      continue-on-error: true
      timeout-minutes: 3
      run: |
        build_dir="$GITHUB_WORKSPACE/source/rust/build"
        rustc="$build_dir/$OHM_TARGET/stage2/bin/rustc"
        if [[ ! -x "$rustc" ]]; then
          exit 0
        fi

        env -i \
          "HOME=$HOME" \
          "PATH=$PATH" \
          "TMPDIR=$RUNNER_TEMP" \
          "LLVM_PROFILE_FILE=$build_dir/opt-artifacts/rustc-pgo/default_%m_%p.profraw" \
          xcrun lldb --batch \
            --one-line 'run' \
            --one-line-on-crash 'thread backtrace all' \
            --one-line-on-crash 'register read' \
            --one-line-on-crash 'disassemble --pc' \
            --one-line-on-crash 'image list' \
            -- "$rustc" -vV
    - name: Write build provenance
      env:
        CARGO_REVISION: ${{ needs.plan.outputs.cargo-revision }}
        CLIPPY_REVISION: ${{ needs.plan.outputs.clippy-revision }}
        COORDINATOR_REPOSITORY: ${{ github.repository }}
        COORDINATOR_REVISION: ca9989034f0ba97389dc82a4b17ff1684b3c069f
        MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
        OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
        RUST_REVISION: ${{ needs.plan.outputs.rust-revision }}
        RUSTFMT_REVISION: ${{ needs.plan.outputs.rustfmt-revision }}
      run: |
        manifest_sha256="$(shasum -a 256 "$MANIFEST_PATH" | awk '{print $1}')"
        jq -n \
          --arg toolchain "$OHM_TOOLCHAIN" \
          --arg target "$OHM_TARGET" \
          --arg coordinator_repository "$COORDINATOR_REPOSITORY" \
          --arg coordinator_revision "$COORDINATOR_REVISION" \
          --arg manifest_path "$MANIFEST_PATH" \
          --arg manifest_sha256 "$manifest_sha256" \
          --arg rust_revision "$RUST_REVISION" \
          --arg cargo_revision "$CARGO_REVISION" \
          --arg clippy_revision "$CLIPPY_REVISION" \
          --arg rustfmt_revision "$RUSTFMT_REVISION" \
          --argjson bundled_tools "$(jq --arg target "$OHM_TARGET" \
            'if $target == "x86_64-unknown-linux-gnu" then .bundled_tools // {} else {} end' "$MANIFEST_PATH")" \
          '{
            schema_version: 1,
            toolchain: $toolchain,
            target: $target,
            bundled_tools: $bundled_tools,
            coordinator: {
              repository: $coordinator_repository,
              revision: $coordinator_revision
            },
            manifest: {
              path: $manifest_path,
              sha256: $manifest_sha256
            },
            sources: {
              rust: { revision: $rust_revision },
              cargo: { revision: $cargo_revision },
              clippy: { revision: $clippy_revision },
              rustfmt: { revision: $rustfmt_revision }
            }
          }' > source/rust/build/dist/ohm-provenance.json
    - name: Stage versioned distribution assets
      id: assets
      env:
        OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
      run: |
        rust_version="$(tr -d '\r\n' < source/rust/src/version)"
        combined_archive="source/rust/build/dist/rust-$rust_version-dev-$OHM_TARGET.tar.gz"
        if [[ ! -f "$combined_archive" ]]; then
          echo "combined Ohm archive not found: $combined_archive" >&2
          exit 1
        fi

        release_directory="$(mktemp -d "${RUNNER_TEMP:?}/ohm-release.XXXXXX")"
        archive_name="$OHM_TOOLCHAIN-$OHM_TARGET.tar.gz"
        provenance_name="$OHM_TOOLCHAIN-$OHM_TARGET-provenance.json"
        cp "$combined_archive" "$release_directory/$archive_name"
        cp source/rust/build/dist/ohm-provenance.json \
          "$release_directory/$provenance_name"

        (
          cd "$release_directory"
          shasum -a 256 "$archive_name" > "$archive_name.sha256"
          shasum -a 256 "$provenance_name" > "$provenance_name.sha256"
        )

        echo "directory=$release_directory" >> "$GITHUB_OUTPUT"
    - name: Retain distribution artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}
        path: |
          ${{ steps.assets.outputs.directory }}/${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}.tar.gz
          ${{ steps.assets.outputs.directory }}/${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}.tar.gz.sha256
          ${{ steps.assets.outputs.directory }}/${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}-provenance.json
          ${{ steps.assets.outputs.directory }}/${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}-provenance.json.sha256
        if-no-files-found: error
        retention-days: 7
    - name: Keep original build evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: qa-expanded-build-${{ matrix.target }}
        path: ${{ runner.temp }}/ohm-expanded-reports
        compression-level: 1
        if-no-files-found: error
        retention-days: 7
  assemble:
    needs:
    - plan
    - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      MANIFEST_PATH: ${{ needs.plan.outputs.manifest }}
      OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
    steps:
    - name: Check out release coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ca9989034f0ba97389dc82a4b17ff1684b3c069f
    - name: Check out qa-code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        path: qa-code
        sparse-checkout: |-
          scripts/rc23-expanded-dist
          scripts/rc23-expanded-inputs
        persist-credentials: false
    - name: Install Python for QA readers
      id: qa_python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
        update-environment: false
    - name: Confirm immutable coordinator, signed predecessor and reviewed QA inputs
      run: |
        mkdir -p "$RUNNER_TEMP/ohm-expanded-reports"
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-dist/verify.py checkout --root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/ohm-expanded-reports/context.json"
      env:
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
    - name: Download verified distribution assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: ${{ needs.plan.outputs.toolchain }}-*
        path: release
        merge-multiple: true
    - name: Verify and assemble release assets
      run: bash scripts/assemble-release.sh "$MANIFEST_PATH" release "$OHM_TOOLCHAIN"
    - name: Retain global release assets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ needs.plan.outputs.toolchain }}-global
        path: |
          release/ohm-installer.sh
          release/${{ needs.plan.outputs.toolchain }}.json
          release/SHA256SUMS
        if-no-files-found: error
        retention-days: 7
  smoke-test:
    needs:
    - plan
    - assemble
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: aarch64-apple-darwin
          runner: namespace-profile-macos-15
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    env:
      CLIPPY_REVISION: ${{ needs.plan.outputs.clippy-revision }}
      OHM_TARGET: ${{ matrix.target }}
      OHM_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
    steps:
    - name: Check out release coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ca9989034f0ba97389dc82a4b17ff1684b3c069f
    - name: Check out qa-code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        path: qa-code
        sparse-checkout: |-
          scripts/rc23-expanded-dist
          scripts/rc23-expanded-inputs
        persist-credentials: false
    - name: Install Python for QA readers
      id: qa_python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
        update-environment: false
    - name: Confirm immutable coordinator, signed predecessor and reviewed QA inputs
      run: |
        mkdir -p "$RUNNER_TEMP/ohm-expanded-reports"
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-dist/verify.py checkout --root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/ohm-expanded-reports/context.json"
      env:
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
    - name: Download platform distribution assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ needs.plan.outputs.toolchain }}-${{ matrix.target }}
        path: release
    - name: Download universal release installer
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ needs.plan.outputs.toolchain }}-global
        path: release
    - name: Bind installed archive and global installer to the four reviewed revisions
      run: |
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-dist/verify.py staged --root "$GITHUB_WORKSPACE" --directory "$GITHUB_WORKSPACE/release" --target "$OHM_TARGET" | tee "$RUNNER_TEMP/ohm-expanded-reports/staged.json"
      env:
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
    - name: Install rust-analyzer
      run: |
        upstream_version="$(jq -r '.release.upstream_rust_version' "release/$OHM_TOOLCHAIN.json")"
        rustup toolchain install "$upstream_version" --profile minimal --component rust-analyzer
        printf 'RUST_ANALYZER=%s\n' "$(rustup which --toolchain "$upstream_version" rust-analyzer)" >> "$GITHUB_ENV"
    - name: Smoke test Ohm toolchain
      run: |
        bash scripts/smoke-test-release.sh release \
          "$OHM_TOOLCHAIN" "$OHM_TARGET" "$CLIPPY_REVISION"
    - name: Check out legacy
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46258d8b9b6ae5f7b443fab3115799466a3b5ff4
        path: legacy
        sparse-checkout: |-
          scripts/integrated-dist-qa
          scripts/dep-graph-slots
          toolchains/1.99.0
        persist-credentials: false
    - name: Install the original signed predecessor using its published checksums and installer
      env:
        GH_TOKEN: ${{ github.token }}
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
      run: |
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-inputs/native.py --install-published --host "$OHM_TARGET" --work "$RUNNER_TEMP/rc23-previous" --out "$RUNNER_TEMP/ohm-expanded-reports/previous"
    - name: Install the staged distribution using its assembled installer
      id: staged_install
      run: |
        umask 077
        mkdir -p "$RUNNER_TEMP/rc23-candidate/rustup" "$RUNNER_TEMP/rc23-candidate/cargo"
        RUSTUP_HOME="$RUNNER_TEMP/rc23-candidate/rustup" CARGO_HOME="$RUNNER_TEMP/rc23-candidate/cargo" OHM_DOWNLOAD_URL="file://$GITHUB_WORKSPACE/release" OHM_INSTALL_DIR="$RUNNER_TEMP/rc23-candidate/sdk" sh release/ohm-installer.sh
    - name: Check feature-gated Cargo install collisions, no-op reinstalls and stale sibling binaries
      if: '!cancelled() && steps.staged_install.outcome == ''success'''
      run: |
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-dist/install_checks.py --candidate "$RUNNER_TEMP/rc23-candidate/sdk" --published "$RUNNER_TEMP/rc23-previous/sdk" --work "$RUNNER_TEMP/rc23-install-checks" --out "$RUNNER_TEMP/ohm-expanded-reports/install-checks"
      env:
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
    - name: Qualify native edits, errors, worktrees and test readiness with the installed distributions
      if: '!cancelled() && steps.staged_install.outcome == ''success'''
      run: |
        env PATH="$(dirname "$QA_PYTHON"):$PATH" "$QA_PYTHON" -IB qa-code/scripts/rc23-expanded-inputs/native.py --installed "$RUNNER_TEMP/rc23-candidate/sdk" --published "$RUNNER_TEMP/rc23-previous/sdk" --host "$OHM_TARGET" --work "$RUNNER_TEMP/rc23-native" --out "$RUNNER_TEMP/ohm-expanded-reports/native" --archive "$GITHUB_WORKSPACE/release/$OHM_TOOLCHAIN-$OHM_TARGET.tar.gz"
      env:
        QA_PYTHON: ${{ steps.qa_python.outputs.python-path }}
    - name: Keep original smoke evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: qa-expanded-smoke-${{ matrix.target }}
        path: ${{ runner.temp }}/ohm-expanded-reports
        compression-level: 1
        if-no-files-found: error
        retention-days: 7
