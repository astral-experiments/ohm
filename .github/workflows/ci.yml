name: Reopen immutable Ruff library-test confirmation
run-name: Independently verify six original Ruff build archives at ${{ inputs.reviewed_head }}
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease verification source
        required: true
        type: string
permissions: {}
concurrency:
  group: heldout-raw-reader-${{ github.sha }}
  cancel-in-progress: false
jobs:
  receipt:
    name: Independently reopen six immutable Ruff builds
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-heldout-mono-fold-27470-reader-20261102' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    permissions:
      actions: read
      contents: read
    timeout-minutes: 60
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: qa
          sparse-checkout: scripts/ruff-heldout-mono-fold/independent-reader
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 9c53b5de3aae4b1832eb7ee137647dda2466f888
          persist-credentials: false
          path: ruff
          sparse-checkout: crates/ruff_db
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Fetch exactly the original six raw ZIPs and bind each GitHub SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-heldout-mono-fold/independent-reader/hosted.py acquire
      - name: Reopen each original graph and native machine object, execute its programs, then verify raw counters
        run: python3 -IB "$RUNNER_TEMP/heldout-independent-reader/reader/verify.py" "$RUNNER_TEMP/heldout-independent-reader" --ruff-source "$GITHUB_WORKSPACE/ruff"
      - name: Seal compact raw controls, all native bodies and counter receipts
        run: python3 -IB qa/scripts/ruff-heldout-mono-fold/independent-reader/hosted.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-27470-independent-verification
          path: ${{ runner.temp }}/heldout-independent-reader/verification-evidence
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-27470-raw-native-and-cargo-controls
          path: ${{ runner.temp }}/heldout-independent-reader/compact-evidence
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-27470-actual-native-products
          path: ${{ runner.temp }}/heldout-independent-reader/native-evidence
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
