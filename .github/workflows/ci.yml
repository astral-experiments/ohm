name: Unscored Ruff displaced table storage
run-name: Displaced checkout tables at ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact source-reviewed private QA carrier
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  storage:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-branch-displaced-tables-20261031' && inputs.reviewed_head == github.sha && github.run_attempt == '1'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: scripts/displaced-first-switch
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ae9ed53266a0106f19571e692a05fb65d28f06b2
          path: history
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-return-pmu
            scripts/packed-ordinary-efficacy
            scripts/ohm-packed-ruff/full-cli
            scripts/ohm-packed-ruff/harness
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: caef389ed580829583f1a63df129b7b649e43508
          path: source
          persist-credentials: false
          sparse-checkout: scripts/branch-return-source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate inputs and qualify the actual two-root filesystem
        run: |
          set -euo pipefail
          (cd enrolled/scripts/displaced-first-switch && sha256sum --strict --check --status SHA256SUMS)
          (cd history/scripts/branch-return-pmu && sha256sum --strict --check --status SHA256SUMS)
          (cd history/scripts/ohm-packed-ruff/full-cli && sha256sum --strict --check --status SHA256SUMS)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates coreutils git ninja-build util-linux zstd
          base="$RUNNER_TEMP/ohm-branch-object-qa"; test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          test "$(df -B1 --output=avail "$base" | tail -1)" -gt 34359738368
          truncate -s 12G "$base/task-owned.ext4"
          /usr/sbin/mkfs.ext4 -q -m 0 -E lazy_itable_init=0,lazy_journal_init=0 "$base/task-owned.ext4"
          if sudo mount -o loop,nosuid,nodev,noatime "$base/task-owned.ext4" "$base/work"; then
            sudo chown "$(id -u):$(id -g)" "$base/work"
            test "$(findmnt -no FSTYPE -T "$base/work")" = ext4
            printf '%s\n' private-ext4 > "$base/logs/storage-mode.txt"
          else
            ! mountpoint -q "$base/work"
            printf '%s\n' runner-filesystem > "$base/logs/storage-mode.txt"
          fi
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt -T "$base/work" > "$base/logs/filesystem.txt"
          findmnt --json --target "$base/work" --output SOURCE,FSTYPE,TARGET,OPTIONS,MAJ:MIN > "$base/logs/filesystem.json"
      - name: Read the 20 displaced table pairs and qualify their exact current-session codec
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
        run: python3 -IBu enrolled/scripts/displaced-first-switch/acquire.py "$GITHUB_WORKSPACE/history" "$GITHUB_WORKSPACE/source"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: displaced-table-storage-receipts
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          include-hidden-files: true
          compression-level: 1
          retention-days: 30
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: displaced-table-original-streams
          path: ${{ runner.temp }}/ohm-branch-object-qa/table-streams
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn
