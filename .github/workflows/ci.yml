name: Check native instruction counters for the -26 compiler comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the native counter on a fixed loop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pmu-probe
          cat /proc/sys/kernel/random/boot_id > pmu-probe/boot.txt
          cat /proc/sys/kernel/perf_event_paranoid > pmu-probe/paranoid.txt
          id > pmu-probe/identity.txt
          gcc -O2 -Wall -Wextra -Werror scripts/rc26-native-counter.c -o pmu-probe/counter
          cat > pmu-probe/loop.c <<'C'
          #include <stdlib.h>
          int main(int argc, char **argv) {
            unsigned long n = strtoul(argv[1], 0, 10);
            __asm__ volatile("1: sub $1, %0; jne 1b" : "+r"(n) : : "cc");
            return 0;
          }
          C
          gcc -O2 pmu-probe/loop.c -o pmu-probe/loop
          for n in 1000000 2000000; do
            pmu-probe/counter "pmu-probe/$n.json" -- pmu-probe/loop "$n"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          a, b = [json.loads(Path(f'pmu-probe/{n}.json').read_text()) for n in (1000000, 2000000)]
          assert all(r['instructions'] > 0 and r['time_running'] == r['time_enabled'] > 0 for r in (a, b))
          delta = b['instructions'] - a['instructions']
          assert abs(delta - 2000000) < 2000, delta
          print('Native instruction counter passed; loop delta:', delta)
          PY
      - name: Preserve the probe and any failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc26-native-counter-probe
          path: pmu-probe/
          if-no-files-found: error
          retention-days: 14
