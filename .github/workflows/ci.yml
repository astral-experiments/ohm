name: Build the input-validating Cargo used by the RUF009 mixed-toolchain study
run-name: RUF009 negotiated compiler capability ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease QA source
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    if: github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-ruf009-aware-cargo-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.reviewed_head }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-foreign-span-observer
            scripts/ruff-join-proof/fix
            scripts/ruff-ruf009-aware-cargo
      - name: Check out the prior authenticated QA source pack
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0ba92bc43183bd548243fedea51e2762f27c05dc
          persist-credentials: false
          path: accepted-source
          sparse-checkout: scripts/ohm-apple-zmij/cargo293
      - name: Reopen all signed SDK and Cargo sources, then build the single release-profile client
        env:
          OHM_SDK_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -IB qa/scripts/ruff-ruf009-aware-cargo/build.py --prior-source-pack accepted-source/scripts/ohm-apple-zmij/cargo293/source.pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ruf009-aware-cargo-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-foreign-join/published/
          retention-days: 15
          if-no-files-found: error
