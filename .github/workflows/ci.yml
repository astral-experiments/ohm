name: CI
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact qualification commit
        type: string
        required: true
permissions: {contents: read, actions: read}
jobs:
  verify:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-22-verify-declared-native' && github.sha == inputs.expected_head && github.run_attempt == 1
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qualification
          persist-credentials: false
          sparse-checkout: |
            scripts/rc22-declared-native/*
            scripts/rc22-cargo-ty-stack.pack
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
          path: cargo-seed
          persist-credentials: false
          sparse-checkout: |
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1a749d7784498cd5a883d69474813f3ca46f176e
          path: intake
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/rc22-native/source/cargo.pack
            scripts/rc22-native/source/cargo.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '13064288126'
          run-id: '41256793646'
          github-token: ${{ github.token }}
          path: release
          merge-multiple: true
      - name: Verify native inputs and count real Linux links
        run: python3 -IB qualification/scripts/rc22-declared-native/qualify.py
      - name: Retain executable values, linker counts, compiler identities, and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-declared-native-links
          path: ${{ runner.temp }}/rc22-qualify-native-link/reports/
          retention-days: 21
          if-no-files-found: error
