name: Mixed-profile rustc native admission
on: workflow_dispatch
permissions:
  actions: read
  contents: read
concurrency:
  group: signed-mixed-generics-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-signed-mixed-generics-20261031'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        role: [parent, candidate, legacy]
    env:
      ROLE: ${{ matrix.role }}
      QA_ROOT: /tmp/ohm-signed-mixed-generics-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/strict-mixed-generics
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
          path: public-seed
          persist-credentials: false
          sparse-checkout: scripts/ohm-apple-zmij/source-transport
      - name: Install native bootstrap dependencies on a fresh host
        run: |
          set -euo pipefail
          mkdir "$QA_ROOT"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config perl libssl-dev zstd clang lld build-essential curl
          dpkg-query -W cmake clang gcc ninja-build python3 zstd
      - name: Reconstruct exact Git objects and the independent signed-source transplant
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C public-seed rev-parse HEAD)" = 85c467e1190d80fa8607fb0f9ef0824b4271266a
          packet=public-seed/scripts/ohm-apple-zmij/source-transport
          (cd "$packet" && sha256sum --check SHA256SUMS)
          python3 -IB "$packet/prepare.py" "$QA_ROOT/rust"
          python3 -IB scripts/strict-mixed-generics/source.py materialize "$QA_ROOT/rust" "$ROLE"
      - if: matrix.role != 'legacy'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          path: package-reader
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - if: matrix.role != 'legacy'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5d26c524606e556b4934842568ed4acd2e91219d
          path: strict-reader
          persist-credentials: false
          sparse-checkout: scripts/strict-host-opt
      - if: matrix.role != 'legacy'
        name: Verify the published Linux -21 package and strict Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -IB package-reader/scripts/packaged-release-workspace/packages.py 21 "$QA_ROOT/packages"
          python3 -IB strict-reader/scripts/strict-host-opt/acquire_cargo.py "$QA_ROOT/strict-cargo"
      - name: Build the compiler and matching complete host libraries
        run: python3 -IB scripts/strict-mixed-generics/build.py "$ROLE" "$QA_ROOT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.role }}
          path: /tmp/ohm-signed-mixed-generics-native/transfer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bootstrap-observations-${{ matrix.role }}
          path: |
            /tmp/ohm-signed-mixed-generics-native/receipts
            /tmp/ohm-signed-mixed-generics-native/packages/receipts
            /tmp/ohm-signed-mixed-generics-native/strict-cargo/custody.json
          if-no-files-found: warn
          retention-days: 21
  admit:
    needs: build
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 45
    env:
      QA_ROOT: /tmp/ohm-signed-mixed-generics-admission
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/strict-mixed-generics
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: parent
          path: kits/parent
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate
          path: kits/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: legacy
          path: kits/legacy
      - name: Admit profile semantics, direct symbols, Cargo transitions and metadata provenance
        run: |
          set -euo pipefail
          mkdir "$QA_ROOT"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd gcc libc6-dev
          rustup toolchain install 1.99.0 --profile minimal
          stock=$(rustc +1.99.0 --print sysroot)
          python3 -IB scripts/strict-mixed-generics/admit.py kits "$stock"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiler-native-admission
          path: |
            /tmp/ohm-signed-mixed-generics-admission/receipts/
            /tmp/ohm-signed-mixed-generics-admission/incremental-transaction/partial.json
            /tmp/ohm-signed-mixed-generics-admission/incremental-transaction/completed.json
            /tmp/ohm-signed-mixed-generics-admission/incremental-transaction/raw
          if-no-files-found: error
          retention-days: 21
