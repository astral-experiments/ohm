name: Qualify bounded packed Git ref lookup on GNU
run-name: Native GNU packed Git ref source ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed QA commit containing one reviewed source qualification
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  qualify:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-rust-packed-ref-source-20261101' && github.run_attempt == '1' && inputs.reviewed_head == github.sha
    runs-on: namespace-profile-ubuntu-24-04-16
    name: Build and qualify the bounded packed Git ref reader
    timeout-minutes: 165
    env:
      QA_ROOT: /tmp/ohm-gnu-renderer-source-native
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            scripts/gnu-same-revision-donor
            scripts/ruff-repair-tables-pilot
            scripts/branch-return-pmu
            scripts/branch-first-session-e-screen
            scripts/branch-storage-e-confirmation
            scripts/ohm-packed-ruff
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 762fc25095e317ac5632ec835df3c7f9cfc64a64
          path: source
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-checked-packed-source
            scripts/branch-first-session-e-source
            scripts/branch-return-source
            scripts/ohm-packed-ruff
            scripts/ohm-apple-zmij/source-transport
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a4afd181ae07107de6174a17a4ec189061fd18aa
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-renderer-cgu-source
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
          path: signed-source
          persist-credentials: false
          sparse-checkout: |
            scripts/strict-mixed-generics
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 19f9a67b032cce44cea1e3bb7e324558cd9abd0a
          path: observer
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-return-execstop
            scripts/branch-return-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a333316177ef3f9c8b3264ca3bf76c451e0ca079
          path: donor
          persist-credentials: false
          sparse-checkout: |
            scripts/ctfe-crossover-pilot
            scripts/gnu-same-revision-donor
            scripts/branch-return-pmu
            scripts/branch-first-session-e-screen
            scripts/branch-storage-e-confirmation
            scripts/ohm-packed-ruff
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Reopen reviewed source and retained compiler verifier
        run: |
          set -euo pipefail
          mkdir "$QA_ROOT"
          mkdir -p "$QA_ROOT/receipts/host-entry"
          host="$QA_ROOT/receipts/host-entry"
          test "$(git -C enrolled rev-parse HEAD)" = "$REVIEWED_HEAD"
          test "$(git -C donor rev-parse HEAD)" = a333316177ef3f9c8b3264ca3bf76c451e0ca079
          test "$(git -C source rev-parse HEAD)" = 762fc25095e317ac5632ec835df3c7f9cfc64a64
          test "$(git -C trusted rev-parse HEAD)" = a4afd181ae07107de6174a17a4ec189061fd18aa
          test "$(git -C observer rev-parse HEAD)" = 19f9a67b032cce44cea1e3bb7e324558cd9abd0a
          test "$(git -C signed-source rev-parse HEAD)" = d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
          for d in enrolled/scripts/{gnu-same-revision-donor,branch-return-pmu,branch-first-session-e-screen,branch-storage-e-confirmation,ohm-packed-ruff,ohm-packed-ruff/full-cli} source/scripts/{branch-checked-packed-source,branch-first-session-e-source,branch-return-source,ohm-packed-ruff,ohm-apple-zmij/source-transport} trusted/scripts/gnu-renderer-cgu-source; do
            (cd "$d" && sha256sum --strict --check --status SHA256SUMS)
          done
          python3 -IB enrolled/scripts/gnu-same-revision-donor/test_qualification.py "$GITHUB_WORKSPACE/observer" 2>&1 | tee "$host/source-tests.log"
          python3 -IB enrolled/scripts/gnu-same-revision-donor/donor_open.py "$host/fs" 2>"$host/fanotify.stderr" | tee "$host/fanotify.json"
      - name: Restore the authenticated D and E source SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base" && test -s "$QA_ROOT/receipts/host-entry/fanotify.json"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          python3 -IB enrolled/scripts/ruff-repair-tables-pilot/guards.py check "$base/work" "$base/logs" > "$base/logs/entry.json"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates clang cmake curl git lld libssl-dev ninja-build perl pkg-config strace zstd
          dpkg-query -W b3sum binutils build-essential clang cmake git lld libssl-dev ninja-build strace zstd > "$QA_ROOT/receipts/packages.tsv"
          python3 -IB enrolled/scripts/gnu-same-revision-donor/bootstrap_subject.py restore "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/donor"
      - name: Build the candidate and exercise the original and corrected native unit suites
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB source/scripts/ohm-apple-zmij/source-transport/prepare.py "$QA_ROOT/rust" > "$QA_ROOT/receipts/public-source.json"
          python3 -IB signed-source/scripts/strict-mixed-generics/source.py materialize "$QA_ROOT/rust" parent > "$QA_ROOT/receipts/signed-source.json"
          python3 -IB enrolled/scripts/ruff-repair-tables-pilot/guards.py watch "$base/work" "$base/logs" "$QA_ROOT/receipts/build-resource" python3 -IB enrolled/scripts/gnu-same-revision-donor/bootstrap_subject.py build "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/trusted"
      - name: Reopen both physical SDKs and the native regression plus three run-makes
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/gnu-same-revision-donor/reopen.py "$QA_ROOT/receipts" "$base/logs" "$base/physical-sdks" | tee "$QA_ROOT/receipts/source-qualified.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-ref-source-and-driver
          path: /tmp/ohm-gnu-renderer-source-native/receipts
          retention-days: 21
          compression-level: 1
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-ref-sdk-and-resources
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 21
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
