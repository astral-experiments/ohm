name: Read signed Rust foreign-span observations on a Ruff check
run-name: RUF009 native macro observation ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease QA source
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    if: github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-ruf009-join-proof-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.reviewed_head }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-foreign-span-observer
            scripts/ruff-join-proof
      - name: Create read-only Cargo source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OHM_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OHM_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ohm-cargo
          permission-contents: read
      - name: Check out the signed source parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-experiments/ohm-cargo
          ref: 7024b0d2dc5f64bba72c0d6d28f537a5cd9707ed
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: cargo
      - name: Build and validate actual Cargo after dependencies complete
        env:
          OHM_INPUT_RECHECK_QA: '1'
          OHM_SDK_READ_TOKEN: ${{ github.token }}
        run: |
          command -v strace || (sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends strace)
          python3 -IB qa/scripts/ruff-join-proof/causality/probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ruf009-join-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-foreign-join/published/
          retention-days: 15
          if-no-files-found: error
