name: Measure the Ruff Unicode normalization edit on release-trained compilers
run-name: Ruff Unicode normalization ${{ inputs.cohort }} at ${{ inputs.reviewed_head }}
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed QA commit
        type: string
        required: true
      cohort:
        description: Six independently booted release-trained pairs
        type: choice
        required: true
        options: [trained-confirmation]
jobs:
  price:
    if: >-
      github.repository == 'astral-experiments/ohm' && github.run_attempt == '1'
      && github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-rc24-normalization-trained-price-20261104'
    name: Normalization ${{ matrix.slot }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        slot: [B1, B2, B3, B4, B5, B6]
    steps:
      - name: Open the exact measurement and its original SDK receiver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: qa
          sparse-checkout: |
            scripts/ruff-normalization-price
            scripts/ruff-static-array-cost
          persist-credentials: false
      - name: Open the original Ruff edit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/ruff
          ref: c7d0c573cf5b79b7426aba6ad5458e2db283843b
          fetch-depth: 3
          path: ruff
          persist-credentials: false
      - name: Count the ordinary Ruff check, its edited rustc and build controls
        env:
          NORM_COHORT: ${{ inputs.cohort }}
          NORM_SLOT: ${{ matrix.slot }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-normalization-price/worker.py
      - name: Save the complete counters, programs and refusals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trained-norm21229-${{ matrix.slot }}-${{ github.run_id }}
          path: ${{ runner.temp }}/normalization-price/proof
          compression-level: 1
          retention-days: 14
          if-no-files-found: error
