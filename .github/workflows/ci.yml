name: Inspect actual metadata invalidation on real uv workspace check
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Reviewed SHA of this private diagnostic
        required: true
        type: string
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  ordinary-root:
    if: github.event.repository.private == true && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-uv-root-20988-rdr' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 95
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - name: Check out reviewed carrier and unchanged readers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: coordinator
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            scripts/uv-root-20988-rdr
            scripts/handwritten-panel
            scripts/uv-resolver-whole-pmu
            scripts/uv-root-20991-opening
      - name: Check out original observer producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: producer
          ref: d24256c96e42cc34a94a17e7d357947fe7375245
          persist-credentials: false
          sparse-checkout: scripts/rdr-observer-stage1
      - name: Check out landed uv edit with build-script history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/uv
          path: uv-source
          ref: 1979349b68dbaa936b98c0f409c1df0598fa72f1
          fetch-depth: 16
          fetch-tags: false
          persist-credentials: false
      - name: Restore exact uv release tag and verify sealed material
        run: |
          set -euo pipefail
          mkdir trait-results
          git -C uv-source -c credential.helper= fetch --no-tags --depth=1 https://github.com/astral-sh/uv.git refs/tags/0.12.2:refs/tags/0.12.2
          (cd coordinator/scripts/uv-root-20988-rdr && sha256sum --strict --check SHA256SUMS)
          (cd coordinator/scripts/handwritten-panel && sha256sum --strict --check SHA256SUMS)
          /usr/bin/bash coordinator/scripts/uv-root-20991-opening/host-prerequisites.sh 2>&1 | tee trait-results/host-prerequisites.log
      - name: Admit exact successful diagnostic SDK and signed release helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3.12 -ISBu coordinator/scripts/uv-root-20988-rdr/enroll.py
      - name: Capture actual native roots and restricted per-process observations
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -ISBu coordinator/scripts/uv-root-20988-rdr/run.py 2>&1 | tee trait-results/capture.log
      - name: Reopen observed and unwrapped outputs through the independent SCC solver
        if: always() && hashFiles('trait-results/marked-cold-B/graph-proof.json') != ''
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -ISBu coordinator/scripts/uv-root-20988-rdr/replay.py 2>&1 | tee trait-results/replay.log
      - name: Preserve the full unscored diagnostic and any independent refusal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-root-20988-rdr-diagnostic-1
          path: trait-results/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
