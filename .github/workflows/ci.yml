name: Qualify the ordinary x86-64 musl Ruff AST baseline
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-x86-musl-ruff-ast'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the original #285 driver and strict #301 Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/ohm-musl-ast/sdk.py inputs
      - name: Acquire the registered compiler build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/ohm-gnu-syscall/source-rebuild/prepare.sh
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Match all 119 historical files and add authentic rustdoc and musl standard libraries
        run: python3 -IB scripts/ohm-musl-ast/sdk.py build
      - name: Compile, break, repair and independently rebuild the real AST edit
        run: python3 -IB scripts/ohm-musl-ast/ruff_loop.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ordinary-musl-ruff-ast
          path: |
            ${{ runner.temp }}/musl-ast/receipts
            ${{ runner.temp }}/ohm-aarch64-linux-zmij/receipts
          retention-days: 14
          if-no-files-found: error
