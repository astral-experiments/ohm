name: Profile the verified ordinary compiler work on Ruff 25492
run-name: Ruff 25492 compiler profile at ${{ inputs.reviewed_head }}
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact QA commit
        type: string
        required: true
permissions: {}
jobs:
  study:
    name: Isolated restored-environment Rust compiler profile on Ruff 25492
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-line-end-25492-20261102' && github.sha == inputs.reviewed_head && github.run_attempt == '1'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: qa
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-db-link-reason
            scripts/ruff-line-end-25492
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 88d851449d2345e11da991794f3e9bfbbd666719
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - name: Provision the process observer and optional sampling reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends strace linux-tools-generic
          strace -ff -qq -e trace=execve -o "$RUNNER_TEMP/line-end-trace-admit" -- /usr/bin/true
      - name: Install and verify the original #253 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-db-link-reason/install.py 253
      - name: Authenticate the previously verified ordinary reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-line-end-25492/contact.py enroll
      - name: Profile the fixed edit with isolated native output and environment gates
        run: python3 -IB qa/scripts/ruff-line-end-25492/worker.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ruff-line-end-25492-profile
          path: ${{ runner.temp }}/ruff-db-link-reason/records
          if-no-files-found: error
          retention-days: 14
