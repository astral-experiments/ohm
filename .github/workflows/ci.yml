name: Pilot whole-Cargo instructions for the GNU Ruff integration-test build
run-name: Fresh pilot with kernel exec witnesses ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed packaging HEAD for the two-position hardware pilot
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  pilot:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-integration-exec-events-20261031' && inputs.reviewed_head == github.sha && github.run_attempt == '1'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 220
    name: Integration F whole-Cargo kernel pilot ${{ matrix.position }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        position: ['01', '02']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-return-pmu
            scripts/ruff-integration-structure
            scripts/ruff-integration-pmu
            scripts/ohm-packed-ruff/full-cli
            scripts/ohm-packed-ruff/harness
      - name: Read the binding to the independently completed native source run
        id: binding
        run: |
          set -euo pipefail
          cd enrolled/scripts/branch-return-pmu
          sha256sum --strict --check --status SHA256SUMS
          python3 -IB bind.py >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.binding.outputs.source_head }}
          path: source
          persist-credentials: false
          sparse-checkout: scripts/branch-return-source
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
          path: physical
          persist-credentials: false
          sparse-checkout: scripts/gnu-renderer-pfc-hardware
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: observers
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-example-ceiling
            scripts/gnu-renderer-library-workers
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Prepare a bounded task-owned target and build filesystem
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates coreutils git ninja-build strace util-linux zstd
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          truncate -s 18G "$base/task-owned.ext4"
          /usr/sbin/mkfs.ext4 -q -m 0 -E lazy_itable_init=0,lazy_journal_init=0 "$base/task-owned.ext4"
          if sudo mount -o loop,nosuid,nodev,noatime "$base/task-owned.ext4" "$base/work" 2>"$base/logs/private-mount.stderr"; then
            sudo chown "$(id -u):$(id -g)" "$base/work"
            test "$(findmnt -n -o FSTYPE --target "$base/work")" = ext4
            printf '%s\n' private-ext4 > "$base/logs/storage-mode.txt"
          else
            ! mountpoint -q "$base/work"
            test "$(findmnt -n -o FSTYPE --target "$base/work")" = overlay
            printf '%s\n' runner-overlay > "$base/logs/storage-mode.txt"
          fi
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          (cd enrolled/scripts/ohm-packed-ruff/full-cli && sha256sum --strict --check --status SHA256SUMS)
      - name: Run local reader negatives before fetching the native SDK
        run: |
          set -euo pipefail
          cd enrolled/scripts/ruff-integration-structure
          sha256sum --strict --check SHA256SUMS
          python3 -IB test_structure.py
          cd ../ruff-integration-pmu
          sha256sum --check --strict SHA256SUMS
          python3 -IB test_pilot.py
          python3 -IB test_kernel_events.py
      - name: Run both same-compiler settings with whole-Cargo hardware counters
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          POSITION: ${{ matrix.position }}
        run: |
          set -euo pipefail
          python3 -IB enrolled/scripts/ruff-integration-pmu/pilot.py "$POSITION" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/physical" "$GITHUB_WORKSPACE/observers"
      - name: Reopen complete ELF bodies, hardware counters, native executions and test verdicts
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/ohm-branch-object-qa/logs"
          python3 -IB enrolled/scripts/ruff-integration-pmu/verify.py worker "$logs" "$GITHUB_WORKSPACE/physical" "$GITHUB_WORKSPACE/observers" > "$logs/independent-pilot.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-integration-kernel-pilot-${{ matrix.position }}
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
