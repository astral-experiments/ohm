name: Count instructions across Ruff rule edits
on:
  workflow_dispatch:
    inputs:
      fixed:
        type: boolean
        default: false
      pairs:
        type: string
        default: '[1]'
permissions:
  contents: read
  actions: read
jobs:
  measure:
    name: Ruff pair ${{ matrix.pair }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(inputs.pairs) }}
    env:
      PAIR: ${{ matrix.pair }}
      CANDIDATE: ${{ inputs.fixed && '44735982792' || '44666699041' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/ruff
          ref: a3554f468ccfeef2511c4156774bc7d8d8c6c324
          fetch-depth: 4
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 44666699041
          name: linux-release-qualification-44666699041
          path: control
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE }}
          name: linux-release-qualification-${{ env.CANDIDATE }}
          path: fixed
      - run: |
          if [[ "$(cat /proc/sys/kernel/perf_event_paranoid)" -gt 2 ]]; then
            sudo sysctl kernel.perf_event_paranoid=2
          fi
          cc -O2 scripts/llvm-check-instructions/meter.c -o meter
          unset CI GITHUB_ACTIONS
          sudo unshare --mount --propagation private bash scripts/llvm-check-instructions/runner.sh "$USER" "$CANDIDATE" "$PAIR"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pair-${{ matrix.pair }}
          path: receipts
          if-no-files-found: error

