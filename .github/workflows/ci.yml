name: Native incremental node-slot containment and optimized Darwin Diesel
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease QA commit
        required: true
        type: string
permissions: {}
concurrency:
  group: private-rc22-node-slot-containment
  cancel-in-progress: false
jobs:
  native:
    name: Native graph recovery (${{ matrix.host }})
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-rc22-reject-node-slots-20261101' && github.run_attempt
      == 1 && github.sha == inputs.reviewed_head
    strategy:
      fail-fast: false
      matrix:
        include:
        - host: x86_64-unknown-linux-gnu
          worker: namespace-profile-ubuntu-24-04-16
        - host: aarch64-apple-darwin
          worker: macos-15
    runs-on: ${{ matrix.worker }}
    timeout-minutes: 230
    permissions:
      contents: read
      actions: read
    env:
      OHM_TARGET: ${{ matrix.host }}
      OHM_TOOLCHAIN: ohm-1.99.0-22
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Check out release coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 3
    - name: Make room for macOS profile training
      if: runner.os == 'macOS' && runner.environment == 'github-hosted'
      run: ./scripts/prepare-hosted-macos-release.sh
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b
        path: source-carrier
        persist-credentials: false
        sparse-checkout: scripts/rc22-private-export-ice
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27
        path: transport
        persist-credentials: false
        sparse-checkout: scripts/rc22-native
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
        path: public-seed
        persist-credentials: false
        sparse-checkout: scripts/ohm-apple-zmij/source-transport
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
        path: signed-rust
        persist-credentials: false
        sparse-checkout: scripts/strict-mixed-generics
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
        path: cargo-seed
        persist-credentials: false
        sparse-checkout: |-
          scripts/cargo-diagnostic-fix
          scripts/ohm-apple-zmij/cargo293
    - name: Check out the authenticated Linux binary verifier
      if: runner.os == 'Linux'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: f303f8a74c44879280427bef5dc5a0cd7dfbd39c
        path: gnu-media
        persist-credentials: false
        sparse-checkout: scripts/packaged-release-workspace
    - name: Check out the authenticated macOS binary verifier
      if: runner.os == 'macOS'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 87d296ac3b05648c082193fdb91d1145652797ff
        path: apple-media
        persist-credentials: false
        sparse-checkout: |-
          scripts/diesel-stage2-repeat
          scripts/darwin-pgo-diesel
    - name: Require the exact review, inherited production scripts and source envelope
      run: |-
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
        test "$(git rev-parse HEAD^)" = 48f743cbf1ecad76127c512f141be636b0deedff
        test "$(git rev-parse HEAD~2)" = e8c4c99286652f27929290e417ff269e32d0bbd5
        git diff --exit-code HEAD~2 HEAD -- .github/workflows/release.yml release toolchains scripts ':!scripts/dep-graph-slots'
        (cd scripts/integrated-dist-qa && shasum -a 256 --check SHA256SUMS)
        (cd scripts/darwin-pgo-diesel && shasum -a 256 --check SHA256SUMS)
        (cd scripts/dep-graph-slots && shasum -a 256 --check SHA256SUMS && python3 -IB test_slots.py)
        df -h "$GITHUB_WORKSPACE"
        available=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
        test "$available" -ge 41943040
        python3 -IB scripts/integrated-dist-qa/sources.py
        if test "$RUNNER_OS" = macOS; then python3 -IB scripts/darwin-pgo-diesel/worker.py source; fi
        python3 -IB scripts/dep-graph-slots/qualify.py source
      id: source
      shell: bash
    - name: Install native GNU bootstrap prerequisites
      if: runner.os == 'Linux'
      run: |
        sudo apt-get -qq update
        sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config perl libssl-dev zstd clang lld curl
    - name: Authenticate the original optimized GNU parent SDK
      run: |-
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/packaged-linux-50/receipts"
        python3 -IB gnu-media/scripts/packaged-release-workspace/rc22_sdk.py install "$RUNNER_TEMP/packaged-linux-50"
        cp -R "$RUNNER_TEMP/packaged-linux-50/receipts/22" source/reports/old-gnu
      if: runner.os == 'Linux'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
    - name: Authenticate the original instrumented Apple parent SDK
      run: |-
        set -euo pipefail
        root="$RUNNER_TEMP/slot-old-apple"
        python3 -IB apple-media/scripts/diesel-stage2-repeat/intake.py restore "$root" "$root/sdk" "$root/report"
        cp -R "$root/report" source/reports/old-darwin
      if: runner.os == 'macOS'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
    - name: Install matching LLVM tools for native PGO
      env:
        MANIFEST_PATH: toolchains/1.99.0/22.json
      run: |
        case "$(jq -er '.release.upstream_rust_version' "$MANIFEST_PATH")" in
          1.97.* | 1.98.*) exit 0 ;;
          1.99.*)
            clang_version=23.1.2
            clang_sha256=d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1
            ;;
          *)
            echo 'Pin matching Clang for this Rust version' >&2
            exit 1
            ;;
        esac

        # Native PGO and ThinLTO require matching LLVM formats.
        clang_root="$(mktemp -d "${RUNNER_TEMP:?}/ohm-clang.XXXXXX")"
        clang_archive="$clang_root/clang.tar.xz"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
          --fail --location --retry 3 --show-error --silent \
          --output "$clang_archive" \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-$clang_version/LLVM-$clang_version-macOS-ARM64.tar.xz"
        printf '%s  %s\n' "$clang_sha256" "$clang_archive" | shasum -a 256 --check
        tar -xf "$clang_archive" -C "$clang_root" --strip-components=1
        rm "$clang_archive"
        "$clang_root/bin/clang" --version
        "$clang_root/bin/clang++" --version
        ln -s clang "$clang_root/bin/cc"
        ln -s llvm-ar "$clang_root/bin/ar"
        ln -s llvm-ranlib "$clang_root/bin/ranlib"
        ln -s llvm-nm "$clang_root/bin/nm"
        printf '%s\n' "$clang_root/bin" >> "$GITHUB_PATH"
        {
          printf 'CC=%s\n' "$clang_root/bin/clang"
          printf 'CXX=%s\n' "$clang_root/bin/clang++"
          printf 'AR=%s\n' "$clang_root/bin/llvm-ar"
          printf 'RANLIB=%s\n' "$clang_root/bin/llvm-ranlib"
          printf 'SDKROOT=%s\n' "$(xcrun --sdk macosx --show-sdk-path)"
        } >> "$GITHUB_ENV"
      if: runner.os == 'macOS'
    - name: Prepare pinned Wild linker
      env:
        MANIFEST_PATH: toolchains/1.99.0/22.json
      run: |
        wild_directory="$(python3 scripts/prepare-wild.py \
          "$MANIFEST_PATH" "$OHM_TARGET" "$RUNNER_TEMP/ohm-wild")"
        printf 'OHM_WILD_LINKER_DIR=%s\n' "$wild_directory" >> "$GITHUB_ENV"
      if: runner.os == 'macOS'
    - name: Compile and execute the source-bound GNU run-make
      run: python3 -IB scripts/dep-graph-slots/qualify.py rmake
      id: linux_rmake
      if: runner.os == 'Linux'
    - name: Run the original optimized release command through all rustc PGO benchmarks
      id: natural
      continue-on-error: true
      run: python3 -IB scripts/darwin-pgo-diesel/supervise.py
      if: runner.os == 'macOS'
    - name: Escrow original collector workspace and graph bytes before any diagnostic compiler
      id: escrow
      if: '!cancelled() && runner.os == ''macOS'' && steps.natural.outcome != ''skipped'''
      run: python3 -IB scripts/darwin-pgo-diesel/worker.py first
    - name: Save originals before any replay
      id: originals
      if: always() && runner.os == 'macOS'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: slot-darwin-original-before-any-replay
        path: |-
          source/reports/diesel-pgo/original-opt-dist.log
          source/reports/diesel-pgo/entry.json
          source/reports/diesel-pgo/primary.json
          source/reports/diesel-pgo/unaccepted-checkpoint.txt
          source/reports/diesel-pgo/native-training.json
          source/reports/diesel-pgo/original-graphs
          source/reports/diesel-pgo/original-workspace.tar.gz
          source/reports/diesel-pgo/workspace-custody.json
          source/reports/diesel-pgo/original-workspace.tar.inventory.json
          source/reports/diesel-pgo/before-replay.json
        if-no-files-found: warn
        compression-level: 0
        retention-days: 7
    - name: Verify the original scenario roster, instrumented child and fresh Diesel Opt
      run: python3 -IB scripts/dep-graph-slots/qualify.py mac
      id: darwin_collectors
      if: success() && runner.os == 'macOS' && steps.natural.outcome == 'success' && steps.escrow.outcome == 'success' && steps.originals.outcome
        == 'success'
    - name: Qualify the parent faults, candidate recovery and old-producer sessions
      run: python3 -IB scripts/dep-graph-slots/qualify.py native
      id: matrix
      if: success() && (steps.linux_rmake.outcome == 'success' || steps.darwin_collectors.outcome == 'success')
    - name: Execute the same checked-in run-make on the native Apple host
      run: python3 -IB scripts/dep-graph-slots/qualify.py rmake
      id: darwin_rmake
      if: success() && runner.os == 'macOS' && steps.matrix.outcome == 'success'
    - name: Require the complete native outcome on the enrolled platform
      run: |-
        set -euo pipefail
        test "$SOURCE" = success
        test "$MATRIX" = success
        if test "$RUNNER_OS" = macOS; then
          test "$NATURAL" = success && test "$ESCROW" = success && test "$COLLECTORS" = success && test "$APPLE_RMAKE" = success
        else
          test "$GNU_RMAKE" = success
        fi
      if: always()
      shell: bash
      env:
        SOURCE: ${{ steps.source.outcome }}
        MATRIX: ${{ steps.matrix.outcome }}
        NATURAL: ${{ steps.natural.outcome }}
        ESCROW: ${{ steps.escrow.outcome }}
        COLLECTORS: ${{ steps.darwin_collectors.outcome }}
        GNU_RMAKE: ${{ steps.linux_rmake.outcome }}
        APPLE_RMAKE: ${{ steps.darwin_rmake.outcome }}
    - name: Preserve native inputs, diagnostics, executables and source logs on every verdict
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: slot-native-${{ matrix.host }}
        path: |-
          source/reports/
          !source/reports/diesel-pgo/original-workspace.tar.gz
          !source/reports/diesel-pgo/original-graphs
        if-no-files-found: error
        retention-days: 14
        compression-level: 1
