name: Unscored uv 20991 direct root opening
run-name: Verify direct uv root edit at ${{ inputs.reviewed_head }}
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed private coordinator commit for the unscored opening
        type: string
        required: true
permissions: {}
concurrency:
  group: unscored-uv-20991-root-opening
  cancel-in-progress: false
jobs:
  opening:
    name: Verify independent cold histories and the actual ordinary-root compiler execs
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-uv-20991-root-opening' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/uv-root-20991-opening
            .github/workflows
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8bf1d2c61fa3bb23ccf44a329e74e0359d98848c
          path: previous
          persist-credentials: false
          sparse-checkout: scripts/uv-resolver-whole-pmu
      - name: Admit the pinned system Python, disk budget, offline readers and scoped descendant trace
        run: |
          set -euo pipefail
          mkdir -p trait-results
          (
            cd scripts/uv-root-20991-opening
            sha256sum -c SHA256SUMS
          )
          test -x /usr/bin/python3.12 && test -x /usr/bin/strace || { echo 'Opening requires /usr/bin/python3.12 and /usr/bin/strace on this runner' >&2; exit 1; }
          /usr/bin/python3.12 -ISBu scripts/uv-root-20991-opening/opening.py early 2>&1 | tee trait-results/initial.log
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/uv
          ref: 5d4a62d7461c7708f3e65d08cef0e99bad94c004
          path: uv-source
          fetch-depth: 2
          persist-credentials: false
      - name: Admit the signed release and final production distribution with the original verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -ISBu scripts/uv-root-20991-opening/opening.py intake 2>&1 | tee trait-results/acquire.log
      - name: Run the two genuine root openings and re-read all evidence
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -ISBu scripts/uv-root-20991-opening/opening.py run 2>&1 | tee trait-results/opening.log
          /usr/bin/python3.12 -ISB scripts/uv-root-20991-opening/opening.py verify trait-results
      - name: Preserve full or partial unscored evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-20991-independent-root-opening-${{ github.run_id }}-${{ github.run_attempt }}
          path: trait-results/
          retention-days: 14
          compression-level: 2
          if-no-files-found: warn
