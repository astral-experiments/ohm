name: Qualify literal AArch64 syscalls on two real Ruff builds
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Bootstrap source or reopen the registered immutable compiler
        type: choice
        default: qualification
        options: [qualification, bootstrap, pilots, holdout, ty-oracle, guest, reader-controls]
permissions:
  contents: read
  actions: read
concurrency:
  group: gnu-literal-svc-${{ github.sha }}
  cancel-in-progress: false
jobs:
  compiler:
    if: inputs.phase == 'bootstrap' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-ruff-syscall'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the original parent SDK, version-aware Cargo and unchanged Wild
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ohm-gnu-syscall/ingress.sh
      - name: Bootstrap the direct rustc child and verify all 119 installed files
        run: |
          set -euo pipefail
          {
            echo "QA_ROOT=$RUNNER_TEMP/ohm-aarch64-linux-zmij"
            echo "CENSUS_PARENT=$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
            echo "CC_aarch64_unknown_linux_gnu=/usr/bin/aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=/usr/bin/aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=/usr/bin/aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ohm-aarch64-linux-zmij/receipts"
      - run: python3 -IB scripts/ohm-gnu-syscall/bootstrap.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-literal-svc-driver
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/ohm-aarch64-linux-zmij/export
      - name: Check both AArch64 marker edges and execute an actual Linux syscall
        run: python3 -IB scripts/ohm-gnu-syscall/direct.py
      - name: Run both existing host run-make regression suites
        run: python3 -IB scripts/ohm-gnu-syscall/bootstrap.py host-test
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-literal-svc-bootstrap-and-native-tests
          retention-days: 14
          path: ${{ runner.temp }}/ohm-aarch64-linux-zmij/receipts
  ruff:
    needs: compiler
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        study: [census, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the original parent SDK, version-aware Cargo and unchanged Wild
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ohm-gnu-syscall/ingress.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gnu-literal-svc-driver
          path: ${{ runner.temp }}/literal-svc-transfer
      - name: Restore and verify the distinct compiler
        run: |
          set -euo pipefail
          export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          export QA_ROOT="$RUNNER_TEMP/svc-receiver"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/bootstrap.py restore "$RUNNER_TEMP/literal-svc-transfer"
          {
            echo "CENSUS_ROOT=$RUNNER_TEMP/observed-ruff"
            echo "CENSUS_SDK=$QA_ROOT/candidate-sdk"
            echo "CENSUS_CANDIDATE_RECORD=$QA_ROOT/receipts/candidate.json"
          } >> "$GITHUB_ENV"
      - name: Execute the original builds, real edits, unchanged builds, broken edits and independent clean products
        run: python3 -IB scripts/ohm-gnu-ty-input-census/${{ matrix.study }}.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-literal-svc-${{ matrix.study }}-verdicts
          retention-days: 14
          path: |
            ${{ runner.temp }}/observed-ruff/receipts
            ${{ runner.temp }}/svc-receiver/receipts

  qualification:
    if: contains(fromJSON('["qualification","ty-oracle","guest","reader-controls"]'), inputs.phase) && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-ruff-syscall'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.phase == 'ty-oracle' && '["census"]' || inputs.phase == 'guest' && '["guest-P","guest-C"]' || inputs.phase == 'reader-controls' && '["aware","migrate-classic","migrate-signed"]' || '["signed","classic","aware","migrate-classic","migrate-signed","census","cli"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the original parent SDK, version-aware Cargo and unchanged Wild
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ohm-gnu-syscall/ingress.sh
      - name: Restore exactly the original compiler driver from run 41099028701
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          export QA_ROOT="$RUNNER_TEMP/qualified-syscall"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/restore_prior.py
          {
            echo "QA_ROOT=$QA_ROOT"
            echo "CENSUS_PARENT=$CENSUS_PARENT"
            echo "CENSUS_ROOT=$RUNNER_TEMP/observed-ruff"
            echo "CENSUS_SDK=$QA_ROOT/candidate-sdk"
            echo "CENSUS_CANDIDATE_RECORD=$QA_ROOT/receipts/candidate.json"
          } >> "$GITHUB_ENV"
      - name: Authenticate the previous Cargo reader and exercise direct and transitive native providers
        if: (inputs.phase == 'qualification' || inputs.phase == 'reader-controls') && matrix.mode != 'cli' && matrix.mode != 'census'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends b3sum
          test "$(printf '' | b3sum --no-names)" = af1349b9f5f9a1a6a0404dea36dcc9499bcb25c9adc112b7cc9a93cae41f3262
          QA_ROOT="$RUNNER_TEMP/gnu-reviewer-ingress" python3 -IB scripts/ohm-aarch64-fallback/acquire.py
          python3 -IB scripts/ohm-gnu-syscall/providers.py "$MODE"
      - name: Retest the genuine Ruff edit against its independent clean executable
        if: matrix.mode == 'cli' || matrix.mode == 'census'
        env:
          STUDY: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python3 -IB "scripts/ohm-gnu-ty-input-census/$STUDY.py"
          python3 -IB scripts/ohm-gnu-ty-input-census/why.py
      - name: Count the original Cargo and every full or link-only rustc on a settled Ruff CLI build
        if: inputs.phase == 'guest'
        env:
          MODE: ${{ matrix.mode }}
        run: python3 -IB scripts/ohm-gnu-syscall/guest.py "$MODE"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-syscall-native-${{ matrix.mode }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/qualified-syscall/receipts
            ${{ runner.temp }}/observed-ruff/receipts

  pilots:
    if: inputs.phase == 'pilots' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-ruff-syscall'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {position: 1, order: PC}
          - {position: 2, order: CP}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the original parent SDK, version-aware Cargo and unchanged Wild
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ohm-gnu-syscall/ingress.sh
      - name: Restore exactly the original compiler driver from run 41099028701
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          export QA_ROOT="$RUNNER_TEMP/qualified-syscall"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/restore_prior.py
          {
            echo "QA_ROOT=$QA_ROOT"
            echo "CENSUS_PARENT=$CENSUS_PARENT"
            echo "CENSUS_ROOT=$RUNNER_TEMP/observed-ruff"
            echo "CENSUS_SDK=$QA_ROOT/candidate-sdk"
            echo "CENSUS_CANDIDATE_RECORD=$QA_ROOT/receipts/candidate.json"
          } >> "$GITHUB_ENV"
      - name: Count both ordinary Cargo commands and compare to a same-path clean Ruff CLI
        env:
          ROLE_ORDER: ${{ matrix.order }}
        run: python3 -IB scripts/ohm-gnu-syscall/paired.py "$ROLE_ORDER"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-svc-pilots-${{ matrix.position }}
          retention-days: 14
          path: ${{ runner.temp }}/qualified-syscall/receipts

  holdout:
    if: inputs.phase == 'holdout' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-ruff-syscall'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {position: 1, order: PC}
          - {position: 2, order: CP}
          - {position: 3, order: CP}
          - {position: 4, order: CP}
          - {position: 5, order: PC}
          - {position: 6, order: CP}
          - {position: 7, order: CP}
          - {position: 8, order: PC}
          - {position: 9, order: PC}
          - {position: 10, order: PC}
          - {position: 11, order: PC}
          - {position: 12, order: CP}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the original parent SDK, version-aware Cargo and unchanged Wild
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ohm-gnu-syscall/ingress.sh
      - name: Restore exactly the original compiler driver from run 41099028701
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          export QA_ROOT="$RUNNER_TEMP/qualified-syscall"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/restore_prior.py
          {
            echo "QA_ROOT=$QA_ROOT"
            echo "CENSUS_PARENT=$CENSUS_PARENT"
            echo "CENSUS_ROOT=$RUNNER_TEMP/observed-ruff"
            echo "CENSUS_SDK=$QA_ROOT/candidate-sdk"
            echo "CENSUS_CANDIDATE_RECORD=$QA_ROOT/receipts/candidate.json"
          } >> "$GITHUB_ENV"
      - name: Count both ordinary Cargo commands and compare to a same-path clean Ruff CLI
        env:
          ROLE_ORDER: ${{ matrix.order }}
        run: python3 -IB scripts/ohm-gnu-syscall/paired.py "$ROLE_ORDER"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-svc-holdout-${{ matrix.position }}
          retention-days: 14
          path: ${{ runner.temp }}/qualified-syscall/receipts
