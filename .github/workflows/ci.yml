name: Measure -23 trait lookup on two uv edits
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        type: string
        required: true
        description: Exact qualification commit
permissions: {}
jobs:
  measure:
    name: Paired Linux uv timings and cache migration
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-rc23-trait-qualification' && github.sha == inputs.reviewed_head
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.OHM_RELEASE_LINUX_RUNNER || 'namespace-profile-ubuntu-24-04-16' }}
    timeout-minutes: 360
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Check out the public uv history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/uv
          ref: 0bbcf757fdf19d43f52c38a5fc2e32a291c262ee
          path: uv-src
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Download the three previous release builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: 41323062793
          github-token: ${{ github.token }}
          pattern: rc23-trait-sdk-*
          path: sdk-media
      - name: Verify compiler identity and correctness, then time the edits
        shell: bash
        run: python3 -IBu scripts/rc23-trait-qualification/measure.py
      - name: Preserve all raw observations, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc23-trait-measurements-attempt-${{ github.run_attempt }}
          path: trait-results/
          if-no-files-found: warn
          retention-days: 30
