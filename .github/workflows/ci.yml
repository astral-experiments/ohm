name: Reopen six ordinary Ruff compilations
run-name: Verify normal-layout Ruff confirmation at ${{ inputs.reviewed_head }}
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact commit of this nonrelease aggregate reader
        required: true
        type: string

permissions: {}
concurrency:
  group: ohm-confirm-reader-41433784058
  cancel-in-progress: false

jobs:
  aggregate:
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-normal-mono-owner-read-20261102' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the reviewed receiver
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.reviewed_head }}
          path: qa
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ruff-upstream-mono-confirm-reader
      - name: Check out the independent producer readers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: dcf095ed65b3529c231560bee0c5e10fdf76b282
          path: producer
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-upstream-mono-pilot
            scripts/ruff-indexed-check-pmu
      - name: Verify the local reader and required GNU tools
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
        run: |
          set -euo pipefail
          test "$(git -C qa rev-parse HEAD)" = "$REVIEWED_HEAD"
          if ! command -v zstd >/dev/null || ! command -v readelf >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd binutils
          fi
          python3 --version
          command -v gh
          zstd --version
          readelf --version
          python3 -IB qa/scripts/ruff-upstream-mono-confirm-reader/test_receiver.py
      - name: Bind completed source jobs to all six complete native archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reader=qa/scripts/ruff-upstream-mono-confirm-reader
          receipts="$RUNNER_TEMP/confirmed-receipts"
          python3 -IB "$reader/aggregate.py" 41433784058 --producer producer --out "$receipts" --register-only
          python3 -IB "$reader/aggregate.py" 41433784058 --producer producer --out "$receipts" --work "$RUNNER_TEMP/confirm-scratch"
          python3 -IB "$reader/durable.py" "$receipts/paired-clocks.json" --from-results "$receipts"
      - name: Retain independent results and any refusal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ruff-normal-confirm-reader-41433784058
          path: ${{ runner.temp }}/confirmed-receipts
          retention-days: 7
          if-no-files-found: warn
