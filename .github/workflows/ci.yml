name: Qualify the two RC22 Cargo sources on Linux
run-name: Cargo recovery and GC at ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Reviewed immutable QA commit with the completed GNU source artifact enrolled
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  source:
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-rc22-cargo-regressions-20261031' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_head: ${{ steps.official.outputs.source_head }}
      anchor_sha: ${{ steps.official.outputs.anchor_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: false
          sparse-checkout: scripts/rc22-cargo-regressions
      - name: Verify five-suite registration and native negative fixtures
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8b2380c1aa9d1707441e79fc549f156516f1aced HEAD
          mkdir -m 700 "$RUNNER_TEMP/source-proof"
          python3 -IB scripts/rc22-cargo-regressions/test_carrier.py 2>&1 | tee "$RUNNER_TEMP/source-proof/preflight.log"
      - name: Confirm successful original GNU source job and immutable SDK
        id: official
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=scripts/rc22-cargo-regressions
          python3 -IB "$d/media.py" check "$d/anchor.json" "$RUNNER_TEMP/source-proof/catalog.json" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc22-cargo-regression-source
          path: ${{ runner.temp }}/source-proof/
          if-no-files-found: warn
          retention-days: 14
  regressions:
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 260
    name: Cargo regression on the GNU SDK (${{ matrix.suite }})
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {suite: shared, runner: ubuntu-24.04}
          - {suite: late, runner: ubuntu-24.04}
          - {suite: private, runner: ubuntu-24.04}
          - {suite: private-fallback, runner: ubuntu-24.04}
          - {suite: ruff-recovery, runner: namespace-profile-ubuntu-24-04-16}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: protocol
          sparse-checkout: scripts/rc22-cargo-regressions
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.source.outputs.source_head }}
          persist-credentials: false
          path: source
          sparse-checkout: scripts/rc22-native
      - if: matrix.suite != 'ruff-recovery'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f23a67771c625785cd70f58e9b46e8d26af3d317
          path: shared
          persist-credentials: false
          sparse-checkout: scripts/gc-mount-evidence
      - if: matrix.suite != 'ruff-recovery'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 786e5235c3faf04fcfde6beef6c2b91537d37696
          path: private
          persist-credentials: false
          sparse-checkout: scripts/private-gc-overlay
      - name: Receive the source-bound GNU ZIP
        env:
          EXPECTED_ANCHOR: ${{ needs.source.outputs.anchor_sha }}
          EXPECTED_SOURCE: ${{ needs.source.outputs.source_head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=protocol/scripts/rc22-cargo-regressions
          mkdir -m 700 "$RUNNER_TEMP/rc22-proof"
          test "$(git -C protocol rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(sha256sum "$d/anchor.json" | cut -d' ' -f1)" = "$EXPECTED_ANCHOR"
          cp "$d/anchor.json" "$RUNNER_TEMP/rc22-proof/source-anchor.json"
          python3 -IB "$d/media.py" get "$d/anchor.json" "$RUNNER_TEMP/source-sdk.zip"
      - name: Reopen the complete SDK and validate all actual native executables
        run: |
          set -euo pipefail
          d=protocol/scripts/rc22-cargo-regressions
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates e2fsprogs git strace util-linux zstd
          python3 -IB "$d/kit.py" "$RUNNER_TEMP/source-sdk.zip" source "$RUNNER_TEMP/rc22-kit" "$d/anchor.json" 2>&1 | tee "$RUNNER_TEMP/rc22-proof/kit.log"
      - name: Execute the enrolled native Cargo regression
        env:
          SUITE: ${{ matrix.suite }}
        run: bash protocol/scripts/rc22-cargo-regressions/run-worker.sh "$SUITE"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc22-cargo-regression-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/rc22-proof/
            ${{ runner.temp }}/rc22-kit/qualified.json
            ${{ runner.temp }}/rc22-kit/registration.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
