name: Reopen both release-optimized real Ruff edits
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  read:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.sha == inputs.reviewed_head && github.ref_name
      == 'charlie/qa-ruff-trained-derive-reader-20261104'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ inputs.reviewed_head }}
        sparse-checkout: scripts/ruff-derived-impl-cgus
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: e48abf3b09f415b296d0ee2e8ec81c0de7b50611
        sparse-checkout: scripts/ruff-clap-config-help/evidence-release-24
        path: schema
        persist-credentials: false
    - name: Authenticate both original jobs, full native files, counters and typed metadata
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -IB scripts/ruff-derived-impl-cgus/read_release.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: trained-reader-41746716369-${{ github.run_id }}
        path: ${{ runner.temp }}/reopened
        retention-days: 14
        if-no-files-found: error
