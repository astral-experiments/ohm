name: Late bind while Cargo GC is traversing trash
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  late:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-cargo-late-gc-bind-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: protocol
        persist-credentials: false
        sparse-checkout: |
          scripts/gc-mount-evidence
          scripts/cargo-diagnostic-fix
          scripts/ohm-apple-zmij/cargo293
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: signed-reader
        ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
        persist-credentials: false
        sparse-checkout: scripts/packaged-release-workspace
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Install the original signed distribution and verify provenance
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
        mkdir -m700 "$RUNNER_TEMP/gc-mount-qualification"
        python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/gc-mount-qualification"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: disposable-gc-qualified-cargo
        path: ${{ runner.temp }}/candidate-download
        run-id: 41147281908
        github-token: ${{ github.token }}
    - name: Attach a bind mount while the unprivileged Cargo process is paused at its owner file
      run: |
        set -eu
        if ! command -v strace; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends strace; fi
        printf '%s  %s\n' 39ed11556c08de95863961763f9d95e3c61994193dbb756e6667beb3279bffe2 "$RUNNER_TEMP/candidate-download/cargo" | sha256sum --check
        python3 -IB protocol/scripts/gc-mount-evidence/compare.py late "$RUNNER_TEMP/gc-mount-qualification" "$RUNNER_TEMP/candidate-download"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: late-bind-native-commands
        path: |
          ${{ runner.temp }}/gc-mount-qualification/packet
          ${{ runner.temp }}/gc-mount-qualification/receipts/21
        retention-days: 30
        if-no-files-found: error
