name: Verify consumed-input capability and reversible native migrations
run-name: RUF009 GNU corrected input contract ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Full frozen QA source
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruf009-consumed-native-20261103' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 45
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-ruf009-derived-enum
            scripts/ruff-linter-check-attribution
            scripts/ruff-module-16149
            scripts/ruff-heldout-mono-fold/residual
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bd7b58765ae44b21a1c9273b3ff0be8e923adc47
          path: donor
          persist-credentials: false
          sparse-checkout: scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 95b405a443e75f1e08daefb0dbd86d29581a5bde
          path: scope-current
          persist-credentials: false
          sparse-checkout: scripts/ruff-matched-stage
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: cf380559123e1144ac83f03d2fc1c4a2e89a9286
          path: scope-early
          persist-credentials: false
          sparse-checkout: scripts/ruff-matched-stage
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 08ca9605d18606a16a1b178f1c5d11efb3c8c65d
          path: alias
          persist-credentials: false
          sparse-checkout: scripts/ruff-join-proof/evidence/reader
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Enroll independent native tools
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq b3sum strace zstd
          command -v b3sum strace zstd
      - name: Verify frozen factory inputs and every physical client condition
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-ruf009-derived-enum/compatibility/matrix/receive.py
      - name: Escrow complete raw outcomes including partial failures
        if: always()
        run: python3 -IB qa/scripts/ruff-ruf009-derived-enum/compatibility/matrix/escrow.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ruf009-v5-native-${{ github.run_id }}
          path: ${{ runner.temp }}/ruf009-v5-native/artifact
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
