name: Discover ordinary uv 22635 rustc and workspace instruction changes
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
        description: Reviewed full SHA of this private discovery panel
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: uv-22635-corrected-production-discovery
  cancel-in-progress: false
jobs:
  screen:
    if: github.repository == 'astral-experiments/ohm' && github.event.repository.private == true && github.ref == 'refs/heads/charlie/codex-uv-22635-production-discovery' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 200
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      BUILD_HEAD: 'cddb036d81e4313a8e422171f39f0840b44110db'
      BUILD_RUN_ID: '41374825846'
      SDK_LOCK_SHA256: 'b7b8705a2200ac514d219383339009d92ed3fe4046846b60010c60359d06f019'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out reviewed discovery and original signed 22635 workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: coordinator
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/uv-22635-opening
            scripts/uv-22635-discovery
          persist-credentials: false
      - name: Check out effective qualified production SDK reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: production
          ref: a08fbd2dc6330acc9a908657671a45611ab91478
          sparse-checkout: scripts/uv-20988-ctfe-hw
          persist-credentials: false
      - name: Check out builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: builder
          ref: cddb036d81e4313a8e422171f39f0840b44110db
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ctfe22-gnu
      - name: Check out opening
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: opening
          ref: 341cd92e5d381a50bd380467075f31e780ee6296
          persist-credentials: false
          sparse-checkout: |
            scripts/uv-root-20991-opening
      - name: Check out previous
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: previous
          ref: 8bf1d2c61fa3bb23ccf44a329e74e0359d98848c
          persist-credentials: false
          sparse-checkout: |
            scripts/uv-resolver-whole-pmu
      - name: Check out qualified
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qualified
          ref: 1286210a06dcc353a4f03dcf8c7bb15f99a56cad
          persist-credentials: false
          sparse-checkout: |
            scripts/rc23-trait-qualification
      - name: Check out pilot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: pilot
          ref: 5c651f1d38c629da2a75d5cac3588db0be8104d7
          persist-credentials: false
          sparse-checkout: |
            scripts/ctfe-crossover-pilot
            scripts/branch-return-pmu
      - name: Check out calibrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: calibrator
          ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-renderer-pfc-hardware
      - name: Check out observers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: observers
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-example-ceiling
            scripts/gnu-renderer-library-workers
      - name: Check out real landed uv edit and original git description
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: uv-source
          repository: astral-sh/uv
          ref: 05e1cc1dc13dc58713c5d049af855a9d2d618b51
          fetch-depth: 58
          fetch-tags: false
          persist-credentials: false
      - name: Verify exact historical tag and provision original host prerequisites
        run: |
          set -euo pipefail
          mkdir trait-results
          git -C uv-source -c credential.helper= fetch --no-tags --depth=1 https://github.com/astral-sh/uv.git refs/tags/0.13.1:refs/tags/0.13.1
          (cd coordinator/scripts/uv-22635-discovery && sha256sum --strict --check SHA256SUMS)
          /usr/bin/bash opening/scripts/uv-root-20991-opening/host-prerequisites.sh 2>&1 | tee trait-results/host-prerequisites.log
      - name: Calibrate inherited whole-command and actual selected-process PMU
        run: |
          set -euo pipefail
          p=coordinator/scripts/uv-22635-discovery
          /usr/bin/python3.12 -ISBu "$p/bridge.py" calibrate 2>&1 | tee trait-results/whole-calibration.log
          cc -O2 -Wall -Wextra -Werror -fPIC -shared "$p/pmu.c" -o "$RUNNER_TEMP/libohm_pmu.so"
          cc -O2 -Wall -Wextra -Werror -pthread "$p/workload.c" -o "$RUNNER_TEMP/target-counter-workload"
          mkdir trait-results/target-calibration
          /usr/bin/python3.12 -ISBu "$p/per_rustc.py" calibrate "$PWD/trait-results/target-calibration" "$RUNNER_TEMP/libohm_pmu.so" "$RUNNER_TEMP/target-counter-workload"
      - name: Verify corrected production sources, full GNU SDKs and the signed Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3.12 -ISBu coordinator/scripts/uv-22635-discovery/bridge.py admit
      - name: Verify two independent A to B histories per compiler and retain all original outputs
        run: /usr/bin/python3.12 -ISBu coordinator/scripts/uv-22635-discovery/study.py
      - name: Independently replay the two discovery pairs
        run: /usr/bin/python3.12 -ISBu coordinator/scripts/uv-22635-discovery/audit.py
      - name: Preserve original samples, diagnostics and incomplete gates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-22635-corrected-discovery-attempt-1
          path: trait-results/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
