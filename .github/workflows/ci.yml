name: Original RUF009 compile trace
run-name: Original RUF009 compile trace ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Frozen diagnostic QA commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  original:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruf009-historical-check-20261103' && github.sha == inputs.reviewed_head && github.run_attempt == '1'
    name: historical-${{ matrix.role }}
    strategy:
      fail-fast: false
      matrix:
        role: [p, c]
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 60
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      HISTORICAL_ARM: ${{ matrix.role }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: qa
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-original-ruf009
            scripts/ruff-ruf009-derived-enum
            scripts/ruff-module-16149
            scripts/ruff-linter-check-attribution
            scripts/ruff-heldout-mono-fold/residual
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bd7b58765ae44b21a1c9273b3ff0be8e923adc47
          path: donor
          persist-credentials: false
          sparse-checkout: scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 34e78f19c0d0c58c86e42d83e05a4dc6db6b0f6d
          path: scope-ruf009
          persist-credentials: false
          sparse-checkout: scripts/ruff-matched-stage
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: b00f68a23cedbd3a38fc25bac63638f0f11fc3f0
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the kernel observer
        run: sudo apt-get -qq update && sudo apt-get install -y --no-install-recommends strace zstd
      - name: Reopen signed Cargo and the matched source compilers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-original-ruf009/acquire.py
      - name: Observe the original three-file source edit, invalid source and repair
        run: python3 -IB qa/scripts/ruff-original-ruf009/study.py "$HISTORICAL_ARM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-ruf009-${{ matrix.role }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-original-ruf009/receipt
          if-no-files-found: warn
          compression-level: 3
          retention-days: 7
