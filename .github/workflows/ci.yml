name: Profile the signed compiler on the historical Ruff linter check
run-name: Ruff 28444 frontend source attribution ${{ inputs.reviewed_head }}

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Registered experiment to execute
        type: choice
        options: [baseline, macro-host-o1, visibility-scope]
        default: baseline
      reviewed_head:
        description: Exact independently reviewed nonrelease QA commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  profile:
    name: Profile the Ruff linter check
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-ruff-linter-check-28444-source-pcs-20261102' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-linter-check-attribution
            scripts/ruff-heldout-mono-fold/residual
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bd7b58765ae44b21a1c9273b3ff0be8e923adc47
          path: donor
          persist-credentials: false
          sparse-checkout: scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 04ae7c402b2a7f1c49a9a1dd264629c00e38f61b
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate the signed SDK and enrolled worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-linter-check-attribution/worker.py acquire
      - name: Fetch the exact registry closure without compiling
        if: inputs.experiment != 'visibility-scope'
        run: python3 -IB qa/scripts/ruff-linter-check-attribution/worker.py prefetch
      - name: Compare the ordinary and sampled edit with the independent clean result
        if: inputs.experiment == 'baseline'
        run: python3 -IB qa/scripts/ruff-linter-check-attribution/worker.py study
      - name: Compare the fixed ordinary check with one recompiled native macro
        if: inputs.experiment == 'macro-host-o1'
        run: python3 -IB qa/scripts/ruff-linter-check-attribution/macro_host.py
      - name: Check the actual downstream closure and run Ruff's native diagnostic
        if: inputs.experiment == 'visibility-scope'
        run: |
          python3 -IB qa/scripts/ruff-linter-check-attribution/scope_inventory.py prefetch
          python3 -IB qa/scripts/ruff-linter-check-attribution/scope_inventory.py study
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ruff-linter-check-attribution-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-ruff28444/receipt
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
