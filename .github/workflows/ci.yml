name: Diagnose Linux task exits on two cold Ruff builds
run-name: Unscored cold Ruff exit diagnostic ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Approved exact diagnostic packaging commit
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-branch-return-exit-events-20261031' && inputs.reviewed_head == github.sha && github.run_attempt == '1'
    name: Cold Ruff exit diagnostic (${{ matrix.arm }})
    strategy:
      fail-fast: false
      matrix:
        arm: [Foff, Kon]
    env:
      COLD_ARM: ${{ matrix.arm }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-return-execstop
            scripts/branch-return-pmu
            scripts/ohm-packed-ruff/full-cli
            scripts/ohm-packed-ruff/harness
      - name: Verify original pilot and diagnostic sources
        id: binding
        run: |
          set -euo pipefail
          cd enrolled/scripts
          (cd branch-return-execstop && sha256sum --strict --check --status SHA256SUMS)
          (cd ohm-packed-ruff/full-cli && sha256sum --strict --check --status SHA256SUMS)
          cd branch-return-pmu
          sha256sum --strict --check --status SHA256SUMS
          python3 -IB bind.py >> "$GITHUB_OUTPUT"
          python3 -IB ../branch-return-execstop/qualify.py --preflight
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.binding.outputs.source_head }}
          path: source
          persist-credentials: false
          sparse-checkout: scripts/branch-return-source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Establish fresh task-owned filesystem and native fixture controls
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates coreutils git libssl-dev ninja-build util-linux zstd
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          truncate -s 12G "$base/task-owned.ext4"
          /usr/sbin/mkfs.ext4 -q -m 0 -E lazy_itable_init=0,lazy_journal_init=0 "$base/task-owned.ext4"
          if sudo mount -o loop,nosuid,nodev,noatime "$base/task-owned.ext4" "$base/work"; then
            sudo chown "$(id -u):$(id -g)" "$base/work"
            test "$(findmnt -n -o FSTYPE --target "$base/work")" = ext4
            printf '%s\n' private-ext4 > "$base/logs/storage-mode.txt"
          else
            ! mountpoint -q "$base/work"
            printf '%s\n' runner-filesystem > "$base/logs/storage-mode.txt"
          fi
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          python3 -IB enrolled/scripts/branch-return-execstop/fixtures.py "$base/tools" "$base/logs/fixtures"
      - name: Compare true-empty ordinary and kernel-observed Ruff binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/branch-return-execstop/qualify.py "$GITHUB_WORKSPACE/source" "$base/tools/observe" "$base/logs/fixtures/qualified.json" "$COLD_ARM"
      - name: Independently reopen a successful or refused observation
        if: always()
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/ohm-branch-object-qa/logs"
          if test -f "$logs/complete.json"; then
            python3 -IB enrolled/scripts/branch-return-execstop/reopen.py "$logs" "$COLD_ARM" > "$logs/offline-reopened.json"
          elif test -f "$logs/observed/cold-A/kernel.tsv.exits.gz"; then
            python3 -IB enrolled/scripts/branch-return-execstop/reopen.py "$logs" "$COLD_ARM" --refusal > "$logs/offline-refusal.json"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cold-Ruff-${{ matrix.arm }}-exit-diagnostic
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
