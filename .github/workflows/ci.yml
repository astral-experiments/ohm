name: Qualify the real Ruff getter edit against native field-visibility Rust
run-name: GNU Ruff getter scope screen ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Full reviewed packaging SHA of this P/C screen
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  ordinary:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-rdr-notebook-getter-20261031' && github.run_attempt == '1' && inputs.reviewed_head == github.sha
    runs-on: namespace-profile-ubuntu-24-04-16
    strategy:
      fail-fast: false
      matrix:
        position: ['01','02']
    name: Real getter ${{ matrix.position }}
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: enrolled
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-renderer-cgu-source
            scripts/rdr-root-field
            scripts/rdr-getter
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: physical
          ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
          persist-credentials: false
          sparse-checkout: scripts/gnu-renderer-pfc-hardware
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: observers
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-example-ceiling
            scripts/gnu-renderer-library-workers
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify source enrollment and native program prerequisites
        run: |
          set -euo pipefail
          test "$(git -C enrolled rev-parse HEAD)" = "$GITHUB_SHA"
          for name in gnu-renderer-cgu-source rdr-root-field rdr-getter; do
            (cd "enrolled/scripts/$name" && sha256sum --strict --check --status SHA256SUMS)
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils build-essential ca-certificates coreutils git strace util-linux zstd
      - name: Calibrate whole inherited hardware instructions then check real Ruff source and clients
        env:
          GH_TOKEN: ${{ github.token }}
          POSITION: ${{ matrix.position }}
        run: |
          set -euo pipefail
          python3 -IB enrolled/scripts/rdr-getter/worker.py "$POSITION" "$GITHUB_WORKSPACE/physical" "$GITHUB_WORKSPACE/observers"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rdr-getter-${{ matrix.position }}
          path: ${{ runner.temp }}/rdr-getter-${{ matrix.position }}/receipt
          include-hidden-files: true
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
