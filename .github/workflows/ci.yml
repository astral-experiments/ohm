name: Measure the compiler share of the unchanged GNU Ruff example build
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-ruff-example-ceiling-20261031'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        position: ['01', '02']
    name: Renderer instruction ceiling (${{ matrix.position }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: enrolled
          persist-credentials: false
          sparse-checkout: scripts/gnu-example-ceiling
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: signed-inputs
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Calibrate complete and native-subtree instruction counters before the ordinary workflow
        env:
          GH_TOKEN: ${{ github.token }}
          POSITION: ${{ matrix.position }}
        run: |
          set -euo pipefail
          cd enrolled/scripts/gnu-example-ceiling
          sha256sum --strict --check SHA256SUMS
          python3 -IB study.py "$POSITION" "$GITHUB_WORKSPACE/signed-inputs"
          python3 -IB verify.py "$RUNNER_TEMP/gnu-example-ceiling/receipt"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnu-ruff-example-ceiling-${{ matrix.position }}
          path: |
            ${{ runner.temp }}/gnu-example-ceiling/receipt
            !${{ runner.temp }}/gnu-example-ceiling/receipt/custody/cargo-301
          retention-days: 14
          if-no-files-found: warn
