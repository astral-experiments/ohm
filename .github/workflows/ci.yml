name: Replay Ohm edits
run-name: Measure build then check (${{ inputs.label }})
on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        required: true
      run:
        type: string
        default: '44863671852'
      candidate:
        type: string
        default: '4'
      cases:
        type: string
        required: true
      pairs:
        type: string
        default: '[1,2]'
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.cases) }}
        pair: ${{ fromJSON(inputs.pairs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.scenario == 'uv-session'
        with:
          repository: astral-sh/uv
          ref: 63251e5ce54f03363a10c088d7f9f6d6ba268302
          fetch-depth: 4
          path: source
          persist-credentials: false
      - name: Fetch the published −3 SDK
        run: |
          mkdir -p kits/3
          name=ohm-1.100.0-3
          curl -fsSL --retry 5 "https://github.com/astral-experiments/ohm/releases/download/$name/$name-x86_64-unknown-linux-gnu.tar.gz" -o kits/3/kit.tar.gz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run }}
          name: ohm-1.100.0-${{ inputs.candidate }}-x86_64-unknown-linux-gnu
          path: kits/4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: endsWith(matrix.scenario, '-keys')
        with:
          github-token: ${{ github.token }}
          run-id: 44875612642
          name: sdk-candidate
          path: keys
      - name: Set up the Codex dependencies
        if: contains(matrix.scenario, 'codex-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libcap-dev protobuf-compiler
          curl -fsSL --retry 4 https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz -o just.tar.gz
          echo '4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  just.tar.gz' | sha256sum -c
          tar xzf just.tar.gz just
      - name: Install nextest
        if: contains(matrix.scenario, 'codex-')
        run: |
          curl -fsSL --retry 4 https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.140/cargo-nextest-0.9.140-x86_64-unknown-linux-musl.tar.gz -o next.tar.gz
          echo 'bc2a998567816eef7b087b920036f49fb89aa2a8a603f6a3d84098be160b62c5  next.tar.gz' | sha256sum -c
          tar xzf next.tar.gz
      - name: Replay both SDKs
        env:
          REPLAY_MODE: ${{ inputs.label }}
          PAIR: ${{ matrix.pair }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if [[ $(cat /proc/sys/kernel/perf_event_paranoid) -gt 2 ]]; then sudo sysctl kernel.perf_event_paranoid=2; fi
          args="$SCENARIO/$PAIR"
          main=replay/replay.py
          if [[ $SCENARIO == uv-session ]]; then
            cc -O2 replay/pmuv.c -o meter
            main=replay/pmuv.py
            if (( PAIR % 2 )); then args=34p; else args=43p; fi
          fi
          sudo unshare --mount --propagation private bash replay/session.sh "$USER" "$args" "$PWD:$PATH" "$GITHUB_STEP_SUMMARY" "$main" "$REPLAY_MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.scenario }}-${{ matrix.pair }}
          path: counts/
          if-no-files-found: error
          retention-days: 30
