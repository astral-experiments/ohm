name: Does the full production compiler halve the eight rustc instruction counts in uv-client check?
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
        description: Reviewed full SHA of this benchmark
      build_run_id:
        required: true
        type: string
        description: Qualified new production SDK build
      build_head:
        required: true
        type: string
        description: Reviewed production generated-derive SDK producer commit
      sdk_lock_sha256:
        required: true
        type: string
        description: SHA-256 of both authenticated production inputs and native qualification
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  root:
    if: github.event.repository.private == true && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-21041-proc-derive-cumulative-check' && github.sha == inputs.reviewed_head
      && github.run_attempt == 1 && inputs.build_run_id == '41434876352' && inputs.build_head == '731d81a4cb3498cf4221d53a267bbf4a76ca250f' && inputs.sdk_lock_sha256 == '51d3b6c65b320f8e7d40021e805475a64ad8de9fa3257530f3069804a7fb1ce0'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 170
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_HEAD: ${{ inputs.build_head }}
      SDK_LOCK_SHA256: ${{ inputs.sdk_lock_sha256 }}
    steps:
    - name: Check out coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: coordinator
        ref: ${{ github.sha }}
        persist-credentials: 'false'
        sparse-checkout: 'scripts/handwritten-panel

          scripts/uv-callables-21041'
        fetch-depth: '2'
    - name: Check out the exact control-builder
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: control-builder
        ref: cddb036d81e4313a8e422171f39f0840b44110db
        persist-credentials: 'false'
        sparse-checkout: scripts/ctfe22-gnu
    - name: Check out the exact treatment-builder
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: treatment-builder
        ref: 731d81a4cb3498cf4221d53a267bbf4a76ca250f
        persist-credentials: 'false'
        sparse-checkout: scripts/ctfe22-gnu
    - name: Check out opening
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: opening
        ref: 341cd92e5d381a50bd380467075f31e780ee6296
        persist-credentials: 'false'
        sparse-checkout: 'scripts/uv-root-20991-opening

          '
    - name: Check out previous
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: previous
        ref: 8bf1d2c61fa3bb23ccf44a329e74e0359d98848c
        persist-credentials: 'false'
        sparse-checkout: 'scripts/uv-resolver-whole-pmu

          '
    - name: Check out qualified
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: qualified
        ref: 1286210a06dcc353a4f03dcf8c7bb15f99a56cad
        persist-credentials: 'false'
        sparse-checkout: 'scripts/rc23-trait-qualification

          '
    - name: Check out pilot
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: pilot
        ref: 5c651f1d38c629da2a75d5cac3588db0be8104d7
        persist-credentials: 'false'
        sparse-checkout: 'scripts/ctfe-crossover-pilot

          scripts/branch-return-pmu

          '
    - name: Check out calibrator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: calibrator
        ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
        persist-credentials: 'false'
        sparse-checkout: 'scripts/gnu-renderer-pfc-hardware

          '
    - name: Check out observers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: observers
        ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
        persist-credentials: 'false'
        sparse-checkout: 'scripts/gnu-example-ceiling

          scripts/gnu-renderer-library-workers

          '
    - name: Check out uv at the actual landed edit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: astral-sh/uv
        ref: 9049e07fa6b8e4863807b3a6e6e1293cbf68d0c3
        fetch-depth: '64'
        fetch-tags: 'false'
        persist-credentials: 'false'
        path: uv-source
    - name: Fetch and verify the historical release tag for the real uv build script
      run: 'git -C uv-source fetch --no-tags --depth=1 https://github.com/astral-sh/uv.git refs/tags/0.12.3:refs/tags/0.12.3

        test "$(git -C uv-source rev-parse ''refs/tags/0.12.3^{}'')" = 507230998c9541d67814b57463ac00e454ff6991

        '
    - name: Check out the verified original stock-authority reader
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: stock-authority
        ref: 125cef4f90f572d8a8d19da42b0bc2b1fcae87a8
        persist-credentials: 'false'
        sparse-checkout: 'scripts/handwritten-panel

          scripts/uv-callables-21041'
    - name: Check out the verified original derive-authority reader
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: derive-authority
        ref: e12e6778ebfaf38ea35fdd8a4084230f6bf1b937
        persist-credentials: 'false'
        sparse-checkout: 'scripts/handwritten-panel

          scripts/uv-callables-21041'
    - name: Verify the two rooted benchmark manifests
      run: 'set -euo pipefail

        (cd coordinator/scripts/handwritten-panel && sha256sum --strict --check SHA256SUMS)

        (cd coordinator/scripts/uv-callables-21041 && sha256sum --strict --check SHA256SUMS)

        (cd stock-authority/scripts/uv-callables-21041 && sha256sum --strict --check SHA256SUMS)

        (cd derive-authority/scripts/uv-callables-21041 && sha256sum --strict --check SHA256SUMS)

        '
    - name: Prepare the host and preserve prerequisites
      run: 'set -euo pipefail

        mkdir trait-results

        /usr/bin/bash opening/scripts/uv-root-20991-opening/host-prerequisites.sh 2>&1 | tee trait-results/host-prerequisites.log

        '
    - name: Calibrate inherited and per-rustc hardware counters, the current machine and the native blocking wait
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISBu coordinator/scripts/uv-callables-21041/core.py calibrate 2>&1 | tee trait-results/calibration.log

        '
    - name: Retain the calibrated unique runner before acquiring the compilers
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: uv-21041-derive-cumulative-production-boot
        path: trait-results/fresh-boot.json
        if-no-files-found: error
        retention-days: 7
    - name: Admit both independently qualified production compilers and the original Gnu/Linux Cargo
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISBu coordinator/scripts/uv-callables-21041/core.py admit 2>&1 | tee trait-results/intake.log

        '
    - name: Exercise the eleven real foreign transitions, separate epochs and same-role reuse
      run: /usr/bin/python3.12 -ISBu coordinator/scripts/uv-callables-21041/core.py migration
    - name: Open two independent histories and collect eight separately restored scoped, whole-Cargo and blocking-wall pairs
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISBu coordinator/scripts/uv-callables-21041/screen.py 2>&1 | tee trait-results/experiment.log'
    - name: Reopen 128 compiler counters, 16 whole-Cargo counters, 16 separate blocking waits and the native derive inventories
      run: 'set -euo pipefail

        /usr/bin/python3.12 -ISBu coordinator/scripts/uv-callables-21041/score.py 2>&1 | tee trait-results/reduction.log'
    - name: Preserve raw clocks, source qualification and any incomplete attempt
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: uv-21041-derive-cumulative-production-eight-pair
        path: trait-results/
        if-no-files-found: error
        compression-level: '1'
        retention-days: 7
