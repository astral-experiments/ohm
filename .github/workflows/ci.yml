name: RC22 structural Ruff CLI and integration-test check
on:
  workflow_dispatch:
    inputs:
      expected_head: {description: Exact reviewed packaging commit, required: true, type: string}
permissions: {contents: read, actions: read}
concurrency: {group: rc22-ruff-real-integration, cancel-in-progress: false}
jobs:
  native:
    name: Unscored real Ruff CLI and integration test (arm64 macOS)
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-rc22-ruff-real-integration-20261031'
    runs-on: namespace-profile-macos-15
    timeout-minutes: 170
    steps:
      - name: Require the reviewed branch head
        env: {EXPECTED: '${{ inputs.expected_head }}'}
        run: test "$GITHUB_SHA" = "$EXPECTED"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/rc22-native
            scripts/rc22-ruff-integration
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {repository: astral-sh/ruff, ref: 915bb2b4bf9ae7eee47cf55646bbfebae254a23b, fetch-depth: 2, path: ruff, persist-credentials: false}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 89a055549f4335e6e172f96c65d162dcd9cb1046, path: marker-reader, persist-credentials: false, sparse-checkout: scripts/ohm-musl-ast-pair/v2}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: {ref: 14c9d13d68f3dd21c53f1ef6c3721de8363c0123, path: apple-reader, persist-credentials: false, sparse-checkout: scripts/ohm-apple-zmij}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - name: Authenticate the independently qualified native SDK and both Cargo binaries
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$(git -C protocol rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C protocol rev-parse HEAD:scripts/rc22-native)" = 784d42db3f6f633a899219406265027cb537ab95
          python3 -IB protocol/scripts/rc22-native/acquire_plain.py protocol/scripts/rc22-native/source/sdk-apple.json "$RUNNER_TEMP/rc22-inbox" "$RUNNER_TEMP/rc22-source"
      - name: Qualify the source, native controls, and exact ordinary Cargo visits
        shell: bash
        run: |
          set -euo pipefail
          command -v b3sum >/dev/null || brew install b3sum
          command -v zstd >/dev/null || brew install zstd
          python3 -IB protocol/scripts/rc22-ruff-integration/test_protocol.py
          python3 -IB protocol/scripts/rc22-ruff-integration/study.py "$RUNNER_TEMP/rc22-ruff-check" "$RUNNER_TEMP/rc22-inbox"
      - name: Independently replay raw kernel events, dep-info and complete signed programs
        run: python3 -IB protocol/scripts/rc22-ruff-integration/reopen.py "$RUNNER_TEMP/rc22-ruff-check/receipts" apple-reader/scripts/ohm-apple-zmij marker-reader/scripts/ohm-musl-ast-pair/v2 "$RUNNER_TEMP/rc22-ruff-check/receipts/independent.json"
      - name: Preserve original observation streams and complete native bodies, including any refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc22-ruff-real-integration
          path: |
            ${{ runner.temp }}/rc22-source/
            ${{ runner.temp }}/rc22-ruff-check/receipts/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
