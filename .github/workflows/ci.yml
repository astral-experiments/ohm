name: 'Ordinary uv-cli build after the landed #20992 edit'
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact inspected coordinator commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: uv-20992-derive-production-build-guard
  cancel-in-progress: false
jobs:
  guard:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-20992-production-build-guard' && github.run_attempt == 1 && github.sha == inputs.reviewed_head
    name: Eight paired ordinary linked-library builds on production rustc
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      INPUT_SOURCE: ${{ inputs.reviewed_head }}
    steps:
      - name: Check out the exact reviewed study and existing release readers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: measure
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the complete carrier before any physical visit
        shell: bash
        run: |
          set -eu
          printf 'OHM20992_RESULT=%s/build-results\nOHM20992_TRANSIENT=%s/ohm-20992-native-state\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python3 -ISB measure/scripts/uv-library-build-20992/source_guard.py
      - name: Check out the existing inherited counter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: pilot
          ref: 5c651f1d38c629da2a75d5cac3588db0be8104d7
          sparse-checkout: |
            scripts/ctfe-crossover-pilot
            scripts/branch-return-pmu
          persist-credentials: false
      - name: Check out authenticated PMU calibration and observers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: calibrator
          ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
          sparse-checkout: scripts/gnu-renderer-pfc-hardware
          persist-credentials: false
      - name: Enroll original retired-instruction calibrator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: observers
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          sparse-checkout: |
            scripts/gnu-example-ceiling
            scripts/gnu-renderer-library-workers
          persist-credentials: false
      - name: Calibrate whole-tree instructions, compiler threads and the blocking native clock
        run: python3 -ISBu measure/scripts/uv-library-build-20992/worker.py calibrate
      - name: Retain the fresh physical boot and all three calibration identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-20992-production-early-boot
          path: build-results/calibration.json
          if-no-files-found: error
          retention-days: 7
      - name: Check out the production parent verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control-builder
          ref: 5f7e5680285caa6b9a848db810b63ef58dfe0143
          sparse-checkout: scripts/ctfe22-gnu
          persist-credentials: false
      - name: Check out the generated-derive production verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: treatment-builder
          ref: 731d81a4cb3498cf4221d53a267bbf4a76ca250f
          sparse-checkout: scripts/ctfe22-gnu
          persist-credentials: false
      - name: Verify original service metadata, PGO+BOLT packages, native QA, and official signed Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -ISBu measure/scripts/uv-library-build-20992/sdk_intake.py
      - name: Check out the real landed uv change and its previous history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: uv-donor
          repository: astral-sh/uv
          ref: 544157b31dbc6007bfdfe2789d3d068278fdb57d
          fetch-depth: 80
          fetch-tags: true
          persist-credentials: false
      - name: Prepare and authenticate the 658 locked packages
        run: |
          set -eu
          git -C uv-donor fetch --no-tags --depth=1 origin +refs/tags/0.12.2:refs/tags/0.12.2
          python3 -ISBu measure/scripts/uv-library-build-20992/registry_intake.py
      - name: Open four independent native histories and exhaustively verify archives, linked CLI, Cargo graph and kernel process identities
        run: python3 -ISBu measure/scripts/uv-library-build-20992/worker.py enroll
      - name: Run all eight opening-order pairs of ordinary Cargo builds and the separate hardware visits
        run: python3 -ISBu measure/scripts/uv-library-build-20992/worker.py measure
      - name: Reopen the original package outputs, counters and blocking clocks
        run: python3 -ISBu measure/scripts/uv-library-build-20992/replay.py "$OHM20992_RESULT"
      - name: Retain complete raw products, process records, clocks, counters and refused inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-20992-production-original
          path: build-results
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

