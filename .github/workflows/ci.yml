name: Independently reopen original Ruff derive codegen pilots
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  review:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-ruff-derived-impl-cgus-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ inputs.reviewed_head }}
        sparse-checkout: scripts/ruff-derived-impl-cgus
        persist-credentials: false
    - name: Reopen registered original objects, metadata, hardware and real process arguments
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -IB scripts/ruff-derived-impl-cgus/read-pilots.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: derived-pilot-independent-proof-${{ github.run_id }}
        path: ${{ runner.temp }}/verified-pilots
        if-no-files-found: error
