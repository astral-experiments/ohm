name: One native Apple Diesel incremental graph reproduction
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact QA commit
        required: true
        type: string
permissions: {}
jobs:
  reproduce:
    name: Original and integrated Darwin compilers on the real Diesel PGO edit
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-darwin-diesel-dep-graph-20261101' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 145
    permissions:
      contents: read
      actions: read
    env:
      OHM_TARGET: aarch64-apple-darwin
    steps:
    - name: Check out release coordinator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 3
    - name: Prepare the disposable native worker
      run: |
        printf '%s\n' "$GITHUB_REPOSITORY $GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/diesel-enrollment.txt"
        ./scripts/prepare-hosted-macos-release.sh
        printf "DIESEL_ROOT=%s/diesel-native\n" "$RUNNER_TEMP" >> "$GITHUB_ENV"
        test "$(uname -m)" = arm64
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: true
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b
        path: source-carrier
        persist-credentials: false
        sparse-checkout: scripts/rc22-private-export-ice
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27
        path: transport
        persist-credentials: false
        sparse-checkout: scripts/rc22-native
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
        path: public-seed
        persist-credentials: false
        sparse-checkout: scripts/ohm-apple-zmij/source-transport
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
        path: signed-rust
        persist-credentials: false
        sparse-checkout: scripts/strict-mixed-generics
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
        path: cargo-seed
        persist-credentials: false
        sparse-checkout: 'scripts/cargo-diagnostic-fix

          scripts/ohm-apple-zmij/cargo293'
    - name: Read the prior native package intake
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: c0748d6bc1bac8e85828ea0c5c9f297eb10f88aa
        path: darwin-prior
        persist-credentials: false
        sparse-checkout: scripts/darwin-native-export
    - name: Read the official artifact reopener
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 69af8fd3bf8ef6ddb49aa801f25016c6af5171a9
        path: native-reader
        persist-credentials: false
        sparse-checkout: 'scripts/rc22-complete-smoke

          release'
    - name: Read the actual Diesel benchmark and unmodified profiler
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0a054b0ead56e41a4584bfab6fdc1a5fad2aedc3
        path: perf
        persist-credentials: false
        repository: rust-lang/rustc-perf
    - name: Read the later declared archive check from packaging
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 933ca489d20ba0c856d6762fd115a3fad78ff0f8
        path: latest-smoke
        persist-credentials: false
        sparse-checkout: scripts
    - name: Verify the native source and original failure before building
      id: sources
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = 2b97b467760a5f469cfca5ccbb07ef37ee0cf3ef
        test "$(git rev-parse HEAD^^)" = 8b2c911b32b7cad9442b7ddced987c5a1b0a62e5
        command -v uvx
        git diff --exit-code HEAD^^ HEAD -- scripts ':!scripts/darwin-diesel' .github/workflows/release.yml release toolchains
        (cd scripts/integrated-dist-qa && shasum -a 256 --check SHA256SUMS)
        (cd scripts/darwin-diesel && shasum -a 256 --check SHA256SUMS)
        python3 -IB scripts/integrated-dist-qa/sources.py
        test "$(git -C perf rev-parse HEAD)" = "$(git -C source/rust rev-parse HEAD:src/tools/rustc-perf)"
        rustup toolchain install 1.98.0 --profile minimal --no-self-update
        df -h "$RUNNER_TEMP"
    - name: Reopen the old optimized Darwin compiler and exact four-fix Cargo
      id: old
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 -IB darwin-prior/scripts/darwin-native-export/drive.py original "$DIESEL_ROOT"
        python3 -IB scripts/darwin-diesel/worker.py original
    - name: Build the original collector and separately prepare passive phase witnesses
      id: collector
      run: python3 -IB scripts/darwin-diesel/worker.py prepare
    - name: parent unmodified Check, Debug and Opt collector
      if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
      run: python3 -IB scripts/darwin-diesel/worker.py profiles parent primary
    - name: parent Opt with complete graphs, duplicate readers and two empties
      if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
      run: python3 -IB scripts/darwin-diesel/worker.py profiles parent observed
    - name: parent reviewed marked and declared two-bin check
      if: ${{ !cancelled() && steps.collector.outcome == 'success' }}
      run: python3 -IB scripts/darwin-diesel/worker.py marked parent
    - name: Build only the integrated non-PGO compiler and native standard library
      id: new
      if: ${{ !cancelled() && steps.sources.outcome == 'success' && steps.old.outcome == 'success' }}
      run: python3 -IB scripts/darwin-diesel/worker.py bootstrap
    - name: integrated unmodified Check, Debug and Opt collector
      if: ${{ !cancelled() && steps.collector.outcome == 'success' && steps.new.outcome == 'success' }}
      run: python3 -IB scripts/darwin-diesel/worker.py profiles integrated primary
    - name: integrated Opt with complete graphs, duplicate readers and two empties
      if: ${{ !cancelled() && steps.collector.outcome == 'success' && steps.new.outcome == 'success' }}
      run: python3 -IB scripts/darwin-diesel/worker.py profiles integrated observed
    - name: integrated reviewed marked and declared two-bin check
      if: ${{ !cancelled() && steps.collector.outcome == 'success' && steps.new.outcome == 'success' }}
      run: python3 -IB scripts/darwin-diesel/worker.py marked integrated
    - name: Preserve all native evidence including refused scopes
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: darwin-diesel-native-observations
        path: |
          ${{ runner.temp }}/diesel-enrollment.txt
          ${{ runner.temp }}/diesel-native/reports/
          ${{ runner.temp }}/diesel-native/receipts/
          ${{ github.workspace }}/source/reports/
        if-no-files-found: error
        retention-days: 14
