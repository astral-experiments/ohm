name: Qualify a real private-module visibility change in Ruff
run-name: Ruff 16149 ordinary check ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease source head
        type: string
        required: true
permissions:
  contents: read
jobs:
  inventory:
    name: Historical Ruff scope edit
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-ruff-16149-visibility-20261103' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 155
    permissions:
      contents: read
      actions: read
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-module-16149
            scripts/ruff-linter-check-attribution
            scripts/ruff-heldout-mono-fold/residual
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bd7b58765ae44b21a1c9273b3ff0be8e923adc47
          path: donor
          persist-credentials: false
          sparse-checkout: scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3a830cdc9f00b01c7110fac3653d8cd0b305c355
          path: scope-inline
          persist-credentials: false
          sparse-checkout: scripts/ruff-matched-stage
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 2f2bc3cc0b2351986dab96b4bc5df8ea910b95ce
          fetch-depth: 3
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the independent native process observer
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends strace
          strace --version
      - name: Enroll the original sources and matched compiler capsule
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-module-16149/setup.py acquire
      - name: Verify the complete lock and ordinary check and build graphs
        id: inputs
        run: python3 -IB qa/scripts/ruff-module-16149/setup.py prefetch
      - name: Run the ordinary parent check and native lint oracles
        if: always() && steps.inputs.outcome == 'success'
        run: python3 -IB qa/scripts/ruff-module-16149/study.py P
      - name: Run the ordinary candidate check and native lint oracles
        if: always() && steps.inputs.outcome == 'success'
        run: python3 -IB qa/scripts/ruff-module-16149/study.py C
      - name: Reconcile the two complete private histories
        if: always() && steps.inputs.outcome == 'success'
        run: python3 -IB qa/scripts/ruff-module-16149/study.py compare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ruff-16149-private-scope-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-ruff16149/receipt
          if-no-files-found: error
          compression-level: 2
          retention-days: 7
