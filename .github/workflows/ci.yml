name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ohm-packed-object-ruff-linux
  cancel-in-progress: false

jobs:
  parser:
    name: Compare three native compiler configurations on the Ruff parser
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-packed-object-ruff-linux'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 355
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Set up repeatable Linux storage and process measurements
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ohm-branch-object-qa"
          mkdir -p "$root/work" "$root/logs"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind strace ninja-build
          command -v rustup zstd cc
          test -x /usr/bin/valgrind.bin
          truncate -s 4G "$root/build-ext4.img"
          /usr/sbin/mkfs.ext4 -q -m 0 -E lazy_itable_init=0,lazy_journal_init=0 "$root/build-ext4.img"
          sudo mount -o loop,nosuid,nodev,noatime "$root/build-ext4.img" "$root/work"
          sudo chown "$(id -u):$(id -g)" "$root/work"
          printf '%s' "$root" > "$root/work/.owned-by-packed-study"
          findmnt --target "$root/work" > "$root/logs/filesystem.txt"
          test "$(findmnt -n -o FSTYPE --target "$root/work")" = ext4
          strace -f -qq -e trace=execve -o "$root/logs/trace-smoke.log" /bin/true
          cp scripts/ohm-packed-ruff/PLAN.md "$root/logs/PLAN.md"
          git rev-parse HEAD > "$root/logs/hosted-study-head.txt"
          (cd scripts/ohm-packed-ruff && sha256sum -c SHA256SUMS)
      - name: Obtain the immutable signed native Cargo and Wild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/ohm-branch-object-qa"
          gh release download ohm-1.99.0-20 --repo "$GITHUB_REPOSITORY" --dir "$root" \
            --pattern 'ohm-1.99.0-20-x86_64-unknown-linux-gnu.tar.gz'
      - name: Build parent and candidate with one bootstrap and reopen both native SDKs
        run: bash scripts/ohm-packed-ruff/prepare.sh
      - name: Verify the toolchain, baseline and locked Ruff inputs
        run: python3 -IB scripts/ohm-packed-ruff/study.py prepare
      - name: Compare independent native readers, archive payloads and invalid edits
        run: python3 -IB scripts/ohm-packed-ruff/study.py qualify
      - name: Measure the two mirrored triplets and their complete footprints
        run: python3 -IB scripts/ohm-packed-ruff/study.py screen
      - name: Measure the separate confirmation if the screen passes
        run: |
          if python3 -c 'import json,sys;sys.exit(not json.load(open(sys.argv[1]))["admitted"])' "$RUNNER_TEMP/ohm-branch-object-qa/logs/screen/result.json"; then
            python3 -IB scripts/ohm-packed-ruff/study.py confirm
          fi
      - name: Preserve the ordinary command streams and all storage receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packed-object-ruff-ordinary
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 5
          if-no-files-found: warn
      - name: Count every instruction in both returning rustcs on two fresh mirrors
        run: |
          if python3 -c 'import json,sys;sys.exit(not json.load(open(sys.argv[1]))["admitted"])' "$RUNNER_TEMP/ohm-branch-object-qa/logs/screen/result.json"; then
            python3 -IB scripts/ohm-packed-ruff/study.py counter
          fi
      - name: Preserve native compiler counters, exit status and native readers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packed-object-ruff-instructions
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs/counter
          retention-days: 5
          if-no-files-found: ignore
