name: Qualify literal AArch64 syscalls on two real Ruff builds
on: workflow_dispatch
permissions:
  contents: read
  actions: read
concurrency:
  group: gnu-literal-svc-${{ github.sha }}
  cancel-in-progress: false
jobs:
  compiler:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-ruff-syscall'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the original parent SDK, version-aware Cargo and unchanged Wild
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ohm-gnu-syscall/ingress.sh
      - name: Bootstrap the direct rustc child and verify all 119 installed files
        run: |
          set -euo pipefail
          {
            echo "QA_ROOT=$RUNNER_TEMP/ohm-aarch64-linux-zmij"
            echo "CENSUS_PARENT=$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
            echo "CC_aarch64_unknown_linux_gnu=/usr/bin/aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=/usr/bin/aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=/usr/bin/aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ohm-aarch64-linux-zmij/receipts"
      - run: python3 -IB scripts/ohm-gnu-syscall/bootstrap.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-literal-svc-driver
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/ohm-aarch64-linux-zmij/export
      - name: Check both AArch64 marker edges and execute an actual Linux syscall
        run: python3 -IB scripts/ohm-gnu-syscall/direct.py
      - name: Run both existing host run-make regression suites
        run: python3 -IB scripts/ohm-gnu-syscall/bootstrap.py host-test
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-literal-svc-bootstrap-and-native-tests
          retention-days: 14
          path: ${{ runner.temp }}/ohm-aarch64-linux-zmij/receipts
  ruff:
    needs: compiler
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        study: [census, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the original parent SDK, version-aware Cargo and unchanged Wild
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ohm-gnu-syscall/ingress.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gnu-literal-svc-driver
          path: ${{ runner.temp }}/literal-svc-transfer
      - name: Restore and verify the distinct compiler
        run: |
          set -euo pipefail
          export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          export QA_ROOT="$RUNNER_TEMP/svc-receiver"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/bootstrap.py restore "$RUNNER_TEMP/literal-svc-transfer"
          {
            echo "CENSUS_ROOT=$RUNNER_TEMP/observed-ruff"
            echo "CENSUS_SDK=$QA_ROOT/candidate-sdk"
            echo "CENSUS_CANDIDATE_RECORD=$QA_ROOT/receipts/candidate.json"
          } >> "$GITHUB_ENV"
      - name: Execute the original builds, real edits, unchanged builds, broken edits and independent clean products
        run: python3 -IB scripts/ohm-gnu-ty-input-census/${{ matrix.study }}.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-literal-svc-${{ matrix.study }}-verdicts
          retention-days: 14
          path: |
            ${{ runner.temp }}/observed-ruff/receipts
            ${{ runner.temp }}/svc-receiver/receipts
