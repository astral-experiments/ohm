name: Adjacent Cargo commits on Ruff's implicit Linux provider
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [provider]
        required: true
permissions:
  contents: read
  actions: read
jobs:
  provider:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-linux-implicit-294-parent-20261031' && inputs.stage == 'provider'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: scripts/linux-294-parent
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          path: signed-reader
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 93526150df078af7dd8fc4226cdcc469539d2001
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Acquire native tools
        run: |
          set -eu
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends strace build-essential binutils
          rustup toolchain install 1.99.0 --profile minimal
      - name: Authenticate the signed release and previous exact source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
          mkdir -m700 "$RUNNER_TEMP/adjacent-provider"
          python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/adjacent-provider"
          python3 -IB protocol/scripts/linux-294-parent/supply.py "$RUNNER_TEMP/adjacent-provider"
      - name: Exercise the six independent Cargo roles against the same Linux provider
        run: |
          set -eu
          python3 -IB protocol/scripts/linux-294-parent/experiment.py "$RUNNER_TEMP/adjacent-provider" "$GITHUB_WORKSPACE/ruff"
      - name: Read actual probes and compare each returned program with its empty references
        run: |
          set -eu
          python3 -IB protocol/scripts/linux-294-parent/verify.py "$RUNNER_TEMP/adjacent-provider/private/host-unicode-wild-dir-v1/results" > "$RUNNER_TEMP/adjacent-provider/terminal.json"
          cat "$RUNNER_TEMP/adjacent-provider/terminal.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-adjacent-Cargo-Ruff-Unicode
          path: |
            ${{ runner.temp }}/adjacent-provider/private/host-unicode-wild-dir-v1/results
            ${{ runner.temp }}/adjacent-provider/private/host-unicode-wild-dir-v1/fixture-config.json
            ${{ runner.temp }}/adjacent-provider/input/*.json
            ${{ runner.temp }}/adjacent-provider/receipts
            ${{ runner.temp }}/adjacent-provider/terminal.json
          retention-days: 7
          if-no-files-found: warn
