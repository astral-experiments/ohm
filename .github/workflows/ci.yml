name: Isolate the signed Ron reason in the current workspace test build
run-name: Isolate the Ron dependency in the real Ruff test build ${{ inputs.reviewed_head }}
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1'
      && github.event_name == 'workflow_dispatch' && github.sha == inputs.reviewed_head
      && github.ref_name == 'charlie/qa-workspace-test-29697-ron-cause-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ inputs.reviewed_head }}
        path: qa
        persist-credentials: false
        sparse-checkout: 'scripts/ruff-foreign-span-observer

          scripts/ruff-original-ty-instructions

          '
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: astral-sh/ruff
        ref: bfa2407e98ee1343caeefd02b4b69043509baa8c
        fetch-depth: 2
        path: ruff
        persist-credentials: false
    - name: Provision the signed Cargo record checksum and debugger
      run: sudo apt-get update -qq && sudo apt-get install -qy b3sum gdb libunwind-dev liblzma-dev
    - name: Exercise one original foreign sentinel on OLD and NEW
      env:
        REVIEWED_HEAD: ${{ inputs.reviewed_head }}
        OHM_SDK_READ_TOKEN: ${{ github.token }}
      run: python3 -IB qa/scripts/ruff-original-ty-instructions/workspace_ron_probe.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: workspace-ron-29697-cause-${{ github.run_id }}
        path: ${{ runner.temp }}/ohm-foreign-join/published/
        retention-days: 10
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease QA source
        required: true
        type: string
