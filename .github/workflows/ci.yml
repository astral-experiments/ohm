name: Attribute signed first-A Ruff instruction leaves
run-name: Signed first-A full compiler instruction samples ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact independently reviewed diagnostic commit
        required: true
        type: string
      previous_boots:
        description: Six independently authenticated job/artifact/digest/boot descriptors in position order
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-first-a-leaves-v2-20261101' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 75
    name: Signed GNU Ruff first-A hardware instruction leaves v2
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-default-owner-pmu
            scripts/ohm-packed-ruff
            scripts/branch-return-pmu
            scripts/branch-storage-e-confirmation/review
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: collector
          persist-credentials: false
          sparse-checkout: scripts/gnu-example-ceiling
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 42ab30fd5e6bcdcf908df81de9baac65ca64fbf9
          path: contract
          persist-credentials: false
          sparse-checkout: scripts/notebook-fanout-ceiling
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f5667dc0aa2083961065a3a947b06a091e00af98
          path: sampler-source
          persist-credentials: false
          sparse-checkout: scripts/notebook-fanout-ceiling
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check immutable source and native gates
        run: |
          set -euo pipefail
          test "$(git -C enrolled rev-parse HEAD)" = "$REVIEWED_HEAD"
          (cd enrolled && sha256sum --strict --check --status scripts/ruff-default-owner-pmu/SHA256SUMS)
          python3 -IB enrolled/scripts/ruff-default-owner-pmu/test_attribution.py "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract"
          python3 -IB enrolled/scripts/ruff-default-owner-pmu/reopen.py --help >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential git libssl-dev zstd
          sudo apt-get install -y --no-install-recommends linux-tools-generic
          python3 -IB enrolled/scripts/ruff-default-owner-pmu/test_leaves.py "$GITHUB_WORKSPACE/sampler-source"
          python3 -IB enrolled/scripts/ruff-default-owner-pmu/test_worker_flow.py "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract" "$GITHUB_WORKSPACE/sampler-source"
          mapfile -t installed_perf < <(find -L /usr/lib/linux-tools -mindepth 2 -maxdepth 2 -type f -name perf | sort -V)
          test "${#installed_perf[@]}" -gt 0
          perf_bin="$(realpath "${installed_perf[-1]}")"
          dpkg-query -S "$perf_bin"
          "$perf_bin" version --build-options
          printf 'OHM_DIAGNOSTIC_PERF=%s\n' "$perf_bin" >> "$GITHUB_ENV"
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          dpkg-query -W b3sum binutils build-essential git libssl-dev zstd > "$base/logs/packages.tsv"
      - name: Install the published GNU release
        env:
          GH_TOKEN: ${{ github.token }}
          EXCLUDED_BOOT_CUSTODY: ${{ inputs.previous_boots }}
        run: python3 -IB enrolled/scripts/ruff-default-owner-pmu/acquire.py
      - name: Run three first-A histories
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-repair-tables-pilot/guards.py watch "$base/work" "$base/logs" "$base/logs/resource" python3 -IB enrolled/scripts/ruff-default-owner-pmu/worker.py "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract" "$GITHUB_WORKSPACE/sampler-source"
      - name: Reopen original counters and native products
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-default-owner-pmu/reopen.py --directory "$base/logs" --collector "$GITHUB_WORKSPACE/collector" --contract "$GITHUB_WORKSPACE/contract" --sampler-source "$GITHUB_WORKSPACE/sampler-source" --symbol-sdk "$base/home/.rustup/toolchains/ohm" --head "$REVIEWED_HEAD" > "$base/accepted.json"
          mv "$base/accepted.json" "$base/logs/accepted.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-gnu-ruff-first-a-instruction-leaves-v2
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
