name: Preserve uv-lock metadata and compiler graphs across edit 22619
run-name: Unscored uv-lock metadata forensics at ${{ inputs.reviewed_head }}
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed private coordinator revision
        type: string
        required: true
permissions: {}
concurrency:
  group: uv-lock-22619-metadata-forensics
  cancel-in-progress: false
jobs:
  characterize:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-uv-22619-lock-rmeta-forensics' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      attestations: read
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/uv-lock-22619
            scripts/uv-lock-22619-forensics
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8bf1d2c61fa3bb23ccf44a329e74e0359d98848c
          path: previous
          persist-credentials: false
          sparse-checkout: scripts/uv-resolver-whole-pmu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1286210a06dcc353a4f03dcf8c7bb15f99a56cad
          path: qualified
          persist-credentials: false
          sparse-checkout: scripts/rc23-trait-qualification
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5c651f1d38c629da2a75d5cac3588db0be8104d7
          path: pilot
          persist-credentials: false
          sparse-checkout: |
            scripts/ctfe-crossover-pilot
            scripts/branch-return-pmu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
          path: calibrator
          persist-credentials: false
          sparse-checkout: scripts/gnu-renderer-pfc-hardware
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: observers
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-example-ceiling
            scripts/gnu-renderer-library-workers
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Authenticate enrolled source and physical workspace
        run: |
          set -euo pipefail
          (cd scripts/uv-lock-22619 && sha256sum --strict -c SHA256SUMS)
          (cd scripts/uv-lock-22619-forensics && sha256sum --strict -c SHA256SUMS)
          python3 -ISBu scripts/uv-lock-22619-forensics/collect.py prepare
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/uv
          ref: c36f60ababfe55a451ad439837471d56ab0e455c
          path: uv-source
          fetch-depth: 70
          fetch-tags: false
          persist-credentials: false
      - name: Admit the historical public tag
        run: git -C uv-source -c credential.helper= fetch --no-tags --depth=1 https://github.com/astral-sh/uv.git refs/tags/0.13.1:refs/tags/0.13.1
      - name: Verify signed Cargo and the exact prior qualified f129 distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -ISBu scripts/uv-lock-22619-forensics/collect.py intake
      - name: Collect independent cold and restored metadata, behavior and selected compiler records
        run: python3 -ISBu scripts/uv-lock-22619-forensics/collect.py run
      - name: Preserve all complete or partial native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-lock-22619-rmeta-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: trait-results/
          if-no-files-found: warn
          compression-level: 3
          retention-days: 14
