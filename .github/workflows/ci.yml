name: Measure complete Ruff check commands with matched compilers
run-name: Matched Ruff check instructions ${{ inputs.reviewed_head }}
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease QA commit
        required: true
        type: string
permissions: {}
concurrency:
  group: ohm-indexed-check-whole-pmu-${{ github.sha }}
  cancel-in-progress: false
jobs:
  ordinary:
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-indexed-check-whole-pmu-20261102' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Check out the reviewed measurement and matched source manifest
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        path: qa
        sparse-checkout: |
          scripts/ruff-indexed-check-pmu
          scripts/ruff-matched-stage
        persist-credentials: false
    - name: Check out the calibrated inherited hardware reader
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 17981f5b807be81496282dd5a58e579e71586962
        path: collector
        sparse-checkout: scripts/gnu-example-ceiling
        persist-credentials: false
    - name: Check out Ruff ast A
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: astral-sh/ruff
        ref: b5dba861cc38e3f7fb4524c9ceba3e01a474ea13
        path: ast-A
        persist-credentials: false
    - name: Check out Ruff ast B
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: astral-sh/ruff
        ref: 7b13f01ba1569887a25670820764b24c206da8e5
        path: ast-B
        persist-credentials: false
    - name: Check out Ruff token A
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: astral-sh/ruff
        ref: 5c64006c01f1b6289d18dd25b0d4ec5f95361424
        path: token-A
        persist-credentials: false
    - name: Check out Ruff token B
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: astral-sh/ruff
        ref: a8d5ba53d1378873d75fb46794452dedfd6ac45b
        path: token-B
        persist-credentials: false
    - name: Prepare native measurement tools
      run: |
        set -euo pipefail
        test "$(git -C qa rev-parse HEAD)" = "$REVIEWED_HEAD"
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends build-essential zstd valgrind binutils pkg-config libssl-dev
    - name: Authenticate the actual factory tar and reopen both compiler installations
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -IB qa/scripts/ruff-indexed-check-pmu/acquire.py
    - name: Calibrate and measure eight counterbalanced pairs on both complete ordinary checks
      run: python3 -IB qa/scripts/ruff-indexed-check-pmu/worker.py
    - name: Independently recompute ordinary instruction counts from their raw windows
      run: |
        set -euo pipefail
        directory="$RUNNER_TEMP/indexed-check-study/logs"
        python3 -IB qa/scripts/ruff-indexed-check-pmu/reopen_results.py "$directory" "$REVIEWED_HEAD" > "$directory/reopened.json"
    - name: Retain raw counters, Cargo inventories, typed verdicts and provenance
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ohm-indexed-check-whole-instruction-receipts
        path: ${{ runner.temp }}/indexed-check-study/logs
        retention-days: 7
        if-no-files-found: warn
