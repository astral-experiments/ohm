name: Qualify the Apple Cargo merge on the shipped -20 compiler
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: apple-shipped-reader-intake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-release-reader:
    runs-on: namespace-profile-macos-15
    timeout-minutes: 125
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Calibrate real Xcode and kernel exec observation
        run: |
          root="$RUNNER_TEMP/apple-release-reader"
          python3 -IB scripts/ohm-apple-zmij/run.py pilot calibrate "$root"
          cp scripts/ohm-apple-zmij/release-intake-plan.md "$root/receipts/registration.md"
      - name: Authenticate and install the signed Darwin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/apple-release-reader"
          mkdir "$root/assets"
          gh release download ohm-1.99.0-20 --repo "$GITHUB_REPOSITORY" --dir "$root/assets" --pattern 'ohm-1.99.0-20-aarch64-apple-darwin*'
          python3 -IB scripts/ohm-apple-zmij/run.py prepare release "$root" "$root/assets"
      - name: Build the integrated reader from its authenticated two-parent tree, then package the native Cargo
        run: |
          root="$RUNNER_TEMP/apple-release-reader"
          python3 -IB scripts/ohm-apple-zmij/receipt_cargo.py aware "$root"
          python3 -IB scripts/ohm-apple-zmij/release_unicode.py pack "$root"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-apple-integrated-fd55-cargo
          path: ${{ runner.temp }}/apple-release-reader/result-product
          retention-days: 14
          if-no-files-found: error
      - name: Check both Cargo executables on the identical signed SDK and pinned real Ruff Unicode build
        run: python3 -IB scripts/ohm-apple-zmij/release_unicode.py run "$RUNNER_TEMP/apple-release-reader"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-apple-integrated-fd55-unicode
          path: ${{ runner.temp }}/apple-release-reader/receipts
          retention-days: 14
          if-no-files-found: warn
