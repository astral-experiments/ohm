name: CI
on: workflow_dispatch
permissions:
  actions: read
  contents: read
concurrency:
  group: gnu-cargo293-source-product-20261030
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-cargo293-link-fallback-20261030'
    name: Build exact 735e1528 Cargo on Linux with its checked Rust inputs
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify public source, compiler inputs and the native acquisition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export QA_ROOT="$RUNNER_TEMP/gnu-cargo293-build"
          mkdir -p "$QA_ROOT/inputs" "$QA_ROOT/receipts"
          printf 'QA_ROOT=%s\n' "$QA_ROOT" >> "$GITHUB_ENV"
          for family in ohm-aarch64-compact ohm-aarch64-registers ohm-aarch64-fallback; do
            (cd "scripts/$family" && sha256sum -c SHA256SUMS)
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends strace zstd cmake pkg-config perl libssl-dev
          python3 -IB scripts/ohm-aarch64-compact/acquire.py
      - name: Use independent Cargo build and target roots
        run: python3 -IB scripts/ohm-aarch64-fallback/build.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-cargo293-source-build-receipts
          path: ${{ runner.temp }}/gnu-cargo293-build/receipts
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-cargo293-exact-product
          path: ${{ runner.temp }}/gnu-cargo293-build/product
          retention-days: 3
          if-no-files-found: error
