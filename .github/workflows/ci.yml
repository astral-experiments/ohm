name: Attribute stock instructions on unchanged Ruff checks and builds
run-name: Stock historical Ruff instruction attribution ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease QA source
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.event_name == 'workflow_dispatch' && github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-original-ruff-ty-instructions-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.reviewed_head }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-foreign-span-observer
            scripts/ruff-original-ty-instructions
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: b00f68a23cedbd3a38fc25bac63638f0f11fc3f0
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - name: Measure ordinary signed checks and builds on the historical source
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          OHM_SDK_READ_TOKEN: ${{ github.token }}
        run: |
          python3 -IB qa/scripts/ruff-original-ty-instructions/study.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stock-original-ruff-instructions-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-foreign-join/published/
          retention-days: 15
          if-no-files-found: error
