name: Signed Cargo shared-GC mount boundary
on:
  workflow_dispatch:
    inputs:
      task:
        description: Exercise the private mount-namespace fixture
        required: true
        type: choice
        options: [signed-gc-mount, qualify-gc-mount]
permissions:
  contents: read
jobs:
  gc:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-signed21-gc-mounted-storage-20261030' && inputs.task == 'signed-gc-mount'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: scripts/gc-mount-evidence
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: signed-reader
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate the original signed SDK against the private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
          mkdir -m700 "$RUNNER_TEMP/gc-signed21"
          python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/gc-signed21"
      - name: Use only owned disposable storage and a private mount namespace
        run: |
          set -eu
          if ! command -v strace; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends strace; fi
          python3 -IB protocol/scripts/gc-mount-evidence/observe.py "$RUNNER_TEMP/gc-signed21"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signed21-native-gc-mount-facts
          path: |
            ${{ runner.temp }}/gc-signed21/packet
            ${{ runner.temp }}/gc-signed21/receipts/21
          retention-days: 7
          if-no-files-found: error
  builder:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-signed21-gc-mounted-storage-20261030' && inputs.task == 'qualify-gc-mount'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/gc-mount-evidence
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: signed-reader
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the enrolled release SDK for the source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
          mkdir -m700 "$RUNNER_TEMP/gc-compiler-build"
          python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/gc-compiler-build"
      - name: Build native Cargo from the locally sealed complete source
        run: |
          set -eu
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends ninja-build build-essential cmake pkg-config perl libssl-dev
          python3 -IB protocol/scripts/gc-mount-evidence/build_candidate.py "$RUNNER_TEMP/gc-compiler-build" "$GITHUB_WORKSPACE/protocol/scripts/ohm-apple-zmij/cargo293/source.pack"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disposable-gc-qualified-cargo
          path: ${{ runner.temp }}/gc-compiler-build/deliver
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gc-qualified-cargo-build-record
          path: ${{ runner.temp }}/gc-compiler-build/build-cert
          if-no-files-found: warn
          retention-days: 7
  paired:
    if: inputs.task == 'qualify-gc-mount'
    needs: builder
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: scripts/gc-mount-evidence
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: signed-reader
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the original signed distribution and verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
          mkdir -m700 "$RUNNER_TEMP/gc-mount-qualification"
          python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$RUNNER_TEMP/gc-mount-qualification"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: disposable-gc-qualified-cargo
          path: ${{ runner.temp }}/candidate-download
      - name: Exercise unprivileged public GC on signed and source-fixed Cargo
        run: |
          set -eu
          if ! command -v strace; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends strace; fi
          python3 -IB protocol/scripts/gc-mount-evidence/compare.py "$RUNNER_TEMP/gc-mount-qualification" "$RUNNER_TEMP/candidate-download"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gc-signed-vs-fixed-native-mounts
          path: |
            ${{ runner.temp }}/gc-mount-qualification/packet
            ${{ runner.temp }}/gc-mount-qualification/receipts/21
          retention-days: 7
          if-no-files-found: error
