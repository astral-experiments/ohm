name: Qualify the versioned Darwin native-link protocol and ordinary developer ty builds
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: apple-versioned-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  versioned-apple-provider:
    runs-on: namespace-profile-macos-15
    timeout-minutes: 360
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Freeze and verify subjects, provider design and native execution observer
        run: |
          root="$RUNNER_TEMP/apple-versioned-native"
          python3 -IB scripts/ohm-apple-zmij/run.py test_cgu scripts/ohm-apple-zmij/native-fixtures/developer-root-cgu-prior.zip
          if ! command -v b3sum >/dev/null; then brew install b3sum; fi
          b3sum --version
          python3 -IB scripts/ohm-apple-zmij/versioned_selftest.py
          python3 -IB scripts/ohm-apple-zmij/test_cli_images.py
          python3 -IB scripts/ohm-apple-zmij/test_provider_edges.py -v
          python3 -IB scripts/ohm-apple-zmij/run.py test_protocol -v
          python3 -IB scripts/ohm-apple-zmij/run.py pilot calibrate "$root"
          test -s "$root/receipts/observer.json"
          cp scripts/ohm-apple-zmij/versioned-plan.md "$root/receipts/registration.md"
      - name: Authenticate exact signed Apple release and seed the real locked Ruff repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/apple-versioned-native"
          mkdir "$root/assets"
          gh release download ohm-1.99.0-20 --repo "$GITHUB_REPOSITORY" --dir "$root/assets" --pattern 'ohm-1.99.0-20-aarch64-apple-darwin*'
          python3 -IB scripts/ohm-apple-zmij/run.py prepare release "$root" "$root/assets"
          python3 -IB scripts/ohm-apple-zmij/run.py objc2_cli seed "$root"
      - name: Bootstrap the exact Darwin-versioned CRC and ObjC compilers on identical stage0 inputs
        run: |
          root="$RUNNER_TEMP/apple-versioned-native"
          python3 -IB scripts/ohm-apple-zmij/run.py host "$root" 32
          if ! command -v ninja >/dev/null; then brew install ninja; fi
          (cd scripts/ohm-apple-zmij/source-transport && shasum -a 256 -c SHA256SUMS)
          python3 -IB scripts/ohm-apple-zmij/source-transport/prepare.py "$root/enrolled-rust" > "$root/receipts/public-source-transport.json"
          python3 -IB scripts/ohm-apple-zmij/source-transport/crc/prepare.py "$root/enrolled-rust" > "$root/receipts/crc-source-transport.json"
          python3 -IB scripts/ohm-apple-zmij/source-transport/objc2/prepare.py "$root/enrolled-rust" > "$root/receipts/objc2-source-transport.json"
          python3 -IB scripts/ohm-apple-zmij/source-transport/versioned/prepare_versioned.py rust "$root/enrolled-rust" > "$root/receipts/versioned-rust-source.json"
          python3 -IB scripts/ohm-apple-zmij/run.py prepare pair "$root" "$root/enrolled-rust"
      - name: Build exact classic and aware release Cargo images with the same signed builder on APFS
        run: |
          root="$RUNNER_TEMP/apple-versioned-native"
          python3 -IB scripts/ohm-apple-zmij/receipt_cargo.py build "$root"
          python3 -IB scripts/ohm-apple-zmij/receipt_cargo.py aware "$root"
      - name: Check native archives with signed Cargo in an ordinary development environment
        run: python3 -IB scripts/ohm-apple-zmij/versioned.py signed "$RUNNER_TEMP/apple-versioned-native"
      - name: Check native archives with classic Cargo in an ordinary development environment
        run: python3 -IB scripts/ohm-apple-zmij/versioned.py classic "$RUNNER_TEMP/apple-versioned-native"
      - name: Check native archives with aware Cargo in an ordinary development environment
        run: python3 -IB scripts/ohm-apple-zmij/versioned.py aware "$RUNNER_TEMP/apple-versioned-native"
      - name: Separately qualify both real zmij and zlib-rs on the versioned CRC parent and every receiver
        run: python3 -IB scripts/ohm-apple-zmij/versioned_registry.py "$RUNNER_TEMP/apple-versioned-native"
      - name: Check same-target Cargo upgrade and downgrade through the real provider changes
        run: python3 -IB scripts/ohm-apple-zmij/versioned.py migration "$RUNNER_TEMP/apple-versioned-native"
      - name: Exercise authentic and literal v1 and v2 paths in all three receivers
        run: |
          root="$RUNNER_TEMP/apple-versioned-native"
          python3 -IB scripts/ohm-apple-zmij/versioned.py named "$root"
          python3 -IB scripts/ohm-apple-zmij/versioned.py terminal "$root"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: apple-versioned-provider-and-migration
          path: ${{ runner.temp }}/apple-versioned-native/receipts
          retention-days: 14
          if-no-files-found: warn
      - name: Real ty builds in both orders, native links, invalid edits, clean matches and actual program behavior
        run: python3 -IB scripts/ohm-apple-zmij/run.py objc2_cli mechanism "$RUNNER_TEMP/apple-versioned-native"
      - name: Verify provider and real application outcomes
        run: |
          root="$RUNNER_TEMP/apple-versioned-native"
          python3 -IB -c 'import json, pathlib, sys; d=pathlib.Path(sys.argv[1]); assert json.loads((d/"provider-matrix/terminal.json").read_text())["passed"]; assert set(json.loads((d/"objc2-cli/mechanism.json").read_text())["orders"])=={"PC","CP"}' "$root/receipts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: apple-versioned-local-ty-traced
          path: ${{ runner.temp }}/apple-versioned-native/receipts
          retention-days: 14
          if-no-files-found: warn
      - name: Run two mirrored untraced pilots
        run: python3 -IB scripts/ohm-apple-zmij/run.py objc2_clock screen "$RUNNER_TEMP/apple-versioned-native"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: apple-versioned-local-ty-pilots
          path: ${{ runner.temp }}/apple-versioned-native/receipts
          retention-days: 14
          if-no-files-found: warn
      - name: Twelve independent balanced pairs and terminal empty builds
        run: python3 -IB scripts/ohm-apple-zmij/run.py objc2_clock confirmation "$RUNNER_TEMP/apple-versioned-native"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: apple-versioned-local-ty-final
          path: ${{ runner.temp }}/apple-versioned-native/receipts
          retention-days: 14
          if-no-files-found: warn
