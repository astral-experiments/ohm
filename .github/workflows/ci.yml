name: Compare upstream, signed and prior checked Cargo on the same GNU bundled provider
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  adjudicate:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-atomic-provider-declarations'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        role: [upstream, signed-off, strict-P, strict-C, signed-on]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Restore the enrolled upstream SDK or the immutable release and strict Cargo products
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          if [[ "$PROVIDER_ROLE" == upstream ]]; then
            sudo apt-get -qq update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user strace
          else
            bash scripts/ohm-gnu-syscall/ingress.sh
            export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
            export QA_ROOT="$RUNNER_TEMP/qualified-syscall"
            mkdir -p "$QA_ROOT/receipts"
            python3 -IB scripts/ohm-gnu-syscall/restore_prior.py
          fi
          python3 -IB scripts/ohm-gnu-atomic-provider/controls.py "$PROVIDER_ROLE"
      - name: Run actual Cargo and the GNU-linked AArch64 programs under each native provider declaration
        env:
          PROVIDER_ROLE: ${{ matrix.role }}
        run: python3 -IB scripts/ohm-gnu-atomic-provider/gate.py "$PROVIDER_ROLE"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: declared-atomic-provider-${{ matrix.role }}
          path: ${{ runner.temp }}/atomic-transitive-proof/receipt
          if-no-files-found: error
          retention-days: 14
