name: Independently reusable LLVM units with opaque assembly
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: llvm-opaque-cgu-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-and-ruff:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-cgu-opaque-asm-20261030'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the experiment source and install the cross toolchain
        run: |
          set -euo pipefail
          export QA_ROOT="$RUNNER_TEMP/opaque-asm-cgu"
          printf 'QA_ROOT=%s\n' "$QA_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$QA_ROOT/receipts" "$QA_ROOT/inbox"
          (cd scripts/ohm-aarch64-linux && sha256sum -c SHA256SUMS)
          (cd scripts/ohm-cgu-reuse && sha256sum -c SHA256SUMS)
          cp scripts/ohm-cgu-reuse/{plan.md,SHA256SUMS} "$QA_ROOT/receipts"
          git rev-parse HEAD > "$QA_ROOT/receipts/qa-head"
          python3 -IB scripts/ohm-aarch64-linux/qualify.py selftest
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user strace valgrind ninja-build
          cc -O2 -Wall -Wextra -o "$QA_ROOT/trace" scripts/ohm-aarch64-linux/trace-compilers.c
          strace -ff -qq -s 65535 -e trace=execve -o "$QA_ROOT/receipts/tracer-check" /bin/true
      - name: Download signed Linux release tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=ohm-1.99.0-20
          archive="$release-x86_64-unknown-linux-gnu"
          gh release download "$release" --repo "$GITHUB_REPOSITORY" --dir "$QA_ROOT/inbox" --pattern "$archive.tar.gz" --pattern "$archive.tar.gz.sha256" --pattern "$archive-provenance.json"
      - name: Produce the exact two native compilers and matching host and target libraries
        run: bash scripts/ohm-aarch64-linux/prepare.sh
      - name: Prove generic external assembly reads and mixed-unit behavior on the candidate
        run: bash scripts/ohm-aarch64-linux/prepare.sh test-host
      - name: Compare equal-stamp native guards, real Ruff edits and healthy independent clean builds
        run: python3 -IB scripts/ohm-cgu-reuse/study_cgu.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-opaque-cgu-ruff-screen
          path: ${{ runner.temp }}/opaque-asm-cgu/receipts
          retention-days: 14
          if-no-files-found: warn
