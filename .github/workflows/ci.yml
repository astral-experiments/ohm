name: Qualify saved code generation for Ruff executable examples
run-name: Ruff example replay ${{ inputs.phase }} at ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run the one-example safety gate or the six qualified package instruction comparisons
        type: choice
        required: true
        options:
          - gate
          - price
      reviewed_head:
        description: Exact reviewed nonrelease QA commit
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  qualify:
    if: inputs.phase == 'gate' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-example-replay-20261102' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    name: Physical matched Cargo and one genuine Ruff example
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-example-replay
            scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
          path: seed
          persist-credentials: false
          sparse-checkout: |
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 17981f5b807be81496282dd5a58e579e71586962
          path: historical
          persist-credentials: false
          sparse-checkout: scripts/gnu-example-ceiling
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install and record the GNU source-build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build strace build-essential cmake pkg-config libssl-dev perl
          command -v gh rustup cargo git strace ninja cc cmake pkg-config perl
          df -h "$RUNNER_TEMP"
      - name: Reopen both source-built Cargo programs and check actual native provider resolution
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
        run: |
          set -euo pipefail
          cd enrolled/scripts/ruff-example-replay
          sha256sum --strict --check SHA256SUMS
          python3 -IB study.py
      - name: Keep raw diagnostics and original physical process records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-example-replay-pilot
          path: ${{ runner.temp }}/ruff-example-replay/evidence
          if-no-files-found: warn
          retention-days: 14
  price:
    if: inputs.phase == 'price' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-example-replay-20261102' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    name: Ordinary examples and test builds on matched Cargo (${{ matrix.position }})
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        position: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-example-replay
            scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 17981f5b807be81496282dd5a58e579e71586962
          path: historical
          persist-credentials: false
          sparse-checkout: scripts/gnu-example-ceiling
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify tools before provenance capture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils strace zstd
          command -v gh rustup cargo git strace cc zstd
      - name: Measure complete ordinary commands and verify real build products
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          POSITION: ${{ matrix.position }}
        run: |
          set -euo pipefail
          cd enrolled/scripts/ruff-example-replay
          sha256sum --strict --check SHA256SUMS
          python3 -IB price.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-example-replay-price-${{ matrix.position }}
          path: ${{ runner.temp }}/ruff-example-price/evidence
          if-no-files-found: warn
          retention-days: 14
