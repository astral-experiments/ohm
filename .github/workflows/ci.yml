name: Run the source-placement compiler regression against both original toolchains
run-name: Native source-placement run-make specificity ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact enrolled QA commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 30
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PLACEMENT_FACTORY: 41475100027
      GH_TOKEN: ${{ github.token }}
      OUTPUT: ${{ github.workspace }}/native-evidence
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-experiments/ohm-rust
          ref: 531eb1980c08c75ccbf3f6b77adbee53cd9b8bd5
          path: rust-source
          persist-credentials: false
          sparse-checkout: |
            src/build_helper
            src/rustdoc-json-types
            src/tools/run-make-support
      - name: Run the repository test with the physically authenticated toolkit
        run: python3 -IB qa/scripts/placed-object-run-make/worker.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: placed-object-run-make-proof
          path: native-evidence
          if-no-files-found: error
          retention-days: 10
