name: Validate uv check queries
run-name: Query validation (${{ inputs.kits }} vs ${{ inputs.prototype }})
on:
  workflow_dispatch:
    inputs:
      kits:
        description: Build run with a control compiler in sdk-candidate
        required: true
      prototype:
        description: Build run with a candidate compiler in sdk-candidate
        required: true
      pairs:
        description: JSON list of pair numbers
        default: '[1,2]'
      rust_source:
        description: Rust source for correctness checks
        default: 'cd98e8497afea884845b172374fd47957ef39666'
      checks:
        description: Include correctness tests on pair 1
        type: boolean
        default: true
permissions:
  contents: read
  actions: read

jobs:
  measure:
    name: Measure pair ${{ matrix.pair }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(inputs.pairs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/uv
          ref: c99faeeeeb8318d874007b4c48635d009838c1a0
          fetch-depth: 21
          persist-credentials: false
          path: uv
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.kits != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.kits }}
          name: sdk-candidate
          path: ${{ runner.temp }}/kits
      - name: Stage the first candidate kit as the control
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/repack"
          tar -C "$RUNNER_TEMP/repack" --zstd -xf "$RUNNER_TEMP/kits/candidate.tar.zst"
          mv "$RUNNER_TEMP/repack/candidate" "$RUNNER_TEMP/repack/control"
          tar -C "$RUNNER_TEMP/repack" -cf - control | zstd -T4 -1 > "$RUNNER_TEMP/kits/control.tar.zst"
          mv "$RUNNER_TEMP/kits/candidate.tar.zst" "$RUNNER_TEMP/repack/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.prototype != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prototype }}
          name: sdk-candidate
          path: ${{ runner.temp }}/kits
      - name: Measure the first root check after each edit
        env:
          RUSTC_KITS: ${{ inputs.kits }}
        run: bash scripts/uv-check-instructions/measure.sh ${{ matrix.pair }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.pair == 1 && inputs.checks
        with:
          repository: astral-experiments/ohm-rust
          ref: ${{ inputs.rust_source }}
          path: source
          persist-credentials: false
      - name: Compare fresh and incremental compilers across fixtures and run focused regressions
        if: matrix.pair == 1 && inputs.checks
        run: python3 scripts/uv-check-instructions/validate.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pair-${{ matrix.pair }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30
