name: Qualify the branch-return Full and Packed native Rust compilers
run-name: Branch-return source ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact source-qualification packaging SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-branch-return-source-20261031' && github.run_attempt == '1' && inputs.reviewed_head == github.sha
    name: Exact Full and Packed source, Rust tests and native providers
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 300
    env:
      QA_ROOT: /tmp/ohm-gnu-renderer-source-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-return-source
            scripts/ohm-packed-ruff
            scripts/ohm-apple-zmij/source-transport
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a4afd181ae07107de6174a17a4ec189061fd18aa
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts/gnu-renderer-cgu-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
          path: signed-source
          persist-credentials: false
          sparse-checkout: scripts/strict-mixed-generics
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          path: signed-reader
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify immutable sources and native tool prerequisites
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C trusted rev-parse HEAD)" = a4afd181ae07107de6174a17a4ec189061fd18aa
          test "$(git -C signed-source rev-parse HEAD)" = d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
          test "$(git -C signed-reader rev-parse HEAD)" = f40b16cdb9c041c941a5e339f816111a80a84bdf
          for d in scripts/branch-return-source scripts/ohm-packed-ruff scripts/ohm-packed-ruff/full-cli scripts/ohm-apple-zmij/source-transport trusted/scripts/gnu-renderer-cgu-source; do
            (cd "$d" && sha256sum --status --strict --check SHA256SUMS)
          done
          mkdir "$QA_ROOT" "$QA_ROOT/receipts"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils ca-certificates clang cmake curl git lld libssl-dev ninja-build perl pkg-config strace time util-linux zstd
          dpkg-query -W build-essential binutils clang cmake git lld libssl-dev ninja-build pkg-config strace time zstd > "$QA_ROOT/receipts/native-packages.tsv"
          for tool in rustup rustc rustdoc cargo ldd cc ar readelf strace gh zstd; do command -v "$tool"; done > "$QA_ROOT/receipts/commands.txt"
          python3 -IB scripts/ohm-apple-zmij/source-transport/prepare.py "$QA_ROOT/rust" > "$QA_ROOT/receipts/public-source.json"
          python3 -IB signed-source/scripts/strict-mixed-generics/source.py materialize "$QA_ROOT/rust" parent > "$QA_ROOT/receipts/signed-source.json"
      - name: Reopen normal GNU native tools from the signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB signed-reader/scripts/packaged-release-workspace/packages.py 21 "$QA_ROOT/packages"
      - name: Independently bootstrap both complete SDKs and exercise branch flags, corruption and native input changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/branch-return-source/qualify.py "$GITHUB_WORKSPACE/trusted"
      - if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-return-source-sdk
          path: /tmp/ohm-gnu-renderer-source-native/transfer/
          compression-level: 0
          if-no-files-found: error
          retention-days: 21
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-return-source-observations
          path: |
            /tmp/ohm-gnu-renderer-source-native/receipts
            /tmp/ohm-gnu-renderer-source-native/packages/receipts
          compression-level: 1
          if-no-files-found: warn
          retention-days: 21
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-return-unqualified-partial-native
          path: /tmp/ohm-gnu-renderer-source-native/transfer/
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
