name: Build corrected Ohm -22 GNU compilers for the uv root benchmark
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        type: string
        required: true
        description: Exact qualification commit
permissions: {}
jobs:
  build:
    name: Production GNU SDK (${{ matrix.arm }})
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-ctfe22-gnu-20988' && github.sha == inputs.reviewed_head
    permissions:
      contents: read
    outputs:
      stock_sdk_id: ${{ steps.binding.outputs.stock_sdk_id }}
      stock_sdk_sha: ${{ steps.binding.outputs.stock_sdk_sha }}
      stock_qa_id: ${{ steps.binding.outputs.stock_qa_id }}
      stock_qa_sha: ${{ steps.binding.outputs.stock_qa_sha }}
      traits_sdk_id: ${{ steps.binding.outputs.traits_sdk_id }}
      traits_sdk_sha: ${{ steps.binding.outputs.traits_sdk_sha }}
      traits_qa_id: ${{ steps.binding.outputs.traits_qa_id }}
      traits_qa_sha: ${{ steps.binding.outputs.traits_qa_sha }}
    strategy:
      fail-fast: false
      matrix:
        arm:
          - stock_ctfe318
          - fa7a_stack_ctfe318
    runs-on: nscloud-ubuntu-24.04-amd64-16x80
    timeout-minutes: 360
    env:
      BENCH_ARM: ${{ matrix.arm }}
      OHM_TOOLCHAIN: ohm-1.99.0-22
      OHM_TARGET: x86_64-unknown-linux-gnu
      PYTHONDONTWRITEBYTECODE: "1"
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Check out the pinned release build scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 8c7d5b4500fdfa6e2234417340aa190e5787e513
          path: release-reference
          sparse-checkout: |-
            scripts
            release
            toolchains
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b
          path: source-carrier
          persist-credentials: false
          sparse-checkout: scripts/rc22-private-export-ice
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27
          path: transport
          persist-credentials: false
          sparse-checkout: scripts/rc22-native
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
          path: public-seed
          persist-credentials: false
          sparse-checkout: scripts/ohm-apple-zmij/source-transport
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
          path: signed-rust
          persist-credentials: false
          sparse-checkout: scripts/strict-mixed-generics
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
          path: cargo-seed
          persist-credentials: false
          sparse-checkout: |-
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - name: Verify the disposable runner and report capacity
        run: |
          set -euo pipefail
          mkdir trait-evidence
          df -B1 "$GITHUB_WORKSPACE" | tee trait-evidence/capacity-initial.txt
          python3 -c 'import os,shutil; w=os.environ["GITHUB_WORKSPACE"]; assert shutil.disk_usage(w).free >= 300*2**30, "production GNU build requires 300 GiB initially available"'
      - name: Reconstruct and verify the exact compiler source
        run: python3 -IB scripts/ctfe22-gnu/materialize.py "$BENCH_ARM"
      - name: Install native GNU bootstrap prerequisites
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config perl libssl-dev zstd clang lld curl
      - name: Install pinned LLVM BOLT tools
        env:
          MANIFEST_PATH: toolchains/1.99.0/22.json
        run: |
          if [[ "$(dpkg --print-architecture)" != amd64 ]]; then
            echo 'LLVM BOLT tools require an amd64 Linux runner' >&2
            exit 1
          fi

          case "$(jq -er '.release.upstream_rust_version' "$MANIFEST_PATH")" in
            1.97.* | 1.98.*)
              bolt_major=22
              bolt_version='22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80'
              bolt_sha256='97a9e4e8d2b2219757c38abef93e913793ebc64580aa51207bd23941c44ec070'
              runtime_sha256='48639dafeb45892eec58f5d8a2d0d612ce791a2f713f06c794b71d6a72fa582d'
              ;;
            1.99.*)
              bolt_major=23
              bolt_version='23.1.2'
              bolt_sha256='b5ed9675149cc837c282e9b6962c276c9fa62863d5b2f91537b60848552995b7'
              ;;
            *)
              echo 'Pin matching LLVM BOLT tools for this Rust version' >&2
              exit 1
              ;;
          esac
          bolt_root="$(mktemp -d "${RUNNER_TEMP:?}/ohm-bolt.XXXXXX")"
          if [[ "$bolt_major" == 23 ]]; then
            bolt_archive="$bolt_root/llvm.tar.xz"
            bolt_directory="LLVM-$bolt_version-Linux-X64"
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --fail --location --retry 3 --show-error --silent \
              --output "$bolt_archive" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-$bolt_version/$bolt_directory.tar.xz"
            printf '%s  %s\n' "$bolt_sha256" "$bolt_archive" | sha256sum --check --strict
            # Leave llvm-profdata for the build to link from Rust's matching LLVM.
            tar -xJf "$bolt_archive" -C "$bolt_root" --strip-components=1 --occurrence=1 \
              "$bolt_directory/bin/llvm-bolt" \
              "$bolt_directory/bin/merge-fdata" \
              "$bolt_directory/lib/libbolt_rt_hugify.a" \
              "$bolt_directory/lib/libbolt_rt_instr.a"
            rm "$bolt_archive"
            bolt_llvm_dir="$bolt_root"
          else
            bolt_base_url="https://apt.llvm.org/noble/pool/main/l/llvm-toolchain-$bolt_major"
            for package in "bolt-$bolt_major" "libbolt-$bolt_major-dev"; do
              curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --fail --location --retry 3 --show-error --silent \
                --output "$bolt_root/$package.deb" \
                "$bolt_base_url/${package}_${bolt_version}_amd64.deb"
            done

            printf '%s  %s\n' \
              "$bolt_sha256" \
              "$bolt_root/bolt-$bolt_major.deb" \
              "$runtime_sha256" \
              "$bolt_root/libbolt-$bolt_major-dev.deb" \
              | sha256sum --check --strict

            dpkg-deb --extract "$bolt_root/bolt-$bolt_major.deb" "$bolt_root"
            dpkg-deb --extract "$bolt_root/libbolt-$bolt_major-dev.deb" "$bolt_root"
            bolt_llvm_dir="$bolt_root/usr/lib/llvm-$bolt_major"
          fi
          "$bolt_llvm_dir/bin/llvm-bolt" --version
          "$bolt_llvm_dir/bin/merge-fdata" --version
          if [[ ! -f "$bolt_llvm_dir/lib/libbolt_rt_instr.a" ]]; then
            echo 'LLVM BOLT instrumentation runtime is missing' >&2
            exit 1
          fi

          printf 'OHM_BOLT_LLVM_DIR=%s\n' "$bolt_llvm_dir" >> "$GITHUB_ENV"
        working-directory: release-reference
      - name: Prepare pinned Wild linker
        env:
          MANIFEST_PATH: toolchains/1.99.0/22.json
        run: |
          wild_directory="$(python3 scripts/prepare-wild.py \
            "$MANIFEST_PATH" "$OHM_TARGET" "$RUNNER_TEMP/ohm-wild")"
          printf 'OHM_WILD_LINKER_DIR=%s\n' "$wild_directory" >> "$GITHUB_ENV"
        working-directory: release-reference
      - name: Build the production PGO and BOLT distribution
        shell: bash
        run: |-
          set -euo pipefail
          release-reference/scripts/build-optimized-dist.sh "$OHM_TARGET" "$OHM_TOOLCHAIN" "$GITHUB_WORKSPACE/source/rust" "$GITHUB_WORKSPACE/release-reference/release/bootstrap.toml" 2>&1 | tee trait-evidence/build.log
      - name: Verify the production SDK and exercise the original regression
        run: python3 -ISB scripts/ctfe22-gnu/native.py "$BENCH_ARM"
      - name: Upload the native-qualified SDK
        id: sdk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ctfe22-gnu-sdk-${{ matrix.arm }}
          path: trait-sdk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain role identity, release build and native diagnostics
        if: always()
        id: qa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ctfe22-gnu-build-${{ matrix.arm }}-attempt-${{ github.run_attempt }}
          path: trait-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Bind successful role inputs to the artifact service receipts
        id: binding
        env:
          SDK_ID: ${{ steps.sdk.outputs.artifact-id }}
          SDK_SHA: ${{ steps.sdk.outputs.artifact-digest }}
          QA_ID: ${{ steps.qa.outputs.artifact-id }}
          QA_SHA: ${{ steps.qa.outputs.artifact-digest }}
        run: |-
          python3 -ISB - <<'PYTHON'
          import os,re
          e=os.environ
          key={'stock_ctfe318':'stock','fa7a_stack_ctfe318':'traits'}[e['BENCH_ARM']]
          with open(e['GITHUB_OUTPUT'],'a') as f:
              for k in ('SDK_ID','SDK_SHA','QA_ID','QA_SHA'):
                  v=e[k].removeprefix('sha256:')
                  assert re.fullmatch(r'[1-9]\d*' if k.endswith('_ID') else '[0-9a-f]{64}',v)
                  print(key+'_'+k.lower()+'='+v,file=f)
          PYTHON
  pair:
    name: Qualify both cache migration directions
    needs: build
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-ctfe22-gnu-20988' && github.sha == inputs.reviewed_head
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      STOCK_SDK_ID: ${{ needs.build.outputs.stock_sdk_id }}
      STOCK_SDK_SHA: ${{ needs.build.outputs.stock_sdk_sha }}
      STOCK_QA_ID: ${{ needs.build.outputs.stock_qa_id }}
      STOCK_QA_SHA: ${{ needs.build.outputs.stock_qa_sha }}
      TRAITS_SDK_ID: ${{ needs.build.outputs.traits_sdk_id }}
      TRAITS_SDK_SHA: ${{ needs.build.outputs.traits_sdk_sha }}
      TRAITS_QA_ID: ${{ needs.build.outputs.traits_qa_id }}
      TRAITS_QA_SHA: ${{ needs.build.outputs.traits_qa_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check pair input IDs and available space
        run: |
          python3 -ISB - <<'PYTHON'
          import os,re,shutil
          e=os.environ
          ids=[e[r+'_'+k+'_ID'] for r in ('STOCK','TRAITS') for k in ('SDK','QA')]
          assert len(set(ids))==4 and all(re.fullmatch(r'[1-9]\d*',v) for v in ids)
          assert shutil.disk_usage(e['GITHUB_WORKSPACE']).free >= 6*2**30, 'need 6 GiB free for both compiler archives and validated installs'
          PYTHON
      - name: Download stock_ctfe318 sdk by immutable service ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.stock_sdk_id }}
          path: intake/stock_ctfe318
          merge-multiple: true
      - name: Download stock_ctfe318 qa by immutable service ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.stock_qa_id }}
          path: intake/stock_ctfe318-qa
          merge-multiple: true
      - name: Download fa7a_stack_ctfe318 sdk by immutable service ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.traits_sdk_id }}
          path: intake/fa7a_stack_ctfe318
          merge-multiple: true
      - name: Download fa7a_stack_ctfe318 qa by immutable service ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.traits_qa_id }}
          path: intake/fa7a_stack_ctfe318-qa
          merge-multiple: true
      - name: Verify the archives and exercise bidirectional cache rejection
        run: python3 -ISB scripts/ctfe22-gnu/pair.py
      - name: Retain paired source and cache qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ctfe22-gnu-pair-qa-attempt-${{ github.run_attempt }}
          path: pair-evidence/
          if-no-files-found: warn
          retention-days: 14
