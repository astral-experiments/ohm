name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gnu-versioned-native-four-way-20261030
  cancel-in-progress: false
jobs:
  block:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-versioned-native-20261030'
    name: Source-bound GNU marker, native provider and migration ${{ matrix.block }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        block: ["direct","signed","classic","aware","migrate-signed","migrate-classic","named","legacy-writer"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the prospective registration and the exact physical tools
        run: |
          set -euo pipefail
          export QA_ROOT="$RUNNER_TEMP/versioned-gnu-native"
          mkdir -p "$QA_ROOT/inputs" "$QA_ROOT/receipts"
          printf 'QA_ROOT=%s\n' "$QA_ROOT" >> "$GITHUB_ENV"
          for family in ohm-aarch64-registers ohm-aarch64-compact ohm-aarch64-confirm ohm-aarch64-fallback ohm-aarch64-versioned; do
            (cd "scripts/$family" && sha256sum -c SHA256SUMS)
          done
          cp scripts/ohm-aarch64-versioned/{NATIVE.md,qualified-builds.json,SHA256SUMS} "$QA_ROOT/receipts/"
          git rev-parse HEAD > "$QA_ROOT/receipts/qa-head"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user strace valgrind zstd b3sum
          dpkg-query -W gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu qemu-user strace valgrind > "$QA_ROOT/receipts/packages"
          echo 'def5fdcf6ae64a4d3e6af3786b622978d8313e0734ecf3f6cbe71d8be9e274c8  /usr/bin/valgrind.bin' | sha256sum -c -
          python3 -IB scripts/ohm-aarch64-linux/qualify.py selftest
      - name: Read back matched compiler and Cargo source products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -IB scripts/ohm-aarch64-versioned/acquire_builds.py
          python3 -IB scripts/ohm-aarch64-fallback/acquire.py
      - name: Apply actual GNU marker and provider gates
        env:
          MODE: ${{ matrix.block }}
        run: |
          set -euo pipefail
          case "$MODE" in
            direct) python3 -IB scripts/ohm-aarch64-versioned/direct_restored.py ;;
            named) python3 -IB scripts/ohm-aarch64-versioned/named.py "$QA_ROOT/inputs" ;;
            *) python3 -IB scripts/ohm-aarch64-versioned/safety.py "$MODE" "$QA_ROOT/inputs" ;;
          esac
      - name: Retain all native terminals, products and profiles even if incomplete
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-versioned-native-${{ matrix.block }}
          path: ${{ runner.temp }}/versioned-gnu-native/receipts
          retention-days: 7
          if-no-files-found: error
