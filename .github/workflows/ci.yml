name: Replay Ohm edits
run-name: Qualify Ohm −11 against −10 (${{ inputs.label }})
on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        required: true
      run:
        type: string
        default: '45266418319'
      candidate:
        type: string
        default: '11'
      kits:
        type: string
        default: '{}'
      cases:
        type: string
        required: true
      pairs:
        type: string
        default: '[1,2]'
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: inputs.label != 'loader' && inputs.label != 'build-actual'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.cases) }}
        pair: ${{ fromJSON(inputs.pairs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the published −10 SDK
        run: |
          mkdir -p kits/10
          name=ohm-1.100.0-10
          curl -fsSL --retry 5 "https://github.com/astral-experiments/ohm/releases/download/$name/$name-x86_64-unknown-linux-gnu.tar.gz" -o kits/10/kit.tar.gz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run }}
          name: ohm-1.100.0-${{ inputs.candidate }}-x86_64-unknown-linux-gnu
          path: kits/11
      - name: Replay both SDKs
        env:
          REPLAY_MODE: ${{ inputs.label }}
          PAIR: ${{ matrix.pair }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if [[ $(cat /proc/sys/kernel/perf_event_paranoid) -gt 2 ]]; then sudo sysctl kernel.perf_event_paranoid=2; fi
          args="$SCENARIO/$PAIR"
          main=replay/replay.py
          sudo unshare --mount --propagation private bash replay/session.sh "$USER" "$args" "$PWD:$PATH" "$GITHUB_STEP_SUMMARY" "$main" "$REPLAY_MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.scenario }}-${{ matrix.pair }}
          path: counts/
          if-no-files-found: error
          retention-days: 30
