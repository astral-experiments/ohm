name: Ohm release instruction comparison
run-name: uv history on Ohm 1.100.0-2 and 1.100.0-3
on:
  workflow_dispatch:
    inputs:
      candidate:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  measure:
    name: 20 uv merges, pair ${{ matrix.pair }}
    runs-on: namespace-profile-ubuntu-24-04-16
    strategy:
      fail-fast: false
      matrix:
        workload: [history]
        pair: [1,2,3,4,5,6]
    timeout-minutes: 45
    env:
      WORKLOAD: ${{ matrix.workload }}
      PAIR: ${{ matrix.pair }}
      BASELINE_ONLY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/uv
          ref: c99faeeeeb8318d874007b4c48635d009838c1a0
          fetch-depth: 21
          persist-credentials: false
          path: source
      - name: Obtain the previous release
        run: |
          tag=ohm-1.100.0-2
          prefix=$tag-x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/control"
          cd "$RUNNER_TEMP/control"
          for file in "$prefix.tar.gz" "$prefix.tar.gz.sha256" "$prefix-provenance.json"; do
            curl --retry 5 -fsSLO "https://github.com/astral-experiments/ohm/releases/download/$tag/$file"
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate }}
          name: ohm-1.100.0-3-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/candidate
      - name: Verify the SDKs, calibrate the meter, replay the edits
        run: |
          if [[ "$(cat /proc/sys/kernel/perf_event_paranoid)" -gt 2 ]]; then
            sudo sysctl kernel.perf_event_paranoid=2
          fi
          export CARGO_HOME="$RUNNER_TEMP/registry"
          python3 scripts/uv-check-instructions/workload.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.workload }}-${{ matrix.pair }}
          path: ${{ runner.temp }}/results
          if-no-files-found: error
          retention-days: 30
  report:
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: results
      - run: python3 scripts/uv-check-instructions/report.py results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: summary
          path: results/summary.json
          retention-days: 30

