name: Focused Darwin Diesel compiler archive comparison
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed QA source commit
        required: true
        type: string
permissions: {}
concurrency:
  group: sealed-darwin-diesel-archives
  cancel-in-progress: false
jobs:
  replay:
    name: Escrow natural and independent Diesel B libraries on the restored instrumented Apple SDK
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-diesel-instrumented-archives-20261101' && github.run_attempt == 1 && github.sha == inputs.reviewed_head
    runs-on: macos-15
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
        persist-credentials: false
    - name: Verify isolated QA source and preserve the native environment
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^)" = 87d296ac3b05648c082193fdb91d1145652797ff
        git diff --exit-code HEAD^ HEAD -- . ':!scripts/diesel-stage2-archives' ':!scripts/diesel-stage2-repeat/repeat.py' ':!scripts/diesel-stage2-repeat/SHA256SUMS' ':!.github/workflows/ci.yml'
        (cd scripts/darwin-pgo-diesel && shasum -a 256 --check SHA256SUMS)
        (cd scripts/diesel-stage2-repeat && shasum -a 256 --check SHA256SUMS)
        (cd scripts/diesel-stage2-archives && shasum -a 256 --check SHA256SUMS)
        ./scripts/prepare-hosted-macos-release.sh
        test "$(uname -m)" = arm64
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: rust-lang/rustc-perf
        ref: 0a054b0ead56e41a4584bfab6fdc1a5fad2aedc3
        path: source/rust/build/opt-artifacts/rustc-perf
        persist-credentials: false
    - name: Install matching LLVM tools for native PGO
      env:
        MANIFEST_PATH: toolchains/1.99.0/22.json
      run: |
        case "$(jq -er '.release.upstream_rust_version' "$MANIFEST_PATH")" in
          1.97.* | 1.98.*) exit 0 ;;
          1.99.*)
            clang_version=23.1.2
            clang_sha256=d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1
            ;;
          *)
            echo 'Pin matching Clang for this Rust version' >&2
            exit 1
            ;;
        esac

        # Native PGO and ThinLTO require matching LLVM formats.
        clang_root="$(mktemp -d "${RUNNER_TEMP:?}/ohm-clang.XXXXXX")"
        clang_archive="$clang_root/clang.tar.xz"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
          --fail --location --retry 3 --show-error --silent \
          --output "$clang_archive" \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-$clang_version/LLVM-$clang_version-macOS-ARM64.tar.xz"
        printf '%s  %s\n' "$clang_sha256" "$clang_archive" | shasum -a 256 --check
        tar -xf "$clang_archive" -C "$clang_root" --strip-components=1
        rm "$clang_archive"
        "$clang_root/bin/clang" --version
        "$clang_root/bin/clang++" --version
        ln -s clang "$clang_root/bin/cc"
        ln -s llvm-ar "$clang_root/bin/ar"
        ln -s llvm-ranlib "$clang_root/bin/ranlib"
        ln -s llvm-nm "$clang_root/bin/nm"
        printf '%s\n' "$clang_root/bin" >> "$GITHUB_PATH"
        {
          printf 'CC=%s\n' "$clang_root/bin/clang"
          printf 'CXX=%s\n' "$clang_root/bin/clang++"
          printf 'AR=%s\n' "$clang_root/bin/llvm-ar"
          printf 'RANLIB=%s\n' "$clang_root/bin/llvm-ranlib"
          printf 'SDKROOT=%s\n' "$(xcrun --sdk macosx --show-sdk-path)"
        } >> "$GITHUB_ENV"
    - name: Authenticate source run and restore each of 3070 captured SDK paths
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 -IB scripts/diesel-stage2-repeat/test_replay.py
        python3 -IB scripts/diesel-stage2-archives/test_contact.py
        python3 -IB scripts/diesel-stage2-repeat/intake.py restore "$RUNNER_TEMP/diesel-repeat" "$GITHUB_WORKSPACE/source/rust/build/aarch64-apple-darwin/stage2" "$RUNNER_TEMP/diesel-repeat/reports"
    - name: Prepare the original collector source and verify physical compiler identities
      run: |
        rustup toolchain install 1.98.0 --profile minimal --no-self-update
        python3 -IB scripts/diesel-stage2-repeat/repeat.py prepare
    - name: Run only the original focused Diesel Opt history and escrow the complete natural B products and incoming state
      id: focused
      run: python3 -IB scripts/diesel-stage2-archives/contact.py focused
    - name: Upload the natural compiler outputs and complete original seed before any direct replay
      id: original
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: diesel-native-archive-original
        path: ${{ runner.temp }}/diesel-repeat/reports
        if-no-files-found: error
        retention-days: 14
    - name: Compare two ordinary B readers, one explicit loaded B, a fresh unit and the separate closed-jobserver control
      id: replays
      if: steps.focused.outcome == 'success' && steps.original.outcome == 'success'
      run: python3 -IB scripts/diesel-stage2-archives/contact.py trials
    - name: Stop the read-only jobserver handoff
      if: always()
      run: python3 -IB scripts/diesel-stage2-archives/contact.py stop
    - name: Preserve each complete replay archive, standalone metadata, native process and archive breakdown
      if: always() && steps.replays.outcome != 'skipped'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: diesel-native-archive-replays
        path: |
          ${{ runner.temp }}/diesel-repeat/reports/archives/replays
          ${{ runner.temp }}/diesel-repeat/archive-handoff/broker.log
        if-no-files-found: error
        retention-days: 14
