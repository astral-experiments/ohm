name: Measure a fixed-branch Ruff parser edit on signed GNU Ohm
run-name: One-file GNU parser edit ${{ inputs.reviewed_head }}
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed QA commit
        required: true
        type: string
      previous_boots:
        description: Frozen prior six and first-A custody; the two additional refused hosts are bound by the reviewed source
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-one-file-saved-link-20261101' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 90
    name: Signed GNU Ruff one-file parser edit
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-one-file-parser
            scripts/ruff-default-owner-pmu
            scripts/ohm-packed-ruff
            scripts/branch-return-pmu
            scripts/branch-storage-e-confirmation/review
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: collector
          persist-credentials: false
          sparse-checkout: scripts/gnu-example-ceiling
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 42ab30fd5e6bcdcf908df81de9baac65ca64fbf9
          path: contract
          persist-credentials: false
          sparse-checkout: scripts/notebook-fanout-ceiling
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Test the source, retained native outcomes and parser mutations
        run: |
          set -euo pipefail
          test "$(git -C enrolled rev-parse HEAD)" = "$REVIEWED_HEAD"
          (cd enrolled && sha256sum --strict --check --status scripts/ruff-one-file-parser/SHA256SUMS)
          python3 -IB enrolled/scripts/ruff-default-owner-pmu/test_attribution.py "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract"
          python3 -IB enrolled/scripts/ruff-one-file-parser/test_onefile.py "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract"
          python3 -IB enrolled/scripts/ruff-one-file-parser/test_saved_link.py "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract"
          python3 -IB enrolled/scripts/ruff-one-file-parser/verify.py --help >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential git libssl-dev zstd
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
      - name: Install signed GNU SDK and bind previous boots
        env:
          GH_TOKEN: ${{ github.token }}
          EXCLUDED_BOOT_CUSTODY: ${{ inputs.previous_boots }}
        run: python3 -IB enrolled/scripts/ruff-one-file-parser/intake.py
      - name: Run the two normal fixed-branch workloads
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-repair-tables-pilot/guards.py watch "$base/work" "$base/logs" "$base/logs/resource" python3 -IB enrolled/scripts/ruff-one-file-parser/run.py "$GITHUB_WORKSPACE/collector" "$GITHUB_WORKSPACE/contract"
      - name: Independently reopen the ordinary counters and native products
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-one-file-parser/verify.py --directory "$base/logs" --head "$REVIEWED_HEAD" --collector "$GITHUB_WORKSPACE/collector" --contract "$GITHUB_WORKSPACE/contract" > "$base/accepted.json"
          mv "$base/accepted.json" "$base/logs/accepted.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-gnu-ruff-one-file-parser
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          compression-level: 1
          include-hidden-files: true
          if-no-files-found: warn
