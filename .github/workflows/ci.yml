name: Observe Ruff examples on the packaged -20 and -21 Apple SDKs
on: workflow_dispatch
permissions:
  contents: read
  actions: read
concurrency:
  group: packaged-ruff-examples-${{ github.sha }}
  cancel-in-progress: false
jobs:
  examples:
    if: github.ref == 'refs/heads/charlie/qa-release21-ruff-examples'
    runs-on: namespace-profile-macos-15
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Exercise true native kernel custody and admitted source
        run: python3 -IB scripts/packaged-native-21/examples_controls.py
      - name: Authenticate original signed -20 and original private release-run -21 distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -IB scripts/packaged-native-21/packages.py 20 "$RUNNER_TEMP/packaged-examples"
          python3 -IB scripts/packaged-native-21/packages.py 21 "$RUNNER_TEMP/packaged-examples"
      - name: Build, run, edit, break and repair twelve public Ruff examples
        run: python3 -IB scripts/packaged-native-21/examples.py "$RUNNER_TEMP/packaged-examples"
      - name: Reopen fresh developer compiles, genuine Xcode link outputs and native program returns
        run: python3 -IB scripts/packaged-native-21/examples.py read "$RUNNER_TEMP/packaged-examples/receipts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: packaged-20-21-ruff-examples-apple
          path: ${{ runner.temp }}/packaged-examples/receipts
          retention-days: 14
          if-no-files-found: warn
