name: Qualify transitive GNU AArch64 native archive ownership
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  provider:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-atomic-transitive-provider-gate'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        role: [P, C]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Reopen both LLVM-built SDKs, strict Cargo reader and Linux cross toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/ohm-gnu-syscall/ingress.sh
          export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          export QA_ROOT="$RUNNER_TEMP/qualified-syscall"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/restore_prior.py
          python3 -IB - "${{ matrix.role }}" <<'PY'
          import pathlib,sys
          sys.path.insert(0,str(pathlib.Path('scripts/ohm-gnu-atomic-provider').resolve()))
          import sdk
          role=sys.argv[1]
          sdk.prepare(role,13018006260 if role=='C' else 0,
                      'a6bfc63d174184cf46ef452323c30ef2520f455da866be6998400d55f4d63582' if role=='C' else '')
          PY
      - name: Execute each ordinary Cargo command, force the root and producer separately, then start empty
        run: python3 -IB scripts/ohm-gnu-atomic-provider/gate.py "${{ matrix.role }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atomic-transitive-provider-${{ matrix.role }}
          path: ${{ runner.temp }}/atomic-transitive-proof/receipt
          if-no-files-found: error
          retention-days: 14
