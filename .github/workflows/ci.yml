name: uv edit replay
run-name: Replay the uv edit sequence with cache-eligible files
on:
  workflow_dispatch:
    inputs:
      orders:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        order: ${{ fromJSON(inputs.orders) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/uv
          ref: 63251e5ce54f03363a10c088d7f9f6d6ba268302
          fetch-depth: 4
          path: source
          persist-credentials: false
      - name: Download published −2
        if: contains(matrix.order, '2') || contains(matrix.order, 'l') || contains(matrix.order, 's')
        run: |
          mkdir -p kits/2
          name=ohm-1.100.0-2
          curl -fsSL --retry 4 "https://github.com/astral-experiments/ohm/releases/download/$name/$name-x86_64-unknown-linux-gnu.tar.gz" -o kits/2/kit.tar.gz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(matrix.order, '3')
        with:
          github-token: ${{ github.token }}
          run-id: '44754589323'
          name: ohm-1.100.0-3-x86_64-unknown-linux-gnu
          path: kits/3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(matrix.order, 'q')
        with:
          github-token: ${{ github.token }}
          run-id: '44648210123'
          name: linux-release-qualification-44648210123
          path: kits/q
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(matrix.order, 'e')
        with:
          github-token: ${{ github.token }}
          run-id: '44666699041'
          name: linux-release-qualification-44666699041
          path: kits/e
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(matrix.order, 'n')
        with:
          github-token: ${{ github.token }}
          run-id: '44733436429'
          name: linux-release-qualification-44733436429
          path: kits/n
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(matrix.order, 'f')
        with:
          github-token: ${{ github.token }}
          run-id: '44735982792'
          name: linux-release-qualification-44735982792
          path: kits/f
      - name: Measure the recorded commands
        env:
          ORDER: ${{ matrix.order }}
        run: |
          if [[ $(cat /proc/sys/kernel/perf_event_paranoid) -gt 2 ]]; then sudo sysctl kernel.perf_event_paranoid=2; fi
          cc -O2 scripts/llvm-check-instructions/meter.c -o meter
          sudo unshare --mount --propagation private bash scripts/llvm-check-instructions/session.sh "$USER" "$ORDER" "$PWD:$PATH" "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: uv-${{ matrix.order }}
          path: counts/

