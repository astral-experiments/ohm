name: Inspect the GNU AArch64 Ruff database build loop
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        default: baseline
        options: [baseline, compile, pilot]
permissions:
  contents: read
  actions: read
jobs:
  screen:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-atomic-ruff-db' && inputs.phase == 'baseline'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [build, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the GNU AArch64 SDK and the exact strict Cargo reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/ohm-gnu-syscall/ingress.sh
          export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          export QA_ROOT="$RUNNER_TEMP/qualified-syscall"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/restore_prior.py
          {
            echo "CENSUS_ROOT=$RUNNER_TEMP/observed-ruff-db"
            echo "CENSUS_SDK=$QA_ROOT/candidate-sdk"
            echo "CENSUS_CANDIDATE_RECORD=$QA_ROOT/receipts/candidate.json"
          } >> "$GITHUB_ENV"
      - name: Compile the actual edit, two unchanged visits, a broken edit and an independent clean build
        run: python3 -IB scripts/ohm-gnu-atomic-db/screen.py "${{ matrix.mode }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aarch64-atomic-ruff-db-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/qualified-syscall/receipts/candidate.json
            ${{ runner.temp }}/observed-ruff-db/receipts
          if-no-files-found: error
          retention-days: 7

  compile:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-atomic-ruff-db' && inputs.phase == 'compile'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Acquire the original host and cross bootstrap tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ohm-gnu-syscall/source-rebuild/prepare.sh
      - name: Build the registered compiler and both complete standard libraries
        run: python3 -IB scripts/ohm-gnu-atomic-db/build_candidate.py
      - if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-atomic-registered-compiler
          path: ${{ runner.temp }}/ohm-aarch64-linux-zmij/atomic-transfer
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-atomic-bootstrap-manifests
          path: ${{ runner.temp }}/ohm-aarch64-linux-zmij/receipts
          if-no-files-found: error
          retention-days: 14

  pilot:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-atomic-ruff-db' && inputs.phase == 'pilot'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [build, test]
        role: [P, C]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the GNU AArch64 SDK and the exact strict Cargo reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/ohm-gnu-syscall/ingress.sh
          export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          export QA_ROOT="$RUNNER_TEMP/qualified-syscall"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/restore_prior.py
          {
            echo "CENSUS_ROOT=$RUNNER_TEMP/observed-ruff-db"
            echo "CENSUS_SDK=$QA_ROOT/candidate-sdk"
            echo "CENSUS_CANDIDATE_RECORD=$QA_ROOT/receipts/candidate.json"
          } >> "$GITHUB_ENV"
      - name: Verify the registered compiler transfer and both complete SDK inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/ohm-gnu-atomic-db/sdk.py
      - name: Compile the actual edit, two unchanged visits, a broken edit and an independent clean build
        run: python3 -IB scripts/ohm-gnu-atomic-db/screen.py "${{ matrix.mode }}" "${{ matrix.role }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-atomic-pilot-${{ matrix.role }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/qualified-syscall/receipts/candidate.json
            ${{ runner.temp }}/observed-ruff-db/receipts
            ${{ runner.temp }}/atomic-subjects/*-sdk.json
            ${{ runner.temp }}/atomic-subjects/origin.json
            ${{ runner.temp }}/atomic-subjects/atomic-candidate.json
          if-no-files-found: error
          retention-days: 7
