name: Attribute GNU Ruff's two settled Wild links
run-name: Fourfix GNU Wild share ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Reviewed immutable commit for this one-host diagnostic
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  share:
    if: github.repository == 'astral-experiments/ohm' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/charlie/qa-ruff-gnu-wild-share-20261031' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    name: GNU fourfix Ruff CLI and integration-harness Wild instruction share
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: enrolled
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-wild-share
            scripts/ruff-integration-structure
            scripts/branch-return-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: media
          ref: 388aea2097619b9a66d0276258a764aa7fc6a4de
          persist-credentials: false
          sparse-checkout: scripts/rc22-cargo-regressions
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: source
          ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27
          persist-credentials: false
          sparse-checkout: scripts/rc22-native
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: observers
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          persist-credentials: false
          sparse-checkout: scripts/gnu-example-ceiling
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          path: ruff
          ref: 7b13f01ba1569887a25670820764b24c206da8e5
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify static source and small independent refusal fixtures
        run: |
          set -euo pipefail
          test "$(git -C enrolled rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C enrolled rev-parse HEAD:scripts/branch-return-pmu)" = 8036cb549845a905ab83882f5b01766229e0e636
          test "$(git -C enrolled rev-parse HEAD:scripts/ruff-integration-structure)" = 6f7323ccd20b1b495bb3c3161296d82c8a9a8981
          test "$(git -C observers rev-parse HEAD)" = 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          test "$(git -C media rev-parse HEAD)" = 388aea2097619b9a66d0276258a764aa7fc6a4de
          (cd enrolled/scripts/gnu-wild-share && sha256sum --strict -c SHA256SUMS)
          (cd enrolled/scripts/ruff-integration-structure && sha256sum --strict -c SHA256SUMS)
          (cd enrolled/scripts/branch-return-pmu && sha256sum --strict -c SHA256SUMS)
          python3 -IB enrolled/scripts/gnu-wild-share/test_share.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates git ninja-build strace util-linux zstd
      - name: Authenticate and reopen all 2473 members of the source-qualified fourfix SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=media/scripts/rc22-cargo-regressions
          python3 -IB "$d/media.py" check "$d/anchor.json" "$RUNNER_TEMP/catalog.json"
          python3 -IB "$d/media.py" get "$d/anchor.json" "$RUNNER_TEMP/source-sdk.zip"
          python3 -IB "$d/kit.py" "$RUNNER_TEMP/source-sdk.zip" source "$RUNNER_TEMP/rc22-kit" "$d/anchor.json"
      - name: Calibrate physical counters and qualify two actual linker outputs on ordinary unchanged Ruff
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
        run: |
          set -euo pipefail
          python3 -IB enrolled/scripts/gnu-wild-share/study.py "$RUNNER_TEMP/rc22-kit" ruff observers/scripts/gnu-example-ceiling
          python3 -IB enrolled/scripts/gnu-wild-share/verify.py "$RUNNER_TEMP/ohm-fourfix-wild-share/receipts" observers/scripts/gnu-example-ceiling
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fourfix-gnu-ruff-wild-share
          path: |
            ${{ runner.temp }}/ohm-fourfix-wild-share/receipts
            ${{ runner.temp }}/rc22-kit/qualified.json
            ${{ runner.temp }}/catalog.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          compression-level: 1
