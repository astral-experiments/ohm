name: Private target GC filesystem diagnosis
on:
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [baseline, qualify, suites, reattached]
        default: baseline
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-private-gc-overlay-20261031' && inputs.task == 'baseline'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: namespace-profile-ubuntu-24-04-16, fs: overlay}
          - {runner: ubuntu-24.04, fs: ext4}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: scripts/private-gc-overlay
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: reader
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate published -21 and prebuilt exact #306 Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/private-gc"
          mkdir -m700 "$root" "$root-input"
          python3 -IB reader/scripts/packaged-release-workspace/packages.py 21 "$root"
          gh api repos/astral-experiments/ohm/actions/artifacts/13021551412/zip >"$root-input/fixed.zip"
          echo "26b5b1fc36e6101a26098e05a38a9df4bfed2a2151a4045e4789543fc89f4cc0  $root-input/fixed.zip" | sha256sum -c -
          unzip -q "$root-input/fixed.zip" -d "$root-input/product"
      - name: Observe private profiles and real held locks
        run: |
          set -euo pipefail
          if ! command -v strace; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends strace; fi
          root="$RUNNER_TEMP/private-gc"
          for role in signed shared-fix; do
            python3 -IB protocol/scripts/private-gc-overlay/observe.py "$root" "$root-input/product" "$role" "$root/visits" "${{ matrix.fs }}"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-gc-${{ matrix.fs }}
          path: |
            ${{ runner.temp }}/private-gc/packet
            ${{ runner.temp }}/private-gc/receipts/21
          retention-days: 7
          if-no-files-found: error
  candidates:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-private-gc-overlay-20261031' && inputs.task == 'qualify'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        role: [standalone, combined]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/private-gc-overlay
            scripts/gc-mount-evidence
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: reader
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install verified signed -21 source-build toolchain and stable 1.99 suite compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/private-gc"
          mkdir -m700 "$root"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends strace libsecret-1-dev libssl-dev pkg-config
          rustup toolchain install 1.99.0 --profile minimal
          python3 -IB reader/scripts/packaged-release-workspace/packages.py 21 "$root"
      - name: Reopen complete product Git tree and build its feature-qualified Cargo
        run: python3 -IB protocol/scripts/private-gc-overlay/qualify.py build "${{ matrix.role }}" "$RUNNER_TEMP/private-gc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disposable-private-gc-${{ matrix.role }}
          path: ${{ runner.temp }}/private-gc/deliver
          retention-days: 3
          if-no-files-found: error
      - name: Public Cargo GC on actual overlay
        run: |
          root="$RUNNER_TEMP/private-gc"
          python3 -IB protocol/scripts/private-gc-overlay/observe.py "$root" "$root/deliver" "${{ matrix.role }}" "$root/visits" overlay
      - name: Original named library lock test and twelve original overlay integration cases
        if: '!cancelled()'
        run: python3 -IB protocol/scripts/private-gc-overlay/qualify.py tests "${{ matrix.role }}" "$RUNNER_TEMP/private-gc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-overlay-${{ matrix.role }}
          path: |
            ${{ runner.temp }}/private-gc/packet
            ${{ runner.temp }}/private-gc/build-cert
            ${{ runner.temp }}/private-gc/receipts/21
          retention-days: 7
          if-no-files-found: error
  ext4:
    needs: candidates
    if: '!cancelled() && inputs.task == ''qualify'''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        role: [standalone, combined]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/private-gc-overlay
            scripts/gc-mount-evidence
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: reader
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install original signed SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/private-gc"
          mkdir -m700 "$root"
          if ! command -v strace; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends strace; fi
          python3 -IB reader/scripts/packaged-release-workspace/packages.py 21 "$root"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: disposable-private-gc-${{ matrix.role }}
          path: ${{ runner.temp }}/download
      - name: Real ext4 held/released profile and an independent nested bind mount
        run: |
          root="$RUNNER_TEMP/private-gc"
          python3 -IB protocol/scripts/private-gc-overlay/observe.py "$root" "$RUNNER_TEMP/download" "${{ matrix.role }}" "$root/visits" ext4
          python3 -IB protocol/scripts/private-gc-overlay/mount_control.py "${{ matrix.role }}" "$root"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-ext4-${{ matrix.role }}
          path: ${{ runner.temp }}/private-gc/packet
          retention-days: 7
          if-no-files-found: error
  suite:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-private-gc-overlay-20261031' && inputs.task == 'suites'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [standalone, combined]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/private-gc-overlay
            scripts/gc-mount-evidence
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Reopen original exact registered source and official suite toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsecret-1-dev libssl-dev pkg-config
          rustup toolchain install 1.99.0 --profile minimal
          python3 -IB protocol/scripts/private-gc-overlay/qualify.py restore "${{ matrix.role }}" "$RUNNER_TEMP/private-gc"
      - name: Run the original named private unit test and all twelve overlay regressions
        run: python3 -IB protocol/scripts/private-gc-overlay/qualify.py tests "${{ matrix.role }}" "$RUNNER_TEMP/private-gc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: official-suites-${{ matrix.role }}
          path: ${{ runner.temp }}/private-gc/build-cert
          retention-days: 7
          if-no-files-found: error
  reattached:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-private-gc-overlay-20261031' && inputs.task == 'reattached'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/private-gc-overlay
            scripts/gc-mount-evidence
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: reader
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Acquire two physically already available Cargo subjects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          roots="$RUNNER_TEMP/private-bind-graft"
          mkdir -m700 "$roots"
          python3 -IB reader/scripts/packaged-release-workspace/packages.py 21 "$roots"
          gh api repos/astral-experiments/ohm/actions/artifacts/13021667897/zip >"$roots/combined.zip"
          echo "1b366dfc45807663d29665716fd977b11ced0e71bf3666f33d911ca7299c72ee  $roots/combined.zip" | sha256sum -c -
          unzip -q "$roots/combined.zip" -d "$roots/product"
          if ! command -v strace; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends strace; fi
      - name: Reattach the very same directory inode after the last native discovery snapshot
        run: |
          set -euo pipefail
          roots="$RUNNER_TEMP/private-bind-graft"
          for role in signed combined; do
            base="$roots/$role"; mkdir -m700 "$base"
            ln -s "$roots/sdk-21" "$base/sdk-21"
            ln -s "$roots/product" "$base/product"
            python3 -IB protocol/scripts/private-gc-overlay/reattached.py "$role" "$base"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genuine-reattached-private-directory
          path: |
            ${{ runner.temp }}/private-bind-graft/signed/packet
            ${{ runner.temp }}/private-bind-graft/combined/packet
            ${{ runner.temp }}/private-bind-graft/receipts/21
          retention-days: 7
          if-no-files-found: error
