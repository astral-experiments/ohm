name: Trace the actual published Ron producer on the default Ruff test graph
run-name: Published -24 Ron backend normal Cargo ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        default: ordinary
        options: [ordinary, runtime-hardware, topology]
      reviewed_head:
        required: true
        description: Exact reviewed nonrelease QA commit
        type: string
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-ron-consumed-inputs-20261103'
    strategy:
      fail-fast: false
      matrix:
        block: ${{ fromJSON(inputs.lane == 'topology' && '["PC"]' || '["PC","CP"]') }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.reviewed_head }}
          path: qa
          persist-credentials: false
          sparse-checkout: |
            scripts/ron-ordinary-backend
            scripts/ron-consumed-metadata
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a95a505d25b0f7839a6104ff1514ed9a4ddf9f90
          path: reference
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-original-ty-instructions
            scripts/ruff-foreign-span-observer
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: bfa2407e98ee1343caeefd02b4b69043509baa8c
          fetch-depth: 2
          path: ruff
          persist-credentials: false
      - name: Verify the source bundle and provision its normal host build tools
        run: |
          cd qa/scripts/ron-ordinary-backend
          sha256sum -c SHA256SUMS
          sudo apt-get update -qq
          sudo apt-get install -qy --no-install-recommends clang libssl-dev zstd busybox-static file
      - name: Independently empty native history and whole-Ruff instruction pair
        env:
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          RON_BLOCK: ${{ matrix.block }}
          OHM_SDK_READ_TOKEN: ${{ github.token }}
        run: |
          if [ '${{ inputs.lane }}' = topology ]; then
            python3 -IB qa/scripts/ron-ordinary-backend/runtime-hardware/topology.py
          elif [ '${{ inputs.lane }}' = runtime-hardware ]; then
            python3 -IB qa/scripts/ron-ordinary-backend/runtime-hardware/work.py
          else
            python3 -IB qa/scripts/ron-ordinary-backend/ordinary.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-ron-published-24-${{ inputs.lane }}-${{ matrix.block }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-foreign-join/published/
          retention-days: 15
          if-no-files-found: error
