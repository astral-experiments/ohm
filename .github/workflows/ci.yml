name: Inspect signed Ruff workspace test links
run-name: Signed GNU Ruff workspace link census ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: One signed release or two independent builds on one boot
        type: choice
        options: [single-22, paired-18-22, source-bisect-330, constructors-implicit-input, constructors-wild-preflight]
        default: single-22
      reviewed_head:
        description: Exact reviewed QA commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  census:
    name: Signed Ohm workspace link census
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 140
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-workspace-link-census
            scripts/ruff-default-owner-pmu
            scripts/ruff-workspace-remat
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 93526150df078af7dd8fc4226cdcc469539d2001
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: inputs.mode == 'constructors-wild-preflight'
        with:
          repository: wild-linker/wild
          ref: e856d81f6683cad80b9fe0ebf1a0c3c403c6fe11
          path: upstream-wild
          persist-credentials: false
      - name: Verify the fixed sources and the native tracing facility
        working-directory: enrolled
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          sha256sum --strict -c scripts/ruff-workspace-link-census/SHA256SUMS
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils build-essential cmake libssl-dev pkg-config strace
          strace -ff -qq -e trace=%process -o "$RUNNER_TEMP/census-trace-admission" -- /bin/true
          grep -F 'execve("/bin/true"' "$RUNNER_TEMP"/census-trace-admission.*
      - name: Authenticate all 79 signed GNU SDK files
        if: inputs.mode == 'single-22'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB enrolled/scripts/ruff-workspace-link-census/census.py install
      - name: Build the complete workspace and trace the unchanged command
        if: inputs.mode == 'single-22'
        run: python3 -IB -u enrolled/scripts/ruff-workspace-link-census/census.py "$GITHUB_WORKSPACE/ruff"
      - name: Verify the independently empty signed -18 SDK
        if: inputs.mode == 'paired-18-22'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB enrolled/scripts/ruff-workspace-link-census/paired.py install 18 "$GITHUB_WORKSPACE/ruff"
      - name: Capture signed -18 workspace roots, unchanged compilers and native bytes
        if: inputs.mode == 'paired-18-22'
        run: python3 -IB -u enrolled/scripts/ruff-workspace-link-census/paired.py run 18 "$GITHUB_WORKSPACE/ruff"
      - name: Verify the independently empty signed -22 SDK
        if: inputs.mode == 'paired-18-22'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB enrolled/scripts/ruff-workspace-link-census/paired.py install 22 "$GITHUB_WORKSPACE/ruff"
      - name: Capture signed -22 workspace roots, unchanged compilers and native bytes
        if: inputs.mode == 'paired-18-22'
        run: python3 -IB -u enrolled/scripts/ruff-workspace-link-census/paired.py run 22 "$GITHUB_WORKSPACE/ruff"
      - name: Verify the signed compiler and both source-bound native Cargo products
        if: inputs.mode == 'source-bisect-330' || inputs.mode == 'constructors-implicit-input'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB -u enrolled/scripts/ruff-workspace-link-census/bisect330.py fetch
      - name: Run the true Ruff constructors test and changing native provider on both readers
        if: inputs.mode == 'source-bisect-330'
        run: python3 -IB -u enrolled/scripts/ruff-workspace-link-census/bisect330.py run "$GITHUB_WORKSPACE/ruff"
      - name: Trace the actual constructors link and qualify the earlier implicit provider in a private view
        if: inputs.mode == 'constructors-implicit-input'
        run: python3 -IB -u enrolled/scripts/ruff-workspace-link-census/constructors_inputs.py run "$GITHUB_WORKSPACE/ruff"
      - name: Prepare an authenticated stock kit and source-bound Cargo 330 for the single linker study
        if: inputs.mode == 'constructors-wild-preflight'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB enrolled/scripts/ruff-workspace-link-census/bisect330.py fetch-child
      - name: Build the same-process observation tool from the original Wild source
        if: inputs.mode == 'constructors-wild-preflight'
        run: |
          sudo apt-get install -y --no-install-recommends valgrind
          python3 -IB -u enrolled/scripts/ruff-workspace-link-census/wild_preflight.py build "$GITHUB_WORKSPACE/upstream-wild"
      - name: Price actual constructors links and test incumbent and input integrity
        if: inputs.mode == 'constructors-wild-preflight'
        run: python3 -IB -u enrolled/scripts/ruff-workspace-link-census/wild_preflight.py run "$GITHUB_WORKSPACE/ruff"
      - name: Retain the native process tree, Cargo products, link markers and verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-ruff-workspace-link-census
          path: |
            ${{ runner.temp }}/ohm-ruff-whole-census/evidence
            ${{ runner.temp }}/matched-ruff-workspace-census/*/evidence
          if-no-files-found: warn
          retention-days: 14
