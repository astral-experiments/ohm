name: Rebuild the GNU Ruff compiler comparison from source

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run the source proof, optionally followed by all twelve registered pairs
        type: choice
        default: qualify
        options: [qualify, holdout]
      clock_control:
        description: Also build Cargo with the current system clock and compare both complete ELFs
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: gnu-ruff-entire-source-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cargo:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-svc-source-rebuild'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Acquire the published release, public bootstrap inputs and GNU cross-toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ohm-gnu-syscall/source-rebuild/prepare.sh
      - name: Rebuild and verify the original 119-file SDK used to compile Cargo
        run: python3 -IB scripts/ohm-gnu-syscall/source-rebuild/rebuild.py rustc builder
      - name: Build the optional OpenSSL clock control at the same physical paths
        if: inputs.clock_control
        run: |
          set -euo pipefail
          builder="$QA_ROOT"
          export QA_ROOT="$RUNNER_TEMP/gnu-cargo293-build"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/source-rebuild/rebuild.py cargo "$builder" --unfixed-clock
          mv "$QA_ROOT" "$RUNNER_TEMP/gnu-cargo-clock-control"
      - name: Rebuild and test Cargo at the recorded source and physical paths
        run: |
          set -euo pipefail
          builder="$QA_ROOT"
          export QA_ROOT="$RUNNER_TEMP/gnu-cargo293-build"
          mkdir -p "$QA_ROOT/receipts"
          control=()
          if [[ -f "$RUNNER_TEMP/gnu-cargo-clock-control/product/cargo" ]]; then
            control=(--control-product "$RUNNER_TEMP/gnu-cargo-clock-control/product/cargo")
          fi
          python3 -IB scripts/ohm-gnu-syscall/source-rebuild/rebuild.py cargo "$builder" "${control[@]}"
      - name: Transfer the rebuilt Cargo to the two compiler workers in this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-built-cargo
          path: |
            ${{ runner.temp }}/gnu-cargo293-build/product/cargo.zst
            ${{ runner.temp }}/gnu-cargo293-build/product/product.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Preserve manifests, source, native Cargo construction and unit test
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-build-builder
          path: |
            ${{ runner.temp }}/gnu-cargo293-build/receipts
            ${{ runner.temp }}/gnu-cargo-clock-control/receipts
            ${{ runner.temp }}/ohm-aarch64-linux-zmij/receipts
          if-no-files-found: error
          retention-days: 30

  rustc:
    needs: cargo
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        role: [parent, patched]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Acquire the published release, public bootstrap inputs and GNU cross-toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ohm-gnu-syscall/source-rebuild/prepare.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: source-built-cargo
          path: ${{ runner.temp }}/just-built-cargo
      - name: Rebuild both target libraries and the compiler from this role's Git tree
        env:
          ROLE: ${{ matrix.role }}
        run: python3 -IB scripts/ohm-gnu-syscall/source-rebuild/rebuild.py rustc "$ROLE" --cargo-transfer "$RUNNER_TEMP/just-built-cargo"
      - name: Verify the real edit, next rebuild, invalid edit, repair and empty Ruff build
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          export CENSUS_ROOT="$RUNNER_TEMP/observed-ruff" CENSUS_SDK="$QA_ROOT/rustup/toolchains/ohm"
          if [[ "$ROLE" == patched ]]; then export CENSUS_CANDIDATE_RECORD="$QA_ROOT/receipts/candidate.json"; fi
          python3 -IB scripts/ohm-gnu-ty-input-census/cli.py
          python3 -IB scripts/ohm-gnu-syscall/source-rebuild/rebuild.py verify-ruff "$ROLE" "$CENSUS_ROOT/receipts"
      - name: Preserve source, complete physical manifests, native tool executions and Ruff verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-build-${{ matrix.role }}
          path: |
            ${{ runner.temp }}/ohm-aarch64-linux-zmij/receipts
            ${{ runner.temp }}/observed-ruff/receipts
          if-no-files-found: error
          retention-days: 30
      - name: Export the parent SDK or the patched driver for this run's holdout
        if: inputs.phase == 'holdout'
        env:
          ROLE: ${{ matrix.role }}
        run: python3 -IB scripts/ohm-gnu-syscall/source-rebuild/kits.py pack "$ROLE" "$RUNNER_TEMP/paired-kit"
      - if: inputs.phase == 'holdout'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-kit-${{ matrix.role }}
          path: ${{ runner.temp }}/paired-kit
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  holdout:
    needs: rustc
    if: inputs.phase == 'holdout'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {position: 1, order: PC}
          - {position: 2, order: CP}
          - {position: 3, order: CP}
          - {position: 4, order: CP}
          - {position: 5, order: PC}
          - {position: 6, order: CP}
          - {position: 7, order: CP}
          - {position: 8, order: PC}
          - {position: 9, order: PC}
          - {position: 10, order: PC}
          - {position: 11, order: PC}
          - {position: 12, order: CP}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: source-kit-*
          path: ${{ runner.temp }}/just-built-kits
      - name: Check all original SDK members on this fresh worker
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross qemu-user strace valgrind ninja-build zstd
          export CENSUS_PARENT="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          export QA_ROOT="$RUNNER_TEMP/qualified-syscall"
          mkdir -p "$QA_ROOT/receipts"
          python3 -IB scripts/ohm-gnu-syscall/source-rebuild/kits.py restore \
            "$RUNNER_TEMP/just-built-kits/source-kit-parent" "$RUNNER_TEMP/just-built-kits/source-kit-patched"
          printf '%s\n' "QA_ROOT=$QA_ROOT" "CENSUS_PARENT=$CENSUS_PARENT" \
            "CENSUS_ROOT=$RUNNER_TEMP/observed-ruff" "CENSUS_SDK=$QA_ROOT/candidate-sdk" \
            "CENSUS_CANDIDATE_RECORD=$QA_ROOT/receipts/candidate.json" >> "$GITHUB_ENV"
      - name: Run the registered counter, Ruff history and same-path clean builds
        env:
          ROLE_ORDER: ${{ matrix.order }}
        run: python3 -IB scripts/ohm-gnu-syscall/paired.py "$ROLE_ORDER"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-svc-holdout-${{ matrix.position }}
          retention-days: 14
          path: ${{ runner.temp }}/qualified-syscall/receipts
          if-no-files-found: error
