name: Cargo 301 Linux checks
on:
  workflow_dispatch:
    inputs:
      task:
        description: Reproduce the complete Linux checks or compare the existing GC failures
        type: choice
        required: true
        default: linux-checks
        options: [linux-checks, gc-control, coherent-storage, profile-selectors, apple-selector, e2e-reason]
permissions:
  contents: read
concurrency:
  group: private-cargo-301-linux-equivalence
  cancel-in-progress: false
defaults:
  run:
    working-directory: subject
env:
  RUST_VERSION: 1.99.0
jobs:
  rustfmt:
    name: Rustfmt
    needs: schema
    if: ${{ !cancelled() && inputs.task == 'linux-checks' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-native-reader-linux-ci-20261030' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: qa-protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/ohm-apple-zmij/cargo293
            scripts/ohm-aarch64-versioned/cargo-transport
            scripts/ohm-cargo-301-linux-ci
      - name: Authenticate Cargo 301 source, tree and all 3114 entries
        working-directory: ${{ github.workspace }}
        run: python3 -IB qa-protocol/scripts/ohm-cargo-301-linux-ci/source.py subject
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +"$RUST_VERSION" fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    if: ${{ !cancelled() && inputs.task == 'linux-checks' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-native-reader-linux-ci-20261030' }}
    runs-on: namespace-profile-ubuntu-24-04-16
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04-8]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: qa-protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/ohm-apple-zmij/cargo293
            scripts/ohm-aarch64-versioned/cargo-transport
            scripts/ohm-cargo-301-linux-ci
      - name: Authenticate Cargo 301 source, tree and all 3114 entries
        working-directory: ${{ github.workspace }}
        run: python3 -IB qa-protocol/scripts/ohm-cargo-301-linux-ci/source.py subject
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
      - name: Check lints
        run: cargo +"$RUST_VERSION" clippy --workspace --all-targets --no-deps -- -D warnings

  cargo-tests:
    name: Cargo tests (${{ matrix.os }})
    if: ${{ !cancelled() && inputs.task == 'linux-checks' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-native-reader-linux-ci-20261030' }}
    runs-on: namespace-profile-ubuntu-24-04-16
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
      CARGO_PUBLIC_NETWORK_TESTS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-ubuntu-24.04-16
            other: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: qa-protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/ohm-apple-zmij/cargo293
            scripts/ohm-aarch64-versioned/cargo-transport
            scripts/ohm-cargo-301-linux-ci
      - name: Authenticate Cargo 301 source, tree and all 3114 entries
        working-directory: ${{ github.workspace }}
        run: python3 -IB qa-protocol/scripts/ohm-cargo-301-linux-ci/source.py subject
      - name: Install Rust
        run: |
          # Keep compiled-in test scratch paths outside this repository and any
          # `target` component, for Git discovery and automatic shared-build admission.
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-tests" >> "$GITHUB_ENV"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup target add --toolchain "$RUST_VERSION" "${{ matrix.other }}" wasm32-unknown-unknown
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libsecret-1-0 libsecret-1-dev
      - name: Run Cargo unit and integration tests
        run: cargo +"$RUST_VERSION" test -p cargo
      - name: Install Ohm for shared-registry integration coverage
        if: runner.os == 'Linux'
        env:
          OHM_VERSION: ohm-1.97.1-16
          OHM_INSTALLER_SHA256: e8f33de7d5a2def0205fbde4db499853f44b3444037559637d2d8ff1e6cc92a4
        run: |
          installer="$RUNNER_TEMP/ohm-installer.sh"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$installer" \
            "https://labs.astral.sh/ohm/releases/$OHM_VERSION/install.sh"
          printf '%s  %s\n' "$OHM_INSTALLER_SHA256" "$installer" | sha256sum --check
          sh "$installer"
      - name: Run shared-registry integration with Ohm
        if: runner.os == 'Linux'
        env:
          RUSTUP_TOOLCHAIN: ohm-1.97.1-16
          # This pinned compiler predates early metadata.
          __CARGO_HEADSTART: "no"
        run: |
          testsuite="$(find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'testsuite-*' -perm -u+x -print -quit)"
          if [[ -z "$testsuite" ]]; then
            echo 'compiled Cargo integration test binary was not found' >&2
            exit 1
          fi
          "$testsuite" \
            build_dir::shared_registry_cache_preserves_cross_workspace_reuse_and_private_early_cutoff \
            --exact --nocapture
          "$testsuite" \
            build_dir::shared_registry_cache_avoids_hashing_immutable_public_apis \
            --exact --nocapture
          "$testsuite" \
            check::ohm_preserves_fresh_checks_while_holding_shared_workspace_locks \
            --exact --nocapture
          "$testsuite" \
            check::ohm_locks_fingerprints_before_preserving_established_check_graphs \
            --exact --nocapture
          "$testsuite" \
            check::ohm_skips_cold_ordinary_check_graphs_after_test_builds \
            --exact --nocapture
      - name: Install Ohm for Clippy worktree coverage
        env:
          OHM_VERSION: ohm-1.98.0-9
          OHM_INSTALLER_SHA256: 573e00024783ab952f7c2d629f12f9e0ba61be96843f7e692dc056642a72affe
        run: |
          installer="$RUNNER_TEMP/ohm-clippy-installer.sh"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$installer" \
            "https://labs.astral.sh/ohm/releases/$OHM_VERSION/install.sh"
          printf '%s  %s\n' "$OHM_INSTALLER_SHA256" "$installer" | shasum -a 256 --check
          sh "$installer"
      - name: Run profile and bundled Clippy worktree tests with Ohm
        env:
          RUSTUP_TOOLCHAIN: ohm-1.98.0-9
          # This pinned compiler predates early metadata.
          __CARGO_HEADSTART: "no"
        run: |
          toolchain_bin="$(dirname "$(rustup which rustc)")"
          rustup_bin="$(dirname "$(command -v rustup)")"
          # Exclude runner-provided native-tool shims from the trusted-cache fixture.
          export PATH="$toolchain_bin:$rustup_bin:/usr/bin:/bin:/usr/sbin:/sbin"
          rustc -Vv
          clippy-driver -V
          testsuite="$(find "$CARGO_TARGET_DIR/debug/deps" -maxdepth 1 -type f -name 'testsuite-*' -perm -u+x -print -quit)"
          if [[ -z "$testsuite" ]]; then
            echo 'compiled Cargo integration test binary was not found' >&2
            exit 1
          fi
          # The stable-built testsuite marks these nightly tests ignored at compile time.
          "$testsuite" profiles::ohm_default_debuginfo --include-ignored --nocapture
          for test in \
            worktree_import_requires_cloning \
            bundled_clippy_isolation_defaults_follow_actual_snapshot_cloning \
            bundled_clippy_preserves_ordinary_seeds_without_importing_lint_state \
            clippy_isolation_overrides_are_inherited_and_child_flags_take_precedence \
            forced_clippy_isolation_preserves_compiler_trust_rejections \
            clippy_wrapper_scripts_still_deny_the_whole_seed; do
            "$testsuite" "ohm_worktree::$test" --exact --include-ignored --nocapture
          done
          if [[ "$RUNNER_OS" == Linux ]]; then
            "$testsuite" ohm_linker::ohm_defaults_select_wild_and_allow_lld \
              --exact --include-ignored --nocapture
            "$testsuite" rustflags::ohm_defaults_reexpand_derive_after_native_input_changes \
              --exact --nocapture
          fi

  workspace-tests:
    name: Workspace tests
    needs: clippy
    if: ${{ !cancelled() && inputs.task == 'linux-checks' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-native-reader-linux-ci-20261030' }}
    runs-on: namespace-profile-ubuntu-24-04-16
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: qa-protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/ohm-apple-zmij/cargo293
            scripts/ohm-aarch64-versioned/cargo-transport
            scripts/ohm-cargo-301-linux-ci
      - name: Authenticate Cargo 301 source, tree and all 3114 entries
        working-directory: ${{ github.workspace }}
        run: python3 -IB qa-protocol/scripts/ohm-cargo-301-linux-ci/source.py subject
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Run workspace tests
        run: cargo +"$RUST_VERSION" test --workspace --exclude cargo --exclude benchsuite --exclude resolver-tests

  resolver:
    name: Resolver tests
    needs: workspace-tests
    if: ${{ !cancelled() && inputs.task == 'linux-checks' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-native-reader-linux-ci-20261030' }}
    runs-on: namespace-profile-ubuntu-24-04-16
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: qa-protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/ohm-apple-zmij/cargo293
            scripts/ohm-aarch64-versioned/cargo-transport
            scripts/ohm-cargo-301-linux-ci
      - name: Authenticate Cargo 301 source, tree and all 3114 entries
        working-directory: ${{ github.workspace }}
        run: python3 -IB qa-protocol/scripts/ohm-cargo-301-linux-ci/source.py subject
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Run resolver tests
        run: cargo +"$RUST_VERSION" test -p resolver-tests

  schema:
    name: Schema tests
    needs: cargo-tests
    if: ${{ !cancelled() && inputs.task == 'linux-checks' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-native-reader-linux-ci-20261030' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: qa-protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/ohm-apple-zmij/cargo293
            scripts/ohm-aarch64-versioned/cargo-transport
            scripts/ohm-cargo-301-linux-ci
      - name: Authenticate Cargo 301 source, tree and all 3114 entries
        working-directory: ${{ github.workspace }}
        run: python3 -IB qa-protocol/scripts/ohm-cargo-301-linux-ci/source.py subject
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Run schema tests
        run: cargo +"$RUST_VERSION" test -p cargo-util-schemas --features unstable-schema

  gc-control:
    name: Compare direct parent and candidate collector tests on the same Linux filesystems
    if: inputs.task == 'gc-control' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-native-reader-linux-ci-20261030'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
      CARGO_PUBLIC_NETWORK_TESTS: 1
    strategy:
      matrix:
        other: [i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: qa-protocol
          persist-credentials: false
          sparse-checkout: |
            scripts/ohm-apple-zmij/cargo293
            scripts/ohm-aarch64-versioned/cargo-transport
            scripts/ohm-cargo-301-linux-ci
      - name: Authenticate Cargo 301 source, tree and all 3114 entries
        working-directory: ${{ github.workspace }}
        run: python3 -IB qa-protocol/scripts/ohm-cargo-301-linux-ci/source.py subject
      - name: Install Rust
        run: |
          # Keep compiled-in test scratch paths outside this repository and any
          # `target` component, for Git discovery and automatic shared-build admission.
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-tests" >> "$GITHUB_ENV"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup target add --toolchain "$RUST_VERSION" "${{ matrix.other }}" wasm32-unknown-unknown
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libsecret-1-0 libsecret-1-dev
      - name: Run the original library tests on both physical binaries
        run: python3 -IB ../qa-protocol/scripts/ohm-cargo-301-linux-ci/gc_control.py
      - name: Preserve source, filesystem and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-301-and-parent-native-gc
          path: ${{ runner.temp }}/gc-controls
          retention-days: 14
          if-no-files-found: error

  cargo-on-coherent-storage:
    name: Complete Cargo tests on coherent Linux fixture storage
    if: ${{ !cancelled() && inputs.task == 'coherent-storage' && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-native-reader-linux-ci-20261030' }}
    runs-on: namespace-profile-ubuntu-24-04-16
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_INCREMENTAL: 0
      CARGO_PUBLIC_NETWORK_TESTS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-ubuntu-24.04-16
            other: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: qa-protocol
          persist-credentials: false
          sparse-checkout: |
