name: Ruff edit replay
run-name: Isolate the Ruff component-cycle command against published −2
on:
  workflow_dispatch:
    inputs:
      orders:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        order: ${{ fromJSON(inputs.orders) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/ruff
          ref: 4b00c689c3d91bb17866ec08de549479d6d8dcca
          fetch-depth: 4
          path: source
          persist-credentials: false
      - name: Download published −2
        if: contains(matrix.order, '2')
        run: |
          mkdir -p kits/2
          name=ohm-1.100.0-2
          curl -fsSL --retry 4 "https://github.com/astral-experiments/ohm/releases/download/$name/$name-x86_64-unknown-linux-gnu.tar.gz" -o kits/2/kit.tar.gz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(matrix.order, 'f')
        with:
          github-token: ${{ github.token }}
          run-id: '44735982792'
          name: linux-release-qualification-44735982792
          path: kits/f
      - name: Install nextest and measure the recorded commands
        env:
          ORDER: ${{ matrix.order }}
        run: |
          curl --retry 3 -fsSL https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.140/cargo-nextest-0.9.140-x86_64-unknown-linux-gnu.tar.gz -o nextest.tgz
          echo '4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3  nextest.tgz' | sha256sum -c -
          tar xf nextest.tgz
          PATH="$PWD:$PATH" python3 focusruff.py "$ORDER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ruff-${{ matrix.order }}
          path: counts/
