name: Darwin release-smoke qualification
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed private QA commit, 40 hexadecimal characters
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  native:
    name: Actual rc22 Apple distribution and checked native linkers
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-rc22-apple-declared-link-smoke-20261031' && inputs.reviewed_head == github.sha
    runs-on: namespace-profile-macos-15
    timeout-minutes: 45
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/rc22-apple-declared-smoke
            scripts/smoke-test-relink.sh
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 14c9d13d68f3dd21c53f1ef6c3721de8363c0123
          path: observer
          persist-credentials: false
          sparse-checkout: scripts/ohm-apple-zmij
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Check frozen helpers, negative guards, single enrollment, real macOS tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -sm)" = "Darwin arm64"
          python3 -B scripts/rc22-apple-declared-smoke/test_matrix.py
          python3 -B scripts/rc22-apple-declared-smoke/admission.py > "$RUNNER_TEMP/rc22-apple-enrollment.json"
          xcodebuild -version
          xcrun --find clang
          xcrun --find ar
          command -v zstd
          command -v rustup
      - name: Verify the original release archives, install, and select two already-built Cargo readers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/rc22-apple-declared-smoke/acquire.py
      - name: Run the frozen release smoke and two-bin Xcode matrix
        run: python3 -B scripts/rc22-apple-declared-smoke/matrix.py
      - name: Recheck the exact single dispatch before sealing
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/rc22-apple-declared-smoke/admission.py > "$RUNNER_TEMP/rc22-apple-terminal-identity.json"
          cmp "$RUNNER_TEMP/rc22-apple-enrollment.json" "$RUNNER_TEMP/rc22-apple-terminal-identity.json"
      - name: Retain original failures and native receipts
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc22-apple-declared-smoke-native
          path: |
            ${{ runner.temp }}/rc22-apple-enrollment.json
            ${{ runner.temp }}/rc22-apple-terminal-identity.json
            ${{ runner.temp }}/rc22-apple-declared-smoke/receipts
          compression-level: 1
          if-no-files-found: error
          retention-days: 14
