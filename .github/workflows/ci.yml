name: Reopen original capped derive-placement runs
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        type: string
        required: true
      dataset:
        type: choice
        options: [pilots, confirm]
        required: true
      original_run:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  read:
    if: github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-ruff-derived-impl-reader-20261103'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ inputs.reviewed_head }}
        sparse-checkout: scripts/ruff-derived-impl-cgus
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: e48abf3b09f415b296d0ee2e8ec81c0de7b50611
        path: schema
        sparse-checkout: scripts/ruff-clap-config-help/evidence-release-24
        persist-credentials: false
    - name: Independently open original archives, native objects, ELFs and true PMU controls
      env:
        GH_TOKEN: ${{ github.token }}
        READ_DATASET: ${{ inputs.dataset }}
        ORIGINAL_RUN: ${{ inputs.original_run }}
      run: python3 -IB scripts/ruff-derived-impl-cgus/read_capped.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: independently-reopened-${{ inputs.dataset }}-${{ inputs.original_run }}-${{ github.run_id }}
        path: ${{ runner.temp }}/reopened
        retention-days: 14
        if-no-files-found: error
