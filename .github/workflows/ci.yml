name: Inspect signed Ruff workspace test links
run-name: Signed GNU Ruff workspace link census ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed QA commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  census:
    name: Signed Ohm workspace link census
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 140
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-workspace-link-census
            scripts/ruff-default-owner-pmu
            scripts/ruff-workspace-remat
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          ref: 93526150df078af7dd8fc4226cdcc469539d2001
          path: ruff
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the fixed sources and the native tracing facility
        working-directory: enrolled
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          sha256sum --strict -c scripts/ruff-workspace-link-census/SHA256SUMS
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils build-essential cmake libssl-dev pkg-config strace
          strace -ff -qq -e trace=%process -o "$RUNNER_TEMP/census-trace-admission" -- /bin/true
          grep -F 'execve("/bin/true"' "$RUNNER_TEMP"/census-trace-admission.*
      - name: Authenticate all 79 signed GNU SDK files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB enrolled/scripts/ruff-workspace-link-census/census.py install
      - name: Build the complete workspace and trace the unchanged command
        run: python3 -IB -u enrolled/scripts/ruff-workspace-link-census/census.py "$GITHUB_WORKSPACE/ruff"
      - name: Retain the native process tree, Cargo products, link markers and verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-ruff-workspace-link-census
          path: ${{ runner.temp }}/ohm-ruff-whole-census/evidence
          if-no-files-found: warn
          retention-days: 14
