name: Private target GC filesystem diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-private-gc-overlay-20261031'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: namespace-profile-ubuntu-24-04-16, fs: overlay}
          - {runner: ubuntu-24.04, fs: ext4}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: protocol
          persist-credentials: false
          sparse-checkout: scripts/private-gc-overlay
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: reader
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate published -21 and prebuilt exact #306 Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/private-gc"
          mkdir -m700 "$root" "$root-input"
          python3 -IB reader/scripts/packaged-release-workspace/packages.py 21 "$root"
          gh api repos/astral-experiments/ohm/actions/artifacts/13021551412/zip >"$root-input/fixed.zip"
          echo "26b5b1fc36e6101a26098e05a38a9df4bfed2a2151a4045e4789543fc89f4cc0  $root-input/fixed.zip" | sha256sum -c -
          unzip -q "$root-input/fixed.zip" -d "$root-input/product"
      - name: Observe private profiles and real held locks
        run: |
          set -euo pipefail
          if ! command -v strace; then sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends strace; fi
          root="$RUNNER_TEMP/private-gc"
          for role in signed shared-fix; do
            python3 -IB protocol/scripts/private-gc-overlay/observe.py "$root" "$root-input/product" "$role" "$root/visits" "${{ matrix.fs }}"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-gc-${{ matrix.fs }}
          path: |
            ${{ runner.temp }}/private-gc/packet
            ${{ runner.temp }}/private-gc/receipts/21
          retention-days: 7
          if-no-files-found: error
