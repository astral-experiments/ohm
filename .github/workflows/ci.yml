name: Measure the Ruff parser libtest build on two source-built compilers
run-name: Ruff parser no-run ${{ inputs.cohort }} at ${{ inputs.reviewed_head }}
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed QA commit
        type: string
        required: true
      cohort:
        description: Original pilot or separately admitted confirmation
        type: choice
        required: true
        options: [pilot, confirmation]
jobs:
  price:
    if: >-
      github.repository == 'astral-experiments/ohm' && github.run_attempt == '1'
      && github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-rc24-parser-norun-20261104'
    name: Parser --no-run ${{ matrix.slot }}
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.cohort == 'pilot' && '["pilot-PC","pilot-CP"]' || '["B1","B2","B3","B4","B5","B6"]') }}
    steps:
      - name: Open the exact measurement and its original SDK receiver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: qa
          sparse-checkout: |
            scripts/ruff-parser-test-norun
            scripts/ruff-static-array-cost
          persist-credentials: false
      - name: Open the original Ruff edit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: astral-sh/ruff
          ref: bfedc614b7670b8766576b64afd426c292f8c2ce
          fetch-depth: 3
          path: ruff
          persist-credentials: false
      - name: Count the ordinary entire parser test build
        env:
          PARSER_COHORT: ${{ inputs.cohort }}
          PARSER_SLOT: ${{ matrix.slot }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-parser-test-norun/worker.py
      - name: Save the complete counters, programs and refusals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parser-norun-${{ matrix.slot }}-${{ github.run_id }}
          path: ${{ runner.temp }}/unicode-price/proof
          compression-level: 1
          retention-days: 14
          if-no-files-found: error
