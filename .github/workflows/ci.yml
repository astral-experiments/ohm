name: Private enum neighbor controls
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact registered packaging SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  structural:
    name: Two real Ruff checks
    if: github.event_name == 'workflow_dispatch' && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 75
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: qa
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-private-enum-neighbors
            scripts/ruff-ruf009-derived-enum
            scripts/ruff-module-16149
            scripts/ruff-linter-check-attribution
            scripts/ruff-heldout-mono-fold/residual
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: donor
          ref: bd7b58765ae44b21a1c9273b3ff0be8e923adc47
          persist-credentials: false
          sparse-checkout: scripts/ruff-default-owner-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: scope-ruf009
          ref: 6250ceba040bc15c2a296ae7ee1e5c6897f3ff06
          persist-credentials: false
          sparse-checkout: scripts/ruff-matched-stage
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          path: line-index
          ref: 88d851449d2345e11da991794f3e9bfbbd666719
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: astral-sh/ruff
          path: unicode
          ref: 88a50d695c1142294bb4c780fad47d3306173885
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: sudo apt-get -qq update && sudo apt-get install -y --no-install-recommends strace zstd
      - name: Reopen the matched kits and exercise both complete ordinary histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB qa/scripts/ruff-private-enum-neighbors/worker.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-enum-neighbors-${{ github.run_id }}
          path: ${{ runner.temp }}/ohm-ruf009/receipt
          if-no-files-found: error
          retention-days: 5
