name: CI
on:
  workflow_dispatch:
    inputs:
      gnu_only: {description: Only the Linux tracer, type: boolean, default: false}
      expected_head: {description: Exact reviewed commit, type: string, required: true}
permissions: {contents: read, actions: read}
jobs:
  observe:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-22-observe-gnu-native-links' && github.sha == inputs.expected_head && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '13064288126'
          run-id: '41256793646'
          github-token: ${{ github.token }}
          path: release
          merge-multiple: true
      - name: Check explicit archive search paths on the release GNU linker
        run: |
          command -v strace || sudo apt-get install -y strace
          python3 -IB scripts/rc22-physical-gnu.py
      - name: Retain the archive reports and the cold linker trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnu-release-archive-search-observations
          path: ${{ runner.temp }}/rc22-gnu-archive-resolution/reports/
          retention-days: 21
          if-no-files-found: error
