name: Remaining GNU inputs in Ruff ty_project tests
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gnu-ty-project-hard-cgu-20261030
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-gnu-ty-hard-inputs'
    name: Census ordinary AArch64 ty_project builds on the versioned register rules
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Reopen the authenticated 119-file final AArch64 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export QA_ROOT="$RUNNER_TEMP/gnu-reviewer-ingress"
          mkdir -p "$QA_ROOT/receipts" "$QA_ROOT/inputs"
          (cd scripts/ohm-aarch64-versioned && sha256sum --quiet -c SHA256SUMS)
          (cd scripts/ohm-aarch64-portable-review && sha256sum --quiet -c SHA256SUMS)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user strace valgrind zstd
          python3 -IB scripts/ohm-aarch64-versioned/acquire_builds.py
          python3 -IB - <<'PY'
          import os,shutil,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts/ohm-aarch64-versioned').resolve()))
          from version_kit import bind,capsule,rt
          from study import load,save,sha
          bind()
          inputs=rt.ROOT/'inputs/versioned'
          product=load(Path('scripts/ohm-aarch64-versioned/qualified-builds.json'))
          assert sha(inputs/'sdk.tar.zst')==product['capsule']
          sdk=rt.ROOT/'reviewer-sdk'
          checked=capsule.verify(inputs/'sdk.tar.zst','C',sdk)
          p=inputs/'cargo/cargo'
          assert sha(p)==product['cargo_elf'] and sha(sdk/'bin/cargo')==rt.TOOLS['bin/cargo']
          temp=sdk/'bin/cargo.new'
          shutil.copy2(p,temp)
          temp.replace(sdk/'bin/cargo')
          save(rt.LOG/'reviewer-sdk.json',{'source':product['source'],'cargo':sha(sdk/'bin/cargo'),'capsule':checked})
          PY

      - name: Trace the real root-change fix and run the returned target tests
        run: |
          set -euo pipefail
          export CENSUS_ROOT="$RUNNER_TEMP/gnu-ty-marker-census"
          export CENSUS_SDK="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          python3 -IB scripts/ohm-gnu-ty-input-census/census.py --self-test
          python3 -IB scripts/ohm-gnu-ty-input-census/census.py
      - name: Inspect the remaining three registry code generators and one unchanged instruction profile
        run: |
          export CENSUS_ROOT="$RUNNER_TEMP/gnu-ty-marker-census"
          export CENSUS_SDK="$RUNNER_TEMP/gnu-reviewer-ingress/reviewer-sdk"
          python3 -IB scripts/ohm-gnu-ty-input-census/assembly.py
      - name: Retain original process streams, depfiles and test verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gnu-ty-project-hard-input-census
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/gnu-ty-marker-census/receipts
            ${{ runner.temp }}/gnu-reviewer-ingress/receipts/reviewer-sdk.json
