name: Confirm the ordinary Ruff test build
run-name: Six independent complete test builds on the trained compiler pair
permissions:
  contents: read
  actions: read
jobs:
  paired:
    if: github.repository == 'astral-experiments/ohm' && github.run_attempt == '1' && github.event_name == 'workflow_dispatch' && github.sha == inputs.reviewed_head && github.ref_name == 'charlie/qa-ruff-cli-help-norun-six-stage2-20261104'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 120
    name: Independent trained test-build pair ${{ matrix.slot }}
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      OHM_STUDY_MODE: build
      RUFF_CASE: '28392'
      PYTHONDONTWRITEBYTECODE: '1'
      BOOT_SLOT: ${{ matrix.slot }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ inputs.reviewed_head }}
        path: current-qa
        persist-credentials: false
        sparse-checkout: scripts/ruff-derived-impl-cgus
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 2672756eb5b9d4e890b678d439dc6c40a29a4008
        path: original-receiver
        persist-credentials: false
        sparse-checkout: scripts/ruff-derived-impl-cgus
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: e48abf3b09f415b296d0ee2e8ec81c0de7b50611
        path: legacy-qa
        persist-credentials: false
        sparse-checkout: scripts/ruff-clap-config-help
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: astral-sh/ruff
        ref: d136bd8d002a648de5f344df602e492658306f1e
        fetch-depth: 2
        path: ruff
        persist-credentials: false
    - name: Build and validate all eight test executables on both authenticated compilers
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -IB current-qa/scripts/ruff-derived-impl-cgus/norun/confirm_six.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ruff-28392-six-norun-${{ matrix.slot }}-${{ github.run_id }}
        path: ${{ runner.temp }}/ruff-norun-evidence
        compression-level: 1
        retention-days: 14
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        slot:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        required: true
        type: string
