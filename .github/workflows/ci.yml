name: Resolve signed Ruff query item names
run-name: Signed Ruff query item dictionary ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed nonrelease diagnostic commit
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-query-item-dictionary-20261102' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    name: Signed GNU Ruff workspace stable query item dictionary
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 55
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ruff-query-dictionary
            scripts/ruff-cgu-inputs
            scripts/ruff-default-owner-pmu
            scripts/ohm-packed-ruff
            scripts/branch-return-pmu
            scripts/branch-storage-e-confirmation/review
            scripts/ruff-repair-tables-pilot
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Authenticate source and install tools
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          test "$(git -C enrolled rev-parse HEAD)" = "$REVIEWED_HEAD"
          test -z "$(git -C enrolled status --porcelain=v1 --untracked-files=all)"
          python3 -IB enrolled/scripts/ruff-cgu-inputs/acquire_cgu.py --sources
          python3 -IB enrolled/scripts/ruff-query-dictionary/test.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential git libssl-dev zstd
          dpkg-query -W b3sum binutils build-essential git libssl-dev zstd > "$base/logs/packages.tsv"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
      - name: Verify the independent assignment and signed 79-file release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB enrolled/scripts/ruff-query-dictionary/acquire_dictionary.py
      - name: Build the full eligible Ruff CLI twice from independent empty roots
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-repair-tables-pilot/guards.py watch "$base/work" "$base/logs" "$base/logs/resource" python3 -IB enrolled/scripts/ruff-query-dictionary/run.py
      - name: Join by each compiler process first and by stable key across histories
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-query-dictionary/reopen.py "$base/logs" "$base/logs/names.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-gnu-ruff-workspace-query-items
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          include-hidden-files: true
          retention-days: 14
          compression-level: 1
          if-no-files-found: warn
