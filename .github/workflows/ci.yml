name: Observe a bounded packed Git branch ref on the full GNU Ruff CLI
run-name: GNU packed Ruff X-B contact ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact independently reviewed contact commit
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  contact:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ruff-packed-refs-full-20261101' && github.run_attempt == '1' && github.sha == inputs.reviewed_head
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 180
    name: GNU packed Ruff CLI X-B contact
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ctfe-crossover-pilot
            scripts/packed-ref-cli
            scripts/ctfe-cli-semantic
            scripts/gnu-same-revision-donor
            scripts/branch-return-pmu
            scripts/branch-first-session-e-screen
            scripts/branch-storage-e-confirmation
            scripts/ohm-packed-ruff
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8f633d8fc21e453f4c81d81588b6dcab125bfeae
          path: donor-source
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/gnu-same-revision-donor
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f93028872101f65e1c748217ac20ddb73a49bab1
          path: packed-source
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/gnu-same-revision-donor
            scripts/ctfe-crossover-pilot
            scripts/branch-return-pmu
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 762fc25095e317ac5632ec835df3c7f9cfc64a64
          path: source
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-checked-packed-source
            scripts/branch-first-session-e-source
            scripts/branch-return-source
            scripts/ohm-packed-ruff
            scripts/ohm-apple-zmij/source-transport
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 19f9a67b032cce44cea1e3bb7e324558cd9abd0a
          path: kernel
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-return-execstop
            scripts/branch-return-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5e91ed3974c0964a912fd38049946f647891dcb2
          path: projector
          persist-credentials: false
          sparse-checkout: scripts/branch-return-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
          path: physical
          persist-credentials: false
          sparse-checkout: scripts/gnu-renderer-pfc-hardware
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: observers
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-example-ceiling
            scripts/gnu-renderer-library-workers
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the packed contact source
        run: |
          set -euo pipefail
          test "$(git -C enrolled rev-parse HEAD)" = "$REVIEWED_HEAD"
          test "$(git -C donor-source rev-parse HEAD)" = 8f633d8fc21e453f4c81d81588b6dcab125bfeae
          test "$(git -C packed-source rev-parse HEAD)" = f93028872101f65e1c748217ac20ddb73a49bab1
          python3 -IB enrolled/scripts/ctfe-crossover-pilot/source_guard.py enrolled "$REVIEWED_HEAD"
          python3 -IB enrolled/scripts/packed-ref-cli/preflight.py enrolled "$REVIEWED_HEAD"
          for component_path in scripts/gnu-same-revision-donor/{binding.py,source_ids.py,donor_open.py,driver_map.py,live_driver.py,overlay.py} scripts/ruff-repair-tables-pilot/guards.py; do
            source_object=$(git -C donor-source rev-parse "HEAD:$component_path")
            pilot_object=$(git -C enrolled rev-parse "HEAD:$component_path")
            test "$source_object" = "$pilot_object"
          done
          for d in donor-source/scripts/gnu-same-revision-donor enrolled/scripts/{ctfe-crossover-pilot,branch-return-pmu,branch-first-session-e-screen,branch-storage-e-confirmation,ohm-packed-ruff,ohm-packed-ruff/full-cli}; do
            (cd "$d" && sha256sum --strict --check --status SHA256SUMS)
          done
          test "$(git -C enrolled rev-parse HEAD:scripts/ctfe-cli-semantic/cases.py)" = c050fb133e4cbef1d2c49e55d306b581702a8c7e
          test "$(git -C enrolled rev-parse HEAD:scripts/ctfe-cli-semantic/stub-reference.json)" = d401963e1465ededf08c29262f46596db9d4e909
          python3 -IB enrolled/scripts/ctfe-crossover-pilot/test_v2.py "$GITHUB_WORKSPACE/kernel"
          python3 -IB enrolled/scripts/ctfe-crossover-pilot/test_donor_full.py
          python3 -IB enrolled/scripts/ctfe-crossover-pilot/test_wild_exit.py
          python3 -IB enrolled/scripts/ctfe-crossover-pilot/test_subjects.py
          python3 -IB enrolled/scripts/ctfe-crossover-pilot/test_subjects.py --acquisition-imports "$GITHUB_WORKSPACE/source"
          python3 -IB enrolled/scripts/ctfe-crossover-pilot/reopen.py --help > /dev/null
          python3 -IB enrolled/scripts/packed-ref-cli/test_git_layout.py
          python3 -IB enrolled/scripts/packed-ref-cli/test_contact.py --source-checkout "$GITHUB_WORKSPACE/packed-source"
          python3 -IB enrolled/scripts/packed-ref-cli/review.py --help >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates git libssl-dev zstd
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          dpkg-query -W b3sum binutils build-essential git libssl-dev zstd > "$base/logs/packages.tsv"
      - name: Install the source-qualified D and P SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -IB enrolled/scripts/packed-ref-cli/run.py acquire "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/packed-source"
      - name: Run the ordinary packed Ruff histories
        env:
          CTFE_EXECS_SOURCE: ${{ github.workspace }}/kernel
          CTFE_EXECS_PROJECTOR: ${{ github.workspace }}/projector
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-repair-tables-pilot/guards.py watch "$base/work" "$base/logs" "$base/logs/resource" python3 -IB enrolled/scripts/packed-ref-cli/run.py contact "$GITHUB_WORKSPACE/physical" "$GITHUB_WORKSPACE/observers"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnu-packed-ruff-x-b-contact
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
