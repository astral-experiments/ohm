name: Count an ordinary Ruff branch return after a private AST edit
run-name: Full Ruff counter screen ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Exact reviewed commit of the untraced hardware screen
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  ordinary:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-ctfe-counter-screen-20261101' && github.run_attempt == '1' && inputs.reviewed_head == github.sha
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 175
    name: Count Ruff build instructions ${{ matrix.position }}
    strategy:
      fail-fast: false
      matrix:
        position: ['01', '02']
    env:
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ctfe-crossover-pilot
            scripts/ctfe-counter-screen
            scripts/gnu-ctfe-literal-identity
            scripts/branch-return-pmu
            scripts/branch-first-session-e-screen
            scripts/branch-storage-e-confirmation
            scripts/ohm-packed-ruff
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 18b0cf251988b5967f8ffb0b11db850966eae9d1
          path: ctfe-source
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/gnu-ctfe-literal-identity
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 762fc25095e317ac5632ec835df3c7f9cfc64a64
          path: source
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-checked-packed-source
            scripts/branch-first-session-e-source
            scripts/branch-return-source
            scripts/ohm-packed-ruff
            scripts/ohm-apple-zmij/source-transport
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
          path: physical
          persist-credentials: false
          sparse-checkout: scripts/gnu-renderer-pfc-hardware
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: observers
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-example-ceiling
            scripts/gnu-renderer-library-workers
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the enrolled source and prepare empty task-owned output roots
        run: |
          set -euo pipefail
          test "$(git -C enrolled rev-parse HEAD)" = "$REVIEWED_HEAD"
          test "$(git -C enrolled rev-parse HEAD:scripts/ctfe-crossover-pilot)" = 1c94fccb2b5fbf22303e4db8b673723ad082092c
          test "$(git -C ctfe-source rev-parse HEAD)" = 18b0cf251988b5967f8ffb0b11db850966eae9d1
          for component_path in scripts/gnu-ctfe-literal-identity scripts/ruff-repair-tables-pilot/guards.py; do
            source_object=$(git -C ctfe-source rev-parse "HEAD:$component_path")
            pilot_object=$(git -C enrolled rev-parse "HEAD:$component_path")
            test "$source_object" = "$pilot_object"
          done
          for d in ctfe-source/scripts/gnu-ctfe-literal-identity enrolled/scripts/{ctfe-counter-screen,ctfe-crossover-pilot,branch-return-pmu,branch-first-session-e-screen,branch-storage-e-confirmation,ohm-packed-ruff,ohm-packed-ruff/full-cli}; do
            (cd "$d" && sha256sum --strict --check --status SHA256SUMS)
          done
          python3 -IB enrolled/scripts/ctfe-crossover-pilot/test_subjects.py
          python3 -IB enrolled/scripts/ctfe-counter-screen/read.py --help > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates git libssl-dev zstd
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          dpkg-query -W b3sum binutils build-essential git libssl-dev zstd > "$base/logs/packages.tsv"
      - name: Reconstruct both 81-file compiler installations using original source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -IB enrolled/scripts/ctfe-counter-screen/run.py acquire "$GITHUB_WORKSPACE/source"
      - name: Count both untraced Ruff histories
        env:
          POSITION: ${{ matrix.position }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB enrolled/scripts/ruff-repair-tables-pilot/guards.py watch "$base/work" "$base/logs" "$base/logs/resource" python3 -IB enrolled/scripts/ctfe-counter-screen/run.py "$POSITION" "$GITHUB_WORKSPACE/physical" "$GITHUB_WORKSPACE/observers"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ctfe-full-cli-counter-${{ matrix.position }}
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
