name: Build the incoherent-directory compiler for uv 21041
'on':
  workflow_dispatch:
    inputs:
      reviewed_head:
        type: string
        required: true
        description: Exact qualification commit
permissions: {}
jobs:
  domain:
    name: Incoherent-directory stage1 SDK (fa7a_stack_ctfe318_handwritten_coroutine_callables_incoherent_domain)
    if: github.event.repository.private == true && github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-21041-incoherent-domain-stage1'
      && github.sha == inputs.reviewed_head && github.run_attempt == 1
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      BENCH_ARM: fa7a_stack_ctfe318_handwritten_coroutine_callables_incoherent_domain
      OHM_TOOLCHAIN: ohm-1.99.0-22
      OHM_TARGET: x86_64-unknown-linux-gnu
      PYTHONDONTWRITEBYTECODE: '1'
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    outputs:
      inner: ${{ steps.probe.outputs.inner }}
      id: ${{ steps.bundle.outputs.artifact-id }}
      sha: ${{ steps.bundle.outputs.artifact-digest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
        ref: ${{ github.sha }}
        fetch-depth: '2'
    - name: Check out the pinned release build scripts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
        ref: 8c7d5b4500fdfa6e2234417340aa190e5787e513
        path: release-reference
        sparse-checkout: 'scripts

          release

          toolchains'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: 'false'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b
        path: source-carrier
        persist-credentials: 'false'
        sparse-checkout: scripts/rc22-private-export-ice
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27
        path: transport
        persist-credentials: 'false'
        sparse-checkout: scripts/rc22-native
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
        path: public-seed
        persist-credentials: 'false'
        sparse-checkout: scripts/ohm-apple-zmij/source-transport
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
        path: signed-rust
        persist-credentials: 'false'
        sparse-checkout: scripts/strict-mixed-generics
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
        path: cargo-seed
        persist-credentials: 'false'
        sparse-checkout: 'scripts/cargo-diagnostic-fix

          scripts/ohm-apple-zmij/cargo293'
    - name: Admit a fresh hosted stage1 workspace
      run: 'set -euo pipefail

        test ! -e stage1-ref-build

        test ! -e stage1-capsule

        mkdir trait-evidence

        df -B1 "$GITHUB_WORKSPACE" > trait-evidence/capacity-initial.txt

        python3 -c ''import os,shutil; assert shutil.disk_usage(os.environ["GITHUB_WORKSPACE"]).free >= 60*(1<<30)''

        test "$(git rev-parse HEAD^)" = acfa00adf70348b8555820e03c038731b847f351

        '
    - name: Verify all four source packs and the direct f228 child
      run: python3 -IB scripts/incoherent-domain-stage1/materialize.py "$BENCH_ARM"
    - name: Install native GNU bootstrap prerequisites
      run: 'sudo apt-get -qq update

        sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config perl libssl-dev zstd
        clang lld curl

        '
    - name: Build optimized compiler and host std, run correctness suites, and export the SDK
      id: probe
      run: python3 -ISB scripts/incoherent-domain-stage1/stage.py "$BENCH_ARM"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: domain-stage1-fa7a_stack_ctfe318_handwritten_coroutine_callables_incoherent_domain
        path: stage1-capsule/
        if-no-files-found: error
        compression-level: 0
        retention-days: '14'
      id: bundle
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: domain-stage1-incomplete-fa7a_stack_ctfe318_handwritten_coroutine_callables_incoherent_domain
        path: trait-evidence/
        if-no-files-found: warn
        compression-level: '0'
        retention-days: '14'
      if: failure()
