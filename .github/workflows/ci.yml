name: E and D fast-forward on the Ruff integration test
run-name: Ruff integration fast-forward six-host confirmation ${{ inputs.reviewed_head }}
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        type: string
        description: Exact reviewed SHA of the six-host confirmation
        required: true
permissions:
  actions: read
  contents: read
jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-donor-integration-xb-six-20261101' && github.run_attempt == '1' && inputs.reviewed_head == github.sha
    name: GNU E D integration fast-forward confirmation ${{ matrix.position }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        position: ['01', '02', '03', '04', '05', '06']
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 185
    env:
      CONFIRMATION_POSITION: ${{ matrix.position }}
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      CTFE_CARRIER: ${{ github.workspace }}/ctfe
      INTEGRATION_CARRIER: ${{ github.workspace }}/integration
      SEMANTIC_CARRIER: ${{ github.workspace }}/semantic
      CTFE_EXECS_SOURCE: ${{ github.workspace }}/kernel
      CTFE_EXECS_PROJECTOR: ${{ github.workspace }}/projector
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: enrolled
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ctfe-integration-contact
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 679e72fedd4968636469d958c38225c0ce3fefab
          path: integration
          persist-credentials: false
          sparse-checkout: |
            scripts/ruff-integration-structure
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0b50022990577aadd904731e51c4d6c2a0f9b665
          path: semantic
          persist-credentials: false
          sparse-checkout: |
            scripts/ctfe-cli-semantic
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a333316177ef3f9c8b3264ca3bf76c451e0ca079
          path: ctfe
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ctfe-crossover-pilot
            scripts/ctfe-cli-semantic
            scripts/gnu-same-revision-donor
            scripts/branch-return-pmu
            scripts/branch-first-session-e-screen
            scripts/branch-storage-e-confirmation
            scripts/ohm-packed-ruff
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8f633d8fc21e453f4c81d81588b6dcab125bfeae
          path: donor-source
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/gnu-same-revision-donor
            scripts/ruff-repair-tables-pilot
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 762fc25095e317ac5632ec835df3c7f9cfc64a64
          path: source
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-checked-packed-source
            scripts/branch-first-session-e-source
            scripts/branch-return-source
            scripts/ohm-packed-ruff
            scripts/ohm-apple-zmij/source-transport
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 19f9a67b032cce44cea1e3bb7e324558cd9abd0a
          path: kernel
          persist-credentials: false
          sparse-checkout: |
            scripts/branch-return-execstop
            scripts/branch-return-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5e91ed3974c0964a912fd38049946f647891dcb2
          path: projector
          persist-credentials: false
          sparse-checkout: scripts/branch-return-pmu
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2f413ca94b84af2dbd6d6231bcf8d860c97ebee8
          path: physical
          persist-credentials: false
          sparse-checkout: scripts/gnu-renderer-pfc-hardware
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a659140df8ab27fd6a8cc61f5eb38717b3f8bbc
          path: observers
          persist-credentials: false
          sparse-checkout: |
            scripts/gnu-example-ceiling
            scripts/gnu-renderer-library-workers
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Bind sources and reserve the runner
        run: |
          set -euo pipefail
          dir=enrolled/scripts/ctfe-integration-contact
          python3 -IB "$dir/test_fast_forward.py" --enrolled "$REVIEWED_HEAD"
          python3 -IB "$dir/test_contact.py"
          python3 -IB "$dir/test_instructions.py"
          python3 -IB "$dir/test_confirmation.py"
          python3 -IB ctfe/scripts/ctfe-crossover-pilot/test_v2.py "$GITHUB_WORKSPACE/kernel"
          python3 -IB ctfe/scripts/ctfe-crossover-pilot/test_subjects.py --acquisition-imports "$GITHUB_WORKSPACE/source"
          for s in scripts/gnu-same-revision-donor/{binding.py,source_ids.py,donors.py,donor_open.py,driver_map.py,live_driver.py,overlay.py} scripts/ruff-repair-tables-pilot/guards.py; do
            test "$(git -C ctfe rev-parse "HEAD:$s")" = "$(git -C donor-source rev-parse "HEAD:$s")"
          done
          for d in donor-source/scripts/gnu-same-revision-donor ctfe/scripts/{branch-return-pmu,branch-first-session-e-screen,branch-storage-e-confirmation,ohm-packed-ruff,ohm-packed-ruff/full-cli}; do
            (cd "$d" && sha256sum --strict --check --status SHA256SUMS)
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends b3sum binutils build-essential ca-certificates git libssl-dev zstd strace util-linux
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          test ! -e "$base"
          mkdir -p "$base/work" "$base/logs"
          printf '%s' "$base" > "$base/work/.owned-by-packed-study"
          findmnt --target "$base/work" > "$base/logs/filesystem.txt"
          dpkg-query -W b3sum binutils build-essential git libssl-dev zstd strace util-linux > "$base/logs/packages.tsv"
          python3 -IB ctfe/scripts/ruff-repair-tables-pilot/guards.py check "$base/work" "$base/logs" > "$base/logs/bootstrap-resources.json"
      - name: Restore the two exact original compiler installations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB enrolled/scripts/ctfe-integration-contact/contact.py acquire "$GITHUB_WORKSPACE/source"
      - name: Run the registered native and hardware histories
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ohm-branch-object-qa"
          python3 -IB ctfe/scripts/ruff-repair-tables-pilot/guards.py watch "$base/work" "$base/logs" "$base/logs/resource" python3 -IB enrolled/scripts/ctfe-integration-contact/contact.py confirm "$GITHUB_WORKSPACE/physical" "$GITHUB_WORKSPACE/observers"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnu-donor-integration-fast-forward-${{ matrix.position }}
          path: ${{ runner.temp }}/ohm-branch-object-qa/logs
          retention-days: 14
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
