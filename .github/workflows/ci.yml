name: Diagnose feature-free Ruff ty_server e2e codegen on signed Linux
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: signed-featureless-e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/qa-signed21-featureless-e2e-codegen-20261031'
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        role: [strict, '293']
    env:
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: registered
          persist-credentials: false
          sparse-checkout: |
            scripts/mixed-generics-ruff
            scripts/featureless-e2e
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: signed
          ref: f40b16cdb9c041c941a5e339f816111a80a84bdf
          persist-credentials: false
          sparse-checkout: scripts/packaged-release-workspace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: physical
          ref: 9d1dd09be4d2346142957cc298093d8a75c755c3
          persist-credentials: false
          sparse-checkout: scripts/ron-check-share
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tree
          ref: 77e33ee7781b8d823dc7f046d3bd9bea43818bc8
          persist-credentials: false
          sparse-checkout: scripts/strict-unicode-cost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: classic
          ref: b3a1bbd38e07293168f06cb21648821b8cacd206
          persist-credentials: false
          sparse-checkout: scripts/ohm-aarch64-fallback
      - name: Verify signed SDK and reopen the original native Cargo ELF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C registered rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config perl libssl-dev zstd
          python3 -IB registered/scripts/featureless-e2e/acquire.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/selected-e2e-cargo" "$ROLE"
      - name: Check two repeats, two physical edits, own empty builds, Cargo INFO and bounded hardware scopes
        run: |
          set -euo pipefail
          python3 -IB registered/scripts/featureless-e2e/study.py \
            --workspace "$GITHUB_WORKSPACE" --role "$ROLE" --root "$RUNNER_TEMP/ohm-featureless-e2e" \
            --signed "$RUNNER_TEMP/selected-e2e-cargo/signed" --cargo "$RUNNER_TEMP/selected-e2e-cargo/selected"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-featureless-e2e-${{ matrix.role }}
          path: ${{ runner.temp }}/ohm-featureless-e2e/receipts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
