name: Qualify the expanded -23 macOS distribution
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        type: string
        required: true
        description: Exact qualification commit
permissions: {}
jobs:
  build:
    name: Build and check the -23 macOS distribution
    if: github.repository == 'astral-experiments/ohm' && github.ref == 'refs/heads/charlie/codex-rc23-host-qualification' && github.sha == inputs.reviewed_head
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: ${{ vars.OHM_RELEASE_MACOS_RUNNER || 'macos-15' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      BENCH_ARM: base
      OHM_TOOLCHAIN: ohm-1.99.0-23
      OHM_TARGET: aarch64-apple-darwin
      PYTHONDONTWRITEBYTECODE: "1"
      REVIEWED_HEAD: ${{ inputs.reviewed_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Check out the pinned release build scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 90575c9fc302c2af0858c711726b2d211e7d3114
          path: release-reference
          sparse-checkout: |-
            scripts
            release
            toolchains
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0c9c558ce24212e5da6fb66150790b0af3cee90b
          path: source-carrier
          persist-credentials: false
          sparse-checkout: scripts/rc22-private-export-ice
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 7bc72b798b019a9ec0de6eeea3bc22b783917b27
          path: transport
          persist-credentials: false
          sparse-checkout: scripts/rc22-native
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 85c467e1190d80fa8607fb0f9ef0824b4271266a
          path: public-seed
          persist-credentials: false
          sparse-checkout: scripts/ohm-apple-zmij/source-transport
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d1e77f9acf1bb19ceb72274b89a5aaa119fb8bf1
          path: signed-rust
          persist-credentials: false
          sparse-checkout: scripts/strict-mixed-generics
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 46d28e8bff1c6b52f3e7b7bc13192019e964a7da
          path: cargo-seed
          persist-credentials: false
          sparse-checkout: |-
            scripts/cargo-diagnostic-fix
            scripts/ohm-apple-zmij/cargo293
      - name: Check out the published candidate manifest and release driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2d8a6fcbfeb99230dff6d7f30448e58fd8e5a98b
          path: release-candidate
          persist-credentials: false
          sparse-checkout: |-
            scripts
            release
            toolchains
      - name: Make room for macOS profile training
        if: matrix.runner == 'macos-15' && runner.environment == 'github-hosted'
        run: ./scripts/prepare-hosted-macos-release.sh
        working-directory: release-candidate
      - name: Verify the published manifest and all four source pins
        run: python3 -IB scripts/rc23-cross-qualification/materialize.py "$BENCH_ARM"
      - name: Install matching LLVM tools for native PGO
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          MANIFEST_PATH: toolchains/1.99.0/23.json
        run: |
          case "$(jq -er '.release.upstream_rust_version' "$MANIFEST_PATH")" in
            1.97.* | 1.98.*) exit 0 ;;
            1.99.*)
              clang_version=23.1.2
              clang_sha256=d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1
              ;;
            *)
              echo 'Pin matching Clang for this Rust version' >&2
              exit 1
              ;;
          esac

          # Native PGO and ThinLTO require matching LLVM formats.
          clang_root="$(mktemp -d "${RUNNER_TEMP:?}/ohm-clang.XXXXXX")"
          clang_archive="$clang_root/clang.tar.xz"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --retry 3 --show-error --silent \
            --output "$clang_archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$clang_version/LLVM-$clang_version-macOS-ARM64.tar.xz"
          printf '%s  %s\n' "$clang_sha256" "$clang_archive" | shasum -a 256 --check
          tar -xf "$clang_archive" -C "$clang_root" --strip-components=1
          rm "$clang_archive"
          "$clang_root/bin/clang" --version
          "$clang_root/bin/clang++" --version
          ln -s clang "$clang_root/bin/cc"
          ln -s llvm-ar "$clang_root/bin/ar"
          ln -s llvm-ranlib "$clang_root/bin/ranlib"
          ln -s llvm-nm "$clang_root/bin/nm"
          printf '%s\n' "$clang_root/bin" >> "$GITHUB_PATH"
          {
            printf 'CC=%s\n' "$clang_root/bin/clang"
            printf 'CXX=%s\n' "$clang_root/bin/clang++"
            printf 'AR=%s\n' "$clang_root/bin/llvm-ar"
            printf 'RANLIB=%s\n' "$clang_root/bin/llvm-ranlib"
            printf 'SDKROOT=%s\n' "$(xcrun --sdk macosx --show-sdk-path)"
          } >> "$GITHUB_ENV"
        working-directory: release-candidate
      - name: Prepare pinned Wild linker
        env:
          MANIFEST_PATH: toolchains/1.99.0/23.json
        run: |
          wild_directory="$(python3 scripts/prepare-wild.py \
            "$MANIFEST_PATH" "$OHM_TARGET" "$RUNNER_TEMP/ohm-wild")"
          printf 'OHM_WILD_LINKER_DIR=%s\n' "$wild_directory" >> "$GITHUB_ENV"
        working-directory: release-candidate
      - name: Build optimized extended Rust distribution
        id: distribution
        run: |
          set -euo pipefail
          ./scripts/build-optimized-dist.sh \
            "$OHM_TARGET" \
            "$OHM_TOOLCHAIN" \
            "$GITHUB_WORKSPACE/source/rust" \
            "$GITHUB_WORKSPACE/release-candidate/release/bootstrap.toml" 2>&1 | tee "$GITHUB_WORKSPACE/cross-evidence/native-build.log"
        working-directory: release-candidate
        shell: bash
      - name: Capture macOS compiler crash
        if: failure() && steps.distribution.outcome == 'failure' && runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          build_dir="$GITHUB_WORKSPACE/source/rust/build"
          rustc="$build_dir/$OHM_TARGET/stage2/bin/rustc"
          if [[ ! -x "$rustc" ]]; then
            exit 0
          fi

          env -i \
            "HOME=$HOME" \
            "PATH=$PATH" \
            "TMPDIR=$RUNNER_TEMP" \
            "LLVM_PROFILE_FILE=$build_dir/opt-artifacts/rustc-pgo/default_%m_%p.profraw" \
            xcrun lldb --batch \
              --one-line 'run' \
              --one-line-on-crash 'thread backtrace all' \
              --one-line-on-crash 'register read' \
              --one-line-on-crash 'disassemble --pc' \
              --one-line-on-crash 'image list' \
              -- "$rustc" -vV
      - name: Seal the complete Darwin SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/source/rust/build/dist/rust-1.99.0-dev-aarch64-apple-darwin.tar.gz"
          test -s "$archive"
          grep -F 'verified executed PGO profile coverage for rustc, rustdoc, Cargo, Clippy, rustfmt, and cargo-fmt' cross-evidence/native-build.log
          mkdir native-sdk
          ln "$archive" native-sdk/ohm.tar.gz
          cp cross-evidence/source.json native-sdk/
          (cd native-sdk && shasum -a 256 ohm.tar.gz > SHA256SUMS)
      - name: Retain the qualified Darwin distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc23-expanded-native-macos-sdk
          path: native-sdk/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc23-expanded-native-macos-evidence
          path: |
            cross-evidence/
            source/reports/slot-source.json
            source/reports/verify-23.json.log
          if-no-files-found: warn
          retention-days: 14
